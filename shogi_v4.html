  var focusBtn=document.getElementById('ms-tournament-only');
  if(focusBtn&&focusBtn.focus){try{focusBtn.focus();}catch(e){}}
}

function editPlayer(id,cls){
  var players=state.players[cls];
  var p=null;
  for(var i=0;i<players.length;i++){if(players[i].id===id){p=players[i];break;}}
  if(!p)return;
  var newName=prompt('名前を変更してください',p.name);
  if(!newName||!newName.trim())return;
  newName=newName.trim();
  // CLASS-VARIABLE-001 (CV-1): 重複名チェックを全クラス横断に汎用化（A/B のみなら従来と同一結果・C+ も保護）。
  var all=allRegisteredPlayers();
  for(var i=0;i<all.length;i++){if(all[i].name===newName&&all[i].id!==id){alert('同じ名前がいます');return;}}
  // MASTER-001: normalize 後に変更なしならモーダルを開かず、旧フローと同じく参加者名のみ更新。
  if(normalizePersonName(p.name)===normalizePersonName(newName)){
    applyParticipantRenameOnly(p,newName);
    return;
  }
  // MASTER-001: 会員マスタ反映の分岐確認モーダルを開く。
  openMemberMasterSyncDialog(p,newName);
}

// START-FRP-UX-001: 参加者一覧の「ふりがな」を登録後でも編集・保存できるようにする（編集導線）。
//   - 当日 state の player.yomi のみ更新する。受付一覧のルビ表示（makePlayerRow / renderPlayerNameWithRuby）が
//     読む値はこの player.yomi なので、ここを更新すれば一覧のルビが即時に変わる。
//   - 空欄で確定するとルビなし（氏名のみ表示）に戻せる（normalizeYomi('')===''）。既存データに yomi が無くても壊れない。
//   - キャンセル（prompt が null）/ 変更なしは no-op（無駄な save・再描画を避ける）。
//   - 保存・保存未確認 warn・renderRegList 再描画は updateField(field='yomi') に委譲（既存の保存検証経路 SAVE-003b を流用）。
//   - 氏名編集（editPlayer / MASTER-001 会員マスタ同期）とは独立。名前/マスタ同期ロジックには触れない。
//     会員マスタ側 yomi への反映は本スライス対象外（参加者一覧のルビ表示が目的）。
function editPlayerYomi(id,cls){
  var players=(state.players&&state.players[cls])||[];
  var p=null;
  for(var i=0;i<players.length;i++){if(players[i]&&players[i].id===id){p=players[i];break;}}
  if(!p)return;
  var displayName=getName(id,cls);
  var cur=(typeof p.yomi==='string')?p.yomi:'';
  var input=prompt(displayName+' のふりがなを入力してください（空欄にするとルビなしに戻ります）',cur);
  if(input===null)return;                 // キャンセルは変更しない
  var normalized=normalizeYomi(input);
  if(normalized===cur)return;             // 変更なしは保存しない
  updateField(id,cls,'yomi',normalized);  // save() + 保存検証(SAVE-003b) + renderRegList は updateField 側に委譲
  showMsg(displayName+' のふりがなを更新しました','ok');
}

// ROUND-CLASS-START-004 (spec §6.3.2):
//   per-class pure validator。他クラスの state を参照しない。
//   bulk / single 両方で再利用される core。グローバル state を読まない（spec §10.3）。
//   error kind の優先順位: too-few (cnt===1) > odd (cnt%2!==0 かつ >=3) を内部で確定。
function validateStartableClass(classInfo,playersForClass){
  var cnt=Array.isArray(playersForClass)?playersForClass.length:0;
  var name=(classInfo&&typeof classInfo.name==='string'&&classInfo.name)?classInfo.name:(classInfo&&classInfo.id?classInfo.id+'クラス':'クラス');
  if(cnt===0)return {kind:'skip-empty'};
  if(classInfo&&classInfo.started===true)return {kind:'skip-already-started'};
  if(cnt===1)return {kind:'too-few',message:name+'は参加者が1名のため開始できません'};
  if(cnt%2!==0)return {kind:'odd',message:name+'が奇数です。運営者を追加してください'};
  return {kind:'ok'};
}

// FRP-IMPL-002 (FRP-DESIGN-002 §6.1 / §7): 「部分開始」の可否判定（pure・state 非参照・副作用なし）。
//   validateStartableClass とは別物：偶数を要求しない（来た人だけで1局目を始める前提のため奇数も可）。
//   - 参加者0名             → skip-empty（開始しない）
//   - 既に開始済み           → skip-already-started（再開始しない）
//   - それ以外(1名以上・未開始) → ok
//   既存 validateStartableClass は無改変（一括開始の判定意味＝2名以上・偶数を保つ）。
//   unknown class（classInfo が解決できない）の拒否は呼出側 startClassPartial で行う。
function validatePartialStartableClass(classInfo,playersForClass){
  var cnt=Array.isArray(playersForClass)?playersForClass.length:0;
  if(cnt===0)return {kind:'skip-empty'};
  if(classInfo&&classInfo.started===true)return {kind:'skip-already-started'};
  return {kind:'ok'};
}

// SHOGI-TOUR-START-001 (設計メモ §4.2 / §6):
//   受付クラス別「開始 readiness」表示用の純粋マッピング helper。
//   開始可否の判定（2名以上・偶数・未開始）は validateStartableClass に一元化されており、
//   この関数は「判定結果(kind)を表示(ラベル/トーン)へ写像するだけ」。独自の開始判定は再実装しない（§6 自己制約）。
//   - 入力: kind = validateStartableClass(...).kind ／ count = 表示用の実人数（判定には使わない）
//   - 出力: {tone,label}（保存しない派生値。state を読み書きしない・副作用なし）
//   - tone は色分け用の区分（ready/warn/started/empty/unknown → .class-readiness-{tone} CSS）
//   文言は現行バリデータ／開始フローのメッセージと「意味」を揃える（押す前に何が足りないか分かる）:
//     ok→開始できます ／ odd→奇数（運営者追加で開始可）／ too-few→1名 ／ skip-empty→未受付 ／ skip-already-started→開始済み
function describeClassReadiness(kind,count){
  var n=(typeof count==='number'&&count>=0)?count:0;
  switch(kind){
    case 'ok':
      return {tone:'ready',  label:'開始できます（'+n+'名）'};
    case 'odd':
      return {tone:'warn',   label:'人数が奇数です（'+n+'名）。運営者を1名追加すると開始できます'};
    case 'too-few':
      return {tone:'warn',   label:'参加者が'+n+'名です。2名以上で開始できます'};
    case 'skip-empty':
      return {tone:'empty',  label:'参加者がいません（未受付）'};
    case 'skip-already-started':
      return {tone:'started',label:'開始済み'};
    default:
      return {tone:'unknown',label:''};
  }
}

// SHOGI-TOUR-START-001 (設計メモ §4.2):
//   受付クラス見出し直下の readiness バッジを描画する（表示専用・state 不変・保存しない）。
//   開始可否は validateStartableClass に委譲し（§6）、文言は describeClassReadiness で写像する。
//   textContent でテキスト挿入するため innerHTML 連結による XSS 経路を増やさない。
//   readiness 要素が無い場合は no-op（ensureClassRegDomNodes 未生成 / 破損 DOM でも安全）。
function renderClassReadiness(classId,classInfo,players){
  var el=document.getElementById(regClassReadinessId(classId));
  if(!el)return;
  var arr=Array.isArray(players)?players:[];
  var r=validateStartableClass(classInfo,arr);
  var d=describeClassReadiness(r.kind,arr.length);
  el.textContent=d.label;
  el.className='class-readiness class-readiness-'+d.tone;
  if(el.style)el.style.display=d.label?'inline-block':'none';
}

// START-UX-CONSOLIDATE-001: 受付タブのクラス別「1局目を作成」ボタン（reg-class-start / START-003）の
//   helper 群を撤去した:
//     - describeClassStartButton（kind→ボタン表示/活性の写像）
//     - buildClassStartConfirmMessage（開始前確認文言）
//     - renderClassStartButton（受付タブのクラス別開始ボタン描画）
//     - onClickClassStart（受付タブから startTournamentForClass を呼ぶ click ハンドラ）
//     - bindClassStartHandlers（受付タブ開始ボタンの click bind）
//   受付タブには開始コントロール・開始 handler・startTournamentForClass 呼び出しを残さない。
//   開始は対局管理タブ（startBtnClass_{cls} → startTournamentForClass(cls)）へ集約する（設計 §5.5 / §7）。
//   読み取り専用の readiness 表示（describeClassReadiness / renderClassReadiness）は残置する。
//   validateStartableClass の既存判定（2名以上・偶数）は不変・流用しない。

// ROUND-CLASS-START-004 (spec §13.2.1):
//   bulk で「errors 0 件 + candidates 0 件」のとき、skip 内訳を見て文言を分ける pure helper。
function resolveNoCandidateMessage(skipped){
  var arr=Array.isArray(skipped)?skipped:[];
  var hasEmpty=false,hasAlreadyStarted=false;
  for(var i=0;i<arr.length;i++){
    var s=arr[i];if(!s)continue;
    if(s.kind==='skip-empty')hasEmpty=true;
    if(s.kind==='skip-already-started')hasAlreadyStarted=true;
  }
  if(hasEmpty&&!hasAlreadyStarted)return '開始できるクラスがありません。参加者を登録してください。';
  if(hasAlreadyStarted&&!hasEmpty)return '未開始のクラスはありません。';
  return '開始対象のクラスがありません。';
}

// ROUND-CLASS-START-004 (spec §6.3.3):
//   #startBtn 用 bulk collector。all-or-nothing validation。
//   pure 関数（グローバル state 非参照、引数のみで動作）。spec §10.3 / §6.6。
//   返り値: {ok, candidates:[classId], errors:[{classId,kind,message}], skipped:[{classId,kind}]}
//   error 優先順位:
//     1. total-too-few（クラス横断、最優先）
//     2. per-class too-few / odd（validateStartableClass 内部で確定）
//     3. no-candidate（errors 0 件 + candidates 0 件のフォールバック）
function collectStartCandidates(classes,players){
  if(!Array.isArray(classes))return {ok:false,candidates:[],errors:[{classId:null,kind:'no-candidate',message:'クラス情報が初期化されていません'}],skipped:[]};
  var safePlayers=(players&&typeof players==='object')?players:{};
  var total=0;
  for(var i=0;i<classes.length;i++){
    var ci=classes[i];if(!ci||typeof ci.id!=='string')continue;
    var arr=safePlayers[ci.id];
    if(Array.isArray(arr))total+=arr.length;
  }
  if(total<2){
    return {ok:false,candidates:[],errors:[{classId:null,kind:'total-too-few',message:'参加者が少なすぎます'}],skipped:[]};
  }
  var errors=[];
  var candidates=[];
  var skipped=[];
  for(var k=0;k<classes.length;k++){
    var c=classes[k];if(!c||typeof c.id!=='string')continue;
    var r=validateStartableClass(c,safePlayers[c.id]);
    switch(r.kind){
      case 'ok':                   candidates.push(c.id); break;
      case 'skip-empty':           skipped.push({classId:c.id,kind:'skip-empty'}); break;
      case 'skip-already-started': skipped.push({classId:c.id,kind:'skip-already-started'}); break;
      case 'too-few':              errors.push({classId:c.id,kind:'too-few',message:r.message}); break;
      case 'odd':                  errors.push({classId:c.id,kind:'odd',message:r.message}); break;
    }
  }
  if(errors.length>0){
    return {ok:false,candidates:[],errors:errors,skipped:skipped};
  }
  if(candidates.length===0){
    return {ok:false,candidates:[],errors:[{classId:null,kind:'no-candidate',message:resolveNoCandidateMessage(skipped)}],skipped:skipped};
  }
  return {ok:true,candidates:candidates,errors:[],skipped:skipped};
}

// ROUND-CLASS-START-004 (spec §6.3.4 / §7.6):
//   startTournamentForClass(classId) 用 single collector。class atomic。
//   他クラスの state を見ない（classes は classInfo 解決のみ）。
//   total-too-few クラス横断 error は適用しない（spec §6.2.3）。
//   返り値: {ok, candidateClassId, error?:{kind,message}}
function collectStartCandidateForClass(classId,classes,players){
  if(typeof classId!=='string'||!classId){
    return {ok:false,candidateClassId:null,error:{kind:'unknown-class',message:'クラスが見つかりません'}};
  }
  if(!Array.isArray(classes)){
    return {ok:false,candidateClassId:null,error:{kind:'unknown-class',message:'クラスが見つかりません'}};
  }
  var classInfo=null;
  for(var i=0;i<classes.length;i++){
    if(classes[i]&&classes[i].id===classId){classInfo=classes[i];break;}
  }
  if(!classInfo){
    return {ok:false,candidateClassId:null,error:{kind:'unknown-class',message:'クラスが見つかりません'}};
  }
  var safePlayers=(players&&typeof players==='object')?players:{};
  var r=validateStartableClass(classInfo,safePlayers[classId]);
  var name=classInfo.name||(classId+'クラス');
  switch(r.kind){
    case 'ok':
      return {ok:true,candidateClassId:classId};
    case 'skip-empty':
      return {ok:false,candidateClassId:null,error:{kind:'skip-empty',message:name+'は参加者がいません'}};
    case 'skip-already-started':
      return {ok:false,candidateClassId:null,error:{kind:'skip-already-started',message:name+'はすでに開始されています'}};
    case 'too-few':
    case 'odd':
      return {ok:false,candidateClassId:null,error:{kind:r.kind,message:r.message}};
  }
  return {ok:false,candidateClassId:null,error:{kind:'unknown-class',message:'クラスが見つかりません'}};
}

// ROUND-CLASS-START-004 (spec §13.2):
//   bulk validation errors を集約表示する UI helper。
//   1 件 → kind に応じて showMsg / alert / showMsg('warn')。複数件 → 1 alert にまとめる。
function showStartValidationErrors(errors){
  var arr=Array.isArray(errors)?errors:[];
  if(arr.length===0)return;
  if(arr.length===1){
    var e=arr[0];
    if(e.kind==='total-too-few'){showMsg(e.message,'err');return;}
    if(e.kind==='no-candidate'){alert(e.message);return;}
    if(e.kind==='too-few'){showMsg(e.message,'warn');return;}
    if(e.kind==='odd'){showMsg(e.message,'warn');return;}
    showMsg(e.message||'対局を開始できません','err');
    return;
  }
  var msgs=[];
  for(var i=0;i<arr.length;i++){if(arr[i]&&arr[i].message)msgs.push(arr[i].message);}
  alert('対局を開始できません：\n\n'+msgs.join('\n'));
}

// ROUND-CLASS-START-004 (spec §6.4):
//   validate 済 candidates のみを mutate する writer。
//   mutate phase 開始前に candidates 全件が state.classes に存在することを再確認することで、
//   setClassStarted の throw による部分 mutation を防ぐ（atomic mutate）。
//   各 candidate について pairings/results 初期化 → setClassStarted(true) → generatePairing。
//   最後に save() を 1 回呼ぶ。
function applyStartForCandidates(candidates){
  if(!Array.isArray(candidates)||candidates.length===0)return;
  if(!state||!Array.isArray(state.classes)){
    if(typeof console!=='undefined'&&console.warn)console.warn('applyStartForCandidates: state.classes is not initialized');
    return;
  }
  // pre-flight: 全 candidate が state.classes に実在することを確認。
  //   1 件でも unknown classId があれば mutate せず return（部分開始バグ防止 / spec §6.1 (6)）。
  var idIndex={};
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    if(c&&typeof c.id==='string')idIndex[c.id]=true;
  }
  for(var k=0;k<candidates.length;k++){
    if(!idIndex[candidates[k]]){
      if(typeof console!=='undefined'&&console.warn)console.warn('applyStartForCandidates: unknown classId in candidates: '+candidates[k]);
      return;
    }
  }
  if(!state.pairings||typeof state.pairings!=='object')state.pairings={};
  if(!state.results||typeof state.results!=='object')state.results={};
  for(var j=0;j<candidates.length;j++){
    var classId=candidates[j];
    state.pairings[classId]=[];
    state.results[classId]=[];
    setClassStarted(classId,true);   // state.started も同期書き込み（spec §8.2）
    generatePairing(classId);
  }
  save();
}

// ROUND-CLASS-START-004 (spec §6.5):
//   SAVE-003 verify を classId 単位で実行する reader。
//   callsiteId は classId を含める（'SAVE-003-startTournament-' + classId）。
//   aggregateKey は 'save-verify:core' を共有（既存 indicator 挙動維持）。
function verifyStartSavedForCandidates(candidates){
  if(!Array.isArray(candidates)||candidates.length===0)return;
  var persisted=readPersistedState();
  for(var i=0;i<candidates.length;i++){
    var classId=candidates[i];
    var klass=null;
    if(state&&Array.isArray(state.classes)){
      for(var j=0;j<state.classes.length;j++){
        if(state.classes[j]&&state.classes[j].id===classId){klass=state.classes[j];break;}
      }
    }
    var className=(klass&&klass.name)?klass.name:(classId+'クラス');
    if(!persisted||!classStartedInPersisted(persisted,classId)){
      notifySaveWarning({
        message:className+'を開始しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
        consoleTag:'SAVE-003: startTournament の保存が確認できませんでした (classId='+classId+')',
        callsiteId:'SAVE-003-startTournament-'+classId,
        kind:'save-verify',
        aggregateKey:'save-verify:core',
        severity:'warn'
      });
    }
  }
}

// START-UX-CONSOLIDATE-001 (設計 §5):
//   受付タブのプライマリボタン #startBtn の click ハンドラ。「対局管理へ進むナビゲーション」であり、
//   開始系の副作用は一切持たない（開始は対局管理タブ §7 に集約）。
//   - 受付入力（参加者追加・名前編集・A/B クラス振り分け・会費区分）は addPlayer / 各編集ハンドラが
//     autosave 済みだが、タブ移動で取りこぼさないよう現 state を save() してから対局管理タブへ移動する。
//     save() は state の JSON 直列化のみで、開始系 state（pairings/results/classes[].started/互換
//     state.started）を変更しない。
//   - generatePairing() / startTournament() / startTournamentForClass() は呼ばない（1回戦を作らない）。
//   - showTab('tournament') は描画専用で開始系 state を mutate しない。
function goToTournamentFromReg(){
  save();
  showTab('tournament');
}

// ROUND-CLASS-START-004 (spec §6.6):
//   全クラス一括開始の atomic wrapper（bulk atomic）。
//   START-UX-CONSOLIDATE-001 以降、本関数は UI から呼ばれない legacy / deprecated helper。
//     - 旧 #startBtn の click bind は goToTournamentFromReg（ナビ専用）へ置換済み。
//     - 物理削除・リネームは後続PRで棚卸しする（設計 §6 / §14）。互換のため温存する。
//   - 既存の `if(state.started===true)` 全クラス開始済 fast-path / hasOngoing fail-safe は
//     spec §6.6 / §7.5 に従い温存（B クラス後追い開始は別途 startTournamentForClass を使う）。
//   - validate phase: collectStartCandidates（pure、state を読むだけ）
//   - mutate phase:   applyStartForCandidates（atomic、validate 済 candidates のみ書く）
//   - 旧 startTournament の直接 mutate（state.started=true / pairings/results 直書き /
//     generatePairing per class）は applyStartForCandidates 内部に集約済み。
//   - SAVE-003 verify は verifyStartSavedForCandidates で classId 単位（spec §6.5）。
function startTournament(){
  // RECEPTION-UX-START-BUTTON-GUARD-IMPL-LIGHT (PR #111 §9.1) +
  // RESET-UX-PARTIAL-RESET-IMPL-LIGHT 同期更新 (PR #113 §9.1.1 H-1 / §10.1):
  //   大会開始済みでの「登録完了・対局開始」再クリックを案内付きで止める。
  //   ROUND-CLASS-START-004: state.started は all-class OR の互換フィールド。
  //   一部 class のみ開始済の場合も guard が発火する（B 後追いは startTournamentForClass('B')）。
  if(state.started===true){
    alert('大会はすでに開始されています。\n参加者を変更する場合は、先に「大会進行データをリセット」を実行してください。\n大会進行データをリセットすると、参加者一覧は残したまま、現在の組み合わせ・勝敗結果は削除されます。');
    return;
  }
  // ROUND-CLASS-START-004b (Codex Should Fix S2):
  //   hasOngoing fail-safe を state.classes 駆動に置換（A/B literal 解消）。
  //   spec §6.6 / inventory §4.4 に従い温存（state.started=false で pairings/results のみ
  //   残る異常データの保護）。通常フローでは到達しない（state.started===true guard と排他）。
  var hasOngoing=false;
  if(state.started&&Array.isArray(state.classes)){
    for(var hi=0;hi<state.classes.length;hi++){
      var hc=state.classes[hi];if(!hc||typeof hc.id!=='string')continue;
      var hp=(state.pairings&&state.pairings[hc.id])||[];
      var hr=(state.results&&state.results[hc.id])||[];
      if(hp.length>0||hr.length>0){hasOngoing=true;break;}
    }
  }
  if(hasOngoing){
    if(!confirm('進行中の大会データがあります。再開始すると現在の結果が消えます。続けますか？'))return;
  }
  // ROUND-CLASS-START-004 (spec §6.6 atomic wrapper):
  //   validate phase: 対象クラス全件を pure validator で検証。total-too-few（参加者が少なすぎます）
  //   / Aクラスが奇数です / Bクラスが奇数です などの error は collectStartCandidates が
  //   validator 経由で生成（旧 inline 検査は ROUND-CLASS-START-004b で完全に削除、
  //   validator に集約）。1 件でも error があれば state を一切変更せず return（bulk atomic）。
  var v=collectStartCandidates(state.classes,state.players);
  if(!v.ok){showStartValidationErrors(v.errors);return;}
  // mutate phase: applyStartForCandidates 内で pairings/results 初期化 / setClassStarted /
  //   generatePairing(classId) を candidate ごとに実行。
  applyStartForCandidates(v.candidates);
  showTab('tournament');
  // SAVE-003 verify は verifyStartSavedForCandidates で classId 単位（spec §6.5）。
  verifyStartSavedForCandidates(v.candidates);
  if(typeof promptMilestoneBackup==='function')promptMilestoneBackup('start','大会を開始しました（参加者の登録が完了）');
}

// ROUND-CLASS-START-004 (spec §7.6):
//   単独 class 開始用 wrapper（class atomic）。
//   他クラスの odd / too-few / 未開始状態に引きずられない。
//   bulk collector を呼ばず、collectStartCandidateForClass で対象 classId 1 件だけ validate。
//   OK なら applyStartForCandidates([candidate]) と verifyStartSavedForCandidates で
//   mutate / SAVE-003 verify を bulk と同じ writer 経由で実行。
function startTournamentForClass(classId){
  var v=collectStartCandidateForClass(classId,state.classes,state.players);
  if(!v.ok){
    var e=v.error||{};
    if(e.kind==='skip-already-started'){alert(e.message||'');return;}
    if(e.kind==='unknown-class'){showMsg(e.message||'クラスが見つかりません','err');return;}
    if(e.kind==='skip-empty'){showMsg(e.message||'参加者がいません','warn');return;}
    if(e.kind==='too-few'||e.kind==='odd'){showMsg(e.message||'対局を開始できません','warn');return;}
    showMsg(e.message||'対局を開始できません','err');
    return;
  }
  applyStartForCandidates([v.candidateClassId]);
  showTab('tournament');
  verifyStartSavedForCandidates([v.candidateClassId]);
  if(typeof promptMilestoneBackup==='function')promptMilestoneBackup('start','大会を開始しました（参加者の登録が完了）');
}

// FRP-IMPL-002 (FRP-DESIGN-002 §5 / §7): クラスを「部分開始」状態にする土台。
//   started=true にし、pairings/results を空配列で初期化するだけ（未割当者の一覧表示が目的）。
//   - generatePairing(cls) は絶対に呼ばない（全員一括ペアしない）。
//   - startTournamentForClass / applyStartForCandidates も使わない（偶数前提の全員開始を流用しない）。
//   未割当者は派生表示（getUnassignedFirstRoundPlayers）。選択者での対局 append 作成は後続 FRP-IMPL-003。
//   保存検証は SAVE-FRP-001（started / pairings 空 / results 空）。未確認は warn のみ・rollback しない。
function startClassPartial(cls){
  if(!state||!Array.isArray(state.classes)){showMsg('クラス情報が初期化されていません','err');return;}
  var classInfo=null;
  for(var i=0;i<state.classes.length;i++){
    if(state.classes[i]&&state.classes[i].id===cls){classInfo=state.classes[i];break;}
  }
  if(!classInfo){showMsg('クラスが見つかりません','err');return;}   // unknown class は mutate せず拒否
  var className=(classInfo.name)?classInfo.name:(cls+'クラス');
  var players=(state.players&&state.players[cls])||[];
  var v=validatePartialStartableClass(classInfo,players);
  if(v.kind!=='ok'){
    if(v.kind==='skip-already-started'){alert(className+'はすでに開始されています');return;}
    if(v.kind==='skip-empty'){showMsg(className+'は参加者がいません','warn');return;}
    showMsg('対局を開始できません','err');
    return;
  }
  if(!state.pairings||typeof state.pairings!=='object')state.pairings={};
  if(!state.results||typeof state.results!=='object')state.results={};
  state.pairings[cls]=[];
  state.results[cls]=[];
  setClassStarted(cls,true);   // classes[i].started + 互換 state.started を同期（既存 writer）
  save();
  // SAVE-FRP-001: 部分開始の保存検証。persisted で started=true / pairings[cls]=[] / results[cls]=[] を確認。
  //   不一致は「保存未確認」（保存失敗と断定しない）。部分開始は rollback しない・運営は継続する。
  //   初期状態 started=false それ自体は warn ではない（save 成功なら persisted で started=true を確認できる）。
  var persisted=readPersistedState();
  var okStarted=!!(persisted&&classStartedInPersisted(persisted,cls));
  var okPairings=!!(persisted&&persisted.pairings&&Array.isArray(persisted.pairings[cls])&&persisted.pairings[cls].length===0);
  var okResults=!!(persisted&&persisted.results&&Array.isArray(persisted.results[cls])&&persisted.results[cls].length===0);
  if(!okStarted||!okPairings||!okResults){
    notifySaveWarning({
      message:className+'を部分開始しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-FRP-001: startClassPartial の保存が確認できませんでした (cls='+cls+')',
      callsiteId:'SAVE-FRP-001-startClassPartial',
      kind:'save-verify',
      aggregateKey:'save-verify:core',
      severity:'warn'
    });
  }
  renderTournament(cls);
  if(typeof promptMilestoneBackup==='function')promptMilestoneBackup('start','大会を開始しました（参加者の登録が完了）');
}

// FRP-IMPL-002 (FRP-DESIGN-002 §5.3 / §7): 1局目の未割当参加者を「派生」で返す（state に保存しない）。
//   - state.results[cls].length >= 1（1局目確定後/2回戦以降）なら空配列（＝この導線の対象外）。
//   - state.players[cls] のうち、state.pairings[cls] の p1/p2 に含まれない人を entry_no 昇順で返す。
//   返すのは player オブジェクト（呼出側で氏名/番号を escapeHtml して表示）。これにより
//   「既に1局目対局がある参加者の除外」「削除済み参加者の非混入」が派生で自動的に充足される。
function getUnassignedFirstRoundPlayers(cls){
  var players=(state.players&&state.players[cls])||[];
  var results=(state.results&&state.results[cls])||[];
  if(results.length>=1)return [];
  var pairings=(state.pairings&&state.pairings[cls])||[];
  var assigned={};
  for(var i=0;i<pairings.length;i++){
    var m=pairings[i];if(!m)continue;
    if(m.p1)assigned[m.p1]=true;
    if(m.p2)assigned[m.p2]=true;
  }
  var out=[];
  for(var j=0;j<players.length;j++){
    var p=players[j];if(!p)continue;
    if(!assigned[p.id])out.push(p);
  }
  out.sort(function(a,b){
    var ea=(a&&typeof a.entry_no==='number'&&a.entry_no>0)?a.entry_no:Infinity;
    var eb=(b&&typeof b.entry_no==='number'&&b.entry_no>0)?b.entry_no:Infinity;
    return ea-eb;
  });
  return out;
}

// Issue #272: 2回戦以降に人数が奇数のとき generatePairing が「待機(leftover)」として現回戦の
//   組み合わせから外した1名を派生で返す（state に保存しない・副作用なし）。運営に「誰が待機か」を
//   明示するための表示専用 reader。1回戦(results 空)の未割当は getUnassignedFirstRoundPlayers が
//   担うため対象外。pairings が空（未生成/全局終了）も対象外。待機者は不戦勝にしない＝勝数・
//   SOS/SODOS に影響しない（getWins は results のみ集計）。配列順（players の登録順）を保つ。
function getRoundLeftoverPlayers(cls){
  var players=(state&&state.players&&state.players[cls])||[];
  var results=(state&&state.results&&state.results[cls])||[];
  if(results.length===0)return [];
  var pairings=(state&&state.pairings&&state.pairings[cls])||[];
  if(pairings.length===0)return [];
  var assigned={};
  for(var i=0;i<pairings.length;i++){
    var m=pairings[i];if(!m)continue;
    if(m.p1)assigned[m.p1]=true;
    if(m.p2)assigned[m.p2]=true;
  }
  var out=[];
  for(var j=0;j<players.length;j++){
    var p=players[j];if(!p)continue;
    if(!assigned[p.id])out.push(p);
  }
  return out;
}

// FRP-IMPL-004B (設計 §5.4 / §5.4.1 / §5.4.2): 「組み合わせを再生成」(repairBtn_) を出力してよいかを判定する reader。
//   以下4条件すべてが真のときだけ false（＝部分手合い組成中で未割当が残る初回 round）を返し、それ以外は true。
//     - isClassStarted(cls)
//     - state.results[cls].length === 0
//     - state.pairings[cls].length > 0
//     - getUnassignedFirstRoundPlayers(cls).length > 0
//   未割当0 は「部分手合い・未割当0」と「通常開始 round1・未割当0」を現行 state では識別できない
//   （start source / generatedBy / match-level source 等の保存メタ情報を持たない＝§3.2）ため、
//   由来を問わず非表示条件に含めない＝true（表示してよい）。generatePairing 本体は不変で、制御は
//   この出力 gate（UI 層）に閉じる。reader・副作用なし（global state 依存）。
function shouldShowRegenerateButton(cls){
  if(!isClassStarted(cls))return true;
  var results=(state&&state.results&&state.results[cls])||[];
  if(results.length!==0)return true;
  var pairings=(state&&state.pairings&&state.pairings[cls])||[];
  if(pairings.length===0)return true;
  if(getUnassignedFirstRoundPlayers(cls).length===0)return true;
  return false;
}

// FRP-IMPL-003 (FRP-DESIGN-002 §7 / §9): 選択者から1局目の候補ペアを作る pure helper（state 非参照・副作用なし）。
//   - 入力 selected = player オブジェクト配列（呼出側で「現在の未割当者」に再検証済みのものを渡す）。
//   - entry_no 昇順に整列。entry_no 欠損/不正(非正の数・非 number)は末尾へ回し、同値は id 昇順で安定 tie-break。
//   - (0,1),(2,3),… の順でペア化。3人以上の奇数なら末尾1人を leftover として返す（＝未割当のまま待機）。
//   - 0/1名なら pairs は空（1名は leftover に、0名は null）。ランダム・任意組み合わせ・手動並び替えは入れない。
//   - 返り値: { pairs:[{p1,p2,winner:null,lastModifiedBy:'auto'}], leftover: playerObjectOrNull }。
//     1局目は results 空のため勝数差・再戦が構造的に発生せず、entry_no 順で十分かつ安全
//     （generatePairing のバックトラッキング流用は不要・過剰）。leftover は state に保存しない
//     （getUnassignedFirstRoundPlayers の派生により append 後も未割当一覧に自動的に残る）。
function buildFirstRoundPartialPairs(selected){
  var list=Array.isArray(selected)?selected.slice():[];
  list.sort(function(a,b){
    var ea=(a&&typeof a.entry_no==='number'&&a.entry_no>0)?a.entry_no:Infinity;
    var eb=(b&&typeof b.entry_no==='number'&&b.entry_no>0)?b.entry_no:Infinity;
    if(ea!==eb)return ea-eb;
    var ia=(a&&a.id!=null)?String(a.id):'';
    var ib=(b&&b.id!=null)?String(b.id):'';
    if(ia<ib)return -1;
    if(ia>ib)return 1;
    return 0;
  });
  var pairs=[];
  var i=0;
  for(;i+1<list.length;i+=2){
    pairs.push({p1:list[i].id,p2:list[i+1].id,winner:null,lastModifiedBy:'auto'});
  }
  var leftover=(i<list.length)?list[i]:null;   // 奇数なら末尾1人、偶数なら null
  return {pairs:pairs,leftover:leftover};
}

// FRP-IMPL-003 (FRP-DESIGN-002 §6.3 / §8.4): native confirm 用の確認文（純粋・state からの氏名解決のみ）。
//   「Mペア / N名を追加」「各対局の氏名」「奇数なら待機（未割当のまま残す）1名」を要約する。
//   完成形・一括開始と混同しない文言にし、既存対局・結果が不変であることを明記する。
function buildFrpAppendConfirmMessage(cls,pairs,leftover){
  // 文言は native confirm() のプレーンテキスト（innerHTML ではないため escapeHtml 不要・適用すると &lt; 等が見えてしまう）。
  //   氏名は一旦ローカルに解決してから連結する（HTML 流入用の未エスケープ検査ヒューリスティクスを踏まないため）。
  var lines=[];
  lines.push((pairs.length)+'組（'+(pairs.length*2)+'名）を1局目に追加します。');
  for(var i=0;i<pairs.length;i++){
    var m=pairs[i];
    var pa=getName(m.p1,cls);
    var pb=getName(m.p2,cls);
    lines.push('　・'+pa+' vs '+pb);
  }
  if(leftover){
    var lo=getName(leftover.id,cls);
    lines.push('待機（未割当のまま残します）：'+lo+' 1名');
  }
  lines.push('');
  lines.push('作成済みの対局・結果は変更されません。よろしいですか？');
  return lines.join('\n');
}

// FRP-IMPL-003 (FRP-DESIGN-002 §8.3 / §10): pane-{cls} 内の未割当チェックボックスから
//   「現在チェックされている」pid を集める（disabled は除外）。実行時に
//   getUnassignedFirstRoundPlayers で再検証するため、ここでは pane スコープで素朴に集めるだけ。
//   pane スコープに限定することで他クラスの選択が構造的に混入しない（同一クラス保証の一次防御）。
function collectCheckedUnassignedPids(cls){
  var out=[];
  var scope=document.getElementById('pane-'+cls);
  var boxes=(scope&&typeof scope.querySelectorAll==='function')?scope.querySelectorAll('.frp-unassigned-cb'):[];
  var n=(boxes&&typeof boxes.length==='number')?boxes.length:0;
  for(var i=0;i<n;i++){
    var cb=boxes[i];
    if(!cb||cb.disabled||!cb.checked)continue;
    var pid=(typeof cb.getAttribute==='function'&&cb.getAttribute('data-frp-pid'))||cb.value;
    if(pid&&out.indexOf(pid)<0)out.push(pid);
  }
  return out;
}

// FRP-IMPL-003 (FRP-DESIGN-002 §6.3 / §7 / §10): 選択者の候補ペアを state.pairings[cls] に append する mutate。
//   既存1局目対局・既存 winner は一切変更しない（末尾 concat のみ）。2局目以降・順位計算・結果確定には触れない。
//   startTournamentForClass / generatePairing / applyStartForCandidates は呼ばない（全員上書き経路を流用しない）。
//   guard（すべて満たすときのみ append。UI のチェック状態を信用せず実行時に再検証する §8）:
//     - state/classes 健全・cls 実在 / isClassStarted(cls)===true（部分開始済み）
//     - results[cls].length===0（1局目確定後/2回戦以降は全面ブロック §6）
//     - pairs が非空配列 / 各 p1≠p2 / p1・p2 が players[cls] 在籍 / 現 pairings[cls] に未在籍 / pairs 内 id 重複なし
//   post-check: duplicate player 不在・既存対局が件数/p1/p2/winner で保持されている。崩れていれば rollback し save しない。
//   save 後 SAVE-FRP-002 検証（snapshot 一致）。不一致は warn（保存未確認・保存失敗と断定しない）・rollback しない・運営継続。
function appendFirstRoundPairs(cls,pairs){
  if(!state||!Array.isArray(state.classes)){showMsg('クラス情報が初期化されていません','err');return false;}
  var classInfo=null;
  for(var ci=0;ci<state.classes.length;ci++){
    if(state.classes[ci]&&state.classes[ci].id===cls){classInfo=state.classes[ci];break;}
  }
  if(!classInfo){showMsg('クラスが見つかりません','err');return false;}
  if(!isClassStarted(cls)){showMsg('部分開始していないクラスには追加できません','warn');return false;}
  if(!state.results||!Array.isArray(state.results[cls])){showMsg('クラス情報が初期化されていません','err');return false;}
  // results 非空（1局目確定済み/2回戦以降）は全面ブロック。「pairings 内の winner 入力済み」とは分けて扱う（§6）。
  if(state.results[cls].length>=1){showMsg('1局目が確定済みのクラスには追加できません','warn');return false;}
  if(!Array.isArray(pairs)||pairs.length===0){showMsg('2人以上を選択してください','warn');return false;}
  if(!state.pairings||!Array.isArray(state.pairings[cls])){showMsg('クラス情報が初期化されていません','err');return false;}
  // 実行時再検証（UI のチェック状態でなく state を真実とする §8）
  var players=(state.players&&state.players[cls])||[];
  var inClass={};
  for(var pi=0;pi<players.length;pi++){if(players[pi])inClass[players[pi].id]=true;}
  var assigned={};
  var existing=state.pairings[cls];
  for(var ei=0;ei<existing.length;ei++){
    var em=existing[ei];if(!em)continue;
    if(em.p1)assigned[em.p1]=true;
    if(em.p2)assigned[em.p2]=true;
  }
  var seen={};
  for(var k=0;k<pairs.length;k++){
    var m=pairs[k];
    if(!m||!m.p1||!m.p2){showMsg('追加する対局の組み合わせが不正です','err');return false;}
    if(m.p1===m.p2){showMsg('同じ参加者同士の対局は作成できません','err');return false;}
    var ids=[m.p1,m.p2];
    for(var t=0;t<2;t++){
      var pid=ids[t];
      if(!inClass[pid]){showMsg('このクラスに登録されていない参加者が含まれています','err');return false;}
      if(assigned[pid]){showMsg('すでに1局目の対局がある参加者が含まれています','err');return false;}
      if(seen[pid]){showMsg('同じ参加者が複数の対局に含まれています','err');return false;}
      seen[pid]=true;
    }
  }
  // append（末尾追加のみ。既存 match オブジェクトには触れない）。backup は rollback 用に既存参照を保持。
  var backup=existing.slice();
  var expected=existing.concat(pairs);
  state.pairings[cls]=expected;
  // post-check 1: 同一選手が複数対局に出ていないか（duplicate）。出ていれば rollback。
  if(getDuplicatePlayersInPairings(cls).length>0){
    state.pairings[cls]=backup;
    showMsg('対局の追加で重複が発生したため中止しました','err');
    return false;
  }
  // post-check 2: 既存対局が件数・p1/p2/winner で保持されているか（消滅・改変が無いか）。崩れていれば rollback。
  var preserved=(state.pairings[cls].length===backup.length+pairs.length);
  if(preserved){
    for(var b=0;b<backup.length;b++){
      var o=backup[b],n=state.pairings[cls][b];
      if(!o||!n||o.p1!==n.p1||o.p2!==n.p2||(o.winner||null)!==(n.winner||null)){preserved=false;break;}
    }
  }
  if(!preserved){
    state.pairings[cls]=backup;
    showMsg('既存の対局が保持できなかったため追加を中止しました','err');
    return false;
  }
  save();
  // SAVE-FRP-002: append の保存検証。persisted.pairings[cls] が expected snapshot（p1/p2/winner/lastModifiedBy 全要素）と
  //   一致するか pairingsMatchSnapshot で照合。length 一致だけでは stale を見逃すため snapshot 比較を使う。
  //   不一致は「保存未確認」（保存失敗と断定しない）。rollback しない・運営は継続する（SAVE-FRP-001 と同型）。
  var className=(classInfo.name)?classInfo.name:(cls+'クラス');
  var persisted=readPersistedState();
  var okSnap=!!(persisted&&persisted.pairings&&pairingsMatchSnapshot(persisted.pairings[cls],state.pairings[cls]));
  if(!okSnap){
    notifySaveWarning({
      message:className+'に対局を追加しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-FRP-002: appendFirstRoundPairs の保存が確認できませんでした (cls='+cls+')',
      callsiteId:'SAVE-FRP-002-appendFirstRoundPairs',
      kind:'save-verify',
      aggregateKey:'save-verify:core',
      severity:'warn'
    });
  }
  renderTournament(cls);
  return true;
}

// #274: 1局目 append の共有 in-flight フラグ。選択式 append（onClickAppendFirstRound）/ P1「1卓追加」
//   （onClickAddOneTable）/ P2「まとめて作成」（onClickAddAllTables）は、いずれも「同じクラスの1局目に対局を
//   append する」同一操作なので、再入防止フラグを **ハンドラ横断の単一フラグ** に統一する。ハンドラ毎に独立
//   フラグだと、片方の confirm 表示中にもう片方を発火させるとクロス再入を防げず、後発 append が
//   appendFirstRoundPairs の正規の二重割当ガード（'すでに1局目の対局がある参加者が含まれています'）を踏んで
//   「データは正常なのに誤った赤エラー」を表示してしまう（QA P2）。共有フラグなら 1 操作の処理中は他導線を
//   弾く＝クロス再入が起きない。appendFirstRoundPairs 側の二重割当ガードは本物の異常検知として **維持** する。
var firstRoundAppendInFlight=false;

// FRP-IMPL-003 (FRP-DESIGN-002 §6 / §8): 「選択した参加者で1局目を追加作成」ボタンの click handler。
//   再入防止（confirm 中の二重発火・double-click 対策）→ 実行時再検証 → 候補ペア生成 → confirm → append。
//   appendFirstRoundPairs 内でも再検証するため二重に安全（UI のチェック状態を信用しない §8）。
function onClickAppendFirstRound(cls){
  if(firstRoundAppendInFlight)return;   // 再入防止: 共有フラグ（#274・クロス再入も弾く）
  firstRoundAppendInFlight=true;
  try{
    if(!isClassStarted(cls)){showMsg('部分開始していないクラスには追加できません','warn');return;}
    var results=(state.results&&state.results[cls])||[];
    if(results.length>=1){showMsg('1局目が確定済みのクラスには追加できません','warn');return;}
    // 実行時再検証: UI のチェック状態でなく「現在の未割当者」に含まれる選択 pid のみ採用（同一クラス・既割当排除・重複排除）。
    var checkedPids=collectCheckedUnassignedPids(cls);
    var unassigned=getUnassignedFirstRoundPlayers(cls);
    var byId={};
    for(var u=0;u<unassigned.length;u++)byId[unassigned[u].id]=unassigned[u];
    var selected=[];
    var picked={};
    for(var c=0;c<checkedPids.length;c++){
      var pid=checkedPids[c];
      if(picked[pid])continue;
      picked[pid]=true;
      if(byId[pid])selected.push(byId[pid]);
    }
    if(selected.length<2){showMsg('2人以上を選択してください','warn');return;}
    var built=buildFirstRoundPartialPairs(selected);
    if(!built.pairs.length){showMsg('2人以上を選択してください','warn');return;}
    if(typeof confirm==='function'){
      if(!confirm(buildFrpAppendConfirmMessage(cls,built.pairs,built.leftover)))return;
    }
    appendFirstRoundPairs(cls,built.pairs);
  }finally{
    firstRoundAppendInFlight=false;
  }
}

// PROGRESSIVE-PAIRING-IMPL-P1 (CONFIRMED spec §2 / §3 / 受入1-7): クラス別「1卓追加」ボタンの click handler。
//   部分開始中クラスの未手合い（getUnassignedFirstRoundPlayers＝受付順＝entry_no 昇順）の「先頭2名」で
//   round=1 の対局を1卓だけ append する。選択式の onClickAppendFirstRound（チェックして選ぶ）とは別導線で、
//   「来た人から2人ずつ」という逐次手合いの主導線（押すたびに次の先頭2名で1卓）を担う。
//   - 未手合い2人未満では何もしない（ボタン自体も buildFirstRoundPartialSectionHtml 側で disabled）。
//   - 生成は既存 buildFirstRoundPartialPairs（先頭2名 → 1ペア・leftover なし）＋ append は既存
//     appendFirstRoundPairs に委譲（実行時再検証・既存対局保持・重複拒否・SAVE-FRP-002・save／復元）。
//     新しい保存スキーマや状態は持たない（待機は派生 getUnassignedFirstRoundPlayers に自動的に残る）。
//   - confirm 文は既存 buildFrpAppendConfirmMessage を再利用（1組2名・氏名・非破壊を明記）。
//   - 再入防止は onClickAppendFirstRound / onClickAddAllTables と **共有** の単一フラグ
//     firstRoundAppendInFlight（#274・confirm 中の二重発火・連打・他導線とのクロス再入を弾く）。
//   - 全員一括の開始経路（旧 start 系・全員上書き）は流用しない＝append 経由のみ（NOCALL はテストで固定）。
function onClickAddOneTable(cls){
  if(firstRoundAppendInFlight)return;   // 再入防止: 共有フラグ（#274・クロス再入も弾く）
  firstRoundAppendInFlight=true;
  try{
    if(!isClassStarted(cls)){showMsg('部分開始していないクラスには追加できません','warn');return;}
    var results=(state.results&&state.results[cls])||[];
    if(results.length>=1){showMsg('1局目が確定済みのクラスには追加できません','warn');return;}
    var unassigned=getUnassignedFirstRoundPlayers(cls);   // 受付順（entry_no 昇順）の未手合い
    if(unassigned.length<2){showMsg('未手合いが2人未満のため1卓を作成できません','warn');return;}
    var built=buildFirstRoundPartialPairs(unassigned.slice(0,2));   // 先頭2名 → 1ペア・leftover なし
    if(!built.pairs.length){showMsg('未手合いが2人未満のため1卓を作成できません','warn');return;}
    if(typeof confirm==='function'){
      if(!confirm(buildFrpAppendConfirmMessage(cls,built.pairs,built.leftover)))return;
    }
    appendFirstRoundPairs(cls,built.pairs);   // 既存対局を変更せず末尾に1卓を append
  }finally{
    firstRoundAppendInFlight=false;
  }
}

// PROGRESSIVE-PAIRING-IMPL-P2 (CONFIRMED spec §P2 / 受入 Phase P2): クラス別「未手合いをまとめて1局目作成」の click handler。
//   部分開始中クラスの未手合い（getUnassignedFirstRoundPlayers＝受付順＝entry_no 昇順）の「全員」を 2人ずつ
//   ペア化して round=1 の卓をまとめて append する。P1「1卓追加」(onClickAddOneTable・先頭2名で1卓) の隣に
//   併置する別導線で、「受付が一段落して残りをまとめて1局目に入れる」運用を担う（押すたびに1卓の逆＝一括）。
//   - 未手合い2人未満では何もしない（ボタン自体も buildFirstRoundPartialSectionHtml 側で disabled）。
//   - 生成は既存 buildFirstRoundPartialPairs（全員 → 偶数は全ペア・奇数は末尾1人 leftover）＋ append は既存
//     appendFirstRoundPairs に委譲（実行時再検証・既存対局保持・重複拒否・SAVE-FRP-002・save／復元）。
//     新しい保存スキーマや状態は持たない（待機＝奇数末尾1人は派生 getUnassignedFirstRoundPlayers に自動的に残る）。
//   - confirm 文は既存 buildFrpAppendConfirmMessage を再利用（全組の氏名・奇数末尾の待機者・非破壊を明記）。
//   - 再入防止は onClickAddOneTable / onClickAppendFirstRound と **共有** の単一フラグ
//     firstRoundAppendInFlight（#274・confirm 中の二重発火・連打・他導線とのクロス再入を弾く）。
//   - 全員一括の開始経路（旧 start 系・全員上書き）は流用しない＝append 経由のみ（既存逐次卓・選択式 append と無干渉）。
function onClickAddAllTables(cls){
  if(firstRoundAppendInFlight)return;   // 再入防止: 共有フラグ（#274・クロス再入も弾く）
  firstRoundAppendInFlight=true;
  try{
    if(!isClassStarted(cls)){showMsg('部分開始していないクラスには追加できません','warn');return;}
    var results=(state.results&&state.results[cls])||[];
    if(results.length>=1){showMsg('1局目が確定済みのクラスには追加できません','warn');return;}
    var unassigned=getUnassignedFirstRoundPlayers(cls);   // 受付順（entry_no 昇順）の未手合い・全員
    if(unassigned.length<2){showMsg('未手合いが2人未満のため1局目を作成できません','warn');return;}
    var built=buildFirstRoundPartialPairs(unassigned);   // 全員 → 2人ずつ全ペア・奇数は末尾1人 leftover（待機）
    if(!built.pairs.length){showMsg('未手合いが2人未満のため1局目を作成できません','warn');return;}
    if(typeof confirm==='function'){
      if(!confirm(buildFrpAppendConfirmMessage(cls,built.pairs,built.leftover)))return;
    }
    appendFirstRoundPairs(cls,built.pairs);   // 既存対局を変更せず末尾に全卓をまとめて append
  }finally{
    firstRoundAppendInFlight=false;
  }
}

// ROUND-CLASS-START-004b (spec §12.1):
//   指定 classId の進行データのみリセット。他クラスの pairings / results / started は保持。
//   class atomic で動作（他クラス state を破壊しない）。
//   - state.pairings[classId] = []
//   - state.results[classId]  = []
//   - setClassStarted(classId, false) で classes[i].started 同期 + state.started 再計算
//   - DOM クリア: pane-{classId} / result-{classId}（classId ベース、A/B literal 不使用）
//   - confirm 文言で「他クラスのデータは保持されます」を明示し全体リセットとの混同を防ぐ。
function resetClassForClass(classId){
  if(!state||!Array.isArray(state.classes)){showMsg('クラス情報が初期化されていません','err');return;}
  var klass=null;
  for(var i=0;i<state.classes.length;i++){
    if(state.classes[i]&&state.classes[i].id===classId){klass=state.classes[i];break;}
  }
  if(!klass){showMsg('クラスが見つかりません','err');return;}
  var className=klass.name||(classId+'クラス');
  if(!confirm(className+'の組み合わせ・勝敗結果を削除します。\n他クラスのデータは保持されます。\nよろしいですか？'))return;
  if(!state.pairings||typeof state.pairings!=='object')state.pairings={};
  if(!state.results||typeof state.results!=='object')state.results={};
  state.pairings[classId]=[];
  state.results[classId]=[];
  setClassStarted(classId,false);
  // DOM クリア（classId ベース、A/B literal 不使用）
  var pane=document.getElementById('pane-'+classId);if(pane)pane.innerHTML='';
  var rslt=document.getElementById('result-'+classId);if(rslt)rslt.innerHTML='';
  save();
  renderRegList();
  // tournament タブが開いている場合は全クラスを再描画して action bar を再生成
  if(typeof renderTournament==='function'&&Array.isArray(state.classes)){
    for(var ri=0;ri<state.classes.length;ri++){
      if(state.classes[ri]&&state.classes[ri].id)renderTournament(state.classes[ri].id);
    }
  }
  showMsg(className+'をリセットしました','ok');
}

// ============================================================
// PAIRING QUALITY (A-4 §1, §2, §5):
//   evaluatePairingQuality は副作用なしの純粋関数。
//   入力: pairings(配列), results(回戦の配列), players(配列)
//   出力: 品質メトリクス + ペア毎ラベル
//   仕様書 docs/specs/20260510_1904_shogi_a4_specs.md §1, §2, §5 準拠。
//
//   avoidableWinDiffPairs の算定は A-4 簡易版:
//     - 各勝数グループ内で再戦回避マッチングが成立する場合のみ「同勝数で組めた」と判定
//     - 奇数グループは1名が必ず別群と組むため、最低限の cross-group ペア数を控除
//   A-5 で本格マッチング（Blossom 等）に置換予定。
// ============================================================
function evaluatePairingQuality(pairings, results, players){
  var safePairings=Array.isArray(pairings)?pairings:[];
  var safeResults=Array.isArray(results)?results:[];
  var safePlayers=Array.isArray(players)?players:[];

  // 1. 勝数集計
  var wins={};
  for(var i=0;i<safePlayers.length;i++)wins[safePlayers[i].id]=0;
  for(var r=0;r<safeResults.length;r++){
    var round=safeResults[r];
    if(!Array.isArray(round))continue;
    for(var m=0;m<round.length;m++){
      var w=round[m]&&round[m].winner;
      if(w&&typeof wins[w]==='number')wins[w]+=1;
    }
  }

  // 2. 過去対戦履歴
  var history={};
  for(var i=0;i<safePlayers.length;i++)history[safePlayers[i].id]={};
  for(var r=0;r<safeResults.length;r++){
    var round=safeResults[r];
    if(!Array.isArray(round))continue;
    for(var m=0;m<round.length;m++){
      var pm=round[m];
      if(!pm||!pm.p1||!pm.p2)continue;
      if(history[pm.p1])history[pm.p1][pm.p2]=true;
      if(history[pm.p2])history[pm.p2][pm.p1]=true;
    }
  }

  // 3. ペアごとの基本指標
  var pairDetails=[];
  var totalWinDiff=0, maxWinDiff=0, sameScorePairCount=0, rematchCount=0;
  var currentMixedCount=0;
  var pairedIds={};
  for(var i=0;i<safePairings.length;i++){
    var pp=safePairings[i];
    if(!pp||!pp.p1||!pp.p2){
      pairDetails.push({idx:i,p1:'',p2:'',winDiff:0,isRematch:false,labels:[]});
      continue;
    }
    var w1=wins[pp.p1]||0, w2=wins[pp.p2]||0;
    var diff=Math.abs(w1-w2);
    var isRematch=!!(history[pp.p1]&&history[pp.p1][pp.p2]);
    totalWinDiff+=diff;
    if(diff>maxWinDiff)maxWinDiff=diff;
    if(diff===0)sameScorePairCount+=1; else currentMixedCount+=1;
    if(isRematch)rematchCount+=1;
    pairedIds[pp.p1]=true; pairedIds[pp.p2]=true;
    pairDetails.push({idx:i,p1:pp.p1,p2:pp.p2,winDiff:diff,isRematch:isRematch,labels:[]});
  }

  // 4. avoidableWinDiffPairs 算定
  //   勝数グループごとに「内部マッチング（再戦回避）が成立するか」を確認し、
  //   不可避な cross-group ペアの最低数（forced）を見積る。
  var groups={};
  for(var pi=0;pi<safePairings.length;pi++){
    var pp=safePairings[pi];
    if(!pp||!pp.p1||!pp.p2)continue;
    var w1=wins[pp.p1]||0, w2=wins[pp.p2]||0;
    if(!groups.hasOwnProperty(w1))groups[w1]=[];
    if(!groups.hasOwnProperty(w2))groups[w2]=[];
    groups[w1].push(pp.p1);
    groups[w2].push(pp.p2);
  }
  // 各グループ内で再戦回避マッチングを試行（バックトラック）
  function canMatchInternally(ids,hist){
    if(ids.length===0)return true;
    if(ids.length%2!==0)return false;
    var used={};
    function tryMatch(){
      var first=-1;
      for(var i=0;i<ids.length;i++){if(!used[i]){first=i;break;}}
      if(first===-1)return true;
      used[first]=true;
      for(var j=first+1;j<ids.length;j++){
        if(used[j])continue;
        if(hist[ids[first]]&&hist[ids[first]][ids[j]])continue;
        used[j]=true;
        if(tryMatch())return true;
        used[j]=false;
      }
      used[first]=false;
      return false;
    }
    return tryMatch();
  }
  var oddGroupCount=0;
  var unmatchableEvenGroupCount=0;
  for(var key in groups){
    if(!groups.hasOwnProperty(key))continue;
    var ids=groups[key];
    if(ids.length%2===1){oddGroupCount+=1;}
    else if(!canMatchInternally(ids,history)){unmatchableEvenGroupCount+=1;}
  }
  // 奇数群が k 個あれば 必ず ceil(k/2) 個の cross-group ペアが発生する
  // 内部マッチング不可能な偶数群は「全員を別群と組ませる必要がある」最悪ケースを許容
  var forcedMixed=Math.ceil(oddGroupCount/2)+unmatchableEvenGroupCount;
  var avoidableWinDiffPairs=Math.max(0,currentMixedCount-forcedMixed);

  // 5. ラベル付与（§2）
  var warningHit=(rematchCount>0)||(avoidableWinDiffPairs>0)||(maxWinDiff>=2);
  for(var di=0;di<pairDetails.length;di++){
    var d=pairDetails[di];
    var pp=safePairings[di];
    var labels=[];
    if(d.p1&&d.p2){
      labels.push(d.winDiff===0?'同勝数':('勝数差'+d.winDiff));
      labels.push(d.isRematch?'再戦':'再戦なし');
      // 個別ペアが警告条件に該当する場合のみ [要確認]
      var pairWarning=d.isRematch||(d.winDiff>=2)||(avoidableWinDiffPairs>0&&d.winDiff>0);
      if(pairWarning)labels.push('要確認');
      if(pp&&pp.lastModifiedBy==='manual')labels.push('手動変更');
    }
    d.labels=labels;
  }

  return {
    totalWinDiff:totalWinDiff,
    maxWinDiff:maxWinDiff,
    sameScorePairCount:sameScorePairCount,
    rematchCount:rematchCount,
    avoidableWinDiffPairs:avoidableWinDiffPairs,
    warningHit:warningHit,
    pairDetails:pairDetails
  };
}

function generatePairing(cls){
  var players=state.players[cls];
  if(players.length<2)return;
  var wins=getWins(cls);
  var played={};
  // Issue #272 / Codex P1: 奇数の待機(leftover)をローテーションするため、各選手が過去の回戦で
  //   何回「不在(=その回戦の results に登場しない)」だったかを results から派生で数える（state には保存しない）。
  //   待機者を最少 sitOut の選手から選ぶことで、同じ低勝者が連続して待機し続けて次回戦に戻れない不公平を防ぐ。
  //   途中参加者は過去回戦が不在＝sitOut が大きくなり、待機に選ばれにくく＝早く対局に入る（望ましい挙動）。
  var sitOutCount={};
  for(var i=0;i<players.length;i++){played[players[i].id]=[];sitOutCount[players[i].id]=0;}
  for(var r=0;r<state.results[cls].length;r++){
    var inRound272={};
    for(var m=0;m<state.results[cls][r].length;m++){
      var match=state.results[cls][r][m];
      if(match.p1)inRound272[match.p1]=true;
      if(match.p2)inRound272[match.p2]=true;
      if(match.winner){
        played[match.p1].push(match.p2);
        played[match.p2].push(match.p1);
      }
    }
    for(var so=0;so<players.length;so++){
      if(!inRound272[players[so].id])sitOutCount[players[so].id]++;
    }
  }

  // 勝ち数降順ソート後、全体を完全ランダムにシャッフル（勝ち数順は維持）
  var sorted=players.slice().sort(function(a,b){return (wins[b.id]||0)-(wins[a.id]||0);});
  // 同勝ち数グループを完全ランダムにシャッフル
  var si=0;
  while(si<sorted.length){
    var sj=si;
    var sw=wins[sorted[si].id]||0;
    while(sj<sorted.length&&(wins[sorted[sj].id]||0)===sw)sj++;
    // グループ全体をFisher-Yatesで完全シャッフル
    for(var sk=sj-1;sk>si;sk--){
      var sl=si+Math.floor(Math.random()*(sk-si+1));
      var stmp=sorted[sk];sorted[sk]=sorted[sl];sorted[sl]=stmp;
    }
    si=sj;
  }
  // さらに全体も勝ち数を崩さない範囲でシャッフル（登録順の影響を排除）
  // 同勝ち数の選手同士の順番はすでにランダム化済み

  // バックトラッキングでペアリング生成
  var pairedArr=[];
  for(var i=0;i<sorted.length;i++)pairedArr.push(false);
  var pairs=[];

  function backtrack(idx,allowRematch){
    while(idx<sorted.length&&pairedArr[idx])idx++;
    if(idx>=sorted.length)return true;
    // 候補を勝数差で評価。同勝ち数グループ内はランダム順、グループ間は勝数差昇順
    var pi=sorted[idx];
    var piWins=wins[pi.id]||0;
    // 勝数差ごとにバケット化
    var buckets={};
    for(var j=idx+1;j<sorted.length;j++){
      if(pairedArr[j])continue;
      var pj=sorted[j];
      if(!allowRematch&&played[pi.id].indexOf(pj.id)>=0)continue;
      var diff=Math.abs((wins[pj.id]||0)-piWins);
      if(!buckets[diff])buckets[diff]=[];
      buckets[diff].push(j);
    }
    // 勝数差昇順でバケットを並べ、各バケット内をシャッフルしてフラット化
    var diffs=[];
    for(var dk in buckets){if(buckets.hasOwnProperty(dk))diffs.push(Number(dk));}
    diffs.sort(function(a,b){return a-b;});
    var candidates=[];
    for(var di=0;di<diffs.length;di++){
      var bucket=buckets[diffs[di]];
      // Fisher-Yatesでバケット内をシャッフル
      for(var bi=bucket.length-1;bi>0;bi--){
        var bj=Math.floor(Math.random()*(bi+1));
        var bt=bucket[bi];bucket[bi]=bucket[bj];bucket[bj]=bt;
      }
      for(var bk=0;bk<bucket.length;bk++)candidates.push(bucket[bk]);
    }
    for(var ci=0;ci<candidates.length;ci++){
      var j=candidates[ci];
      pairedArr[idx]=true;pairedArr[j]=true;
      // A-4 §4: 自動生成ペアには lastModifiedBy: 'auto' を付与
      pairs.push({p1:sorted[idx].id,p2:sorted[j].id,winner:null,lastModifiedBy:'auto'});
      if(backtrack(idx+1,allowRematch))return true;
      pairs.pop();
      pairedArr[idx]=false;pairedArr[j]=false;
    }
    return false;
  }

  // Issue #272: 2回戦以降に人数が奇数になると、従来の backtrack は「完全マッチング」を要求して
  //   解なし(false)となり pairs が空のまま返り、state.pairings[cls] が 0 卓に潰れていた（警告も
  //   出ず空回戦が表示され進行不能）。残り偶数人で floor(N/2) 卓を生成し、1人を待機(leftover)として
  //   組み合わせから外す方針に揃える。待機者は不戦勝にしない（勝数・SOS/SODOS に一切影響させない
  //   ＝getWins は results のみ集計）。state には保存せず、現回戦の pairings に含めないだけで派生表示
  //   getRoundLeftoverPlayers が運営へ明示する。submitRound は 2回戦以降にこの待機を許容して確定できる。
  // Codex P1: 当初は「sorted 末尾(最少勝ち数)の1人を機械的に待機」へ固定していたが、(a) 同じ低勝者が
  //   連続待機して次回戦に戻れない (b) 待機を先に固定すると no-rematch バックトラッキングが回避可能な
  //   再戦を強制する、という不公平が起きた。対策として待機を固定せず、待機候補を「sitOut 昇順 → 勝ち数
  //   昇順 →（同値は sorted の既存シャッフル順）」で並べ、各候補を待機にして no-rematch ペアリングを試し、
  //   最初に完全成立した候補を採用する（＝再戦を避けられる待機を優先）。どの候補でも no-rematch 不能なら
  //   同順で allowRematch にフォールバック。偶数は待機を作らず従来どおり backtrack(0,false)→不能で
  //   allowRematch ＝ N=6/8 は挙動完全一致。
  function tryPairing272(waiterIdx,allowRematch){
    pairs.length=0;
    for(var z=0;z<sorted.length;z++)pairedArr[z]=false;
    if(waiterIdx>=0)pairedArr[waiterIdx]=true;
    return backtrack(0,allowRematch);
  }
  if(sorted.length%2===0){
    if(!tryPairing272(-1,false))tryPairing272(-1,true);
  }else{
    var waiterOrder272=[];
    for(var wo=0;wo<sorted.length;wo++)waiterOrder272.push(wo);
    waiterOrder272.sort(function(a,b){
      var sa=sitOutCount[sorted[a].id]||0,sb=sitOutCount[sorted[b].id]||0;
      if(sa!==sb)return sa-sb;                 // sitOut が少ない選手を先に待機（待機回数を均す＝ローテーション）
      var wa=wins[sorted[a].id]||0,wb=wins[sorted[b].id]||0;
      if(wa!==wb)return wa-wb;                 // 勝ち数が少ない選手を先に待機（従来意図）
      return a-b;                              // 同値は sorted の既存シャッフル順（実質ランダム）
    });
    var paired272=false;
    for(var pw1=0;pw1<waiterOrder272.length;pw1++){          // pass1: 再戦なしで完全成立する待機を優先
      if(tryPairing272(waiterOrder272[pw1],false)){paired272=true;break;}
    }
    if(!paired272){                                          // pass2: 再戦許容で同順フォールバック
      for(var pw2=0;pw2<waiterOrder272.length;pw2++){
        if(tryPairing272(waiterOrder272[pw2],true)){paired272=true;break;}
      }
    }
  }

  state.pairings[cls]=pairs;
  // Issue #272 (c): 2名以上いるのに 0 卓になった場合（奇数対応後は通常発生しない安全網）は、空回戦の
  //   まま黙って進行不能になるのを避け、運営へ警告する。
  if(pairs.length===0&&players.length>=2){
    if(typeof showMsg==='function')showMsg('組み合わせを生成できませんでした（'+cls+'クラス）。参加者数をご確認ください','warn');
    if(typeof console!=='undefined'&&console.warn)console.warn('Issue #272: generatePairing produced 0 tables (cls='+cls+', players='+players.length+')');
  }
  save();
  // A-5.1-SAVE-003 / SAVE-004: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。組合せ生成は rollback しない・運営は継続する。
  // SAVE-004: length 一致だけでは「同件数だが中身が古い stale pairings」を見逃すため、
  // pairingsMatchSnapshot で p1/p2/winner（lastModifiedBy は両側に存在する場合のみ）も比較する。
  var persisted_gp=readPersistedState();
  var pairingsOk_gp=persisted_gp&&persisted_gp.pairings&&pairingsMatchSnapshot(persisted_gp.pairings[cls],pairs);
  if(!pairingsOk_gp){
    notifySaveWarning({
      message:'組み合わせを生成しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-004: generatePairing の保存が確認できませんでした (cls='+cls+', expected='+pairs.length+')',
      callsiteId:'SAVE-004-generatePairing',
      kind:'save-verify',
      aggregateKey:'save-verify:core',
      severity:'warn'
    });
  }
}

function setWinner(cls,idx,wid){
  if(state.pairings[cls][idx].winner===wid){
    state.pairings[cls][idx].winner=null;
  } else {
    state.pairings[cls][idx].winner=wid;
  }
  renderTournament(cls);save();
  // A-5.1-SAVE-003: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。勝敗入力は rollback しない・運営は継続する。
  var expectedWinner=state.pairings[cls][idx].winner;
  var persisted_sw=readPersistedState();
  if(!persisted_sw||!persisted_sw.pairings||!Array.isArray(persisted_sw.pairings[cls])||!persisted_sw.pairings[cls][idx]||persisted_sw.pairings[cls][idx].winner!==expectedWinner){
    notifySaveWarning({
      message:'勝敗を入力しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-003: setWinner の保存が確認できませんでした (cls='+cls+', idx='+idx+', expected='+expectedWinner+')',
      callsiteId:'SAVE-003-setWinner',
      kind:'save-verify',
      aggregateKey:'save-verify:core',
      severity:'warn'
    });
  }
}

function buildChangePairingModalHtml(cls, idx, candidates, match){
  // PAIRING-UX-MANUAL-CHANGE-CANDIDATE-FILTER-IMPL-LIGHT (PR #108 §5.1 / §9.1):
  //   候補を classifyChangePairingCandidate で事前分類し、native select 内で
  //   「選択可能」/「選択できない候補」optgroup に分けて出力する。
  //   選択不可候補は disabled + 短い理由ラベル（「結果入力済」「再戦になる」「同じ選手」）。
  //   現 p1 / p2 は status:'ok' + selected + 非 disabled + 理由ラベルなし（§7.1.1）。
  //   表示文字列は escapeHtml を通す（個人情報保護）。
  function buildSelectInner(role,selectedId){
    var okHtml='',blockedHtml='',okCount=0,blockedCount=0;
    for(var i=0;i<candidates.length;i++){
      var c=candidates[i];
      var clf=classifyChangePairingCandidate(cls,idx,c.id,role);
      var baseLabel=entryNoOf(cls,c.id)+'｜'+c.name;
      var sel=(c.id===selectedId)?' selected':'';
      if(clf.status==='ok'){
        okHtml+='<option value="'+c.id+'"'+sel+'>'+escapeHtml(baseLabel)+'</option>';
        okCount++;
      }else{
        var blockedLabel=clf.reasonLabel?(baseLabel+'（'+clf.reasonLabel+'）'):baseLabel;
        blockedHtml+='<option value="'+c.id+'"'+sel+' disabled data-reason-id="'+escapeHtml(clf.reasonId||'')+'">'+escapeHtml(blockedLabel)+'</option>';
        blockedCount++;
      }
    }
    var inner='';
    if(okHtml)inner+='<optgroup label="選択可能">'+okHtml+'</optgroup>';
    if(blockedHtml)inner+='<optgroup label="選択できない候補">'+blockedHtml+'</optgroup>';
    return {html:inner,okCount:okCount,blockedCount:blockedCount};
  }
  var sel1=buildSelectInner('p1',match.p1);
  var sel2=buildSelectInner('p2',match.p2);
  // 現 p1 / p2 は ok に必ず含まれるため、ok>1 で「他に選べる候補あり」を意味する。
  var hasAlternative=(sel1.okCount>1)||(sel2.okCount>1);
  // PAIRING-UX-MANUAL-CHANGE-ERROR-RECOVERY-IMPL-LIGHT (PR #106 §5.2):
  //   モーダル冒頭に「現在の対局」を読み取り専用で表示し、エラー後でも
  //   元の組み合わせが見える状態を保つ（formatParticipantLabel compact + escapeHtml）。
  function buildChgCurrentLabel(pid){
    var p=null;
    for(var j=0;j<candidates.length;j++){if(candidates[j].id===pid){p=candidates[j];break;}}
    if(!p)return cls+'-?? (削除)';
    return formatParticipantLabel({id:p.id,name:p.name,entry_no:p.entry_no,member:p.member,cls:cls},{mode:'compact'});
  }
  var currentP1Label=buildChgCurrentLabel(match.p1);
  var currentP2Label=buildChgCurrentLabel(match.p2);
  // 候補 0 人時の案内（PR #108 §8.2 推奨）と保存ボタン disabled
  var emptyNoticeHtml=hasAlternative?'':
    '<div data-chg-empty-notice="1" style="margin-bottom:12px;padding:8px 10px;background:#fff7e6;border:1px solid #f5d490;border-radius:6px;font-size:12px;color:#7a4a00;line-height:1.5">'
    +'現在の条件では、1人だけ入れ替えできる候補がありません。<br>別の対局を選ぶか、組み合わせ全体を見直してください。'
    +'</div>';
  var saveBtnAttr=hasAlternative?'':' disabled';
  var saveBtnStyle=hasAlternative
    ?'padding:8px 16px;border-radius:8px;border:none;background:#1F3864;color:#fff;font-size:14px;cursor:pointer'
    :'padding:8px 16px;border-radius:8px;border:none;background:#bbb;color:#fff;font-size:14px;cursor:not-allowed';
  return '<div style="background:rgba(0,0,0,0.5);position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;display:flex;align-items:center;justify-content:center;" id="chg-modal">'
    +'<div style="background:#fff;border-radius:12px;padding:24px;width:320px;">'
    +'<h3 style="margin-bottom:12px;font-size:16px;color:#1F3864">対戦相手の変更</h3>'
    +'<div data-chg-current="1" style="margin-bottom:16px;padding:8px 10px;background:#f5f7fa;border-radius:6px;font-size:13px;color:#333">'
    +'<div style="font-size:11px;color:#888;margin-bottom:4px">現在の対局</div>'
    +'<div data-chg-current-role="p1">'+escapeHtml(currentP1Label)+'</div>'
    +'<div style="font-size:11px;color:#888;margin:2px 0">対</div>'
    +'<div data-chg-current-role="p2">'+escapeHtml(currentP2Label)+'</div>'
    +'</div>'
    +emptyNoticeHtml
    +'<div style="margin-bottom:12px"><label style="font-size:12px;color:#666;display:block;margin-bottom:4px">先手</label>'
    +'<select id="chg-p1" style="width:100%;height:36px;border:1px solid #ccc;border-radius:8px;font-size:14px">'+sel1.html+'</select></div>'
    +'<div style="margin-bottom:20px"><label style="font-size:12px;color:#666;display:block;margin-bottom:4px">後手</label>'
    +'<select id="chg-p2" style="width:100%;height:36px;border:1px solid #ccc;border-radius:8px;font-size:14px">'+sel2.html+'</select></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end">'
    +'<button onclick="document.getElementById(\'chg-modal\').remove()" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:14px;cursor:pointer">キャンセル</button>'
    +'<button id="chg-save" style="'+saveBtnStyle+'"'+saveBtnAttr+'>変更を保存</button>'
    +'</div></div></div>';
}

function bindChangePairingModalEvents(cls, idx){
  document.getElementById('chg-save').addEventListener('click',function(){
    var newP1=document.getElementById('chg-p1').value;
    var newP2=document.getElementById('chg-p2').value;
    var match=state.pairings[cls][idx];
    var oldP1=match.p1, oldP2=match.p2;

    // PAIRING-UX-MANUAL-CHANGE-ERROR-RECOVERY-IMPL-LIGHT (PR #106 §5.2 方針 3):
    //   検証 NG で return する経路で <select> を元の選手 ID へ戻し、
    //   失敗した選択値がモーダル内に残らないようにする。state.pairings は触らない。
    function resetSelectsToOriginal(){
      var s1=document.getElementById('chg-p1');
      var s2=document.getElementById('chg-p2');
      if(s1)s1.value=oldP1;
      if(s2)s2.value=oldP2;
    }

    if(newP1===newP2){alert('同じ選手を先手・後手両方に選べません');return;}
    if(newP1===oldP1 && newP2===oldP2){alert('変更がありません');return;}

    var keepPlayer, X;
    if(newP1===oldP1 && newP2!==oldP2){ keepPlayer=oldP1; X=newP2; }
    else if(newP2===oldP2 && newP1!==oldP1){ keepPlayer=oldP2; X=newP1; }
    else {
      resetSelectsToOriginal();
      alert('この変更では、2人を同時に入れ替える必要があります。\n現在は1人ずつの変更に対応しています。\n選択を元に戻しました。もう一度、変更したい選手を1人だけ選んでください。');
      return;
    }

    var otherIdx=findPairContainingPlayer(cls, X, idx);

    if(otherIdx===-1){
      if(pairHasRematch(cls, keepPlayer, X)){
        if(!confirm('この組み合わせは過去に対戦済みです。再戦として保存しますか？'))return;
      }
      // A-4 §4: 手動変更ペアには lastModifiedBy: 'manual' を付与
      state.pairings[cls][idx]={p1:newP1,p2:newP2,winner:null,lastModifiedBy:'manual'};
    } else {
      var otherPair=state.pairings[cls][otherIdx];
      if(otherPair.winner){
        alert('相手ペアが結果入力済みのため、入れ替えできません');
        return;
      }
      var Y=(otherPair.p1===X)?otherPair.p2:otherPair.p1;
      var droppedFromTarget=(keepPlayer===oldP1)?oldP2:oldP1;

      if(pairHasRematch(cls, keepPlayer, X) || pairHasRematch(cls, droppedFromTarget, Y)){
        resetSelectsToOriginal();
        alert('この変更を行うと、再戦になる組み合わせが発生します。\n選択を元に戻しました。別の選手を選び直してください。');
        return;
      }

      var newOtherP1=(otherPair.p1===X)?droppedFromTarget:otherPair.p1;
      var newOtherP2=(otherPair.p2===X)?droppedFromTarget:otherPair.p2;

      if(!confirm('入れ替えを実行します。\n  ('+getName(oldP1,cls)+'-'+getName(oldP2,cls)+') → ('+getName(newP1,cls)+'-'+getName(newP2,cls)+')\n  ('+getName(otherPair.p1,cls)+'-'+getName(otherPair.p2,cls)+') → ('+getName(newOtherP1,cls)+'-'+getName(newOtherP2,cls)+')\nよろしいですか?'))return;

      var backup1=state.pairings[cls][idx];
      var backup2=state.pairings[cls][otherIdx];
      // A-4 §4: 入れ替えで影響を受けた両ペアに lastModifiedBy: 'manual' を付与
      state.pairings[cls][idx]={p1:newP1,p2:newP2,winner:null,lastModifiedBy:'manual'};
      state.pairings[cls][otherIdx]={p1:newOtherP1,p2:newOtherP2,winner:null,lastModifiedBy:'manual'};

      if(getDuplicatePlayersInPairings(cls).length>0){
        state.pairings[cls][idx]=backup1;
        state.pairings[cls][otherIdx]=backup2;
        alert('内部エラー: 入れ替え後の重複を検出しました。変更を取り消し、元の組み合わせに戻しました');
        return;
      }
    }

    document.getElementById('chg-modal').remove();
    renderTournament(cls);save();
    // A-5.1-SAVE-003b: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
    // false は「保存未確認」（保存失敗と断定しない）。対戦相手変更 / swap は rollback しない・運営は継続する。
    // pairingsMatchSnapshot で配列全体（p1 / p2 / winner、両側存在時のみ lastModifiedBy）を比較するため、
    // swap で 2 ペア同時に変わっても、片方だけ stale になっているケースを検知できる。
    var expectedPairings_cp=state.pairings[cls];
    var persisted_cp=readPersistedState();
    var pairingsOk_cp=persisted_cp&&persisted_cp.pairings&&pairingsMatchSnapshot(persisted_cp.pairings[cls],expectedPairings_cp);
    if(!pairingsOk_cp){
      notifySaveWarning({
        message:'対戦相手を変更しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
        consoleTag:'SAVE-003b: bindChangePairingModalEvents の保存が確認できませんでした (cls='+cls+', idx='+idx+')',
        callsiteId:'SAVE-003b-bindChangePairingModalEvents',
        kind:'save-verify',
        aggregateKey:'save-verify:pairing',
        severity:'warn'
      });
    }
  });
}

function changePairing(cls,idx){
  var match=state.pairings[cls][idx];
  if(match.winner){
    alert('結果入力済みのため変更できません');
    return;
  }
  var candidates=state.players[cls];
  var html=buildChangePairingModalHtml(cls, idx, candidates, match);
  var div=document.createElement('div');
  div.innerHTML=html;
  document.body.appendChild(div.firstChild);
  bindChangePairingModalEvents(cls, idx);
}

function submitRound(cls){
  var unfinished=state.pairings[cls].filter(function(m){return !m.winner;});
  if(unfinished.length>0){alert('全試合の結果を入力してください');return;}
  for(var r=0;r<state.results[cls].length;r++){
    for(var m=0;m<state.results[cls][r].length;m++){
      if(!state.results[cls][r][m].winner){
        alert((r+1)+'回戦に未入力の対局があります。修正してから確定してください');return;
      }
    }
  }
  var playerMap={};
  for(var pi=0;pi<state.players[cls].length;pi++){
    playerMap[state.players[cls][pi].id]=true;
  }
  var usedIds={};
  for(var i=0;i<state.pairings[cls].length;i++){
    var m=state.pairings[cls][i];
    if(!playerMap[m.p1]||!playerMap[m.p2]){alert((i+1)+'試合目に登録されていない選手が含まれています。「対戦相手変更」または「組み合わせを再生成」で修正してください。');return;}
    if(usedIds[m.p1]){alert(getName(m.p1,cls)+'が複数の対局に登録されています。対戦相手を修正してください。');return;}
    if(usedIds[m.p2]){alert(getName(m.p2,cls)+'が複数の対局に登録されています。対戦相手を修正してください。');return;}
    if(m.p1===m.p2){alert(getName(m.p1,cls)+'が同じ対局の先手・後手に登録されています。対戦相手を修正してください。');return;}
    usedIds[m.p1]=true;
    usedIds[m.p2]=true;
  }
  var missing=[];
  for(var i=0;i<state.players[cls].length;i++){
    var p=state.players[cls][i];
    if(!usedIds[p.id])missing.push(p.name);
  }
  // Issue #272 / Codex P1: 1回戦(results 空)は従来どおり全員割当を必須にする（FRP の未割当は別経路で扱う）。
  //   2回戦以降は待機者が複数いてよい——奇数の leftover に加え、回戦生成後に途中追加された参加者
  //   （addPlayer で確認済み）はその回戦の組み合わせに入らず正当に待機する。これらは次回戦で組み合わせに
  //   戻り、対局管理画面の待機バナー(getRoundLeftoverPlayers)で運営に明示される。旧実装は人数の偶奇
  //   (allowedMissing=N%2)で判定したため、偶数のまま2名以上を途中追加すると未割当2名で確定できず進行
  //   不能になっていた（＝Codex 指摘）。2回戦以降は待機者数でブロックせず、参加者がいるのに0卓という
  //   退行的な空回戦だけをガードする。
  if(state.results[cls].length===0){
    if(missing.length>0){
      // HELP-UX-001 (#308 (1)): 原因（奇数なら待機が出る）と次の行動を出す文言へ。未割当者名は残す。
      //   テスト pin（run_tests.sh / test_frp_impl_002.js / test_pairing_odd_leftover_272.js）は
      //   「次の参加者が対局に登録されていません」の部分文字列で維持＝同期更新不要。
      alert('次の参加者が対局に登録されていません：\n'+missing.join('、')+'\n\n参加人数が奇数の場合は、人数を偶数にするか、1名を待機にして開始できます。割り当てるには「対戦相手変更」または「組み合わせを再生成」を使ってください。');return;
    }
  }else if(state.pairings[cls].length===0&&state.players[cls].length>=2){
    alert('この回戦の組み合わせがありません。「組み合わせを再生成」で対局を作成してください。');return;
  }
  state.results[cls].push(JSON.parse(JSON.stringify(state.pairings[cls])));
  state.pairings[cls]=[];
  if(state.results[cls].length<state.rounds)generatePairing(cls);
  renderTournament(cls);save();
  if(typeof showToast==='function')showToast('\u2713 結果を保存しました');
  // A-5.1-SAVE-003: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。回戦確定は rollback しない・運営は継続する。
  // 内部で generatePairing(cls) が呼ばれた場合、in-memory の state.pairings[cls] は新ペアを保持する。
  // PR #48 Codex Should Fix: pairings は length 一致だけでは stale を見逃すため、
  // pairingsMatchSnapshot で p1/p2/winner（lastModifiedBy は両側に存在する場合のみ）も比較する。
  var expectedRoundsLen=state.results[cls].length;
  var expectedPairings=state.pairings[cls];
  var persisted_sr=readPersistedState();
  var resultsOk=persisted_sr&&persisted_sr.results&&Array.isArray(persisted_sr.results[cls])&&persisted_sr.results[cls].length===expectedRoundsLen;
  var pairingsOk=persisted_sr&&persisted_sr.pairings&&pairingsMatchSnapshot(persisted_sr.pairings[cls],expectedPairings);
  if(!resultsOk||!pairingsOk){
    notifySaveWarning({
      message:'回戦を確定しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-003: submitRound の保存が確認できませんでした (cls='+cls+', expectedRounds='+expectedRoundsLen+', expectedPairings='+expectedPairings.length+')',
      callsiteId:'SAVE-003-submitRound',
      kind:'save-verify',
      aggregateKey:'save-verify:core',
      severity:'warn'
    });
  }
  // BACKUP-NUDGE (当日第2弾⑫): このクラスが完走（rounds 到達）した節目で促す。全クラス終了なら全体を促す。
  if(state.results[cls]&&state.results[cls].length>=state.rounds&&typeof promptMilestoneBackup==='function'){
    if(typeof isTournamentDone==='function'&&isTournamentDone())promptMilestoneBackup('all','全クラスの対局が終了しました');
    else promptMilestoneBackup('class:'+cls,_classDisplayNameForBackup(cls)+'が終了しました');
  }
}

// ============================================================
// RENDER (TOURNAMENT): 対局管理タブの描画
//   build*Html: HTML文字列を返すだけ(副作用なし)
//   bindTournamentEvents: イベント登録だけ
//   renderTournament: データ準備 → 連結 → DOM反映 → イベント登録
// ============================================================

function buildScoreGridHtml(cls, sorted, wins){
  var html='<h3>暫定成績</h3><div class="score-grid">';
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];var w=wins[p.id]||0;
    var total=0;for(var r=0;r<state.results[cls].length;r++){for(var m=0;m<state.results[cls][r].length;m++){var mm=state.results[cls][r][m];if(mm.p1===p.id||mm.p2===p.id)total++;}}
    // PAIRING-UX-SCORE-LIST-READABILITY-IMPL-LIGHT (PR #104 §3.2 案 B):
    //   番号 (A-12) と氏名 (山田太郎) を別要素 (.sno / .snm) で別行表示。
    //   getNameWithNo の単一文字列だと .sname の word-break 未指定で番号と氏名が
    //   任意位置で折り返される問題を解消。書式は PR #103 pairing-card 補助ラベル
    //   (A-12 山田太郎（2勝0敗）) と整合。
    var snoLabel=cls+'-'+entryNoOf(cls,p.id);
    var snmLabel=getName(p.id,cls);
    html+='<div class="score-card"><div class="sno">'+escapeHtml(snoLabel)+'</div><div class="snm">'+escapeHtml(snmLabel)+'</div><div class="swins">'+w+'</div><div style="font-size:11px;color:#888">'+w+'勝'+(total-w)+'敗</div></div>';
  }
  html+='</div>';
  return html;
}

function buildPlayedHistoryHtml(cls, sorted, played){
  // PAIRING-UX-SCORE-LIST-READABILITY-IMPL-LIGHT (PR #104 §4.2 候補 A + C):
  //   暫定成績と sorted を共有しているため、対戦済みリストも勝数順 +
  //   同勝数内エントリー番号順となる。並び順を見出しと補足で明示。
  //   対戦相手タグは renderTournament の played[] 構築順 = ラウンド順を維持。
  //   切替 UI / 独自並び順は IMPL-LIGHT 範囲外。
  var html='<h3>対戦済みリスト<span style="font-size:11px;font-weight:normal;color:#888;margin-left:8px">（勝数順）</span></h3>';
  html+='<div style="font-size:11px;color:#888;margin-bottom:6px">※ 暫定成績と同じ勝数順で表示しています。対戦相手はラウンド順です。</div>';
  html+='<div style="margin-bottom:12px">';
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    var tags='';
    for(var j=0;j<played[p.id].length;j++)tags+='<span class="history-tag">'+escapeHtml(getNameWithNo(played[p.id][j],cls))+'</span>';
    html+='<div style="margin-bottom:4px"><strong style="font-size:12px">'+escapeHtml(getNameWithNo(p.id,cls))+'</strong>：'+(tags||'なし')+'</div>';
  }
  html+='</div>';
  return html;
}

function buildPastResultsHtml(cls){
  if(state.results[cls].length===0)return '';
  var html='<h3>過去の結果（クリックで修正）</h3>';
  for(var rr=0;rr<state.results[cls].length;rr++){
    html+='<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;color:#1F3864;margin-bottom:4px">'+(rr+1)+'回戦</div>';
    for(var mm=0;mm<state.results[cls][rr].length;mm++){
      var pm=state.results[cls][rr][mm];
      var pn1=getNameWithNo(pm.p1,cls),pn2=getNameWithNo(pm.p2,cls);
      var pw=pm.winner?getNameWithNo(pm.winner,cls):'未入力';
      var pc=pm.winner?'#27500A':'#A32D2D';
      html+='<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8f8f8;border-radius:6px;margin-bottom:3px">'
        +'<span style="display:inline-block;width:8em;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ escapeHtml(pn1) +'</span>'
        +'<span style="font-size:13px;color:#888">vs</span>'
        +'<span style="display:inline-block;width:8em;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ escapeHtml(pn2) +'</span>'
        +'<span style="font-size:12px;color:'+pc+';font-weight:500;white-space:nowrap;margin-left:4px">'+escapeHtml(pw)+'</span>'
        +'<button id="editpast_'+cls+'_'+rr+'_'+mm+'" style="padding:2px 8px;font-size:11px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;margin-left:auto;flex-shrink:0">修正</button>'
        +'</div>';
    }
    html+='</div>';
