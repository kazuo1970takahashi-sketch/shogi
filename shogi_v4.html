function bindMasterEditModalEvents(){
  var cancelBtn=document.getElementById('me-cancel');
  if(cancelBtn)cancelBtn.addEventListener('click',function(){
    var m=document.getElementById('master-edit-modal');if(m)m.remove();
  });
  // Phase 3 §2.1: 履歴情報トグル(▼ 開く / ▲ 閉じる)。既存「過去参加者から選ぶ」と同パターン
  var historyToggle=document.getElementById('me-history-toggle');
  var historyDiv=document.getElementById('me-history');
  if(historyToggle&&historyDiv){
    historyToggle.addEventListener('click',function(){
      var open=historyDiv.style.display!=='none';
      if(open){historyDiv.style.display='none';historyToggle.textContent='▼ 履歴情報を開く';}
      else{historyDiv.style.display='block';historyToggle.textContent='▲ 履歴情報を閉じる';}
    });
  }
  var saveBtn=document.getElementById('me-save');
  if(saveBtn)saveBtn.addEventListener('click',function(){
    // iPhone Safari blur 競合回避
    var nameInput=document.getElementById('me-name');
    var yomiInput=document.getElementById('me-yomi');
    var cityInput=document.getElementById('me-city');
    if(nameInput)nameInput.blur();
    if(yomiInput)yomiInput.blur();
    if(cityInput)cityInput.blur();
    var memberId=this.getAttribute('data-mid');
    var newName=nameInput?nameInput.value:'';
    var newYomi=yomiInput?yomiInput.value:'';
    // Phase 1 §3: city は cityInput が存在しない場合に既存値を変更しないため undefined を保つ
    var newCity=cityInput?cityInput.value:undefined;
    var statusEl=document.getElementById('me-status');
    if(!newName||!newName.trim()){
      if(statusEl)statusEl.textContent='氏名を入力してください';
      return;
    }
    // A-4 §3.3.2: ラジオから member/grade を読み取り options で渡す
    // A-4.3 §2.5: last_class も同様に options で渡す
    // Phase 1 §2.1: city も options で渡す(値は applyMasterMemberEdit 側で normalizeCity 適用)
    var memberRadios=document.getElementsByName('me-member');
    var gradeRadios=document.getElementsByName('me-grade');
    var lastClassRadios=document.getElementsByName('me-last-class');
    var memberPick=null,gradePick=null,lastClassPick=null,lastClassPicked=false;
    for(var ri=0;ri<memberRadios.length;ri++){if(memberRadios[ri].checked){memberPick=memberRadios[ri].value;break;}}
    for(var rj=0;rj<gradeRadios.length;rj++){if(gradeRadios[rj].checked){gradePick=gradeRadios[rj].value;break;}}
    for(var rk=0;rk<lastClassRadios.length;rk++){if(lastClassRadios[rk].checked){lastClassPick=lastClassRadios[rk].value;lastClassPicked=true;break;}}
    var options={};
    if(memberPick==='member'||memberPick==='other')options.member=memberPick;
    if(gradePick==='ippan'||gradePick==='chu'||gradePick==='josei')options.grade=gradePick;
    // A-4.5 §2.6: 「未設定」radio 廃止。A/B どちらも未 check なら last_class を変更しない(undefined)
    if(lastClassPicked&&(lastClassPick==='A'||lastClassPick==='B'))options.last_class=lastClassPick;
    // Phase 1: cityInput が存在する場合のみ options.city を渡す。空文字も明示更新として扱う(=任意項目をクリア可能)
    if(cityInput)options.city=newCity;

    var master=loadBranchMaster();
    var result=applyMasterMemberEdit(memberId,newName,newYomi,master,options);
    if(!result.success){
      if(statusEl){
        if(result.error==='empty_name')statusEl.textContent='氏名を入力してください';
        else if(result.error==='not_found')statusEl.textContent='対象の member が見つかりません';
        else if(result.error==='deleted')statusEl.textContent='削除済み member は編集できません';
        else if(result.error==='invalid_member_value')statusEl.textContent='支部員区分の値が不正です';
        else if(result.error==='invalid_grade_value')statusEl.textContent='会費区分の値が不正です';
        else statusEl.textContent='保存に失敗しました';
      }
      return;
    }
    // MASTER-V2-LASTCLASS S22: expected はフォーム生値ではなく applyMasterMemberEdit 適用後の
    // in-memory master.members[i] の正規化済み値から取得する。city は normalizeCity（trim /
    // 最大 20 文字）で正規化されているため、フォーム生値を expected にすると false negative になる。
    var verifyTarget_s22=null;
    for(var vi_s22=0;vi_s22<master.members.length;vi_s22++){
      if(master.members[vi_s22]&&master.members[vi_s22].id===memberId){verifyTarget_s22=master.members[vi_s22];break;}
    }
    saveBranchMaster(master);
    // saveBranchMaster は例外を握り潰すため、4 fields を localStorage 再読込で検証する。
    // 1 field 不一致ごとに console.warn を 1 行（field 別、後追いデバッグ用）。
    // SAVE-UX-MIN-NOTIFY-002: user-facing showMsg は 1 件集約のため、verify 結果を s22MasterVerifyOk
    // 変数に集約する。rollback / alert / retry なし。
    // SAVE-UX-WARN-HELPER: 失敗 field を s22FailedFields に集めて helper の fields 引数に渡す
    // （debug 用、user-facing 文言には含めない）。
    var s22MasterVerifyOk=true;
    var s22FailedFields=[];
    if(verifyTarget_s22){
      var checks_s22=[
        ['last_class',verifyTarget_s22.last_class],
        ['member',verifyTarget_s22.member],
        ['grade',verifyTarget_s22.grade],
        ['city',verifyTarget_s22.city]
      ];
      for(var ci_s22=0;ci_s22<checks_s22.length;ci_s22++){
        var fname_s22=checks_s22[ci_s22][0],fexp_s22=checks_s22[ci_s22][1];
        if(!verifyMasterFieldPersisted(memberId,fname_s22,fexp_s22)){
          if(typeof console!=='undefined'&&console.warn){
            console.warn('[MASTER-V2-LASTCLASS] S22 verify failed',{memberId:memberId,field:fname_s22,expected:fexp_s22});
          }
          s22MasterVerifyOk=false;
          s22FailedFields.push(fname_s22);
        }
      }
    }
    var modalEl=document.getElementById('master-edit-modal');if(modalEl)modalEl.remove();
    // SAVE-UX-DESIGN Level 1 / SAVE-UX-MIN-NOTIFY-002: master verify 失敗時は user-facing
    // 表示を warn に集約する。success showMsg('マスタを更新しました', ...) で上書きしない
    // （PR #63 と同パターン）。詳細は docs/specs/20260513_shogi_save_ux_design.md
    if(typeof showMsg==='function'){
      if(s22MasterVerifyOk){
        var msg='マスタを更新しました';
        if(result.duplicateCount>0){
          msg+='（同名 '+result.duplicateCount+'件あり：自動統合しません）';
        }
        showMsg(msg,result.duplicateCount>0?'warn':'ok');
      } else {
        // user-facing は 1 件集約。field 別の詳細は console.warn 側に残す。

function bindMigrationModalEvents(){
  var cancelBtn=document.getElementById('mig-cancel');
  if(cancelBtn)cancelBtn.addEventListener('click',function(){
    var m=document.getElementById('mig-modal');if(m)m.remove();
  });
  var runBtn=document.getElementById('mig-run');
  if(runBtn)runBtn.addEventListener('click',function(){
    var textarea=document.getElementById('mig-paste-area');
    if(textarea)textarea.blur();
    var text=textarea?textarea.value:'';
    if(!text||!text.trim()){alert('大会データを貼り付けてください');return;}
    var statusEl=document.getElementById('mig-status');
    if(statusEl)statusEl.textContent='読み込み中...';
    var parsed=parseTournamentTextInput(text);
    var tournaments=parsed.tournaments;
    var errors=parsed.errors;
    if(tournaments.length===0){
      if(statusEl){
        statusEl.textContent=errors.length===0
          ?'大会データが見つかりませんでした'
          :'貼り付けたデータの形式が正しくありません（'+errors.length+'件パース失敗）';
      }
      return;
    }
    try{
      var master=loadBranchMaster();
      var summary=mergeTournamentParticipantsIntoMaster(tournaments,master);
      // SAVE-UX-NONQUOTA-NOTIFY-001 (Codex P2): 保存失敗時は成功サマリを出さない
      //   （saveBranchMaster が既に warn を表示済。statusEl も失敗を明示してバックアップへ誘導する）。
      var saved=saveBranchMaster(master);
      if(saved){
        var msg=summary.tournaments+'大会を読込：新規追加 '+summary.added+'名 / 既存統合 '+summary.matched+'件 / スキップ '+summary.skipped+'件';
        if(errors.length>0)msg+='（'+errors.length+'件は形式エラーで失敗）';
        if(statusEl)statusEl.textContent=msg;
      }else if(statusEl){
        // SAVE-UX-NONQUOTA-NOTIFY-001 (Codex P2-A): 保存に失敗した場合、統合結果はメモリ上にしか存在せず
        //   localStorage は統合前のまま。ここで「マスタをエクスポート」を案内すると loadBranchMaster() 経由で
        //   統合前（古い）データを書き出してしまい、統合結果を失う誤誘導になる。よって復旧策として通常の
        //   エクスポートは案内せず、「統合は保存されていない（マスタは変更前のまま）」ことを明示する。
        statusEl.textContent='統合内容は保存されませんでした（支部マスタは統合前のまま変更されていません）。空き容量を確保するかプライベートブラウズを解除し、もう一度統合してください';
      }
      renderMasterTab();
      renderPastParticipantsPanel();
    }catch(err){
      if(statusEl)statusEl.textContent='統合に失敗：'+(err&&err.message?err.message:String(err));
    }
  });
}

// UTILITY: テキスト入力から複数の大会データをパース
//   - 空行で大会を区切る
//   - 改行コード CRLF/LF/CR を正規化
//   - BOM を除去
//   - 各ブロックを JSON.parse → 呼び出し側で normalizeState 等を適用
//   - 原則 throw しない（想定外の内部例外のみ throw）
//
// 戻り値: { tournaments: [{raw, source}, ...], errors: [string, ...] }
//   - 空文字 / 空白のみ: { tournaments: [], errors: [] }
//   - 全件パース失敗:    { tournaments: [], errors: [...] }
//   - 一部成功:          { tournaments: [成功分], errors: [失敗分] }
function parseTournamentTextInput(text){
  if(!text||typeof text!=='string'){
    return {tournaments:[],errors:[]};
  }
  if(text.charCodeAt(0)===0xFEFF){
    text=text.slice(1);
  }
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!text.trim()){
    return {tournaments:[],errors:[]};
  }
  var blocks=text.split(/\n\s*\n+/);
  var tournaments=[];
  var errors=[];
  blocks.forEach(function(block,idx){
    var trimmed=block.trim();
    if(!trimmed)return;
    try{
      var raw=JSON.parse(trimmed);
      tournaments.push({raw:raw,source:'block '+(idx+1)});
    }catch(e){
      errors.push('block '+(idx+1)+': パースに失敗 - '+e.message);
    }
  });
  return {tournaments:tournaments,errors:errors};
}

function deriveTournamentMetaForMigration(raw,filename,master){
  if(raw&&typeof raw.tournament_id==='string'&&raw.tournament_id){
    var tdate=isValidYmd(raw.tournament_date)?raw.tournament_date:null;
    if(!tdate&&raw.report&&typeof raw.report.date==='string'){
      var rm0=raw.report.date.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
      if(rm0)tdate=rm0[1]+'-'+('0'+rm0[2]).slice(-2)+'-'+('0'+rm0[3]).slice(-2);
    }
    return {tournament_id:raw.tournament_id, tournament_date:tdate||todayYmd()};
  }
  var date=null;
  var fm=filename&&filename.match(/(\d{4})(\d{2})(\d{2})/);
  if(fm)date=fm[1]+'-'+fm[2]+'-'+fm[3];
  if(!date&&raw&&raw.report&&typeof raw.report.date==='string'){
    var rm=raw.report.date.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
    if(rm)date=rm[1]+'-'+('0'+rm[2]).slice(-2)+'-'+('0'+rm[3]).slice(-2);
  }
  if(!date)date=todayYmd();
  var base='t_'+date.replace(/-/g,'_');
  var existing={};
  for(var i=0;i<master.members.length;i++){
    var arr=master.members[i].tournament_ids||[];
    for(var j=0;j<arr.length;j++)existing[arr[j]]=true;
  }
  var id=base; var n=2;
  while(existing[id]){id=base+'_'+n;n++;}
  return {tournament_id:id, tournament_date:date};
}

function mergeTournamentParticipantsIntoMaster(tournaments,master){
  var added=0, matched=0, skipped=0;
  for(var t=0;t<tournaments.length;t++){
    var entry=tournaments[t];
    var raw=entry&&entry.raw;
    if(!raw||typeof raw!=='object'){skipped++;continue;}
    var tempState=normalizeState(raw);
    var meta=deriveTournamentMetaForMigration(raw,entry.filename||'',master);
    // Issue #273: A/B 固定をやめ、各大会の tempState の全クラス（state.classes / players キー）を走査し、
    //   C 以降のクラス参加者が過去大会統合から取りこぼされる問題を解消する。A/B のみの大会は同順・不変。
    var classes=listClassIdsForMasterSync(tempState);
    for(var ci=0;ci<classes.length;ci++){
      var cls=classes[ci];
      var players=tempState.players[cls]||[];
      for(var pi=0;pi<players.length;pi++){
        var p=players[pi];
        if(!p||!p.name)continue;
        var member=null;
        if(typeof p.member_id==='string'&&p.member_id){
          for(var mi=0;mi<master.members.length;mi++){
            if(master.members[mi].id===p.member_id){member=master.members[mi];break;}
          }
        }
        if(!member){
          var cands=findMemberCandidates({name:p.name},master);
          if(cands.length===1){
            member=cands[0]; matched++;
          }else{
            // 0件 → 新規。複数 → 自動統合しない（仕様書 7.5）→ 新規作成
            try{
              member=createMemberFromParticipant(p,master,meta.tournament_date);
              master.members.push(member); added++;
            }catch(e){skipped++;continue;}
          }
        }else{
          matched++;
        }
        addTournamentIdOnce(member,meta.tournament_id);
        // Issue #273 / Codex P1: 統合経路も同様に last_class を「最新出席のクラス」に揃える。
        //   この大会が member の最新出席（既存 last_attended 以降、または初出席）になるときだけ上書きし、
        //   古い大会で新しいクラスを潰さない。C 以降は A/B/null 不変条件を保つため null に揃える
        //   （旧実装は A/B のみ上書きし、C 以降の統合で stale な "A"/"B" が残って C→null 不変条件を破っていた）。
        var isLatestAttendance273=isValidYmd(meta.tournament_date)&&(!member.last_attended||meta.tournament_date>=member.last_attended);
        if(isValidYmd(meta.tournament_date)){
          if(!member.last_attended||meta.tournament_date>=member.last_attended)member.last_attended=meta.tournament_date;
          if(!member.first_attended||meta.tournament_date<member.first_attended)member.first_attended=meta.tournament_date;
        }
        if(isLatestAttendance273)member.last_class=(p.cls==='A'||p.cls==='B')?p.cls:null;
        recalcMemberAttendance(member);
      }
    }
  }
  return {tournaments:tournaments.length, added:added, matched:matched, skipped:skipped};
}

// ROUND-CLASS-START-005 (spec §11 / §15.1 / inventory §3.4):

//   既存 pane-{classId} があれば何もしない（冪等）。
//   getElementById 経由のため、grid コンテナが存在しない場合は silent no-op。
//   renderTournament / showTab('tournament') から呼ばれる。
function ensureClassPaneDomNodes(){
  if(!Array.isArray(state.classes))return;
  var grid=document.getElementById('pane-tournament-grid');
  if(!grid)return;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    if(!c||!isSafeClassId(c.id))continue;
    if(document.getElementById('pane-'+c.id))continue;
    var d=document.createElement('div');
    d.id='pane-'+c.id;
    grid.appendChild(d);
  }
}

//   受付タブから開始導線を外し、開始は対局管理タブ（startBtnClass_{cls} → startTournamentForClass(cls)）へ集約。

// ROUND-CLASS-START-006 (spec §11.3 系の reg 版):
//   reg-class-grid 内に C クラス以降の section を動的補完する。
//   既存 A/B section（data-class-id="A"/"B"）は静的 DOM のまま維持。
//   isSafeClassId で安全な classId のみ追加（Codex S3 / DOM id 破綻防止）。
//   存在チェック: getElementById(regClassListId(classId)) で既設なら no-op（冪等）。
//   getElementById 経由のため、grid コンテナが存在しない場合は silent no-op。
function ensureClassRegDomNodes(){
  if(!Array.isArray(state.classes))return;
  var grid=document.getElementById('reg-class-grid');
  if(!grid)return;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    if(!c||!isSafeClassId(c.id))continue;
    if(document.getElementById(regClassListId(c.id)))continue;
    // section コンテナ
    var section=document.createElement('div');
    section.setAttribute('data-class-id',c.id);
    // header (h3 + bulkedit button)
    var header=document.createElement('div');
    header.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px';
    var h3=document.createElement('h3');
    h3.style.marginBottom='0';
    // CLASS-VARIABLE-001: クラス名は専用 span（regClassNameId）に入れ、renderRegList が
    //   改名時に textContent を更新できるようにする（A/B 静的 DOM の a-name/b-name span と同構造）。
    var nameSpan=document.createElement('span');
    nameSpan.id=regClassNameId(c.id);
    nameSpan.textContent=(c.name||c.id+'クラス');
    h3.appendChild(nameSpan);
    h3.appendChild(document.createTextNode(' '));
    var cnt=document.createElement('span');
    cnt.id=regClassCountId(c.id);
    cnt.style.cssText='color:#888;font-size:12px;font-weight:400';
    h3.appendChild(cnt);
    header.appendChild(h3);
    var btn=document.createElement('button');
    btn.type='button';
    btn.id=regClassBulkEditId(c.id);
    btn.className='btn-sm';
    btn.style.cssText='border-color:#2E75B6;color:#2E75B6';
    btn.textContent='名前を一括編集';
    // ROUND-CLASS-START-007 (Codex Should Fix S3):
    //   bulkEdit click handler bind は ensureClassRegDomNodes 内では行わず、
    //   bindClassBulkEditHandlers() に集約する。A/B 既存 bind と同経路で統一する。
    header.appendChild(btn);
    section.appendChild(header);
    // SHOGI-TOUR-START-001: 見出し直下に readiness バッジを生成（A/B 静的 DOM と同位置）。
    //   初期は非表示。renderRegList が validateStartableClass から導出して描画する。
    var readiness=document.createElement('div');
    readiness.id=regClassReadinessId(c.id);
    readiness.className='class-readiness';
    if(readiness.style)readiness.style.display='none';
    section.appendChild(readiness);
    // START-UX-CONSOLIDATE-001: 受付タブのクラス別「1局目を作成」ボタン（reg-class-start / START-003）の
    //   動的生成は撤去した。開始導線は対局管理タブ（startBtnClass_{cls} → startTournamentForClass(cls)）へ集約。
    //   readiness バッジ（上記）は読み取り専用の情報表示として残置する。
    // list
    var list=document.createElement('div');
    list.id=regClassListId(c.id);
    section.appendChild(list);
    grid.appendChild(section);
  }
}

// ROUND-CLASS-START-007 (Codex Should Fix S3):
//   bulkEdit ボタンの click handler bind を classes-driven に統一する。
//   A/B 静的ボタン（bulkEditA/B）も C+ 動的ボタン（class-bulkedit-{classId}）も
//   ここから bulkEditNames(classId) を bind する。
//   重複 bind 防止: 各ボタンに data-bulkedit-bound 属性を立て、再呼出時に skip する。
//   呼出契機:
//     - bindRegistrationEvents (起動時、A/B 静的 DOM 用)
//     - renderRegList (ensureClassRegDomNodes が C+ 動的 DOM を生成した直後)
//   classId は getRegistrationClassList() で取得し isSafeClassId/fallback 整合性を維持。
function bindClassBulkEditHandlers(){
  var classes=getRegistrationClassList();
  for(var i=0;i<classes.length;i++){
    var c=classes[i];
    if(!c||!isSafeClassId(c.id))continue;
    var btn=document.getElementById(regClassBulkEditId(c.id));
    if(!btn)continue;
    // 既に bind 済みなら skip（idempotent）
    if(btn.getAttribute&&btn.getAttribute('data-bulkedit-bound')==='true')continue;
    btn.addEventListener('click',(function(cid){return function(){bulkEditNames(cid);};})(c.id));
    if(btn.setAttribute)btn.setAttribute('data-bulkedit-bound','true');
  }
}

// ROUND-CLASS-START-006 (Codex Should Fix S4):
//   state.classes 不在 / 空 / 不正でも renderRegList / count 更新が安全に動作するための fallback。
//   通常経路（normalizeState 後）は state.classes が必ず存在するが、
//   破損 localStorage 直接読み / 直前で state を差し替えた中間状態 / 古い JSON migrate 前等の
//   defensive 経路で fallback ['A','B'] に戻す。
//   既存 A/B section の DOM id（a-count/a-list/bulkEditA/B）に依存する callsite が安全に動く。
function getRegistrationClassList(){
  if(state&&Array.isArray(state.classes)){
    var out=[];
    for(var i=0;i<state.classes.length;i++){
      var c=state.classes[i];
      if(c&&isSafeClassId(c.id))out.push({id:c.id,name:c.name||(c.id+'クラス'),started:c.started===true});
    }
    if(out.length>0)return out;
  }
  // fallback: 旧データ互換と同じく ['A','B'] 既定
  return [
    {id:'A',name:'Aクラス',started:false},
    {id:'B',name:'Bクラス',started:false}
  ];
}

// ============================================================
// CLASS-VARIABLE-001 (CV-1): クラス管理（追加 / 改名 / 削除）+ inp-class の class 駆動化
//   「A/B 固定をやめ 3 クラス以上に増やせる」ための UI 層。データモデル（normalizeState /
//   normalizeClasses / emptyClassDict）・保存復元・ペアリング・集計・印刷は既に class 駆動で
//   完成済みのため、本スライスは state.classes を runtime で mutate する導線だけを足す。
//   - A/B はアプリ既定クラス：normalizeClasses が読込毎に必ず A/B を補完するため、削除しても
//     再読込で復活する → 混乱回避のため A/B は削除不可（builtin 保護）。改名は state に残るため永続。
//   - 追加クラスの classId は英大文字 C..Z を順に採番（尽きたら CLS1, CLS2…）。isSafeClassId 準拠の ASCII。
//   - dict（players/pairings/results）は追加時に空配列で初期化、削除時に delete する。
// ============================================================

// 全クラスの参加者を 1 配列に集約する（同名重複チェック用の class 駆動版）。
//   A/B 固定の state.players.A.concat(state.players.B) を置換。A/B のみなら従来と同一結果。
//   C 以降があれば全クラス横断で重複検知し、C 登録時も A/B と同じ重複保護を効かせる。
function allRegisteredPlayers(){
  var out=[];
  var clsList=getRegistrationClassList();
  for(var i=0;i<clsList.length;i++){
    var arr=state&&state.players&&state.players[clsList[i].id];
    if(Array.isArray(arr))out=out.concat(arr);
  }
  return out;
}

// 次に使える classId を返す（C..Z を順に、尽きたら CLS1, CLS2…）。state は読むが mutate しない。
function nextClassId(){
  var used={};
  if(state&&Array.isArray(state.classes)){
    for(var i=0;i<state.classes.length;i++){
      if(state.classes[i]&&typeof state.classes[i].id==='string')used[state.classes[i].id]=true;
    }
  }
  for(var c=67;c<=90;c++){ // 'C'(67)..'Z'(90)：A/B は既定なので C から探す
    var letter=String.fromCharCode(c);
    if(!used[letter])return letter;
  }
  var n=1;
  while(used['CLS'+n])n++;
  return 'CLS'+n;
}

// クラスに在籍者（state.players[classId]）が 1 名以上いるか。
function classHasPlayers(classId){
  return !!(state&&state.players&&Array.isArray(state.players[classId])&&state.players[classId].length>0);
}

// クラス削除の可否判定（pure）。{ok:true,reason:null} か {ok:false,reason}。
//   builtin（A/B）→不可 / started→不可 / hasPlayers→不可。
function canDeleteClass(classId){
  if(classId==='A'||classId==='B')return {ok:false,reason:'builtin'};
  if(isClassStarted(classId))return {ok:false,reason:'started'};
  if(classHasPlayers(classId))return {ok:false,reason:'hasPlayers'};
  return {ok:true,reason:null};
}

// 削除不可理由のユーザー向け文言。
function deleteGuardMessage(reason){
  if(reason==='builtin')return 'A・Bクラスはアプリの既定クラスのため削除できません。';
  if(reason==='started')return '開始済みのクラスは削除できません。';
  if(reason==='hasPlayers')return '参加者が登録されているクラスは削除できません。先に参加者を削除してください。';
  return 'このクラスは削除できません。';
}

// クラスを追加する。rawName は表示名（空なら "{id}クラス"）。成功時 classId、失敗時 null。
//   state.classes へ push し players/pairings/results dict を空配列で初期化する。
function addClass(rawName){
  if(!state)return null;
  if(!Array.isArray(state.classes))state.classes=[];
  var id=nextClassId();
  if(!isSafeClassId(id))return null;
  var name=(typeof rawName==='string')?rawName.trim():'';
  if(!name)name=id+'クラス';
  state.classes.push({id:id,name:name,started:false});
  if(!state.players||typeof state.players!=='object')state.players={};
  if(!Array.isArray(state.players[id]))state.players[id]=[];
  if(!state.pairings||typeof state.pairings!=='object')state.pairings={};
  if(!Array.isArray(state.pairings[id]))state.pairings[id]=[];
  if(!state.results||typeof state.results!=='object')state.results={};
  if(!Array.isArray(state.results[id]))state.results[id]=[];
  renderRegList();
  save();
  return id;
}

// クラスを改名する。空名は拒否。成功 true / 失敗 false。
function renameClass(classId,rawName){
  if(!state||!Array.isArray(state.classes))return false;
  var name=(typeof rawName==='string')?rawName.trim():'';
  if(!name)return false;
  for(var i=0;i<state.classes.length;i++){
    if(state.classes[i]&&state.classes[i].id===classId){
      state.classes[i].name=name;
      renderRegList();
      save();
      return true;
    }
  }
  return false;
}

// 削除されたクラスの DOM ノード（受付 section / 対局 pane / 結果 section）を除去する。
//   ensure*DomNodes は追加のみのため、削除はここで明示的に行う（parentNode から removeChild、なければ no-op）。
function removeClassDomNodes(classId){
  var listEl=document.getElementById(regClassListId(classId));
  // listEl.parentNode は data-class-id section、その親が reg-class-grid
  if(listEl&&listEl.parentNode&&listEl.parentNode.parentNode){
    listEl.parentNode.parentNode.removeChild(listEl.parentNode);
  }
  var pane=document.getElementById('pane-'+classId);
  if(pane&&pane.parentNode)pane.parentNode.removeChild(pane);
  var res=document.getElementById('result-'+classId);
  if(res&&res.parentNode)res.parentNode.removeChild(res);
}

// クラスを削除する（canDeleteClass が ok のときのみ）。成功 true / 失敗 false。
//   state.classes から splice、players/pairings/results dict を delete、DOM を除去する。
function removeClass(classId){
  if(!canDeleteClass(classId).ok)return false;
  if(!state||!Array.isArray(state.classes))return false;
  var idx=-1;
  for(var i=0;i<state.classes.length;i++){
    if(state.classes[i]&&state.classes[i].id===classId){idx=i;break;}
  }
  if(idx<0)return false;
  state.classes.splice(idx,1);
  if(state.players)delete state.players[classId];
  if(state.pairings)delete state.pairings[classId];
  if(state.results)delete state.results[classId];
  removeClassDomNodes(classId);
  syncGlobalStartedFromClasses();
  renderRegList();
  save();
  return true;
}

// 登録プルダウン inp-class の option を state.classes から動的生成する（CV-1 最優先）。
//   現在の選択値が有効なら維持、無効/未設定なら先頭クラスへ。idempotent。
//   静的 HTML の A/B option は no-JS フォールバックとして残し、ここで毎回作り直す。
function populateClassSelect(){
  var sel=document.getElementById('inp-class');
  if(!sel)return;
  var clsList=getRegistrationClassList();
  var prev=sel.value;
  sel.innerHTML='';
  var hasPrev=false;
  for(var i=0;i<clsList.length;i++){
    var opt=document.createElement('option');
    opt.value=clsList[i].id;
    opt.textContent=clsList[i].name||(clsList[i].id+'クラス');
    sel.appendChild(opt);
    if(clsList[i].id===prev)hasPrev=true;
  }
  if(hasPrev)sel.value=prev;
  else if(clsList.length>0)sel.value=clsList[0].id;
}

// クラス管理リスト（#class-manager-list）を描画する。各行＝クラス名 + 状態 + 「改名」「削除」ボタン。
//   削除ボタンは canDeleteClass で disabled 化し理由を title 表示（XSS 安全：textContent / addEventListener）。
function renderClassManager(){
  var host=document.getElementById('class-manager-list');
  if(!host)return;
  var clsList=getRegistrationClassList();
  host.innerHTML='';
  for(var i=0;i<clsList.length;i++){
    (function(c){
      var row=document.createElement('div');
      row.className='class-manager-row';
      row.style.cssText='display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #eee';
      var nameSpan=document.createElement('span');
      nameSpan.textContent=c.name||(c.id+'クラス');
      nameSpan.style.cssText='flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      row.appendChild(nameSpan);
      var statusSpan=document.createElement('span');
      statusSpan.style.cssText='font-size:12px;color:#888;white-space:nowrap';
      var n=(state&&state.players&&Array.isArray(state.players[c.id]))?state.players[c.id].length:0;
      statusSpan.textContent='('+n+'名'+(isClassStarted(c.id)?'・開始済み':'')+')';
      row.appendChild(statusSpan);
      var renameBtn=document.createElement('button');
      renameBtn.type='button';
      renameBtn.className='btn-sm';
      renameBtn.textContent='改名';
      renameBtn.addEventListener('click',function(){onClickRenameClass(c.id);});
      row.appendChild(renameBtn);
      var delBtn=document.createElement('button');
      delBtn.type='button';
      delBtn.textContent='削除';
      var guard=canDeleteClass(c.id);
      if(!guard.ok){
        delBtn.className='btn-sm';
        delBtn.disabled=true;
        if(delBtn.setAttribute)delBtn.setAttribute('title',deleteGuardMessage(guard.reason));
        delBtn.style.cssText='opacity:0.5;cursor:not-allowed';
      }else{
        delBtn.className='btn-sm btn-danger';
      }
      delBtn.addEventListener('click',function(){onClickRemoveClass(c.id);});
      row.appendChild(delBtn);
      host.appendChild(row);
    })(clsList[i]);
  }
}

// 「クラスを追加」ボタンのハンドラ。#inp-new-class の値を名前として addClass する。
function onClickAddClass(){
  var inp=document.getElementById('inp-new-class');
  var name=inp?inp.value:'';
  var id=addClass(name);
  if(inp)inp.value='';
  if(id){
    var label=(name&&name.trim())?name.trim():(id+'クラス');
    showMsg(label+'を追加しました','ok');
  }
}

// 「改名」ボタンのハンドラ。prompt で新名を取得し renameClass する。
function onClickRenameClass(classId){
  var cur='';
  var clsList=getRegistrationClassList();
  for(var i=0;i<clsList.length;i++){if(clsList[i].id===classId){cur=clsList[i].name;break;}}
  var input=prompt('新しいクラス名を入力してください',cur);
  if(input===null)return;                 // キャンセル
  var name=input.trim();
  if(!name){alert('クラス名を入力してください');return;}
  if(name===cur)return;                    // 変更なし
  renameClass(classId,name);
}

// 「削除」ボタンのハンドラ。canDeleteClass を確認し confirm の上で removeClass する。
function onClickRemoveClass(classId){
  var guard=canDeleteClass(classId);
  if(!guard.ok){alert(deleteGuardMessage(guard.reason));return;}
  var cur=classId;
  var clsList=getRegistrationClassList();
  for(var i=0;i<clsList.length;i++){if(clsList[i].id===classId){cur=clsList[i].name;break;}}
  if(!confirm('「'+cur+'」を削除しますか？この操作は取り消せません。'))return;
  removeClass(classId);
}

// ROUND-CLASS-START-005 (spec §11 / §15.1):
//   result-{classId} 不足分を result-list の末尾に append する。
//   既存 A/B は静的 DOM として維持。3 クラス以上の場合のみ補完される。
//   新規 result-{classId} は既存 result-B と同じ margin-top:16px を付与し
//   レイアウト連続性を保つ（first / non-first の判別は static result-A の存在前提）。
//   renderResults / showTab('result') から呼ばれる。
function ensureClassResultDomNodes(){
  if(!Array.isArray(state.classes))return;
  var list=document.getElementById('result-list');
  if(!list)return;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    // ROUND-CLASS-START-006 (Codex Should Fix S1): isSafeClassId() で id-safety を強制し、
    //   ensureClassPaneDomNodes / ensureClassRegDomNodes / calcTotal と同条件に揃える。
    if(!c||!isSafeClassId(c.id))continue;
    if(document.getElementById('result-'+c.id))continue;
    var d=document.createElement('div');
    d.id='result-'+c.id;
    // ROUND-CLASS-START-007 (spec §15.1): .result-section クラスを付与し、印刷時の
    //   page-break を class 駆動汎用 CSS（.result-section + .result-section）に揃える。
    d.className='result-section';
    if(d.style)d.style.marginTop='16px';
    list.appendChild(d);
  }
}

function showTab(t){
  document.getElementById('pane-reg').style.display=t==='reg'?'block':'none';
  document.getElementById('pane-tournament').style.display=t==='tournament'?'block':'none';
  document.getElementById('pane-result').style.display=t==='result'?'block':'none';
  var pm=document.getElementById('pane-master');if(pm)pm.style.display=t==='master'?'block':'none';
  var ph=document.getElementById('pane-history');if(ph)ph.style.display=t==='history'?'block':'none';
  document.getElementById('tab-reg').className='tab'+(t==='reg'?' active':'');
  document.getElementById('tab-tournament').className='tab'+(t==='tournament'?' active':'');
  document.getElementById('tab-result').className='tab'+(t==='result'?' active':'');
  var tm=document.getElementById('tab-master');if(tm)tm.className='tab'+(t==='master'?' active':'');
  var th=document.getElementById('tab-history');if(th)th.className='tab'+(t==='history'?' active':'');
  try{window.scrollTo(0,0);}catch(e){}
  if(t==='result')renderResults();
  // ROUND-CLASS-START-005 (spec §15.1 row 1): tournament タブ表示時は
  //   state.classes を走査して renderTournament(c.id) を呼ぶ（A/B literal 解消）。
  //   ensureClassPaneDomNodes() で pane-{classId} 不足分を補完してから描画する。
  //   state.classes が空 / 未定義の場合は何も描画しない（normalizeState 後は必ず存在）。
  if(t==='tournament'){
    ensureClassPaneDomNodes();
    if(Array.isArray(state.classes)){
      for(var i=0;i<state.classes.length;i++){
        var c=state.classes[i];
        if(c&&typeof c.id==='string'&&c.id)renderTournament(c.id);
      }
    }
  }
  if(t==='master')renderMasterTab();
  if(t==='history'&&typeof renderHistoryList==='function')renderHistoryList();
}

function showMsg(text,type){
  var el=document.getElementById('reg-msg');
  el.innerHTML=text?'<div class="alert alert-'+type+'">'+escapeHtml(text)+'</div>':'';
}
// 当日UX: 成功フィードバックの軽量トースト（#app-toast）。textContent のみ・自動で消える・例外は握りつぶす。
var _toastTimer=null;
function showToast(text){
  try{
    var el=document.getElementById('app-toast');
    if(!el)return;
    el.textContent=String(text==null?'':text);
    el.className='app-toast show';
    if(_toastTimer)clearTimeout(_toastTimer);
    _toastTimer=setTimeout(function(){ var e2=document.getElementById('app-toast'); if(e2)e2.className='app-toast'; },1800);
  }catch(e){}
}

// 致命的エラーは登録タブが見えていない可能性があるため alert で通知（重複連発を避けるため直近メッセージで抑止）
// SAVE-NONQUOTA-ALERT (Issue #278): alwaysAlert=true のときは表示中タブに関わらず alert を出す。
//   保存失敗（データ消失に直結）は登録タブ表示中でも blocking alert で確実に認知させるため、save() が true を渡す。
//   alert は dedup（直近メッセージ抑止）の内側にあるので、true でも 3 秒以内の連発では二重に出ない。
var _lastErr={text:'',at:0};
function notifyError(text,alwaysAlert){
  showMsg(text,'err');
  var now=Date.now();
  if(_lastErr.text===text&&now-_lastErr.at<3000)return;
  _lastErr={text:text,at:now};
  var regVisible=document.getElementById('pane-reg').style.display!=='none';
  if(alwaysAlert||!regVisible)alert(text);
}

// SAVE-UX-STATUS-INDICATOR: Level 2 indicator 用の memory-only state。
//   localStorage / sessionStorage / tournament state に保存しない（設計書 §6）。
//   reload で消えるのは意図的。永続ログが必要なら SAVE-FUTURE-REPORT で別設計。
//   将来 history 等を持つ余地として object 形式。
var saveWarningIndicatorState={count:0};

// SAVE-UX-WARN-AGGREGATION-IMPL-DISPLAY: showMsg aggregation 用の memory-only state。
//   localStorage / sessionStorage / tournament state には保存しない（reload で消える）。
//   aggregateKey 単位で「最後に発生した時刻」を保持し、3 秒未満で再発した場合のみ
//   2 回目以降の showMsg を短縮文言に切り替える。console.warn / indicator count は不変。
//   時間窓 3000ms は初期値（運用感覚で後続 PR にて調整可能）。
//   短縮文言は当日運営中の混乱を避けるため reload を促さず「内容を確認してください」に留める。
var SAVE_WARN_AGGREGATION_WINDOW_MS=3000;
var SAVE_WARN_AGGREGATED_MESSAGE='保存確認に失敗した操作が複数あります。内容を確認してください。';
// SAVE-UX-MASTER-V2-AGGREGATION: aggregation 対象 kind の allow-list。
//   - 'save-verify' (A-5.1 SAVE 系 15 callsite、PR #76 で aggregation 対象化)
//   - 'master-verify' (MASTER-V2-LASTCLASS S03/S05/S22、本 PR で aggregation 対象化)
//   storage-quota は意図的に含めない（quota は 1 回 1 回確実な認知が必要、
//   PR #79 設計参照）。将来 kind 追加時はここに 1 要素追加して判断可能。
var SAVE_WARN_AGGREGATABLE_KINDS=new Set(['save-verify','master-verify']);
var saveWarningAggregationState={lastTimestampByKey:{}};

// テスト用 reset。本番 UI からは呼ばない（clear UI / reset UI は実装しない）。
function _resetSaveWarningAggregationState(){
  saveWarningAggregationState.lastTimestampByKey={};
}

// SAVE-UX-STATUS-INDICATOR: indicator count を +1 し、DOM を更新する。
//   notifySaveWarning 1 回呼出 = count +1（設計書 §7 count 増加単位）。
//   fields.length 分は加算しない（S22 4 fields 失敗でも +1）。
//   options は将来拡張用に受け取るが現状は使わない。
//   例外を投げない（notifySaveWarning の契約を壊さない）。戻り値 void。
function recordSaveWarningForIndicator(options){
  try{
    saveWarningIndicatorState.count+=1;
    updateSaveWarningIndicator();
  }catch(e){
    if(typeof console!=='undefined'&&console.warn){
      console.warn('[SAVE-WARN-INDICATOR] record failed',e);
    }
  }
}

// SAVE-UX-STATUS-INDICATOR: indicator DOM (#save-warning-indicator) に count を反映。
//   DOM 不在時は silent skip。textContent で表示（innerHTML 不使用）。
//   N=0 → hidden / N>=1 → 「保存確認 N件」。
//   例外を投げない。戻り値 void。
function updateSaveWarningIndicator(){
  try{
    var el=document.getElementById('save-warning-indicator');
    if(!el)return;
    var n=saveWarningIndicatorState.count;
    if(n<=0){
      el.hidden=true;
      el.textContent='';
    }else{
      el.hidden=false;
      // U-2b (UX-P1): 数字ではなく行動を促す一言に。件数は title（ツールチップ）へ退避。
      el.textContent='⚠ 未保存の恐れ・要バックアップ';
      el.title='保存の確認が取れていません（'+n+'件）。押すと対処方法を表示します';
    }
  }catch(e){
    if(typeof console!=='undefined'&&console.warn){
      console.warn('[SAVE-WARN-INDICATOR] update failed',e);
    }
  }
}

// SAVE-UX-WARN-HELPER: SAVE-UX-DESIGN Level 1 の user-facing warn helper。
//   showMsg(.., 'warn') と 総括 console.warn のみを担当する。
//   success showMsg の抑止は callsite 側の責務（PR #63 / #65 と同じ設計を保護する）。
//   既存の field 別 console.warn は callsite 側に残す（debug 詳細）。
// 引数 options:
//   - message (string, 必須): user-facing 文言。空のときは showMsg を出さず安全側で return
//   - consoleTag (string): 総括 console.warn のタグ。grep しやすい既存タグ準拠
//   - callsiteId (string): 'SAVE-XXX-<functionName>' などの識別子
//   - fields (string[]): 失敗 field 名（debug 用、user-facing 文言には含めない）
// 任意 metadata（SAVE-UX-WARN-AGGREGATION-IMPL 土台）:
//   - kind (string): warn の種別（例: 'save-verify'）。helper 内で値検証しない
//   - aggregateKey (string): 将来 aggregation 表示の同一性キー（例: 'save-verify:core'）。
//                            helper 内で値検証・showMsg 抑制・count 集約を行わない
//   - severity (string): 警告レベル（例: 'warn'）。helper 内で表示分岐しない
// 戻り値: void。success 抑止判定には使わない。例外は投げない。
function notifySaveWarning(options){
  var opts=options||{};
  var message=(typeof opts.message==='string'&&opts.message)?opts.message:'';
  var consoleTag=(typeof opts.consoleTag==='string'&&opts.consoleTag)?opts.consoleTag:'[SAVE-WARN]';
  var callsiteId=(typeof opts.callsiteId==='string')?opts.callsiteId:'unknown';
  var fields=(Object.prototype.toString.call(opts.fields)==='[object Array]')?opts.fields:[];
  // SAVE-UX-WARN-AGGREGATION-IMPL: 任意 metadata を console.warn / indicator 経路に流す。
  //   undefined のときは output object に含めない（プレースホルダ値の混入を避ける）。
  //   集約・抑制・表示分岐は本 PR で実装しない（土台のみ）。
  var kind=opts.kind;
  var aggregateKey=opts.aggregateKey;
  var severity=opts.severity;
  if(!message){
    // message 不在は callsite 側 bug の可能性。例外を投げず、debug ログを残して安全 return。
    if(typeof console!=='undefined'&&console.warn){
      var bugMeta={callsiteId:callsiteId,fields:fields,error:'notifySaveWarning called without message'};
      if(kind!==undefined)bugMeta.kind=kind;
      if(aggregateKey!==undefined)bugMeta.aggregateKey=aggregateKey;
      if(severity!==undefined)bugMeta.severity=severity;
      console.warn(consoleTag,bugMeta);
    }
    return;
  }
  // SAVE-UX-WARN-AGGREGATION-IMPL-DISPLAY / SAVE-UX-MASTER-V2-AGGREGATION: showMsg のみ集約。
  //   条件: SAVE_WARN_AGGREGATABLE_KINDS.has(kind) && severity==='warn' && aggregateKey が truthy
  //   現在の allow-list: 'save-verify' / 'master-verify'。storage-quota は対象外。
  //   同一 aggregateKey で 3 秒未満に再発した場合のみ短縮文言に切替。
  //   1 回目 / 別 key / 3 秒経過後 / metadata 不足は元 message のまま。
  //   console.warn / indicator count / showMsg type は不変（失敗を隠さない原則）。
  var displayMessage=message;
  if(SAVE_WARN_AGGREGATABLE_KINDS.has(kind)&&severity==='warn'&&aggregateKey){
    var nowTs=Date.now();
    var lastTs=saveWarningAggregationState.lastTimestampByKey[aggregateKey];
    if(typeof lastTs==='number'&&(nowTs-lastTs)<SAVE_WARN_AGGREGATION_WINDOW_MS){
      displayMessage=SAVE_WARN_AGGREGATED_MESSAGE;
    }
    saveWarningAggregationState.lastTimestampByKey[aggregateKey]=nowTs;
  }
  if(typeof showMsg==='function'){
    showMsg(displayMessage,'warn');
  }
  if(typeof console!=='undefined'&&console.warn){
    var warnMeta={callsiteId:callsiteId,fields:fields};
    if(kind!==undefined)warnMeta.kind=kind;
    if(aggregateKey!==undefined)warnMeta.aggregateKey=aggregateKey;
    if(severity!==undefined)warnMeta.severity=severity;
    console.warn(consoleTag,warnMeta);
  }
  // SAVE-UX-STATUS-INDICATOR: helper 1 呼出 = indicator count +1（設計書 §7）。
  //   fields.length 分は加算しない。callsite 不変。例外を投げない契約を維持。
  //   SAVE-UX-WARN-AGGREGATION-IMPL: metadata は indicator 経路に渡すが count 集約には使わない。
  var indicatorPayload={callsiteId:callsiteId,fields:fields};
  if(kind!==undefined)indicatorPayload.kind=kind;
  if(aggregateKey!==undefined)indicatorPayload.aggregateKey=aggregateKey;
  if(severity!==undefined)indicatorPayload.severity=severity;
  recordSaveWarningForIndicator(indicatorPayload);
}

function renderRegList(){
  // ROUND-CLASS-START-006 (spec §15.1):
  //   受付一覧を classes-driven にする。fallback で state.classes 不在時も安全に動作する（Codex S4）。
  //   C クラス以降の section は ensureClassRegDomNodes() が動的補完する。
  //   classId id-safety は isSafeClassId() で保証され、a-count/b-count/bulkEditA/B 互換 id は
  //   regClassCountId/regClassListId/regClassBulkEditId が翻訳する。
  ensureClassRegDomNodes();
  // ROUND-CLASS-START-007 (Codex Should Fix S3): C+ 動的セクションの bulkEdit ボタンを bind。
  //   A/B 静的ボタンは bindRegistrationEvents 起動時に bind 済（idempotent 設計、重複 bind なし）。
  bindClassBulkEditHandlers();
  // START-UX-CONSOLIDATE-001: 受付タブのクラス別開始ボタン bind（bindClassStartHandlers / START-003）は撤去。
  //   受付タブに開始 handler を残さない（開始は対局管理タブへ集約）。readiness 表示は下記で描画（読み取り専用）。
  // CLASS-VARIABLE-001 (CV-1): 登録プルダウン inp-class とクラス管理リストを state.classes 駆動で再描画。
  //   populateClassSelect は現在の選択値を保持するため、登録途中の再描画でも選択が飛ばない。
  populateClassSelect();
  renderClassManager();
  var clsList=getRegistrationClassList();
  var allCount=0;
  for(var ci=0;ci<clsList.length;ci++){
    var cls=clsList[ci].id;
    var players=(state.players&&Array.isArray(state.players[cls]))?state.players[cls]:[];
    allCount+=players.length;
    var countEl=document.getElementById(regClassCountId(cls));
    var listEl=document.getElementById(regClassListId(cls));
    if(countEl)countEl.textContent='('+players.length+'名)';
    // CLASS-VARIABLE-001 (CV-1): 改名を受付見出しへ反映（A/B 静的 a-name/b-name span ＋ C+ 動的 span を同経路で更新）。
    var nameEl=document.getElementById(regClassNameId(cls));
    if(nameEl)nameEl.textContent=clsList[ci].name||(cls+'クラス');
    if(listEl){
      listEl.innerHTML='';
      for(var i=0;i<players.length;i++){
        listEl.appendChild(makePlayerRow(players[i],cls,i));
      }
    }
    // SHOGI-TOUR-START-001: クラス別 開始 readiness バッジ（派生値・保存しない）。
    //   開始可否は validateStartableClass に委譲（§6）。clsList[ci]={id,name,started} を classInfo として渡す。
    renderClassReadiness(cls,clsList[ci],players);
    // START-UX-CONSOLIDATE-001: クラス別「1局目を作成」ボタンの描画（renderClassStartButton / START-003）は撤去。
    //   受付タブには開始コントロールを置かない。開始は対局管理タブ（startBtnClass_{cls}）に集約。
  }
  var total=calcTotal();
  var feeEl=document.getElementById('fee-summary');
  if(feeEl){
    if(allCount>0){
      feeEl.className='fee-bar';
      feeEl.innerHTML='参加者計 <strong>'+allCount+'名</strong>　　集金合計 <strong style="color:#1F3864;font-size:16px">'+total.toLocaleString()+'円</strong>';
    } else {
      feeEl.innerHTML='';
    }
  }
}

// FURIGANA-MVP-001: 氏名 + ふりがなを表す DOM ノードを返す共通 helper（受付一覧のルビ表示用）。
//   - DOM API（createTextNode / createElement('rt')）で生成し XSS 安全（textContent 経由で自動 escape）。
//   - ふりがなが空（trim 後）なら <ruby> を使わず氏名テキストノードのみ（空 <rt> を出さない）。
//   - innerHTML 文字列連結はしない。呼び出し側で appendChild する。
//   - FURIGANA-MVP-001 では受付一覧のみ。FURIGANA-VIEW-002 で順位表 / 星取表 / 閲覧ビュー /
//     印刷・PDF へ展開（string でHTMLを組む経路は併設の playerNameRubyHtml を使う。設計メモ §A-5）。
// PHASE-B-3 (#289): ルビ生成の「氏名・ふりがな正規化」を1か所に集約する単一窓口。
//   DOM 版（renderPlayerNameWithRuby）と string 版（playerNameRubyHtml）が同じ規則
//   「氏名は null→'' で文字列化／ふりがなは null→'' で文字列化し trim、空ならルビ無し」を
//   個別実装していたのを集約する（生成結果は完全同値）。
//   返り値: { name: 文字列化した氏名, yomi: trim 済みふりがな（空ならルビ無しの合図） }。
function _resolveNameRuby(name,yomi){
  return { name:String(name==null?'':name), yomi:String(yomi==null?'':yomi).trim() };
}

function renderPlayerNameWithRuby(name,yomi){
  var parts=_resolveNameRuby(name,yomi);
  if(!parts.yomi)return document.createTextNode(parts.name);
  var ruby=document.createElement('ruby');
  ruby.appendChild(document.createTextNode(parts.name));
  var rt=document.createElement('rt');
  rt.textContent=parts.yomi;
  ruby.appendChild(rt);
  return ruby;
}

// FURIGANA-VIEW-002: renderPlayerNameWithRuby の「escape 済み HTML 文字列」版（設計メモ §A-3 併設版）。
//   string で HTML を組み立てる経路（順位表 / 星取表 / 閲覧ビュー / 印刷・PDF）でルビを出す共通 helper。
//   - DOM 版と同じ規則: ふりがなが空（trim 後）なら <ruby> を使わず氏名のみ（空 <rt> を出さない）。
//   - 氏名・ふりがなは必ず escapeHtml を通す（innerHTML 直挿しによる XSS を増やさない）。
//   - ルビ組み立ての規則は DOM 版とここ（string 版）に集約し、各呼出側で二重実装しない。
function playerNameRubyHtml(name,yomi){
  var parts=_resolveNameRuby(name,yomi);
  if(!parts.yomi)return escapeHtml(name);
  return '<ruby>'+escapeHtml(name)+'<rt>'+escapeHtml(parts.yomi)+'</rt></ruby>';
}

// FURIGANA-VIEW-002: 当日 player.yomi を id+cls で引く（getName と対の lookup）。
//   未登録 / yomi 不在は ''（= ルビなし）。表示専用で順位・対局ロジックには使わない。
function yomiOf(id,cls){
  var players=(state.players&&state.players[cls])||[];
  for(var i=0;i<players.length;i++){if(players[i].id===id)return (typeof players[i].yomi==='string')?players[i].yomi:'';}
  return '';
}

// FURIGANA-VIEW-002: getNameWithNo（"entry_no｜氏名"）の HTML 版。番号部は素のテキストのまま、
//   氏名部だけ playerNameRubyHtml でルビ化する（番号にルビが乗らないようにする）。
// PHASE-B-3 (#289): entryNoOf+getName+yomiOf の三重走査を _resolvePlayerDisplay の単一走査へ集約（出力同値）。
function nameWithNoRubyHtml(id,cls){
  var d=_resolvePlayerDisplay(id,cls);
  return escapeHtml(d.entryNo+'｜')+playerNameRubyHtml(d.name,d.yomi);
}

function makePlayerRow(p,cls,i){
  var div=document.createElement('div');
  div.className='player-row';

  // 1段目: 情報(番号・名前・支部員区分・種別)
  var mainDiv=document.createElement('div');
  mainDiv.className='player-row-main';

  var num=document.createElement('span');
  // A-4 §2: 番号表示は 2 桁ゼロ埋めに統一（ペアリング・PDF と整合）
  // A-5.1 §11.8: index ではなく entryNoOf 経由で entry_no を表示（欠番維持）
  num.style.cssText='color:#1F3864;font-size:12px;font-weight:bold;min-width:28px';
  num.textContent=entryNoOf(cls,p.id);
  mainDiv.appendChild(num);

  var name=document.createElement('span');
  name.className='player-name';
  // FURIGANA-MVP-001: ふりがながあれば氏名にルビ表示（受付一覧のみ）。空なら従来どおり氏名テキスト。
  name.appendChild(renderPlayerNameWithRuby(p.name,p.yomi));
  mainDiv.appendChild(name);

  var mSel=document.createElement('select');
  mSel.className='sel-sm';
  var o1=document.createElement('option');o1.value='member';o1.textContent='支部員';
  var o2=document.createElement('option');o2.value='other';o2.textContent='支部員以外';
  if((p.member||'member')==='other')o2.selected=true; else o1.selected=true;
  mSel.appendChild(o1);mSel.appendChild(o2);
  mSel.addEventListener('change',(function(pid,c){return function(){
    updateField(pid,c,'member',this.value);
  };})(p.id,cls));
  mainDiv.appendChild(mSel);

  var gSel=document.createElement('select');
  gSel.className='sel-sm';
  var g1=document.createElement('option');g1.value='ippan';g1.textContent='一般';
  var g2=document.createElement('option');g2.value='chu';g2.textContent='中学生以下';
  // FEE-JOSEI-001 (#325): 会費区分に「女性」(josei) を追加（chu と同額）。josei 選択時は g3 を選択表示。
  var g3=document.createElement('option');g3.value='josei';g3.textContent='女性';
  var gradeSel=(p.grade==='chu'||p.grade==='josei')?p.grade:'ippan';
  if(gradeSel==='chu')g2.selected=true; else if(gradeSel==='josei')g3.selected=true; else g1.selected=true;
  gSel.appendChild(g1);gSel.appendChild(g2);gSel.appendChild(g3);
  gSel.addEventListener('change',(function(pid,c){return function(){
    updateField(pid,c,'grade',this.value);
  };})(p.id,cls));
  mainDiv.appendChild(gSel);

  div.appendChild(mainDiv);

  // 2段目: 左=料金(情報)、右=操作ボタン群(名前編集・削除)
  // スマホでは space-between で左右に分離
  // PCでは main の右に詰めて並ぶ
  var actionsDiv=document.createElement('div');
  actionsDiv.className='player-row-actions';

  var fee=getFee(p.member||'member',p.grade||'ippan');
  var feeSpan=document.createElement('span');
  feeSpan.className='player-fee';
  feeSpan.textContent=fee===0?'無料':fee.toLocaleString()+'円';
  actionsDiv.appendChild(feeSpan);

  // 操作ボタン群を1単位にまとめる(スマホの space-between で右端にまとめて配置)
  var buttonsDiv=document.createElement('div');
  buttonsDiv.className='player-row-buttons';

  var editBtn=document.createElement('button');
  editBtn.className='btn-sm';
  editBtn.textContent='名前編集';
  editBtn.addEventListener('click',(function(pid,c){return function(){editPlayer(pid,c);};})(p.id,cls));
  buttonsDiv.appendChild(editBtn);

  // START-FRP-UX-001: 参加者一覧から ふりがな（player.yomi）を登録後でも編集できる導線。
  //   名前編集（editPlayer / 会員マスタ同期）とは独立した別ボタン。空欄でルビなしに戻せる。
  //   click は addEventListener（innerHTML 連結しない＝未エスケープ検査ヒューリスティクスを踏まない）。
  var yomiBtn=document.createElement('button');
  yomiBtn.className='btn-sm';
  yomiBtn.textContent='ふりがな';
  yomiBtn.addEventListener('click',(function(pid,c){return function(){editPlayerYomi(pid,c);};})(p.id,cls));
  buttonsDiv.appendChild(yomiBtn);

  var delBtn=document.createElement('button');
  delBtn.className='btn-sm btn-danger';
  delBtn.textContent='削除';
  delBtn.addEventListener('click',(function(pid,c){return function(){removePlayer(pid,c);};})(p.id,cls));
  buttonsDiv.appendChild(delBtn);

  actionsDiv.appendChild(buttonsDiv);
  div.appendChild(actionsDiv);

  return div;
}

function updateField(id,cls,field,value){
  var players=state.players[cls];
  for(var i=0;i<players.length;i++){
    if(players[i].id===id){players[i][field]=value;break;}
  }
  renderRegList();save();
  // A-5.1-SAVE-003b: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。属性変更は rollback しない・運営は継続する。
  // updateField は member / grade を書換えるため、verifyPlayerPersistedById（name 軸）では
  // 不足。field 軸の verifyPlayerFieldPersisted で expected と厳密一致を確認する。
  if(!verifyPlayerFieldPersisted(cls,id,field,value)){
    notifySaveWarning({
      message:'属性を変更しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-003b: updateField の保存が確認できませんでした (player='+id+', cls='+cls+', field='+field+', expected='+value+')',
      callsiteId:'SAVE-003b-updateField',
      kind:'save-verify',
      aggregateKey:'save-verify:edit',
      severity:'warn'
    });
  }
}

function getCurrentlyRegisteredMemberIds(){

  if(!state||!state.players)return ids;
  // CLASS-VARIABLE-001 (CV-1 Codex P2): A/B 固定をやめ allRegisteredPlayers() で全クラス横断に収集。
  //   A/B のみなら従来と同一結果。C+ 登録済み会員の member_id も updateSuggestList / addPlayer の
  //   重複チェック対象になる（C 登録解禁後の member_id 重複見落としを解消）。
  var all=allRegisteredPlayers();
  for(var pi=0;pi<all.length;pi++){
    var p=all[pi];
    if(p&&typeof p.member_id==='string'&&p.member_id)ids.push(p.member_id);
  }
  return ids;
}

function renderSuggestList(suggestions){
  var list=document.getElementById('suggest-list');
  if(!list)return;
  list.innerHTML='';
  if(!suggestions||suggestions.length===0){
    list.style.display='none';
    return;
  }
  for(var i=0;i<suggestions.length;i++){
    (function(m){
      var item=document.createElement('div');
      item.className='suggest-item';
      // 行の内容と A/B ボタンを横並びに（行本体タップは A-4 既存挙動を維持、§3.2.2 Must Fix 1）
      item.style.display='flex';
      item.style.alignItems='center';
      item.style.gap='8px';
      var info=document.createElement('div');
      info.className='si-info';
      info.style.flex='1';
      info.style.minWidth='0';
      var nm=document.createElement('div');
      nm.className='si-name';
      nm.textContent=m.name;
      info.appendChild(nm);
      var meta=document.createElement('div');
      meta.className='si-meta';
      var parts=[];
      if(m.yomi)parts.push(m.yomi);
      // A-4.2 §3.4.3: 「前回:Xクラス」テキスト併記
      if(m.last_class==='A'||m.last_class==='B')parts.push('前回:'+m.last_class+'クラス');
      if(m.last_attended)parts.push('最終参加 '+m.last_attended);
      meta.textContent=parts.join(' / ');
      info.appendChild(meta);
      item.appendChild(info);
      // mousedown は input の blur より先に発火するため、blur-close で取りこぼさない
      item.addEventListener('mousedown',function(e){
        e.preventDefault();
        onSuggestTap(m);
      });
      // タッチ環境用フォールバック
      item.addEventListener('touchstart',function(e){
        e.preventDefault();
        onSuggestTap(m);
      });
      // A-4.2 §3.2.3: A/B ボタン（行本体タップとは独立、stopPropagation で二重発火回避）
      // A-4.2 §3.4.1: last_class のボタンを強調（太字 + 背景色 #FFD580）
      var classes=['A','B'];
      for(var ci=0;ci<classes.length;ci++){
        (function(cls){
          var highlight=(m.last_class===cls);
          var btn=document.createElement('button');
          btn.type='button';
          btn.className='suggest-add-btn'+(highlight?' suggest-add-btn-highlight':'');
          btn.setAttribute('data-cls',cls);
          btn.setAttribute('aria-label',m.name+'を'+cls+'クラスで追加');
          btn.setAttribute('title',cls+'クラスで追加');
          btn.textContent=cls;
          btn.style.cssText='min-width:44px;min-height:44px;flex-shrink:0;border:1px solid #1976d2;background:'+(highlight?'#FFD580':'#fff')+';color:'+(highlight?'#7a3e00':'#1976d2')+';border-radius:6px;font-size:14px;font-weight:'+(highlight?'bold':'normal')+';cursor:pointer;margin-left:4px';
          // mousedown / touchstart で行ハンドラより先に処理して伝播停止（行本体タップは A-4 既存挙動として維持）
          btn.addEventListener('mousedown',function(e){
            if(e.preventDefault)e.preventDefault();
            if(e.stopPropagation)e.stopPropagation();
            handleSuggestClassAdd(m.id,cls);
          });
          btn.addEventListener('touchstart',function(e){
            if(e.preventDefault)e.preventDefault();
            if(e.stopPropagation)e.stopPropagation();
            handleSuggestClassAdd(m.id,cls);
          });
          // click は念のため伝播を止める（実機環境差吸収）
          btn.addEventListener('click',function(e){
            if(e.preventDefault)e.preventDefault();
            if(e.stopPropagation)e.stopPropagation();
          });
          item.appendChild(btn);
        })(classes[ci]);
      }
      list.appendChild(item);
    })(suggestions[i]);
  }
  list.style.display='block';
}

// A-4.3 §2.3: サジェスト A/B ボタン押下時の処理。
// 過去参加者パネルと同じ 3 ケース分岐（メンタルモデル一貫性）。サジェストは既登録者除外があるため通常はケース 1 のみだが、念のため 3 ケース全対応。
// _pendingNewYomi / master.yomi は触らない（A-4.2 Should Fix 6）。
function handleSuggestClassAdd(memberId,cls){
  var master=loadBranchMaster();
  var member=null;
  if(master&&Array.isArray(master.members)){
    for(var mi=0;mi<master.members.length;mi++){
      if(master.members[mi]&&master.members[mi].id===memberId){member=master.members[mi];break;}
    }
  }
  if(!member){showMsg('該当する参加者が見つかりません','err');return;}
  if(member.deleted===true){showMsg('この参加者は削除済みのため追加できません','err');return;}
  var memberName=member.name||'';
  var existingCls=null;
  var existClasses=['A','B'];
  for(var eci=0;eci<existClasses.length;eci++){
    var eArr=state.players[existClasses[eci]]||[];
    for(var epi=0;epi<eArr.length;epi++){
      if(eArr[epi]&&eArr[epi].member_id===memberId){existingCls=existClasses[eci];break;}
    }
    if(existingCls)break;
  }
  // 共通：成功後の登録画面後処理（氏名/ふりがな欄クリア + サジェスト閉じ + 再描画）
  // A-5.1-SAVE-003b: 追加 / クラス変更の両経路から呼ばれるため、verify 対象（pid/cls/name）と
  // 保存未確認時の warn 文言を引数で受け取り、save() 後に検証する。
  // SAVE-UX-MIN-NOTIFY-001: options.suppressOkMsg=true のとき成功 showMsg(ok) を出さない。
  // master verify 失敗時に呼出側で立て、直前に出した warn を ok で上書きしないために使う。
  function postSuccess(msgText,verifyPid,verifyCls,verifyName,warnMsg,options){
    options=options||{};
    var inpName=document.getElementById('inp-name');
    var inpYomi=document.getElementById('inp-yomi');
    if(inpName)inpName.value='';
    if(inpYomi)inpYomi.value='';
    _suggestState.selectedMemberId=null;
    _suggestState.selectedNormalizedName=null;
    _yomiManuallyEdited=false;
    _yomiAutoBuffer='';
    closeSuggestList();
    renderRegList();save();
    if(typeof renderPastParticipantsPanel==='function'){
      var ppSearch=document.getElementById('pp-search');
      renderPastParticipantsPanel(ppSearch?ppSearch.value:'');
    }
    if(!options.suppressOkMsg){
      showMsg(msgText,'ok');
    }
    // A-5.1-SAVE-003b: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
    // false は「保存未確認」（保存失敗と断定しない）。追加 / クラス変更とも rollback しない・運営は継続する。
    if(!verifyPlayerPersistedById(verifyPid,verifyCls,verifyName)){
      notifySaveWarning({
        message:warnMsg,
        consoleTag:'SAVE-003b: handleSuggestClassAdd の保存が確認できませんでした (player='+verifyPid+', cls='+verifyCls+', name='+verifyName+')',
        callsiteId:'SAVE-003b-handleSuggestClassAdd',
        kind:'save-verify',
        aggregateKey:'save-verify:past',
        severity:'warn'
      });
    }
  }
  // ケース 3: 同クラス登録済（alert OK のみ）
  if(existingCls===cls){
    alert(memberName+'さんは既に '+cls+'クラス に登録されています。');
    return;
  }
  // ケース 2: 別クラス登録済（変更 confirm）
  if(existingCls&&existingCls!==cls){
    var ok2=confirm(memberName+'さんは現在 '+existingCls+'クラス に登録されています。\n'+cls+'クラス に変更しますか?');
    if(!ok2)return;
    var r2=changePlayerClass(memberId,cls,master,state);
    if(!r2||!r2.success){showMsg('クラス変更に失敗しました','err');return;}
    saveBranchMaster(master);
    // MASTER-V2-LASTCLASS S05: 既登録者クラス変更分岐限定の master.last_class 保存検証。
    // changePlayerClass が master.members[i].last_class を新クラスに更新済み（line 1250）。
    // saveBranchMaster は例外を握り潰すため、localStorage を再読込して検証する。
    // 新規追加分岐（addPlayerFromMaster 側）では master を更新しないため、ここに verify を入れない。
    // SAVE-UX-DESIGN Level 1: console.warn + showMsg。最終表示が warn になるよう、
    // master verify 失敗時は postSuccess の成功 showMsg を suppressOkMsg で抑止する。
    // 詳細は docs/specs/20260513_shogi_save_ux_design.md
    var s05MasterVerifyOk=verifyMasterFieldPersisted(memberId,'last_class',cls);
    if(!s05MasterVerifyOk){
      if(typeof console!=='undefined'&&console.warn){
        console.warn('[MASTER-V2-LASTCLASS] S05 last_class verify failed',{memberId:memberId,expected:cls});
      }
      // SAVE-UX-WARN-HELPER: user-facing warn は helper 経由。success showMsg 抑止は postSuccess(suppressOkMsg) で行う（不変）。
      notifySaveWarning({
        message:'前回クラス情報の保存が確認できませんでした',
        consoleTag:'[MASTER-V2-LASTCLASS]',
        callsiteId:'S05',
        fields:['last_class'],
        kind:'master-verify',
        aggregateKey:'master-verify:lastclass',
        severity:'warn'
      });
    }
    postSuccess('['+memberName+'] を '+cls+'クラス に変更しました',r2.player.id,cls,r2.player.name,'クラスを変更しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',{suppressOkMsg:!s05MasterVerifyOk});
    return;
  }
  // ケース 1: 未登録（追加 confirm）
  var ok1=confirm(memberName+'さんを '+cls+'クラス に追加しますか?');
  if(!ok1)return;
  var r=addPlayerFromMaster(memberId,cls,master,state);
  if(!r||!r.success){
    var err=r&&r.error;
    if(err==='duplicate_member'){
      showMsg('この参加者はすでに登録されています','err');
    }else if(err==='duplicate_name'){
      showMsg('同じ名前の参加者がいます。別人の場合は手入力で区別してください','err');
    }else if(err==='deleted'){
      showMsg('この参加者は削除済みのため追加できません','err');
    }else if(err==='not_found'){
      showMsg('該当する参加者が見つかりません','err');
    }else{
      showMsg('追加に失敗しました','err');
    }
    return;
  }
  postSuccess('['+r.player.name+']（'+cls+'クラス）を登録しました',r.player.id,cls,r.player.name,'参加者は登録されましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください');
}

function closeSuggestList(){
  var list=document.getElementById('suggest-list');
  if(!list)return;
  list.style.display='none';
  list.innerHTML='';
}

function onSuggestTap(member){
  if(!member)return;
  var inpName=document.getElementById('inp-name');
  var inpClass=document.getElementById('inp-class');
  var inpYomi=document.getElementById('inp-yomi');
  if(inpName)inpName.value=member.name||'';
  if(inpClass&&(member.last_class==='A'||member.last_class==='B'))inpClass.value=member.last_class;
  // A-4 §3.1.3: サジェスト由来は yomi 欄にもマスタ値を反映。
  // _yomiManuallyEdited は false のまま（手動編集扱いにしない）。
  if(inpYomi)inpYomi.value=member.yomi||'';
  _yomiManuallyEdited=false;
  _yomiAutoBuffer='';
  _suggestState.selectedMemberId=member.id;
  _suggestState.selectedNormalizedName=normalizePersonName(member.name||'');
  closeSuggestList();
}

function updateSuggestList(){
  var inpName=document.getElementById('inp-name');
  if(!inpName)return;
  var raw=inpName.value;
  // 候補選択後に氏名を変更したら member_id 解除（normalize 後の比較）
  if(_suggestState.selectedMemberId){
    var curNorm=normalizePersonName(raw);
    if(curNorm!==_suggestState.selectedNormalizedName){
      _suggestState.selectedMemberId=null;
      _suggestState.selectedNormalizedName=null;
    }
  }
  var trimmed=raw.replace(/^\s+|\s+$/g,'');
  if(trimmed.length<1){
    closeSuggestList();
    return;
  }
  var master=loadBranchMaster();
  var excluded=getCurrentlyRegisteredMemberIds();
  var sugg=findMasterSuggestions(trimmed,master,excluded);
  renderSuggestList(sugg);
}

function addPlayer(){
  // iPhone Safari: ペースト後のボタン無反応回避（A-2.6 ガイドライン）
  var inpName=document.getElementById('inp-name');
  var inpYomi=document.getElementById('inp-yomi');
  if(inpName)inpName.blur();
  if(inpYomi)inpYomi.blur();
  closeSuggestList();

  var name=inpName.value.trim();
  var cls=document.getElementById('inp-class').value;
  // FURIGANA-MVP-001: ふりがな欄の値は player.yomi に保持する（当日 snapshot・受付一覧 ruby 表示用）。
  //   旧 A-4 §3.1.4 は「DOM のみ保持・player 非保存」だったが、当日表示要件のため方針変更した。
  //   マスタ反映（_pendingNewYomi / suggest backfill）は従来どおり別途維持（下記）。
  var yomiRaw=inpYomi?inpYomi.value:'';
  if(!name){showMsg('名前を入力してください','err');return;}
  // CLASS-VARIABLE-001 (CV-1): 重複名チェックを全クラス横断に汎用化（A/B のみなら従来と同一結果・C+ も保護）。
  var all=allRegisteredPlayers();
  for(var i=0;i<all.length;i++){if(all[i].name===name){showMsg('同じ名前の参加者がいます','err');return;}}

  // サジェスト選択中かつ氏名が選択時の正規化名と一致 → マスタから member_id / member / grade を引き継ぐ
  var memberValue='member';
  var gradeValue='ippan';
  var memberIdValue=null;
  var suggestSelected=null;
  if(_suggestState.selectedMemberId){
    var curNorm=normalizePersonName(name);
    if(curNorm===_suggestState.selectedNormalizedName){
      var master=loadBranchMaster();
      var sel=null;
      if(master&&Array.isArray(master.members)){
        for(var mi=0;mi<master.members.length;mi++){
          if(master.members[mi].id===_suggestState.selectedMemberId){sel=master.members[mi];break;}
        }
      }
      if(sel&&sel.deleted!==true){
        // 当日同 member_id 二重追加防止
        var dupRegistered=false;
        var existingIds=getCurrentlyRegisteredMemberIds();
        for(var ei=0;ei<existingIds.length;ei++){
          if(existingIds[ei]===sel.id){dupRegistered=true;break;}
        }
        if(dupRegistered){
          showMsg(name+'（'+cls+'クラス）はすでに登録されています','err');
          return;
        }
        memberIdValue=sel.id;
        if(sel.member==='other')memberValue='other';
        if(sel.grade==='chu'||sel.grade==='josei')gradeValue=sel.grade;
        suggestSelected=sel;
      }
    }
  }

  // Issue #272(b): 開始済みクラスの「2回戦以降（確定済み回戦あり）」への参加者追加は、すでに生成済みの
  //   現回戦の組み合わせに含まれず待機になる上、人数を奇数化して以降の組み合わせに影響しうる。誤操作で
  //   進行中の大会に紛れ込むのを防ぐため、運営に確認する（最低限の通知ガード。1回戦の途中受付＝results
  //   が空のクラスは対象外で従来どおり追加できる）。キャンセル時は追加しない。
  if(isClassStarted(cls)&&state.results&&Array.isArray(state.results[cls])&&state.results[cls].length>=1){
    var roundsDone272=state.results[cls].length;
    if(!confirm(cls+'クラスはすでに'+roundsDone272+'回戦まで進行しています。\nいま追加すると、この参加者は現在の組み合わせには入らず、'+(roundsDone272+1)+'回戦以降の対象になります（この回戦は待機になり、次の回戦から組み合わせに入ります）。\n\n追加してよろしいですか？')){
      return;
    }
  }

  var id='p'+Date.now()+Math.floor(Math.random()*1000);
  var newPlayer={id:id,name:name,cls:cls,member:memberValue,grade:gradeValue};
  if(memberIdValue)newPlayer.member_id=memberIdValue;
  // FURIGANA-MVP-001: 受付ふりがな欄を player.yomi に保持。空でサジェスト選択時は master.yomi をフォールバック。
  newPlayer.yomi=normalizeYomi(yomiRaw||'');
  if(!newPlayer.yomi&&suggestSelected)newPlayer.yomi=normalizeYomi(suggestSelected.yomi||'');
  // A-5.1 §11.8: 同一クラス内で max(entry_no)+1 を採番（欠番維持）
  newPlayer.entry_no=nextEntryNoForClass(cls,state);
  state.players[cls].push(newPlayer);

  // A-4 §3.1.4 + Should Fix 2: yomi のマスタ反映条件
  //   サジェスト由来：既存マスタ yomi が **空** の場合のみ補完（誤上書き防止）。
  //   新規参加者：_pendingNewYomi[player.id] に退避し、saveData 時に updateBranchMasterFromTournament 経由で反映。
  var yomiForMaster=normalizeYomi(yomiRaw||'');
  // SAVE-UX-NONQUOTA-NOTIFY-001 (Codex P2-B): yomi バックフィルの master 保存失敗を握り潰さない。
  //   参加者登録自体は成功する（後続の showMsg('ok')）が、ふりがなのマスタ反映が保存できなかったことを
  //   後続成功表示の後に再掲する（空 catch / 戻り値無視の是正）。
  var yomiMasterSaveFailed=false;
  if(suggestSelected){
    if(yomiForMaster && !normalizeYomi(suggestSelected.yomi||'')){
      try{
        var masterToSave=loadBranchMaster();
        if(masterToSave&&Array.isArray(masterToSave.members)){
          for(var mj=0;mj<masterToSave.members.length;mj++){
            if(masterToSave.members[mj].id===suggestSelected.id){
              masterToSave.members[mj].yomi=yomiForMaster;
              if(saveBranchMaster(masterToSave)===false)yomiMasterSaveFailed=true;
              break;
            }
          }
        }
      }catch(e){
        // saveBranchMaster は例外を握り潰す契約だが、loadBranchMaster 等で想定外例外が出た場合も
        // ふりがなのマスタ反映は失敗扱いとして握り潰さない。
        yomiMasterSaveFailed=true;
        if(typeof console!=='undefined'&&console.warn)console.warn('ふりがなのマスタ反映に失敗（参加者登録は継続）',e);
      }
    }
  }else if(yomiForMaster){
    _pendingNewYomi[id]=yomiForMaster;
  }

  inpName.value='';
  if(inpYomi)inpYomi.value='';
  _suggestState.selectedMemberId=null;
  _suggestState.selectedNormalizedName=null;
  _yomiManuallyEdited=false;
  _yomiAutoBuffer='';
  inpName.focus();
  showMsg(name+'（'+cls+'クラス）を登録しました','ok');
  // SAVE-UX-NONQUOTA-NOTIFY-001 (Codex P2-B): 参加者登録は成功したが、ふりがなのマスタ保存に失敗した場合は
  //   成功バナーで上書きされた警告を再掲する（saveBranchMaster の indicator +1 に加えユーザー可視化を維持）。
  if(yomiMasterSaveFailed){
    notifySaveWarning({
      message:'参加者は登録されましたが、ふりがなのマスタ保存に失敗しました。空き容量を確保するかプライベートブラウズを解除してください',
      consoleTag:'SAVE-UX-NONQUOTA-NOTIFY-001 P2-B: addPlayer yomi backfill saveBranchMaster failed (player='+id+', cls='+cls+', name='+(name)+')',
      callsiteId:'SAVE-UX-NONQUOTA-NOTIFY-001-addPlayer-yomi',
      kind:'save-verify',
      aggregateKey:'save-verify:entry',
      severity:'warn'
    });
  }
  renderRegList();save();
  // A-5.1-SAVE-002: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。追加は rollback しない・運営は継続する。
  if(!verifyPlayerPersistedById(id,cls,name)){
    notifySaveWarning({
      message:'参加者は登録されましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-002: addPlayer の保存が確認できませんでした (player=' + id + ', cls=' + cls + ', name=' + name + ')',
      callsiteId:'SAVE-002-addPlayer',
      kind:'save-verify',
      aggregateKey:'save-verify:entry',
      severity:'warn'
    });
  }
}

function removePlayer(id,cls){
  var name=getName(id,cls);
  var inPairings=false;
  for(var i=0;i<state.pairings[cls].length;i++){
    var pm=state.pairings[cls][i];
    if(pm.p1===id||pm.p2===id){inPairings=true;break;}
  }
  if(inPairings){
    // REMOVE-PLAYER-GUARD-MESSAGE-IMPL-LIGHT (PR #115 §6.4 案 D 一次禁止):
    //   「現在の組み合わせ」用語に統一し、PR #114 で追加された
    //   「大会進行データをリセット」(#resetProgressBtn) へも誘導する。
    //   「対戦相手変更」(soft recovery、results 保持) を第一案として温存。
    //   「参加者一覧は残したまま、組み合わせ・勝敗結果は削除」を明示し、
    //   既存 #resetBtn「大会データを全リセット」(全リセット) との混同を抑制。
    alert(name+'は現在の組み合わせに登録されているため削除できません。\n\n別の選手に差し替える場合は「対戦相手変更」を実行してください。\n参加者一覧から削除したい場合は、先に「大会進行データをリセット」を実行してください。\n大会進行データをリセットすると、参加者一覧は残したまま、現在の組み合わせ・勝敗結果は削除されます。');
    return;
  }
  var pastMatches=0;
  for(var r=0;r<state.results[cls].length;r++){
    for(var mi=0;mi<state.results[cls][r].length;mi++){
      var rm=state.results[cls][r][mi];
      if(rm.p1===id||rm.p2===id)pastMatches++;
    }
  }
  // ROUND-CLASS-START-005 (spec §7.5 / §15.1 row 3 持ち越し):
  //   過去対局保護は当該 player の所属 class の started 状態だけで判定する。
  //   旧 state.started (all-class OR) では、他クラスが開始済だと未開始クラスの
  //   参加者も削除できなくなる過剰ブロックがあった（class atomic 違反）。
  //   isClassStarted(cls) に置換することで、A 開始済 / B 未開始時に B 参加者の
  //   削除が可能になる（spec §7.6.1 / inventory §5.7 隣接リスク）。
  //   started クラスの参加者削除は引き続き安全にブロックされる（calcFinal の
  //   TypeError 回帰を防ぐため pastMatches>0 条件は維持）。
  if(isClassStarted(cls)&&pastMatches>0){
    // REMOVE-PLAYER-GUARD-MESSAGE-IMPL-LIGHT (PR #115 §6.4 案 D 二次禁止):
    //   「対戦履歴」→「勝敗結果」用語統一（state.results 由来であることが
    //   直感的）/ 「リセット」→「大会進行データをリセット」具体化で
    //   既存 #resetBtn 誤押下を抑制 / 「参加者一覧は残したまま」明示で
    //   PR #114 で真実になった内容を伝える（PR #111 §7.3 で書けなかった）。
    alert(name+'には過去'+pastMatches+'試合分の勝敗結果があるため削除できません。\n\n参加者を削除する場合は、先に「大会進行データをリセット」を実行してください。\n大会進行データをリセットすると、参加者一覧は残したまま、現在の組み合わせ・勝敗結果は削除されます。');
    return;
  }
  var msg=name+'を削除しますか？';
  if(!confirm(msg))return;
  var arr=state.players[cls];
  state.players[cls]=arr.filter(function(p){return p.id!==id;});
  // A-4 §3.1.4: 当該 player の _pendingNewYomi も破棄
  if(_pendingNewYomi&&Object.prototype.hasOwnProperty.call(_pendingNewYomi,id))delete _pendingNewYomi[id];
  renderRegList();save();
  // A-5.1-SAVE-001: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
  // false は「保存未確認」（保存失敗と断定しない）。削除は rollback しない・運営は継続する。
  if(!verifyPlayerAbsent(id,cls)){
    notifySaveWarning({
      message:'削除は反映されましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
      consoleTag:'SAVE-001: removePlayer の保存が確認できませんでした (player='+id+', cls='+cls+')',
      callsiteId:'SAVE-001-removePlayer',
      kind:'save-verify',
      aggregateKey:'save-verify:entry',
      severity:'warn'
    });
  }
}

// MODALS: モーダル生成と振る舞い
//   build*ModalHtml: モーダル内側のHTML文字列を返すだけ
//   bind*ModalEvents: 表示済みモーダルにイベント登録
//   元の関数(bulkEditNames等): バリデーション → DOM作成 → HTML注入 → bind呼出
// ============================================================

function buildBulkEditModalHtml(cls, players){
  var rows='';
  for(var i=0;i<players.length;i++){
    // A-5.1 §11.8: 一括編集モーダルでも entry_no を表示（欠番維持を視覚化）。
    // A-4 §2: 番号表示は 2 桁ゼロ埋めに統一（参加者一覧・対戦相手変更・PDF と整合）。
    rows+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +'<span style="font-size:12px;color:#888;min-width:28px">'+cls+entryNoOf(cls,players[i].id)+'</span>'
      +'<input type="text" id="bulk-name-'+players[i].id+'" value="'+escapeHtml(players[i].name)+'" '
      +'style="flex:1;height:34px;padding:0 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit">'
      +'</div>';
  }
  return '<div style="background:#fff;border-radius:12px;padding:24px;width:360px;max-height:80vh;overflow-y:auto;">'
    +'<h3 style="margin-bottom:16px;font-size:16px;font-weight:500;color:#1F3864">'+cls+'クラス 名前の一括編集</h3>'
    +rows
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'
    +'<button id="bulk-cancel" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:14px;cursor:pointer">キャンセル</button>'
    +'<button id="bulk-save" style="padding:8px 16px;border-radius:8px;border:none;background:#1F3864;color:#fff;font-size:14px;cursor:pointer">保存</button>'
    +'</div></div>';
}

function bindBulkEditModalEvents(cls, players){
  // 最初のinputにフォーカス
  var firstInput=document.getElementById('bulk-name-'+players[0].id);
  if(firstInput)firstInput.focus();

  // Enterで次のフィールドに移動
  for(var i=0;i<players.length;i++){
    (function(idx){
      var inp=document.getElementById('bulk-name-'+players[idx].id);
      if(!inp)return;
      inp.addEventListener('keypress',function(e){
        if(e.key==='Enter'){
          var next=document.getElementById('bulk-name-'+(players[idx+1]?players[idx+1].id:''));
          if(next)next.focus();
          else document.getElementById('bulk-save').click();
        }
      });
    })(i);
  }

  document.getElementById('bulk-cancel').addEventListener('click',function(){
    document.getElementById('bulk-edit-modal').remove();
  });

  document.getElementById('bulk-save').addEventListener('click',function(){
    // CLASS-VARIABLE-001 (CV-1): 重複名チェックを全クラス横断に汎用化（A/B のみなら従来と同一結果・C+ も保護）。
    var all=allRegisteredPlayers();
    var hasError=false;
    var newNames={};

    for(var i=0;i<players.length;i++){
      var inp=document.getElementById('bulk-name-'+players[i].id);
      var newName=inp?inp.value.trim():'';
      if(!newName){alert((i+1)+'番目の名前が空です');hasError=true;break;}
      newNames[players[i].id]=newName;
    }
    if(hasError)return;

    // 重複チェック（他クラス含む、編集対象同士の新名前も比較）
    for(var i=0;i<players.length;i++){
      var newName=newNames[players[i].id];
      for(var j=0;j<all.length;j++){
        if(all[j].id===players[i].id)continue;
        var otherName=newNames[all[j].id]||all[j].name;
        if(otherName===newName){
          alert('"'+newName+'"が重複しています');hasError=true;break;
        }
      }
      if(hasError)break;
    }
    if(hasError)return;

    for(var i=0;i<players.length;i++){
      players[i].name=newNames[players[i].id];
    }
    document.getElementById('bulk-edit-modal').remove();
    renderRegList();save();
    // A-5.1-SAVE-003b: save() は例外を握り潰すため書込み後に localStorage を再読込して検証。
    // 全件 verify し、未確認件数を集計。warn は件数集約して 1 回のみ（UI ノイズ回避）。
    // rollback しない・運営は継続する。alert も使わない（pre-save の空欄 / 同名重複 alert は別経路）。
    // 既存 verifyStatePersisted(id, expectedName) を流用し、新 helper は追加しない。
    var unverified=0;
    for(var vi=0;vi<players.length;vi++){
      if(!verifyStatePersisted(players[vi].id,newNames[players[vi].id]))unverified++;
    }
    if(unverified>0){
      notifySaveWarning({
        message:players.length+'名のうち '+unverified+'名分の保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
        consoleTag:'SAVE-003b: bulkEditNames の保存が確認できませんでした ('+unverified+'/'+players.length+' 件未確認)',
        callsiteId:'SAVE-003b-bulkEditNames',
        kind:'save-verify',
        aggregateKey:'save-verify:edit',
        severity:'warn'
      });
    }
  });
}

function bulkEditNames(cls){
  var players=state.players[cls];
  if(players.length===0){alert(cls+'クラスの参加者がいません');return;}

  var existing=document.getElementById('bulk-edit-modal');
  if(existing)existing.remove();

  var modal=document.createElement('div');
  modal.id='bulk-edit-modal';
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML=buildBulkEditModalHtml(cls, players);
  document.body.appendChild(modal);

  bindBulkEditModalEvents(cls, players);
}
