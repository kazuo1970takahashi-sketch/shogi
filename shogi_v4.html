<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沼津支部 月例将棋大会 運営ツール</title>
<!-- PWA Slice1 (#... ): ホーム画面インストール用。manifest＋テーマ色＋iOS用メタ/アイコン。
     Service Worker（オフライン/キャッシュ）は別スライス。挙動非接触（head への追加のみ）。 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="将棋大会運営">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- PWA Slice2: Service Worker 登録（オフライン起動＋更新の一元管理）。ES5・load 後に登録・失敗は無視。 -->
<script>
if(typeof navigator!=="undefined" && "serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;font-size:15px;color:#222;background:#f5f5f0;min-height:100vh}
.header{background:#1F3864;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:15px;font-weight:500}
.container{max-width:1100px;margin:0 auto;padding:10px 8px}
.tab-bar{display:flex;gap:3px;margin-bottom:10px;background:#fff;border-radius:10px;padding:5px;border:1px solid #ddd}
.tab{flex:1;padding:10px 4px;border-radius:8px;border:none;cursor:pointer;font-size:13px;background:transparent;color:#666;font-family:inherit}
.tab.active{background:#1F3864;color:#fff;font-weight:500}
.section{background:#fff;border-radius:10px;padding:12px 12px;margin-bottom:12px;border:1px solid #e0e0e0}
h2{font-size:15px;font-weight:500;margin-bottom:10px;color:#1F3864;border-bottom:2px solid #1F3864;padding-bottom:6px}
h3{font-size:14px;font-weight:500;margin-bottom:8px;color:#444}
.flex{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=text]{height:44px;padding:0 12px;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:inherit}
select{height:44px;padding:0 8px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
button{cursor:pointer;padding:10px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:15px;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn-primary{background:#1F3864;color:#fff;border-color:#1F3864}
.btn-success{background:#27500A;color:#fff;border-color:#27500A}
.btn-danger{background:#A32D2D;color:#fff;border-color:#A32D2D}
.btn-sm{padding:6px 12px;font-size:13px}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.alert-err{background:#fcebeb;color:#A32D2D;border:1px solid #f09595}
.alert-ok{background:#eaf3de;color:#27500A;border:1px solid #97c459}
.alert-warn{background:#faeeda;color:#633806;border:1px solid #EF9F27}
.save-warn-pill{flex:0 0 auto;align-self:center;padding:4px 10px;border-radius:12px;background:#faeeda;color:#633806;border:1px solid #EF9F27;font-size:12px;font-weight:500}
/* U-1 (UX-P1): クラウド結果 status の色分け＋AAコントラスト（applyCloudStatus が kind クラスを付与）。
   旧 #888（コントラスト不足）を解消し 成功=緑/失敗=赤/警告=橙/案内=中立/送信中=紺 で区別する。 */
.cloud-status{color:#444}
.cloud-status-pending{color:#1F3864}
.cloud-status-info{color:#444}
.cloud-status-ok{color:#1a5c00;font-weight:600}
.cloud-status-warn{color:#7a4a00;font-weight:600}
.cloud-status-err{color:#A32D2D;font-weight:600}
/* U-2 (UX-P1): 「保存確認 N件」ピルは押すと説明モーダルを開く（cursor/focus を明示）。 */
.save-warn-pill{cursor:pointer}
/* 当日UX: 操作の成功を控えめに知らせるトースト（対局管理タブでも見える固定表示）。 */
.app-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:90%;background:#27500A;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;font-weight:500;z-index:10000;box-shadow:0 2px 10px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.app-toast.show{opacity:1}
.save-warn-pill:focus{outline:2px solid #EF9F27;outline-offset:1px}
/* U-3 (UX-P1): 受付一覧の操作ボタン（名前編集/ふりがな/削除）はタッチターゲット 44px を確保し誤タップを防ぐ。
   危険操作の削除も含め行内で高さを揃える。ヘッダの危険ボタン（全リセット等）は別グループで対象外。 */
.player-row-buttons button{min-height:44px}
.fee-bar{margin-top:12px;padding:10px 14px;background:#e8f0f8;border-radius:8px;font-size:14px}
/* SHOGI-TOUR-START-001: 受付クラス別「開始 readiness」バッジ（見出し直下・派生表示・保存しない）。
   色は既存 alert 系の意味色を流用（ready=alert-ok 緑 / warn=alert-warn 黄 / started=primary 紺 / empty=灰）。
   開始可否の判定は validateStartableClass に一元化（設計メモ §6）。本バッジは表示専用。 */
.class-readiness{display:inline-block;margin:0 0 8px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid;line-height:1.5}
.class-readiness-ready{background:#eaf3de;color:#27500A;border-color:#97c459}
.class-readiness-warn{background:#faeeda;color:#633806;border-color:#EF9F27}
.class-readiness-started{background:#e8f0f8;color:#1F3864;border-color:#9DB7D5}
.class-readiness-empty{background:#f2f2f2;color:#808080;border-color:#d9d9d9}
/* SHOGI-TOUR-START-003 の受付クラス別「1局目を作成」ボタン用 CSS（.reg-class-start*）は
   START-UX-CONSOLIDATE-001 で撤去した（受付タブから開始導線を外し、開始は対局管理タブへ集約）。 */
.separator{border:none;border-top:1px solid #eee;margin:12px 0}
.player-row{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#f8fbff;border:1px solid #d0e4f7;border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.player-row-main{display:flex;flex:1;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.player-row-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
/* MOBILE-HEADER-001 (PR #235 繰越): 受付一覧の操作ボタン群（名前編集 / ふりがな / 削除）は
   .player-row-actions(スマホで width:100% + space-between) の右側に置かれる。最狭幅で 3 ボタンが
   1 行に収まらないと横あふれしていた。flex-wrap:wrap で入り切らない分だけ折り返す（PC 幅は
   十分広く 1 行に収まるため折り返さず従来どおり＝見た目不変）。class-action-bar(#235) と同じ流儀。 */
.player-row-buttons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){
  .player-row-main{width:100%;flex:unset}
  .player-row-actions{width:100%;margin-left:0;justify-content:space-between}
  /* MOBILE-HEADER-001: スマホ幅で上部ヘッダーを「タイトル行」と「操作ボタン行」に段組みする。
     .header は title(div) と操作ボタン群(div) の 2 子を持つ flex(space-between)。狭幅で 1 行に
     詰めるとボタン群が圧縮され、長い日本語ラベル（例「大会データを全リセット」）が 1 文字ずつ
     縦に割れていた。ヘッダー自体を flex-wrap で折り返し、ボタン群(:last-child=操作側)を全幅・
     折返し可にして 1 行強制を解く。各ボタンは white-space:nowrap で文字の縦割れを防止する。
     危険操作ボタン（全リセット / 進行リセット）は btn-sm サイズのまま維持し縮小しない。
     PC 幅はこの @media 外なので従来の 1 行レイアウトのまま不変。 */
  .header{flex-wrap:wrap;gap:8px}
  .header>div:last-child{width:100%;flex-wrap:wrap}
  .header button{white-space:nowrap}
}
.player-name{font-weight:500;min-width:70px;font-size:14px}
/* FURIGANA-MVP-001: 受付一覧のふりがなルビ表示（氏名の上に小さく）。MVP では受付一覧のみ。 */
.player-name ruby{ruby-position:over}
.player-name rt{font-size:.6em;font-weight:400;color:#555;line-height:1}
/* FURIGANA-VIEW-002: 順位表 / 星取表 / 閲覧ビューへルビ展開（受付一覧と同じ流儀）。
   rt は氏名より小さく line-height:1 で行の伸びを抑える（設計メモ §A-4）。 */
.sb-table ruby,#pane-result ruby{ruby-position:over}
.sb-table rt,#pane-result rt{font-size:.6em;font-weight:400;color:#777;line-height:1}
.player-fee{font-weight:500;color:#1F3864;min-width:55px;font-size:14px}
.sel-sm{height:34px;padding:0 6px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;font-family:inherit}
/* ROUND-CLASS-START-007 (spec §15.1 .grid2 3+ クラス棚卸し):
   現状 A/B 2 クラス前提で `1fr 1fr` 固定。C クラス以降を追加すると 3 番目以降が
   次行へ折り返される（致命的崩れは無く、半幅占有で並ぶ）。
   `repeat(auto-fit, minmax(...))` 等への汎用化は VRT baseline 更新を伴うため、
   本 PR では実施せず、A/B 既存表示と完全互換のままにする。
   3+ クラス本格 UI レイアウト改善は後続タスク（008 以降）で扱う。 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
/* Codex Should Fix 2 (根本対処): 対局管理のクラスpane(#pane-tournament-grid 直下のグリッド項目)は
   既定の min-width:auto だとコンテンツ最小幅でトラックを突き破り、スマホ幅で pane ごと横あふれする
   （長い氏名の winner-btn / 暫定成績 / 対戦済みリストが原因になり得た）。min-width:0 でトラック幅に
   収め、内側の .winner-row(flex-wrap) や score-grid を折り返し可能にする。PC では 1fr トラックが十分
   広く min-width:auto でも破綻しないため、この指定による見た目変化はなく操作性も不変(PC最優先)。 */
#pane-tournament-grid>div{min-width:0}
.pairing-card{background:#f8fbff;border:1px solid #d0e4f7;border-radius:10px;padding:12px 12px;margin-bottom:8px}
/* LIVE-MOBILE-SCOREBOARD-001 §2 対局管理の名前ボックス改善:
   旧実装は width:7em + white-space:nowrap + text-overflow:ellipsis で長い氏名を
   省略表示していた（「12｜長谷川さく…」のように末尾が切れて読めない）。
   省略に逃げず、氏名を折り返して全文を読めるようにする。番号プレフィックス（12｜）は
   getNameWithNo 由来でそのまま保持し、同姓・同姓同名の判別補助とする。
   タップ対象の高さを min-height で安定させ、勝敗入力の操作性は維持する。 */
.winner-btn{padding:9px 10px;border-radius:8px;border:2px solid #ccc;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:7.5em;max-width:13em;min-height:2.9em;line-height:1.35;white-space:normal;word-break:break-word;overflow-wrap:anywhere;text-align:center;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}
.winner-btn.selected{background:#1F3864;color:#fff;border-color:#1F3864}
/* LIVE-MOBILE-SCOREBOARD-001 §2 / Codex Should Fix 2: 対局カードの氏名ボタン親flex(.winner-row)。
   旧実装は親が nowrap の横並びのままで、長い氏名2名だとスマホ幅で第2対局者ボタンが画面外へ
   はみ出し、勝敗入力が押しづらかった。入り切らない時だけ折り返す(flex-wrap)ことで横あふれを防ぐ。
   通常氏名は1行に収まり折り返さないため、PC運営画面の従来挙動・操作性は維持される(PC最優先)。
   折り返しが起きるスマホ幅では中央寄せ＋行間を少し空けて、上下に並んだ2ボタンを押しやすくする。 */
.winner-row{flex-wrap:wrap}
@media(max-width:700px){.winner-row{justify-content:center;row-gap:8px}}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:12px}
.score-card{background:#f0f4f8;border-radius:8px;padding:8px 6px;text-align:center}
.score-card .sname{font-weight:500;font-size:12px}
/* PAIRING-UX-SCORE-LIST-READABILITY-IMPL-LIGHT (PR #104 §3.2 案 B):
   暫定成績カードで番号と氏名を別行表示するための class。 */
.score-card .sno{font-size:11px;color:#1F3864;font-weight:500;white-space:nowrap;margin-bottom:2px}
.score-card .snm{font-size:12px;font-weight:500;line-height:1.3;word-break:break-word;margin-bottom:2px}
.score-card .swins{font-size:22px;font-weight:bold;color:#1F3864}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}
.b1{background:#FAC775;color:#633806}
.b2{background:#C8C8C8;color:#333}
.b3{background:#B5D4F4;color:#042C53}
.row-r1{background:#fef8e7}
.row-r2{background:#f5f5f5}
.row-r3{background:#eaf3fb}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#e8f0f8;color:#1F3864;font-weight:500;padding:7px 6px;text-align:center;border-bottom:2px solid #2E75B6}
td{padding:7px 6px;text-align:center;border-bottom:1px solid #eee;vertical-align:middle}
.history-tag{display:inline-block;background:#eee;border-radius:4px;padding:2px 6px;font-size:11px;color:#666;margin:2px}
.final-done{background:#eaf3de;border:1px solid #97c459;border-radius:8px;padding:12px;color:#27500A;font-weight:500;margin-bottom:12px}
.suggest-list{margin-top:6px;border:1px solid #ccc;border-radius:8px;background:#fff;max-height:280px;overflow-y:auto;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.suggest-item{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0.1)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active{background:#eaf3fb}
.suggest-item .si-name{font-weight:500;font-size:15px;color:#1F3864}
.suggest-item .si-meta{color:#666;font-size:12px;margin-top:2px}
@media(max-width:480px){
  input[type=text]{font-size:16px}
  .winner-btn{padding:10px 8px;font-size:14px}
  .tab{font-size:12px;padding:10px 2px}
  .header h1{font-size:13px}
}
/* MOBILE-TAB-001: 320px 級の極小幅で active タブ「参加者登録」(5文字) が2行に折り返す件の改善。
   .tab は flex:1 の等幅配分のため最長ラベルが基準になる。font-size を 11px に下げ、tab-bar の
   gap/余白と .tab の横パディングを詰めて1行に収める。横パディング 0 でも等幅 flex + 中央寄せで
   左右の視覚的余白は確保され、縦 10px は維持するためタップ高さ・タブ幅(タップ領域)は不変。
   CJK 全角は約 1em 幅で端末差が小さく、約 2.6px の余白で収まる。white-space:nowrap には
   あえて頼らず、想定外でも折り返しに留めて横スクロールは発生させない。361px 以上は従来表示のまま。 */
@media(max-width:360px){
  .tab-bar{gap:2px;padding:3px}
  .tab{font-size:11px;padding:10px 0}
}
/* ROUND-CLASS-START-007 (spec §15.1):
   #result-B 固定の page-break を .result-section + .result-section に汎用化。
   隣接する .result-section 間で改ページ（最初の section は改ページしない）。
   page-break-before は legacy 互換、break-before は新仕様。両方併用する。
   3 クラス以上（C+ result section）でも自然に改ページされる。 */
@media print{.header,.tab-bar,.no-print{display:none!important}body{background:#fff}.result-section+.result-section{page-break-before:always;break-before:page}}
@media screen and (orientation:landscape) and (max-width:900px){
  #rotate-overlay{display:flex!important}
}
/* LIVE-MOBILE-SCOREBOARD-001 §1 スマホ閲覧用リアルタイム星取表ビュー:
   運営画面（.header/.container）とは物理的に分離したフルスクリーンの閲覧専用ビュー。
   #scoreboard / #viewer / #mobile-standings hash で起動し、操作UI（ボタン/入力/
   保存/編集）は一切描画しない。順位は既存 calcFinal / computeDisplayRanks / getWins を
   再利用して算出し、ロジックを複製しない。スマホ縦画面 + 横スクロール、氏名列は sticky 固定。 */
#scoreboard-view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#eef2f7;z-index:90000;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}
body.sb-active{overflow:hidden}
.sb-head{position:sticky;top:0;z-index:6;background:#1F3864;color:#fff;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,0.18)}
.sb-title{font-size:16px;font-weight:600;line-height:1.3}
.sb-meta{font-size:12px;opacity:0.92;margin-top:3px;line-height:1.4}
.sb-note{font-size:11px;opacity:0.8;margin-top:4px}
/* LIVE-MOBILE-SCOREBOARD-001 §1: 最終更新時刻（閲覧ビューが state を最後に読み込んだ時刻）。 */
.sb-updated{font-size:11px;opacity:0.92;margin-top:3px;font-variant-numeric:tabular-nums}
/* Codex Must Fix 1: 「運営画面へ」戻りボタン(.sb-back)は read-only 徹底のため廃止（CSS も削除）。 */
.sb-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#dde7f2}
.sb-tab{padding:6px 14px;border-radius:16px;border:1px solid #2E75B6;background:#fff;color:#2E75B6;font-size:13px;cursor:pointer;font-family:inherit}
.sb-tab.active{background:#2E75B6;color:#fff;font-weight:600}
.sb-body{padding:8px 0 48px}
.sb-class{margin-bottom:16px}
.sb-class-h{font-size:14px;font-weight:600;color:#1F3864;padding:8px 12px 6px}
.sb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid #d3dbe5;border-bottom:1px solid #d3dbe5;background:#fff}
.sb-table{border-collapse:separate;border-spacing:0;font-size:13px;width:auto;min-width:100%}
.sb-table th,.sb-table td{border-right:1px solid #e0e6ee;border-bottom:1px solid #e0e6ee;padding:5px 7px;text-align:center;white-space:nowrap;vertical-align:middle}
.sb-table thead th{background:#1F3864;color:#fff;font-weight:500;position:sticky;top:0;z-index:2}
/* 順位 + 氏名 列を sticky 固定（横スクロールでも誰の行か分かる）。
   氏名列の left は順位列の固定幅(40px)に一致させる。 */
.sb-col-rank{position:sticky;left:0;z-index:3;background:#eef3f9;font-weight:700;width:40px;min-width:40px;max-width:40px}
.sb-col-name{position:sticky;left:40px;z-index:3;background:#fff;text-align:left;font-weight:600;min-width:6.5em;max-width:10.5em;white-space:normal;word-break:break-word;line-height:1.3}
.sb-table thead .sb-col-rank,.sb-table thead .sb-col-name{background:#15294a;color:#fff;z-index:4}
.sb-row-1 .sb-col-rank{background:#fde7c4}
.sb-mark{font-size:16px;font-weight:700;line-height:1.05}
.sb-mark-win{color:#1b7a2e}
.sb-mark-lose{color:#b23030}
.sb-mark-none{color:#bbb}
.sb-opp{font-size:10px;color:#777;display:block;margin-top:1px}
.sb-wins{font-weight:700;color:#1F3864;font-size:15px}
.sb-metric{color:#555;font-size:12px}
.sb-empty{padding:28px 16px;text-align:center;color:#888;font-size:13px;line-height:1.6}
.sb-legend{padding:6px 12px 0;font-size:11px;color:#667}
</style>
</head>
<body>
<div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>
<div id="rotate-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#1F3864;z-index:99999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px">
  <div style="font-size:60px;margin-bottom:20px">↩️</div>
  <div style="font-size:20px;font-weight:500;margin-bottom:12px">縦向きにしてください</div>
  <div style="font-size:14px;opacity:0.8">このアプリは縦向き表示に最適化されています</div>
</div>
<!-- LIVE-MOBILE-SCOREBOARD-001 §1: スマホ閲覧用リアルタイム星取表ビュー（閲覧専用）。
     既定は display:none。#scoreboard / #viewer / #mobile-standings hash 時に renderScoreboard()
     が中身を生成し、運営画面（.header / .container）を隠して全画面表示する。
     操作UI（入力/保存/編集ボタン）は一切含めない。 -->
<div id="scoreboard-view" aria-hidden="true"></div>
<div class="header">
  <div><h1>沼津支部 月例将棋大会 運営ツール</h1></div>
  <div style="display:flex;gap:8px;align-items:center">
    <!-- LIVE-MOBILE-SCOREBOARD-001 §1: スマホ閲覧用の星取表ビューを別タブで開く。
         運営画面（このタブ）はそのまま維持し、閲覧専用ビューは #scoreboard hash で起動する。
         同一ブラウザの localStorage(state) を参照し、運営タブの保存に追従してリアルタイム更新する。 -->
    <button type="button" class="btn-sm no-print" id="openScoreboardBtn" style="background:#2E75B6;color:#fff;border-color:#2E75B6">📱 スマホ星取表</button>
    <button type="button" class="btn-sm no-print" id="saveBtn" style="background:#27500A;color:#fff;border-color:#27500A">大会データをコピー</button>
    <button type="button" class="btn-sm no-print" id="loadBtn" style="background:#185FA5;color:#fff;border-color:#185FA5">読み込み</button>
    <input type="file" id="loadFile" accept=".json" style="display:none">
    <button type="button" class="btn-sm no-print" id="backupBtn" style="background:#5B6770;color:#fff;border-color:#5B6770">バックアップ</button>
    <!-- RESET-MENU (当日第2弾⑩後半): 危険な全リセット/進行リセットは常時表示せず ⋯メニュー配下へ退避し誤タップを防ぐ。
         id（resetBtn / resetProgressBtn）は不変＝既存の resetAll / resetTournamentProgressOnly 結線をそのまま温存。 -->
    <div id="dangerMenuWrap" class="no-print" style="position:relative;display:inline-block">
      <button type="button" class="btn-sm no-print" id="dangerMenuBtn" aria-haspopup="true" aria-expanded="false" title="リセットなどの操作" style="background:#fff;border:1px solid #c33;color:#c33;min-height:36px">⋯ その他</button>
      <div id="dangerMenu" role="menu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.18);padding:8px;min-width:230px;text-align:left">
        <div style="font-size:11px;color:#999;padding:2px 6px 6px">危険な操作（元に戻すで1回分復旧できます）</div>
        <button type="button" class="btn-danger no-print" id="resetProgressBtn" role="menuitem" style="display:block;width:100%;text-align:left;margin-bottom:6px">大会進行データをリセット</button>
        <button type="button" class="btn-danger no-print" id="resetBtn" role="menuitem" style="display:block;width:100%;text-align:left">大会データを全リセット</button>
      </div>
    </div>
  </div>
</div>
<!-- BACKUP-NUDGE (当日第2弾⑫): 節目（大会開始/クラス完了/全終了）で「今ひかえますか？」を非ブロッキングで促す。既定非表示・あとで可・端末事故の全損防止。 -->
<div id="backup-nudge" class="no-print" role="status" aria-live="polite" style="display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#faeeda;border:1px solid #EF9F27;color:#633806;padding:10px 14px;margin:0 12px 0;border-radius:0 0 8px 8px;font-size:13px">
  <span id="backup-nudge-msg"></span>
  <span style="display:flex;gap:6px;flex-wrap:wrap">
    <button type="button" class="btn-sm no-print" id="backup-nudge-do" style="min-height:36px;background:#EF9F27;color:#fff;border-color:#EF9F27">バックアップする</button>
    <button type="button" class="btn-sm no-print" id="backup-nudge-later" style="min-height:36px;background:#fff;color:#633806;border:1px solid #d6b673">あとで</button>
  </span>
</div>
<div class="container">
  <div class="tab-bar no-print">
    <button type="button" class="tab active" id="tab-reg">参加者登録</button>
    <button type="button" class="tab" id="tab-tournament">対局管理</button>
    <button type="button" class="tab" id="tab-result">最終結果</button>
    <button type="button" class="tab" id="tab-master">会員名簿</button>
    <button type="button" class="tab" id="tab-history">大会履歴</button>
    <span id="save-warning-indicator" class="save-warn-pill" role="button" tabindex="0" title="押すと対処方法を表示します" hidden></span>
  </div>
  <div id="pane-reg">
    <div class="section" id="past-participants-section" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <h2 style="border:none;padding:0;margin:0;font-size:15px">過去参加者から選ぶ <span id="pp-summary" style="color:#888;font-weight:400;font-size:12px"></span></h2>
        <button type="button" class="btn-sm" id="ppToggleBtn">▼ 開く</button>
      </div>
      <div id="ppPanel" style="display:none"></div>
    </div>
    <!-- CLASS-VARIABLE-001 (CV-1): クラス管理UI。state.classes を runtime で追加/改名/削除する。
         A/B はアプリ既定クラス（normalizeClasses が読込毎に必ず補完するため）削除不可。
         renderClassManager() が #class-manager-list を描画し、追加は #addClassBtn / #inp-new-class。
         登録プルダウン inp-class は populateClassSelect() が state.classes 駆動で生成する。 -->
    <div class="section" id="class-manager-section">
      <h2>クラスを管理する</h2>
      <div id="class-manager-list" style="margin-bottom:8px"></div>
      <div class="flex">
        <input type="text" id="inp-new-class" placeholder="クラス名（例: Cクラス）" style="width:200px" autocomplete="off" maxlength="20">
        <button type="button" class="btn-sm" id="addClassBtn" style="border-color:#2E75B6;color:#2E75B6">クラスを追加</button>
      </div>
      <div style="font-size:11px;color:#888;margin-top:4px">A・Bクラスは削除できません。開始済み・参加者がいるクラスは削除できません。</div>
    </div>
    <div class="section">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 style="margin:0">参加者を登録する</h2>
        <button type="button" id="helpBtnReg" class="btn-sm" title="登録・受付の使い方をヘルプで表示します" aria-label="登録・受付ヘルプ" style="font-size:12px;padding:2px 8px;font-weight:400;white-space:nowrap">？ ヘルプ</button>
      </div>
      <div class="flex">
        <input type="text" id="inp-name" placeholder="氏名を入力" style="width:150px" autocomplete="off">
        <select id="inp-class">
          <option value="A">Aクラス</option>
          <option value="B">Bクラス</option>
        </select>
        <button type="button" class="btn-primary" id="addBtn">追加</button>
      </div>
      <div style="margin-top:6px">
        <input type="text" id="inp-yomi" placeholder="ふりがな" style="width:200px;font-size:16px" autocomplete="off">
        <span style="font-size:11px;color:#888;margin-left:6px">自動入力されない場合は手入力してください</span>
      </div>
      <div id="suggest-list" class="suggest-list" style="display:none"></div>
      <div id="reg-msg"></div>
      <!-- ROUND-CLASS-START-006 (spec §15.1): 受付一覧 grid を id="reg-class-grid" で
           参照可能にし、ensureClassRegDomNodes() で C クラス以降の受付 section を動的補完できる
           土台にする。A/B section は静的 DOM のまま維持し、互換 id (a-count/b-count/a-list/b-list)
           を温存する。新規 class section は class-section-{classId} / class-count-{classId} /
           class-list-{classId} / class-bulkedit-{classId} で構成。 -->
      <div class="grid2" id="reg-class-grid" style="margin-top:12px">
        <div data-class-id="A">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <h3 style="margin-bottom:0"><span id="a-name">Aクラス</span> <span id="a-count" style="color:#888;font-size:12px;font-weight:400"></span></h3>
            <button type="button" id="bulkEditA" class="btn-sm" style="border-color:#2E75B6;color:#2E75B6">名前を一括編集</button>
          </div>
          <!-- SHOGI-TOUR-START-001: クラス別 開始 readiness バッジ（renderRegList が validateStartableClass から導出して描画・読み取り専用の情報表示）。初期は非表示。 -->
          <!-- START-UX-CONSOLIDATE-001: 受付タブのクラス別「1局目を作成」ボタン（reg-class-start）は撤去。開始は対局管理タブへ集約。 -->
          <div id="a-readiness" class="class-readiness" style="display:none"></div>
          <div id="a-list"></div>
        </div>
        <div data-class-id="B">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <h3 style="margin-bottom:0"><span id="b-name">Bクラス</span> <span id="b-count" style="color:#888;font-size:12px;font-weight:400"></span></h3>
            <button type="button" id="bulkEditB" class="btn-sm" style="border-color:#2E75B6;color:#2E75B6">名前を一括編集</button>
          </div>
          <!-- SHOGI-TOUR-START-001: クラス別 開始 readiness バッジ（renderRegList が validateStartableClass から導出して描画・読み取り専用の情報表示）。初期は非表示。 -->
          <!-- START-UX-CONSOLIDATE-001: 受付タブのクラス別「1局目を作成」ボタン（reg-class-start）は撤去。開始は対局管理タブへ集約。 -->
          <div id="b-readiness" class="class-readiness" style="display:none"></div>
          <div id="b-list"></div>
        </div>
      </div>
      <div id="fee-summary" style="margin-top:12px"></div>
      <hr class="separator">
      <div class="flex">
        <!-- START-UX-CONSOLIDATE-001 (設計 §5): このボタンは「対局管理へ進むナビゲーション」。開始系の副作用は持たない。
             id="startBtn" は短期互換のため維持するが、意味は「開始」ではなく「対局管理タブへ移動」。開始は対局管理タブへ集約。 -->
        <button type="button" class="btn-primary" id="startBtn">登録内容を確認して対局管理へ</button>
        <span style="font-size:12px;color:#888">※対局の開始は「対局管理」タブで行います</span>
      </div>
    </div>
  </div>
  <div id="pane-tournament" style="display:none">
    <!-- REPORT-PRINT-003: 全クラスの現ラウンド組み合わせを印刷するボタン。
         no-print: 印刷時はボタン自体を隠す（クリックはブラウザ印刷経路ではなく専用 HTML 経路）。
         配置: pane-tournament-grid のクラス別 action bar（リセット / 再生成）と物理的に離すため
         tournament pane の上部に独立 row として配置する。文言は printResults / downloadReport と
         整合: 「現在の組み合わせを印刷 / PDF保存」。 -->
    <div style="margin-bottom:12px;text-align:right" class="no-print">
      <button type="button" class="btn-primary" onclick="printPairings()">現在の組み合わせを印刷 / PDF保存</button>
    </div>
    <!-- ROUND-CLASS-START-005 (spec §15.1 / inventory §3.4): pane-{classId} は
         state.classes 駆動で ensureClassPaneDomNodes() が動的補完する。
         A/B は既存互換のため静的に保持。grid2 コンテナに id を付与し、
         3 クラス以上の場合に append できる挿入点とする。 -->
    <div class="grid2" id="pane-tournament-grid">
      <div id="pane-A"></div>
      <div id="pane-B"></div>
    </div>
  </div>
  <div id="pane-master" style="display:none"></div>
  <div id="pane-result" style="display:none">
    <!-- HELP-UX-004 (#341): 順位タブの迷子防止ヘルプ。#309/#323 のモーダル三層を流用し topic 追加のみ。
         順位表は per-class 動的描画（buildResultsClassHtml=golden 対象）のため、静的アンカーをここに置き
         click は bindReportEvents 側で openHelpModal('standings') へ結線する（report help と同経路・golden 非接触）。 -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px" class="no-print">
      <span style="font-size:14px;font-weight:600;color:#1F3864">順位の見方</span>
      <button type="button" id="helpBtnStandings" class="btn-sm" title="順位の決め方をヘルプで表示します" aria-label="順位の見方ヘルプ" style="font-size:12px;padding:2px 8px;font-weight:400;white-space:nowrap">？ ヘルプ</button>
    </div>
    <!-- ROUND-CLASS-START-005: result-{classId} を state.classes 駆動で append できるよう
         result-list ラッパーで囲む。A/B は既存互換のため静的に保持し、
         ensureClassResultDomNodes() が不足分のみ末尾に動的補完する。
         ROUND-CLASS-START-007: .result-section クラスを付与し、印刷時 page-break を
         #result-B 固定から `.result-section + .result-section` の汎用 CSS に置換。 -->
    <div id="result-list">
      <div id="result-A" class="result-section"></div>
      <div id="result-B" class="result-section" style="margin-top:16px"></div>
    </div>
    <div style="margin-top:16px;text-align:right" class="no-print">
      <button type="button" class="btn-primary" onclick="printResults()">対戦成績を印刷 / PDF保存</button>
    </div>
    <!-- B-2b-wire (#343): 確定結果をクラウド（Supabase）へ送信（任意・冪等・押さなければ従来通り）。
         click は bindReportEvents で sendTournamentToCloud に結線。supabase-js/config は click 時のみ遅延ロード。 -->
    <div style="margin-top:8px;text-align:right" class="no-print">
      <button type="button" id="cloudSendBtn" class="btn-sm" style="border:1px solid #2b6cb0;color:#2b6cb0;background:#fff">☁ クラウドへ送信（任意）</button>
      <div id="cloudSendStatus" class="cloud-status" role="status" aria-live="polite" style="font-size:12px;margin-top:4px;min-height:1.2em"></div>
    </div>
    <div class="section no-print" style="margin-top:16px">
      <!-- HELP-UX-002 (#322): 見出し脇に「？ ヘルプ」ボタンを1つ置く（報告書画面の迷子防止 in-app ヘルプ導線）。
           #309 の「1局目 未割当参加者」見出し（flex 横並び・btn-sm＋inline）と同型。click は build/bind 分離のため
           bindReportEvents 側で openHelpModal('report') へ結線する。本文は HELP_TEXTS['report'] に集約し escapeHtml 経由。 -->
      <div style="display:flex;align-items:center;gap:8px">
        <h2 style="margin:0">大会報告書</h2>
        <button type="button" id="helpBtnReport" class="btn-sm" title="報告書の作り方をヘルプで表示します" aria-label="報告書の作り方ヘルプ" style="font-size:12px;padding:2px 8px;font-weight:400;white-space:nowrap">？ ヘルプ</button>
      </div>
      <!-- REPORT-UX-004: 大会名（state.report.title）。downloadReport の <title> / h2 / ファイル名
           で参照される。既定値 '沼津支部月例将棋大会'。「報告書」接尾辞は downloadReport 側で付与。
           空欄/不正値は normalizeReportTitle で既定値に fallback、DOM 表示値も同期される。 -->
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">大会名</label>
        <input type="text" id="rep-title" placeholder="沼津支部月例将棋大会" style="width:100%">
      </div>
      <!-- REPORT-UX-005: 主催者名（state.report.organizer）。downloadReport の「主催」行で参照される。
           既定値 '日本将棋連盟沼津支部'。「主催：」ラベル文言は downloadReport 側で付与し、state には
           純粋な主催者名のみを保存する。空欄/不正値は normalizeReportOrganizer で既定値に fallback、
           DOM 表示値も change イベント時のみ同期書き戻し（input 時は IME-safe で state 更新のみ）。 -->
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">主催者</label>
        <input type="text" id="rep-organizer" placeholder="日本将棋連盟沼津支部" style="width:100%">
      </div>
      <!-- REPORT-UX-001: 開催日は <input type="date">、開始/終了時間は <input type="time"> で
           ブラウザ標準のカレンダー/時刻ピッカーを使用。step="300" は 5 分刻み。
           未入力時は ensureReportDateTimeDefaults() が今日 / 13:00 / 17:00 を補完する。
           保存済み値・入力済み値は populateReportFields() が優先し、defaults は上書きしない。
           印刷帳票では downloadReport() が YYYY-MM-DD / HH:MM を YYYY年M月D日 / HH時MM分 に変換して表示する。 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">開催日</label>
          <input type="date" id="rep-date" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">会場</label>
          <input type="text" id="rep-place" value="労政会館" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">開始時間</label>
          <input type="time" id="rep-start" step="300" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">終了時間</label>
          <input type="time" id="rep-end" step="300" style="width:100%">
          <div id="rep-time-warning" style="display:none;font-size:11px;color:#A32D2D;margin-top:4px"></div>
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">担当役員（正）</label>
          <input type="text" id="rep-sei" placeholder="氏名" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">担当役員（副）</label>
          <input type="text" id="rep-fuku" placeholder="氏名" style="width:100%">
        </div>
        <!-- REPORT-UX-003A: 賞金額（円）入力欄。既定 7000 円、0 は有効値、負値・不正値は 7000 にフォールバック。
             downloadReport で state.report.prize を参照し、収支表示も同期。 -->
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">賞金額（円）</label>
          <input type="number" id="rep-prize" min="0" step="100" inputmode="numeric" placeholder="7000" style="width:100%">
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">申し送り事項</label>
        <textarea id="rep-note" placeholder="特になし" style="width:100%;height:60px;padding:8px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </div>
      <!-- REPORT-UX-007A / FAX削除対応（Codex 追加 Must Fix）:
           FAX番号入力欄（#rep-fax / state.report.fax）は schema・保存読込互換のため残置するが、
           FAX が実在しないため報告書出力（downloadReport）には一切出力しない（出力で参照しない）。
           事務局名（#rep-office-name / officeName）は引き続き footer 1行目
           '※ホームページ掲載の為、当日夜までにメールまたは直接<officeName>まで' で参照する。
           既定値 '943-9443'(fax・出力未使用) / '沼津支部事務局'(officeName)。空欄/不正値は normalize
           helper で既定値に fallback、DOM 同期は change イベント時のみ（input 時は IME-safe で state のみ）。 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">FAX番号</label>
          <input type="text" id="rep-fax" placeholder="943-9443" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">事務局名</label>
          <input type="text" id="rep-office-name" placeholder="沼津支部事務局" style="width:100%">
        </div>
      </div>
      <!-- REPORT-UX-007B-1: 報告書 footer 2行目（会計提出文 / state.report.accountingNote）。
           downloadReport が '<p style="font-size:11px">…</p>' で参照する。既定値
           '※役員会で会計長へ収支報告書として提出ください。'。空欄/不正値は normalizeReportAccountingNote
           で既定値に fallback。DOM 表示値は change イベント時のみ同期書き戻し（input 時は IME-safe）。
           中間改行は維持し、帳票表示で <br> に変換される。 -->
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">会計提出文</label>
        <textarea id="rep-accounting-note" placeholder="※役員会で会計長へ収支報告書として提出ください。" style="width:100%;height:48px;padding:8px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </div>
      <button type="button" class="btn-primary" id="downloadReportBtn">報告書を印刷 / PDF保存</button>
    </div>
  </div>
  <!-- SHOGI-TOUR-HISTORY-STEP1: 過去大会の履歴一覧 / read-only 閲覧（追加 pane。既存 pane は変更しない） -->
  <div id="pane-history" style="display:none">
    <div id="history-content"></div>
  </div>
</div>

<script>
var state = {
  players: {A:[], B:[]},
  rounds: 4,
  pairings: {A:[], B:[]},
  results: {A:[], B:[]},
  started: false,
  report: {date:'', place:'労政会館', start:'', end:'', sei:'', fuku:'', note:'', prize:7000, title:'沼津支部月例将棋大会', organizer:'日本将棋連盟沼津支部', fax:'943-9443', officeName:'沼津支部事務局', accountingNote:'※役員会で会計長へ収支報告書として提出ください。'},
  // ROUND-CLASS-START-003: classId 単位 started を正とする state.classes を導入。
  //   既存 dict (players/pairings/results) は当面 A/B 固定構造で維持。詳細: spec §5.2
  classes: [
    {id:'A', name:'Aクラス', started:false},
    {id:'B', name:'Bクラス', started:false}
  ]
};

var STORAGE_KEY='shogi_v4';
var LEGACY_STORAGE_KEYS=['shogi_v3'];

// ============================================================
// UTILITY: 共通の純粋/参照系関数(escapeHtml, 名前取得, 料金計算, 勝数集計, 整合チェック, JSON正規化)
// ============================================================

function escapeHtml(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// PHASE-B-3 (#289): 参加者の「id+クラス → 表示フィールド」を1回の走査で解決する単一窓口。
//   getName / getNameWithNo / nameWithNoRubyHtml が個別に state.players[cls] を走査していた
//   重複を集約する（生成文字列は完全同値）。
//   - 走査は state.players[cls] を直接参照（getName / entryNoOf と同じ非防御＝クラス不在なら throw）。
//   - entryNo: entry_no>0 なら 2 桁ゼロ埋め、未付与なら index+1 を 2 桁ゼロ埋め（entryNoOf と同一規則）。
//   - name : 見つかれば player.name、なければ '(削除)'（getName と同一）。
//   - yomi : 見つかれば string の yomi、なければ ''（yomiOf と同一）。
//   - not-found: {found:false,name:'(削除)',entryNo:'--',yomi:''}（各既存関数の not-found と同一）。
function _resolvePlayerDisplay(id,cls){
  var players=state.players[cls];
  for(var i=0;i<players.length;i++){
    if(players[i].id===id){
      var p=players[i];
      var en=p.entry_no;
      return {
        found:true,
        name:p.name,
        entryNo:(typeof en==='number'&&en>0)?('00'+en).slice(-2):('00'+(i+1)).slice(-2),
        yomi:(typeof p.yomi==='string')?p.yomi:''
      };
    }
  }
  return {found:false,name:'(削除)',entryNo:'--',yomi:''};
}

function getName(id,cls){
  return _resolvePlayerDisplay(id,cls).name;
}

// A-5.1 §11.8 (欠番維持): entry_no を player に永続化する。
//   削除発生後も他参加者の番号を詰めない（再採番は現場混乱を招くため禁止）。
//   旧 A-4 §7 の「配列 index+1 から都度算出」は normalizeState による
//   legacy backfill 経由で互換維持し、新規採番は nextEntryNoForClass で
//   max(entry_no)+1 を採る。entryNoOf は entry_no を優先し、未付与時は
//   index+1 にフォールバック（安全網）。
function entryNoOf(cls,id){
  var players=state.players[cls];
  for(var i=0;i<players.length;i++){
    if(players[i].id===id){
      var en=players[i].entry_no;
      if(typeof en==='number'&&en>0)return ('00'+en).slice(-2);
      return ('00'+(i+1)).slice(-2);
    }
  }
  return '--';
}

// A-5.1 §11.8 + #276: 同一クラス内の entry_no を「正の整数で一意」に正規化する単一窓口。
//   不変条件: クラス内 entry_no は正の整数で一意。明示の有効・一意な entry_no は保持し、
//   不在/無効（非数値・非正・非整数）/重複 の player のみ max(existing)+1 から一意採番する
//   （重複は配列内で後発側＝2件目以降を再採番）。削除で生まれた欠番は再利用しない。
//   旧実装は欠番補完に配列 index+1 を使い、別レコードの明示値と衝突（重複）し得た（#276）。
//   players を in-place で正規化し、次に採番すべき番号（一意化後の max+1）を返す。冪等。
// #330: entry_no の有効値判定（正の安全整数のみ）。Infinity/1e21(非安全整数)/NaN/負/小数を除外。
//   ES5: Number.isFinite/isSafeInteger を使わず global isFinite + MAX_SAFE_INTEGER 上限で表現。
//   #276 のガード（typeof number && >0 && floor===self）の取りこぼし（Infinity/1e21 素通り）を是正。
function isValidEntryNo(en){
  return typeof en==='number'&&isFinite(en)&&en>0&&Math.floor(en)===en&&en<=9007199254740991;
}
function reconcileEntryNos(players){
  var list=players||[];
  var claimed={};
  var maxNo=0;
  var i,en,p;
  // 第1パス: 明示の有効・一意値（正の整数・初出）を確定。それ以外は後段の再採番対象へ回す。
  for(i=0;i<list.length;i++){
    p=list[i];
    if(!p)continue;
    en=p.entry_no;
    if(isValidEntryNo(en)&&!claimed[en]){
      claimed[en]=true;
      if(en>maxNo)maxNo=en;
    }else{
      p.entry_no=null;
    }
  }
  // 第2パス: 不在/無効/重複（後発）を max+1 から配列順に一意採番（欠番は再利用しない）。
  var next=maxNo+1;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(!p)continue;
    if(p.entry_no===null){
      p.entry_no=next;
      next++;
    }
  }
  return next;
}

// A-5.1 §11.8: 同一クラス内で次に採番すべき entry_no を返す。
//   #276: 衝突回避の一意採番（reconcileEntryNos）に揃える。欠番補完の index+1 が
//   別レコードの明示値と衝突するバグを解消し、既存重複も検知して後発を再採番する。
//   max(entry_no)+1 を採用し、削除発生で生まれた欠番は再利用しない。
function nextEntryNoForClass(cls,stateObj){
  var s=stateObj||state;
  var players=(s&&s.players&&s.players[cls])||[];
  return reconcileEntryNos(players);
}

// A-4 §2: 「番号｜名前」の表示フォーマット。プレフィックス幅2桁ゼロ埋め。
// PHASE-B-3 (#289): entryNoOf+getName の二重走査を _resolvePlayerDisplay の単一走査へ集約（出力同値）。
function getNameWithNo(id,cls){
  var d=_resolvePlayerDisplay(id,cls);
  return d.entryNo+'｜'+d.name;
}

// PAIRING-UX-DISPLAY-HELPER-IMPL-LIGHT (PR #101 §10.1):
//   DISPLAY-LABELS / WARNING-DECISION-SUPPORT の共通基盤となる軽量 helper。
//   既存 getName / getNameWithNo は破壊せず並存。
//   対象: compact / standard モードのみ（detail / print は IMPL-LIGHT 範囲外）。
//   戻り値: HTML escape 前のプレーン文字列。callsite で escapeHtml() を通す。
//   options:
//     mode:            'compact' | 'standard'（default 'compact'）
//     includeRecord:   勝敗数を併記（mode 共通）
//     record:          { wins: number, losses: number }
//     includeCategory: 支部員区分を併記（standard モードのみ有効）
//   表示例:
//     compact:                      'A-12 山田太郎'
//     compact + record:             'A-12 山田太郎（2勝0敗）'
//     standard:                     'A-12 山田太郎'
//     standard + category:          'A-12 山田太郎（沼津支部員）'
//     standard + record:            'A-12 山田太郎（2勝0敗）'
//     standard + category + record: 'A-12 山田太郎（沼津支部員 / 2勝0敗）'
//   重要: 単一支部運営のため state に「支部名」フィールドは存在しない。
//   category は player.member（'member' / 'other'）= 支部員区分。
function formatParticipantLabel(player, options){
  if(!player||typeof player!=='object')return '';
  var opts=options||{};
  var mode=(opts.mode==='standard')?'standard':'compact';
  var includeRecord=!!opts.includeRecord;
  var includeCategory=(mode==='standard')&&!!opts.includeCategory;
  var cls=(typeof player.cls==='string')?player.cls:'';
  var en=player.entry_no;
  var entryNoStr=(typeof en==='number'&&en>0)?('00'+en).slice(-2):'--';
  var name=(typeof player.name==='string')?player.name:'';
  var prefix=cls?(cls+'-'+entryNoStr):entryNoStr;
  // cowork Should Fix (PR #102): name 未設定 / 非 string 時に trailing space を残さない。
  var base=name?(prefix+' '+name):prefix;
  var extras=[];
  if(includeCategory){
    var cat='';
    if(player.member==='member')cat='沼津支部員';
    else if(player.member==='other')cat='他';
    if(cat)extras.push(cat);
  }
  if(includeRecord&&opts.record&&typeof opts.record.wins==='number'&&typeof opts.record.losses==='number'){
    extras.push(opts.record.wins+'勝'+opts.record.losses+'敗');
  }
  if(extras.length===0)return base;
  return base+'（'+extras.join(' / ')+'）';
}

// FEE-JOSEI-001 (#325): 会費区分 grade は 'ippan'(一般) / 'chu'(中学生以下) / 'josei'(女性) の3値。
//   女性(josei) は中学生以下(chu) と完全に同額（支部員=0円 / 支部員以外=500円）。
function getFee(member,grade){
  if(grade==='chu'||grade==='josei')return member==='member'?0:500;
  return member==='member'?500:1000;
}

function calcTotal(){
  // ROUND-CLASS-START-007 (Codex Should Fix S2):
  //   getRegistrationClassList() を唯一の source of truth として使うことで、
  //   renderRegList と calcTotal の fallback 方針を完全に揃える。
  //   state.classes が非空でも全 unsafe な場合の挙動分岐:
  //   - getRegistrationClassList: ['A','B'] fallback
  //   - calcTotal: 旧 006 では state.classes 駆動経路に入って 0 を返していた → 受付一覧と
  //     fee-summary の表示が乖離（破損 state 直接注入時）。
  //   本 PR で両者を getRegistrationClassList 経由に統一し、整合を回復する（spec §15.1 / S2）。
  //
  // ROUND-CLASS-START-006 既存仕様（維持）:
  //   - isSafeClassId() で classId 安全文字のみ許容
  //   - state.players[classId] が無い classId は 0 加算
  var t=0;
  var classes=getRegistrationClassList();
  for(var ci=0;ci<classes.length;ci++){
    var c=classes[ci];
    if(!c||!isSafeClassId(c.id))continue;
    var arr=(state&&state.players&&state.players[c.id])||[];
    if(!Array.isArray(arr))continue;
    for(var i=0;i<arr.length;i++){
      var p=arr[i]; if(!p)continue;
      t+=getFee(p.member||'member',p.grade||'ippan');
    }
  }
  return t;
}

function getWins(cls){
  var wins={};
  var players=state.players[cls];
  for(var i=0;i<players.length;i++)wins[players[i].id]=0;
  var results=state.results[cls];
  for(var r=0;r<results.length;r++){
    for(var m=0;m<results[r].length;m++){
      var match=results[r][m];
      if(match.winner)wins[match.winner]=(wins[match.winner]||0)+1;
    }
  }
  return wins;
}

function pairHasRematch(cls,p1,p2){
  for(var r=0;r<state.results[cls].length;r++){
    for(var m=0;m<state.results[cls][r].length;m++){
      var match=state.results[cls][r][m];
      if((match.p1===p1&&match.p2===p2)||(match.p1===p2&&match.p2===p1))return true;
    }
  }
  return false;
}

function findPairContainingPlayer(cls,playerId,excludeIdx){
  for(var i=0;i<state.pairings[cls].length;i++){
    if(i===excludeIdx)continue;
    var pair=state.pairings[cls][i];
    if(!pair)continue;
    if(pair.p1===playerId||pair.p2===playerId)return i;
  }
  return -1;
}

function getDuplicatePlayersInPairings(cls){
  var used={};
  var dups=[];
  for(var i=0;i<state.pairings[cls].length;i++){
    var m=state.pairings[cls][i];
    if(!m)continue;
    [m.p1,m.p2].forEach(function(pid){
      if(!pid)return;
      if(used[pid]&&dups.indexOf(pid)<0)dups.push(pid);
      used[pid]=true;
    });
  }
  return dups;
}

// PAIRING-UX-MANUAL-CHANGE-CANDIDATE-FILTER-IMPL-LIGHT (PR #108 §9.1):
//   手動変更モーダルの select 候補を「選択可能 / 選択不可」に事前分類する。
//   事後判定（bindChangePairingModalEvents）と同じ helper（pairHasRematch /
//   findPairContainingPlayer）を内部で呼ぶことで、表示と保存時の判定を一致させる。
//   既存事後判定は安全網として残す（fail-safe）。
//   role='p1' は先手 select、'p2' は後手 select。現 p1/p2 は status:'ok' 扱いで
//   reasonId=null（PR #108 §7.1.1 確定）。
//   戻り値: { status:'ok'|'blocked', reasonId, reasonLabel }
function classifyChangePairingCandidate(cls, idx, candidateId, role){
  var pairings=state.pairings&&state.pairings[cls];
  var match=pairings&&pairings[idx];
  if(!match)return {status:'blocked',reasonId:'R-invalid',reasonLabel:'選択不可'};
  var currentInRole=(role==='p1')?match.p1:match.p2;
  if(candidateId===currentInRole){
    return {status:'ok',reasonId:null,reasonLabel:''};
  }
  var otherInRole=(role==='p1')?match.p2:match.p1;
  if(candidateId===otherInRole){
    // 反対側の現在値を同じ役にぶつけると保存時の「同じ選手」/「2 人同時入替」alert に至る。
    return {status:'blocked',reasonId:'R-self',reasonLabel:'同じ選手'};
  }
  var otherIdx=findPairContainingPlayer(cls,candidateId,idx);
  if(otherIdx===-1){
    // replace 経路: 候補が他ペアに属さない。再戦は既存 confirm に任せるため候補側では blocked にしない。
    return {status:'ok',reasonId:null,reasonLabel:''};
  }
  var otherPair=pairings[otherIdx];
  if(otherPair&&otherPair.winner){
    return {status:'blocked',reasonId:'R-winner-locked',reasonLabel:'結果入力済'};
  }
  // swap 経路: 既存 hard block と同じ条件（keepPlayer-X / droppedFromTarget-Y の双方を判定）
  var keepPlayer=(role==='p1')?match.p2:match.p1;
  var droppedFromTarget=(role==='p1')?match.p1:match.p2;
  var Y=(otherPair&&otherPair.p1===candidateId)?otherPair.p2:(otherPair?otherPair.p1:null);
  if(pairHasRematch(cls,keepPlayer,candidateId)||(Y&&pairHasRematch(cls,droppedFromTarget,Y))){
    return {status:'blocked',reasonId:'R-rematch-swap',reasonLabel:'再戦になる'};
  }
  return {status:'ok',reasonId:null,reasonLabel:''};
}

// ROUND-CLASS-START-003: 旧データ/現行/将来データから「class 一覧」を安全に正規化する。
//   pure 関数。グローバル state を参照しない。詳細: spec §9.2 / §9.3 / §10.3
//   返り値: [{id, name, started}, ...]
//   旧データ互換ルール:
//     - raw.classes が配列なら id/name/started を補完して採用 + A/B を補完
//     - raw.classes が無い旧データは A/B をデフォルト + raw.started を両クラスに保守的展開
//     - raw.players/pairings/results dict に未知 classId があれば classes に補完追加
//     - 過渡期データ（raw.classes 既存だが raw.started=true で classes 内 started=true ゼロ）は、
//       startTournament が classes を直接更新しない 003 以前の経路との互換のため、
//       全クラスに started=true を保守的展開（spec §9.3 案 a 準拠）
// ROUND-CLASS-START-006 (Codex Should Fix S3):
//   classId は DOM id / querySelector / getElementById に直接合成されるため、
//   ASCII 安全文字 (`/^[A-Za-z0-9_-]+$/`) のみを許可する。
//   不正な classId（空 / スペース / quote / 全角 / ピリオド等）は normalizeClasses で skip し、
//   既定の A/B fallback に頼る。設計 spec §7.2 末尾の前提を実コードで強制する。
function isSafeClassId(classId){
  return typeof classId==='string' && /^[A-Za-z0-9_-]+$/.test(classId);
}

function normalizeClasses(raw){
  var rawStarted=!!(raw&&raw.started);
  var hasRawClasses=!!(raw&&Array.isArray(raw.classes));
  var classes;
  if(hasRawClasses){
    classes=raw.classes
      .filter(function(c){return c&&isSafeClassId(c&&c.id);})
      .map(function(c){
        return {
          id:c.id,
          name:typeof c.name==='string'&&c.name?c.name:(c.id+'クラス'),
          started:c.started===true
        };
      });
    // 既存A/B大会の互換補完（足りない側を追加）
    ['A','B'].forEach(function(cls){
      var found=false;
      for(var i=0;i<classes.length;i++){if(classes[i].id===cls){found=true;break;}}
      if(!found)classes.push({id:cls,name:cls+'クラス',started:false});
    });
    // 過渡期互換: raw.started=true だが classes 内に started=true が一つも無い場合、
    // 003 以前の startTournament（classes を更新しない経路）から保存された state との
    // 整合性のため、保守的に全 classes へ started=true を展開する（spec §9.3）。
    if(rawStarted){
      var anyStarted=false;
      for(var k=0;k<classes.length;k++){if(classes[k].started===true){anyStarted=true;break;}}
      if(!anyStarted){for(var j=0;j<classes.length;j++)classes[j].started=true;}
    }
  } else {
    // 旧データ v0/v1: classes 無しの場合は A/B 既定 + raw.started を両方に展開
    classes=[
      {id:'A',name:'Aクラス',started:rawStarted},
      {id:'B',name:'Bクラス',started:rawStarted}
    ];
  }
  appendMissingClassesFromDicts(classes,raw);
  return classes;
}

// ROUND-CLASS-START-003: raw.players/pairings/results dict にあるが classes に無い classId を補完。
//   pure 関数。将来 C クラスを含む JSON を読んでも壊れないための前処理。
//   classes を破壊的に変更する（push 追加）。spec §9.2
function appendMissingClassesFromDicts(classes,raw){
  if(!raw||typeof raw!=='object')return;
  var existing={};
  for(var i=0;i<classes.length;i++)existing[classes[i].id]=true;
  ['players','pairings','results'].forEach(function(dictKey){
    var d=raw[dictKey];
    if(!d||typeof d!=='object'||Array.isArray(d))return;
    Object.keys(d).forEach(function(cid){
      // ROUND-CLASS-START-006 (Codex S3): classId id-safety を dict key 由来でも徹底する。
      //   破損 localStorage 由来の不正 classId（スペース / quote / 全角 等）が dict key として
      //   入り込んでも、state.classes へは展開しない（DOM id 破綻防止）。
      if(!isSafeClassId(cid))return;
      if(existing[cid])return;
      classes.push({id:cid,name:cid+'クラス',started:false});
      existing[cid]=true;
    });
  });
}

// ROUND-CLASS-START-003: classes 配列から classId-keyed object を生成する pure 関数。
//   グローバル state を参照しない（spec §10.3）。
//   initialValue が function（factory）の場合は class ごとに呼び出して個別値を生成する。
//   配列/object を共有しないように factory を渡すことで参照共有事故を避ける（spec §7.3）。
function emptyClassDict(classes,initialValue){
  var out={};
  if(!Array.isArray(classes))return out;
  var isFactory=typeof initialValue==='function';
  for(var i=0;i<classes.length;i++){
    var c=classes[i];

  //   4. 互換フィールド state.started を classes から同期書き込み / 5. return base

  var classes=normalizeClasses(s);

  //   既定 4、小数は floor、正の整数はそのまま。上限クランプは設けない（既知の上限概念なし）。
  var rn=Math.floor(Number(s.rounds));

    players:emptyClassDict(classes,function(){return [];}),

    classes:classes
  };
  classes.forEach(function(c){
    var cls=c.id;
    var players=(s.players&&Array.isArray(s.players[cls]))?s.players[cls]:[];
    base.players[cls]=players.map(function(p,idx){
      var pp={
        id:p&&p.id?p.id:('restored_'+cls+'_'+idx+'_'+Date.now()),
        name:p&&p.name?String(p.name):'',
        cls:cls,
        member:p&&p.member==='other'?'other':'member',
        grade:p&&(p.grade==='chu'||p.grade==='josei')?p.grade:'ippan'
      };
      // 支部マスタとの紐付け（F2）。既存JSON（member_id 不在）は従来通り。

    // #276: クラス内 entry_no を「正の整数・一意」に正規化。明示の有効・一意値は保持し、
    //   不在/無効/重複（後発）は max(existing)+1 から一意採番（欠番は再利用しない）。
    reconcileEntryNos(base.players[cls]);

    var validIds={};

    // REPORT-UX-006C: sei / fuku / note も専用 helper で trim/fallback して復元する（下記の個別分岐）。

    if(Object.prototype.hasOwnProperty.call(s.report,'sei')){

    if(Object.prototype.hasOwnProperty.call(s.report,'start')){

    if(Object.prototype.hasOwnProperty.call(s.report,'end')){

    if(Object.prototype.hasOwnProperty.call(s.report,'prize')){

    if(Object.prototype.hasOwnProperty.call(s.report,'title')){

    }
    // REPORT-UX-005: organizer 文字列フィールド。normalizeReportOrganizer で trim/fallback。

    if(Object.prototype.hasOwnProperty.call(s.report,'organizer')){

    }

    //   旧データ (fax 欠落) は base.report.fax='943-9443'（schema 既定）のまま維持。

    if(Object.prototype.hasOwnProperty.call(s.report,'fax')){

// ROUND-CLASS-START-003 (spec §8.2):
//   state.classes[i].started を正、state.started は互換フィールド（純 derived ではない）。
//   通常経路では setClassStarted 経由、§8.2 例外3関数（normalizeState/resetAll/
//   resetTournamentProgressOnly）で直接代入する場合は最後に syncGlobalStartedFromClasses を呼ぶ。
function syncGlobalStartedFromClasses(){
  if(!state||!Array.isArray(state.classes)){state.started=false;return false;}
  var any=false;
  for(var i=0;i<state.classes.length;i++){
    if(state.classes[i]&&state.classes[i].started===true){any=true;break;}
  }
  state.started=any;
  return any;
}

// ROUND-CLASS-START-003: classId の started を返す。存在しない classId は false（spec §10.1）。
function isClassStarted(classId){
  if(!state||!Array.isArray(state.classes))return false;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    if(c&&c.id===classId)return c.started===true;
  }
  return false;
}

// ROUND-CLASS-START-003 (spec §8.2 / Codex Should Fix):
//   通常の started 変更経路。該当 class だけ更新し、互換フィールド state.started を同期書き込みする。
//   未知 classId は Error を throw する（spec 推奨）。silent no-op にしないことで、classId typo や
//   DOM 由来の不正 ID を早期検知できる。004 で atomic start の中核 helper になる前提のため厳格化。
//   isClassStarted（reader）は false 扱いのままで読み取り側の例外を増やさない。
function setClassStarted(classId,value){
  if(!state||!Array.isArray(state.classes)){
    throw new Error('setClassStarted: state.classes is not initialized');
  }
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    if(c&&c.id===classId){
      c.started=value===true;
      syncGlobalStartedFromClasses();
      return;
    }
  }
  throw new Error('setClassStarted: unknown classId: '+classId);
}

// ROUND-CLASS-START-003 (spec §12.7): readPersistedState 返り値の normalized state から
//   当該 classId が started か判定する pure 関数。raw parsed は渡さない（必ず normalize 済を渡す）。
function classStartedInPersisted(persisted,classId){
  if(!persisted||!Array.isArray(persisted.classes))return false;
  for(var i=0;i<persisted.classes.length;i++){
    var c=persisted.classes[i];
    if(c&&c.id===classId)return c.started===true;
  }
  return false;
}

// ============================================================
// STORAGE: localStorageへの保存と復元(旧版キーからの移行込み)
// ============================================================

// SAVE-UX-QUOTA-HANDLING-IMPL: QuotaExceededError 判定。
//   ブラウザ間の差異を吸収:
//     - Chrome / Edge / Safari / WebKit: name === 'QuotaExceededError' / code === 22
//     - Firefox 旧版:                    name === 'NS_ERROR_DOM_QUOTA_REACHED' / code === 1014
//   false negative を減らすため name / code を OR で判定。
//   詳細: docs/notes/20260514_shogi_save_ux_quota_inventory.md §5.3
function isQuotaExceededError(e){
  if(!e)return false;
  return (
    e.name==='QuotaExceededError'||
    e.name==='NS_ERROR_DOM_QUOTA_REACHED'||
    e.code===22||
    e.code===1014
  );
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){
    // SAVE-UX-QUOTA-HANDLING-IMPL: quota の場合は storage-quota 系統に分岐。
    //   alert は容量問題を user に確実に認知させるため維持。
    //   notifySaveWarning が showMsg('warn') / console.warn / indicator count +1 を担当する。
    //   既存 notifyError 経路は quota 以外の汎用例外用に維持（重複 showMsg を避けるため quota では呼ばない）。
    if(isQuotaExceededError(e)){
      alert('保存容量の上限に達しました。データ整理が必要です。');
      notifySaveWarning({
        message:'保存容量の上限に達しました。データ整理が必要です。',
        consoleTag:'[STORAGE-QUOTA] save() setItem failed (name='+(e&&e.name)+', code='+(e&&e.code)+')',
        callsiteId:'STORAGE-QUOTA:save',
        kind:'storage-quota',
        aggregateKey:'storage-quota:global',
        severity:'warn'
      });
      return;
    }
    // SAVE-NONQUOTA-ALERT (Issue #278): 非quota の保存失敗（循環参照による JSON.stringify の TypeError /
    //   SecurityError / プライベートブラウズ等）はデータ消失に直結するため、登録タブ表示中でも blocking alert を
    //   確実に出す（quota 分岐と認知強度を揃える）。banner（showMsg）と dedup は notifyError が担当（二重 alert なし）。
    notifyError('保存に失敗しました。容量超過か、プライベートブラウズの可能性があります。大会データをコピー（バックアップ）してください。',true);
  }
}
function load(){
  // 現行キー → 旧キーの順に試行。各 key は parse 失敗時に次の key にフォールバック。
  // SAVE-UX-STATE-RESTORE-HANDLING-IMPL-LIGHT (§25):
  //   破損起源（getItem 例外 or JSON.parse 失敗）が 1 回以上発生し、かつ state 復元に失敗した
  //   場合のみ PARSE-LOAD-003 warn を出す。初回起動（全 key が null）では warn しない（regression 防止）。
  //   PARSE-MASTER-003 と metadata は並列だが timing は非対称（PARSE-LOAD-003 は boot 時、
  //   セッションごと最大 1 回。PARSE-MASTER-003 は保存ごとに発火しうる）。
  var keys=[STORAGE_KEY].concat(LEGACY_STORAGE_KEYS);
  var anyFailure=false;
  for(var i=0;i<keys.length;i++){
    var d=null;
    try{d=localStorage.getItem(keys[i]);}catch(e){anyFailure=true;continue;}
    if(!d)continue;
    try{
      state=normalizeState(JSON.parse(d));
      return;
    }catch(e){
      // この key の JSON は壊れている → 次の key を試す
      anyFailure=true;
    }
  }
  // すべての key が空 or 壊れている → 初期 state を normalize
  if(anyFailure){
    // PARSE-LOAD-003: 破損起源の全キー失敗時のみ warn。aggregation 対象外。
    notifySaveWarning({
      message:'保存データを復元できなかったため、初期状態で起動しました。',
      consoleTag:'[STORAGE-CORRUPTED] load() initial state fallback (all keys failed)',
      callsiteId:'PARSE-LOAD-003',
      kind:'storage-corrupted',
      aggregateKey:'storage-corrupted:state',
      severity:'warn'
    });
  }
  state=normalizeState(state);
}

// BRANCH MASTER (支部マスタ) — Phase A-1
//   localStorage キー: shogi_branch_master（既存 state とは別管理）

var BRANCH_MASTER_KEY='shogi_branch_master';
var BRANCH_MASTER_SCHEMA_VERSION=1;
// 仕様書 v6 §3.7 / Codex Minor #2: 同一セッション内で crypto 不在通知を1度だけ出すためのフラグ
var _phaseA2State={cryptoNotificationShown:false};

// A-4 §3.4.1: マスタタブの「削除済みを表示」トグル状態（タブ切替で保持）
var _masterShowDeleted=false;

function createEmptyBranchMaster(){
  return {schema_version:BRANCH_MASTER_SCHEMA_VERSION,updated_at:new Date().toISOString(),members:[]};
}

function isValidYmd(s){
  // 仕様書 v5 §3.5 / Codex Minor: 形式チェックに加え Date オブジェクトで実在検証
  if(typeof s!=='string')return false;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var d=new Date(s+'T00:00:00Z');
  if(isNaN(d.getTime()))return false;
  // toISOString が同じ日付を返すか（例: '2026-02-30' は '2026-03-02' に補正される）
  return d.toISOString().slice(0,10)===s;
}

function todayYmd(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

// REPORT-UX-001: <input type="date"> に流し込む YYYY-MM-DD（local date、UTC 換算なし）。
//   `new Date().toISOString().slice(0,10)` は UTC 換算で日本時間の深夜帯にズレるため使わない。
function formatLocalDateForInput(d){
  if(!(d instanceof Date)||isNaN(d.getTime()))return '';
  var y=d.getFullYear();
  var m=('0'+(d.getMonth()+1)).slice(-2);
  var day=('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+day;
}

// REPORT-UX-001 (Codex Must Fix 1):
//   `<input type="date">` の value 用に正規化する pure helper。
//   - "YYYY-MM-DD" はそのまま
//   - "YYYY年M月D日" / "YYYY年MM月DD日" は "YYYY-MM-DD" に変換（zero-padding）
//   - 不正値・空値は '' を返す（input.value='' なら placeholder UI 表示、defaults helper が補完）
//   旧保存形式（v0 以前のテキスト入力時代）の互換維持。
function normalizeReportDateForInput(value){
  if(typeof value!=='string'||!value)return '';
  // 新 ISO 形式
  var iso=value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso)return iso[1]+'-'+iso[2]+'-'+iso[3];
  // 旧和暦風 "YYYY年M月D日" / "YYYY年MM月DD日"
  var ja=value.match(/^(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日$/);
  if(ja)return ja[1]+'-'+('0'+ja[2]).slice(-2)+'-'+('0'+ja[3]).slice(-2);
  return '';
}

// REPORT-UX-001 (Codex Must Fix 1):
//   `<input type="time">` の value 用に正規化する pure helper。
//   - "HH:MM" / "H:MM" は HH:MM（zero-padding）
//   - "HH時MM分" / "H時MM分" は HH:MM に変換
//   - 不正値・空値は '' を返す
//   旧保存形式（テキスト入力時代）の互換維持。
function normalizeReportTimeForInput(value){
  if(typeof value!=='string'||!value)return '';
  // 新 HH:MM / H:MM
  var hm=value.match(/^(\d{1,2}):(\d{2})$/);
  if(hm){
    var h=parseInt(hm[1],10), mm=hm[2];
    if(h<0||h>23)return '';
    var mmNum=parseInt(mm,10);
    if(mmNum<0||mmNum>59)return '';
    return ('0'+h).slice(-2)+':'+mm;
  }
  // 旧 "HH時MM分" / "H時MM分"
  var ja=value.match(/^(\d{1,2})時\s*(\d{1,2})分$/);
  if(ja){
    var h2=parseInt(ja[1],10), m2=parseInt(ja[2],10);
    if(h2<0||h2>23)return '';
    if(m2<0||m2>59)return '';
    return ('0'+h2).slice(-2)+':'+('0'+m2).slice(-2);
  }
  return '';
}

// REPORT-UX-001: 報告書印刷用に YYYY-MM-DD を「YYYY年M月D日」表記に変換する pure helper。
//   旧テキスト入力時代の見た目（運営者向け和暦風表記）を保つため。
//   不正値はそのまま返す（落ちない / 既存値が見える）。
function formatJapaneseDateFromYmd(ymd){
  if(typeof ymd!=='string')return '';
  var m=ymd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return ymd;
  return m[1]+'年'+String(parseInt(m[2],10))+'月'+String(parseInt(m[3],10))+'日';
}

// REPORT-UX-001: 報告書印刷用に HH:MM を「HH時MM分」表記に変換する pure helper。
//   旧テキスト入力時代の見た目を保つため。
//   不正値はそのまま返す。
function formatJapaneseTimeFromHhmm(hm){
  if(typeof hm!=='string')return '';
  var m=hm.match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return hm;
  return String(parseInt(m[1],10))+'時'+m[2]+'分';
}

// ============================================================
// REPORT-FIELD-NORMALIZE (Phase B-1 集約 / #285):
//   下の normalizeReportTitle / Organizer / Fax / OfficeName / AccountingNote /
//   Place / Sei / Fuku / Note / Prize は、いずれも「文字列を trim し、空なら既定値へ
//   fallback」（title は末尾「報告書」除去、prize は数値 0 以上のみ採用）という同型処理。
//   これを 1 つの汎用関数 normalizeReportField(value, key) ＋ 設定テーブル
//   REPORT_FIELD_SPECS に集約する。各 normalizeReportX(value) は本テーブルを引く薄い
//   ラッパーへ退避し、入力・出力は従来と 1 バイトも変わらない（動作を変えない純リファクタ）。
//   各フィールド個別の詳細仕様は、従来どおり各ラッパー直前のコメントを参照。
//
//   spec のキー:
//     def        … 既定値（fallback）。
//     stripSuffix… title 専用。trim 後に末尾「報告書」を 1 回だけ除去し、trailing 空白を再 trim。
//     numeric    … prize 専用。0 以上の有限数のみ採用し、他（NaN/Infinity/負数/非数値）は def(=7000)。
//   string フィールド共通: 文字列なら trim し、結果が非空ならそれを、空 / 非文字列は def を返す。
//   （帳票表示は呼出側 downloadReport 等で escapeHtml されるため本 helper では sanitize しない）
// ============================================================
var REPORT_FIELD_SPECS={
  title:{def:'沼津支部月例将棋大会', stripSuffix:true},
  organizer:{def:'日本将棋連盟沼津支部'},
  fax:{def:'943-9443'},
  officeName:{def:'沼津支部事務局'},
  accountingNote:{def:'※役員会で会計長へ収支報告書として提出ください。'},
  place:{def:'労政会館'},
  sei:{def:''},
  fuku:{def:''},
  note:{def:''},
  prize:{def:7000, numeric:true}
};
function normalizeReportField(value, key){
  var spec=REPORT_FIELD_SPECS[key]||{def:''};
  if(spec.numeric){
    // prize: 0 以上の有限数値のみ採用（0 は有効値・Number(value)||def は使わない）。
    if(typeof value==='number'){
      if(isFinite(value)&&value>=0)return value;
      return spec.def;
    }
    if(typeof value==='string'){
      var nt=value.trim();
      if(nt==='')return spec.def;
      var n=Number(nt);
      if(isFinite(n)&&n>=0)return n;
    }
    return spec.def;
  }
  if(typeof value==='string'){
    var trimmed=value.trim();
    if(spec.stripSuffix&&trimmed.length>=3&&trimmed.slice(-3)==='報告書'){
      trimmed=trimmed.slice(0,-3).replace(/[\s　]+$/,'');
    }
    if(trimmed!=='')return trimmed;
  }
  return spec.def;
}

//
//   変換ルール:
//     1. name が「英字1文字 + 'クラス'」(例 Sクラス/Aクラス/Bクラス) → 「英字1文字 + '級'」 (S級/A級/B級)
//     2. name が「英字1文字 + '級'」 (例 S級/A級) → そのまま（二重変換しない）
//     3. それ以外のカスタム名（小学生/初心者/一般/上級/子ども大会 等） → そのまま尊重
//     4. name が空文字 / 不正値の場合は c.id+'クラス' fallback、c.id も無ければ '' を返す
//
//   pure / 副作用なし。escapeHtml は呼出側 (rankRow) で必ず通すこと（XSS 安全性は label 経路で担保）。
function getReportClassLabel(c){
  if(!c)return '';
  var name=(c.name&&typeof c.name==='string')?c.name:'';
  var idFallback=(typeof c.id==='string'&&c.id)?(c.id+'クラス'):'';
  if(!name)return idFallback;
  // ルール 2: 既に「英字1文字 + 級」なら二重変換しない
  if(/^[A-Z]級$/.test(name))return name;
  // ルール 1: 「英字1文字 + クラス」を「英字1文字 + 級」に変換
  var m=name.match(/^([A-Z])クラス$/);
  if(m)return m[1]+'級';
  // ルール 3: カスタム名はそのまま
  return name;
}

// REPORT-UX-001: 未入力の開催日 / 開始時間 / 終了時間に既定値を補完する idempotent helper。
//   - rep-date が空 → 今日（local date）
//   - rep-start が空 → 13:00
//   - rep-end が空 → 17:00
//   既に値があるフィールドは何もしない（タブ切替や再 init で上書きしない契約）。
//   state.report の値は populateReportFields が input.value にコピーした「後」に呼ぶ前提。
//   helper 内で state.report も同期更新する（保存忘れ防止）。
function ensureReportDateTimeDefaults(){
  if(!state.report)state.report={date:'',place:'労政会館',start:'',end:'',sei:'',fuku:'',note:'',prize:7000,title:'沼津支部月例将棋大会',organizer:'日本将棋連盟沼津支部',fax:'943-9443',officeName:'沼津支部事務局',accountingNote:'※役員会で会計長へ収支報告書として提出ください。'};
  var pairs=[
    {key:'date', defaultFn:function(){return formatLocalDateForInput(new Date());}},
    {key:'start',defaultFn:function(){return '13:00';}},
    {key:'end',  defaultFn:function(){return '17:00';}}
  ];
  for(var i=0;i<pairs.length;i++){
    var k=pairs[i].key;
    var el=document.getElementById('rep-'+k);
    if(!el)continue;
    if(el.value)continue;  // 既存値あり → 触らない
    var def=pairs[i].defaultFn();
    el.value=def;
    state.report[k]=def;
  }
}

// REPORT-UX-001: 終了時間が開始時間以前の場合に軽い警告を表示する。
//   ブロックはしない（現場運用で例外があり得る）。表示専用の #rep-time-warning に文言出力。
//   start/end どちらかが空 / 不正な場合は警告非表示（消す）。
function checkReportTimeOrder(){
  var startEl=document.getElementById('rep-start');
  var endEl=document.getElementById('rep-end');
  var warnEl=document.getElementById('rep-time-warning');
  if(!warnEl)return;
  var startVal=(startEl&&startEl.value)||'';
  var endVal=(endEl&&endEl.value)||'';
  var ok=/^\d{1,2}:\d{2}$/.test(startVal)&&/^\d{1,2}:\d{2}$/.test(endVal);
  if(ok&&endVal<=startVal){
    warnEl.textContent='終了時間が開始時間以前になっています。確認してください。';
    warnEl.style.display='block';
  } else {
    warnEl.textContent='';
    warnEl.style.display='none';
  }
}

function generateMemberId(master){
  // 仕様書 v5 §3.3 / Codex MF #4: crypto.randomUUID 不在時は明示 throw。
  // 旧実装は raw='' で 'm_' だけの不正 ID を保存していた。スマホ運用前提のため
  // サイレントフォールバックではなくエラーで気付ける設計とする。
  if(typeof crypto==='undefined'||!crypto.randomUUID){
    throw new Error('crypto.randomUUID が利用不可な環境です。古い iOS Safari 等の場合、ブラウザを更新してください。');
  }
  for(var i=0;i<3;i++){
    // 必ず replace(/-/g,'') を先に行う（slice 先行だとハイフンが残る危険）
    var id='m_'+crypto.randomUUID().replace(/-/g,'').slice(0,12);
    var dup=false;
    if(master&&Array.isArray(master.members)){
      for(var j=0;j<master.members.length;j++){
        if(master.members[j]&&master.members[j].id===id){dup=true;break;}
      }
    }
    if(!dup)return id;
  }
  throw new Error('member_id 生成に3回連続で失敗。マスタが異常です。');
}

function normalizePersonName(name){
  if(typeof name!=='string')return '';
  // 仕様書 3.4.4: 全角空白→半角空白、連続空白を単一空白、前後空白除去
  return name.replace(/　/g,' ').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
}

// 仕様書 v6 §3.4: ふりがな正規化（A-2 ふりがな3点セット用）
// - カタカナ → ひらがな統一（[ァ-ヶ] = U+30A1〜U+30F6 を 0x60 減算）
// - 前後空白除去 + 途中の半角・全角空白も削除（ふりがな用途のため）
// - 長音符（ー）/ 小書き文字は保持
// - 半角カナ（U+FF66-FF9F）は A-2 非対応（変換せず → getYomiInitialRow で other 扱い）
// - undefined / null / 非文字列でも安全（ChatGPT D 反映）
function normalizeYomi(yomi){
  if(typeof yomi!=='string')return '';
  return yomi
    .replace(/^\s+|\s+$/g,'')
    .replace(/[ァ-ヶ]/g,function(m){return String.fromCharCode(m.charCodeAt(0)-0x60);})
    .replace(/[\s　]/g,'');
}

// 仕様書 v6 §3.5: 50音タブ用の行判定
// 入力は normalizeYomi 済み前提（ひらがな正規化済み）
// 12分類: a / ka / sa / ta / na / ha / ma / ya / ra / wa / other
// - 濁音・半濁音は同行（が→か行、ぱ→は行）
// - 小書き文字も同行（ぁ→あ行、ょ→や行、っ→た行）
// - ゔ（ヴ由来）/ ゕ（ヵ由来）/ ゖ（ヶ由来）/ 半角カナ / 数字 / 記号 / 先頭長音符はすべて other
function getYomiInitialRow(yomi){
  if(!yomi)return 'other';
  var first=yomi.charAt(0);
  if('あいうえおぁぃぅぇぉ'.indexOf(first)>=0)return 'a';
  if('かきくけこがぎぐげご'.indexOf(first)>=0)return 'ka';
  if('さしすせそざじずぜぞ'.indexOf(first)>=0)return 'sa';
  if('たちつてとだぢづでどっ'.indexOf(first)>=0)return 'ta';
  if('なにぬねの'.indexOf(first)>=0)return 'na';
  if('はひふへほばびぶべぼぱぴぷぺぽ'.indexOf(first)>=0)return 'ha';
  if('まみむめも'.indexOf(first)>=0)return 'ma';
  if('やゆよゃゅょ'.indexOf(first)>=0)return 'ya';
  if('らりるれろ'.indexOf(first)>=0)return 'ra';
  if('わをん'.indexOf(first)>=0)return 'wa';
  return 'other';
}
