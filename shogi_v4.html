// ============================================================
// LIVE-MOBILE-SCOREBOARD-001 §3/§4 PDF 出力ファイル名 / PDF 内タイトル共通 helper
//   各 PDF 出力箇所が個別にファイル名・見出しを組み立てない。state.report を SoT として
//   「YYYY年M月度{大会名}{種別}」形式の安全なファイル名と、対象月/開催日を含む見出しを生成する。
//   - 対象月: 今回はデータ構造を増やさず state.report.date（開催日）の年月から導出する。
//     対象月を独立フィールドとして持つ恒久対応は docs/notes の設計メモ §7 参照。
//   - 開催日: state.report.date を「YYYY年M月D日」表記に変換する。
//   - ファイル名に使えない文字は安全に除去/置換する。未入力項目があっても破綻しない。
// ============================================================

// ファイル名の 1 パーツをサニタイズ: OS でファイル名に使えない文字・制御文字・空白を除去する。
function sanitizeFilenamePart(value){
  return String(value==null?'':value)
    .replace(/[\\/:*?"<>|]/g,'')      // Windows / macOS で禁止される文字
    .replace(/[\x00-\x1f\x7f]/g,'')    // 制御文字
    .replace(/[\s　]+/g,'')        // 半角/全角スペースは詰める（配布ファイル名を素直にする）
    .replace(/^\.+/,'')                // 先頭ドット（隠しファイル化）を防ぐ
    .trim();
}

// パーツ配列を結合して拡張子なしの安全なファイル名（基底名）を返す。空パーツはスキップ。
//   全パーツが空でも壊れないよう既定値 '将棋大会' に fallback する。
function buildSafePdfFilename(parts,sep){
  // sep: トークン区切り（既定 '' で後方互換）。SHOGI-TOUR-PDF-FILENAME-MVP-001 では '_' を渡す。
  var joiner=(typeof sep==='string')?sep:'';
  var safe=[];
  if(Object.prototype.toString.call(parts)==='[object Array]'){
    for(var i=0;i<parts.length;i++){
      var p=sanitizeFilenamePart(parts[i]);
      if(p)safe.push(p);
    }
  }
  var name=safe.join(joiner);
  return name||'将棋大会';
}

// 対象月ラベル「YYYY年M月度」。state.report.date（開催日）の年月から導出。日付未入力時は ''。
function buildTournamentTargetMonthLabel(){
  var raw=(typeof normalizeReportDateForInput==='function')?normalizeReportDateForInput(state.report&&state.report.date):'';
  var mm=raw&&raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!mm)return '';
  return mm[1]+'年'+String(parseInt(mm[2],10))+'月度';
}

// 開催日ラベル「YYYY年M月D日」。日付未入力時は ''。
function buildTournamentHeldDateLabel(){
  var raw=(typeof normalizeReportDateForInput==='function')?normalizeReportDateForInput(state.report&&state.report.date):'';
  return raw?formatJapaneseDateFromYmd(raw):'';
}

// SHOGI-TOUR-PDF-FILENAME-MVP-001: 開催日コンパクト表記「YYYYMMDD」。
//   state.report.date（normalizeReportDateForInput 通過済の YYYY-MM-DD）からハイフンを除去する。
//   日付未入力／不正値時は '' を返し、ファイル名側で日付トークンを省略できるようにする。
function buildTournamentHeldDateCompact(){
  var raw=(typeof normalizeReportDateForInput==='function')?normalizeReportDateForInput(state.report&&state.report.date):'';
  var mm=raw&&raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!mm)return '';
  return mm[1]+mm[2]+mm[3];
}

// PDF 保存時の推奨ファイル名（拡張子なしの基底名）を種別ごとに生成する。
//   形式: {YYYYMMDD}_{大会名}[_{クラス名}]_{種別}
//     例: 20260614_沼津支部月例将棋大会_Aクラス_対戦成績 / 20260614_沼津支部月例将棋大会_報告書
//   SHOGI-TOUR-PDF-FILENAME-MVP-001（運用者の明示要望）:
//     後から運営記録・過去大会履歴と突き合わせやすいよう、開催日(8桁)・大会名・クラス名・種別を
//     アンダースコア区切りで並べる。これは LIVE-MOBILE-SCOREBOARD-001(PR #204) の
//     「{YYYY年M月度}{大会名}{種別}」形式を意図的に置き換えるもの。
//   現行 PDF 出力は全経路（printResults / printPairings / downloadReport）が
//   Blob(text/html) + window.open() + win.print() 方式であり、生成物は HTML である。
//   利用者がブラウザの印刷ダイアログで「PDF に保存」を選ぶと、ブラウザは <title> を
//   ファイル名候補として提示し、「.pdf」拡張子はブラウザ側のPDF保存動作で付与される。
//   そのため「.pdf 拡張子」をアプリのコードで保証することはできない（ブラウザ依存）。
//   よってここでは拡張子を付けない安全な基底名のみを返す
//   （title に '.pdf' を埋めると環境により二重拡張子等になり得るため付与しない）。
//   未設定時の fallback:
//     - 開催日が空／不正値なら日付トークンを省略（大会名から始まる）。
//     - className は「出力が単一クラスを特定できる」場合のみ呼び出し側が渡す。多クラス一括出力や
//       大会全体の帳票（報告書）では省略（undefined）し、クラストークンを付けない。
//     - 全トークンが空でも buildSafePdfFilename が '将棋大会' に fallback する。
//   危険文字（OS 禁止文字 / パス区切り / 制御文字 / 前後空白）は sanitizeFilenamePart で除去済み。
function buildTournamentPdfFilename(kind,className){
  var title=(typeof normalizeReportTitle==='function')?normalizeReportTitle(state.report&&state.report.title):'沼津支部月例将棋大会';
  return buildSafePdfFilename([buildTournamentHeldDateCompact(),title,className,kind],'_');
}

// PDF 帳票の見出し HTML（大会名 / 種別 / 対象月 / 開催日）。印刷・配布時に単体で意味が通るようにする。
//   未入力（対象月・開催日が空）でも崩れないよう、存在する項目だけを表示する。すべて escapeHtml 済み。
function buildPdfDocHeaderHtml(kindLabel){
  var title=(typeof normalizeReportTitle==='function')?normalizeReportTitle(state.report&&state.report.title):'沼津支部月例将棋大会';
  var monthLabel=buildTournamentTargetMonthLabel();
  var heldLabel=buildTournamentHeldDateLabel();
  var metaParts=[];
  if(monthLabel)metaParts.push('対象月：'+monthLabel);
  if(heldLabel)metaParts.push('開催日：'+heldLabel);
  var titleLine=title+(kindLabel?('　'+kindLabel):'');
  var metaHtml=metaParts.length?'<div class="doc-meta">'+escapeHtml(metaParts.join('　／　'))+'</div>':'';
  return '<header class="doc-header"><div class="doc-title">'+escapeHtml(titleLine)+'</div>'+metaHtml+'</header>';
}

// REFACTOR B-5a (#298): printResults の HTML 生成部を副作用なしの builder として抽出。
//   旧 printResults の「var html 完成まで」を逐語移動し return html。printResults 側は
//   builder 呼出＋Blob/open/print の薄い wrapper に縮約（挙動完全同値）。builder は現行どおり
//   global state / 既存 helper（calcFinal/computeDisplayRanks/buildPdfDocHeaderHtml/
//   buildTournamentPdfFilename 等）を直読みする（side-effect-free だが厳密 pure ではない）。
//   出力 byte 一致は test/test_print_results_characterization_001.js が固定する。
function buildPrintResultsHtml(){
  // ROUND-CLASS-START-007 (spec §15.1):
  //   印刷帳票を state.classes 駆動で組み立てる（A/B 固定 literal 解消）。
  //   getRegistrationClassList() を使い、renderRegList / calcTotal と同じ source of truth に揃える。
  //   classId は isSafeClassId() で id-safe 保証済み。3 クラス以上でも自然に表示される。
  //   既存 A/B 印刷結果は前と変わらない（class 数=2、順序 A→B のまま）。
  var classes=getRegistrationClassList();
  // 各クラスの wins 集計を classId-keyed dict に蓄積
  var winsByClass={};
  for(var wi=0;wi<classes.length;wi++){
    var wc=classes[wi]; if(!wc||!isSafeClassId(wc.id))continue;
    var wid=wc.id;
    var w={};
    var wplayers=(state.players&&state.players[wid])||[];
    wplayers.forEach(function(p){w[p.id]=0;});
    var wresults=(state.results&&state.results[wid])||[];
    wresults.forEach(function(r){r.forEach(function(m){if(m.winner)w[m.winner]=(w[m.winner]||0)+1;});});
    winsByClass[wid]=w;
  }

  function buildTable(cls,wins){
    var finals=calcFinal(cls);
    if(finals.length===0)return '';
    // class 表示名: state.classes の name を優先（Aクラス / Bクラス / Cクラス 等）
    var className=cls+'クラス';
    for(var i=0;i<classes.length;i++){
      if(classes[i]&&classes[i].id===cls&&classes[i].name){className=classes[i].name;break;}
    }
    var html='<div style="margin:16px 0 0">';
    html+='<div style="font-size:15px;font-weight:bold;color:#1F3864;margin-bottom:4px">'+escapeHtml(className)+'</div>';
    html+='<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px">';
    html+='<thead><tr style="background:#e8f0f8"><th style="padding:6px 8px;border:1px solid #ccc;text-align:center">順位</th><th style="padding:6px 8px;border:1px solid #ccc;text-align:left">氏名</th>';
    for(var r=1;r<=state.rounds;r++)html+='<th style="padding:6px 8px;border:1px solid #ccc;text-align:center">'+r+'回戦</th>';
    html+='<th style="padding:6px 8px;border:1px solid #ccc;text-align:center">勝数(A)</th>';
    html+='<th style="padding:6px 8px;border:1px solid #ccc;text-align:center">負数</th>';
    html+='<th style="padding:6px 8px;border:1px solid #ccc;text-align:center">B<br><small style="font-weight:normal;font-size:10px">対戦相手<br>勝数合計</small></th>';
    html+='<th style="padding:6px 8px;border:1px solid #ccc;text-align:center">C<br><small style="font-weight:normal;font-size:10px">勝った相手<br>勝数合計</small></th>';
    html+='</tr></thead><tbody>';
    var displayRanks=computeDisplayRanks(finals,cls);
    for(var idx=0;idx<finals.length;idx++){
      var f=finals[idx];var rank=displayRanks[idx];
      var bg=rank===1?'#fef8e7':rank===2?'#f5f5f5':rank===3?'#eaf3fb':'#fff';
      html+='<tr style="background:'+bg+'">';
      html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center;font-weight:bold">'+rank+'位</td>';
      // RANK-PRINT-001: 印刷/PDF 帳票では entry_no を表示せず氏名のみを出力する。
      //   画面 UI（buildResultsMobileHtml / buildResultsDesktopHtml）や受付・対局カード・
      //   参加者一覧では従来通り getNameWithNo を使用し本変更の影響を受けない。
      html+='<td style="padding:6px 8px;border:1px solid #ccc;font-weight:bold">'+playerNameRubyHtml(getName(f.p.id,cls),yomiOf(f.p.id,cls))+'</td>';
      for(var r=0;r<state.rounds;r++){
        var round=state.results[cls][r];
        if(!round){html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center;color:#ccc">-</td>';continue;}
        var match=null;
        for(var m=0;m<round.length;m++){if(round[m].p1===f.p.id||round[m].p2===f.p.id){match=round[m];break;}}
        if(!match){html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center;color:#ccc">-</td>';continue;}
        var oppId=match.p1===f.p.id?match.p2:match.p1;
        // RANK-PRINT-001: 印刷/PDF の対戦相手表示も entry_no なしの氏名のみに変更。
        var oppName=getName(oppId,cls);
        var oppWins=wins[oppId]||0;
        var won=match.winner===f.p.id;
        var color=won?'#27500A':'#222';
        var markStr2=match.winner===null?'－':(won?'○':'●');
        html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center"><span style="font-weight:bold;color:'+color+'">'+markStr2+'</span><br><small style="color:#333">'+playerNameRubyHtml(oppName,yomiOf(oppId,cls))+'('+oppWins+')</small></td>';
      }
      html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center;font-weight:bold">'+f.A+'</td>';
      html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center">'+(f.played-f.A)+'</td>';
      html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center">'+f.B+'</td>';
      html+='<td style="padding:6px 8px;border:1px solid #ccc;text-align:center">'+f.C+'</td>';
      html+='</tr>';
    }
    html+='</tbody></table>';
    html+='<p style="font-size:10px;color:#666;margin-bottom:8px">※B：対戦相手の最終勝数合計（強い相手と多く戦った人が有利）　C：自分が勝った相手の最終勝数合計（強い相手を倒した人が有利）</p>';
    html+='</div>';
    return html;
  }

  // ROUND-CLASS-START-007 (spec §15.1):
  //   classes-driven の table 組み立て。各 class の table を生成し、空でない table のみを採用、
  //   隣接 table 間にだけ page-break を挟む（既存 B07 と同じく空白ページを挿入しない）。
  //   A/B 既存挙動（A→B 2 枚で page-break 1 回）は維持される。
  var tables=[];
  var tableClassNames=[];   // 実際に出力された（finals 非空の）クラス表示名。単一クラス時のみファイル名に使う。
  for(var ti=0;ti<classes.length;ti++){
    var tc=classes[ti]; if(!tc||!isSafeClassId(tc.id))continue;
    var tbl=buildTable(tc.id, winsByClass[tc.id]||{});
    if(tbl){tables.push(tbl);tableClassNames.push(tc.name||(tc.id+'クラス'));}
  }
  var pageBreakHtml='<div style="page-break-before:always"></div>';
  var tablesHtml=tables.join(pageBreakHtml);

  // SHOGI-TOUR-PDF-FILENAME-MVP-001: PDF 保存時のファイル名は共通 helper で
  //   「{YYYYMMDD}_{大会名}[_{クラス名}]_対戦成績」形式に統一する（buildTournamentPdfFilename）。
  //   開催日(8桁)・大会名・種別を基本トークンとし、クラス名は「この出力に 1 クラスだけ含まれる」
  //   ときのみ付与する（複数クラス一括出力では特定クラス名を付けず 日付+大会名+種別 のみ）。
  //   これは LIVE-MOBILE-SCOREBOARD-001(PR #204) の月度ベース命名を運用者要望で置き換えるもの。
  //   <title> をファイル名候補として使う印刷経路のため、拡張子なしの基底名を代入する
  //   （保存時にブラウザが .pdf を付与）。本文・レイアウトは変更しない。
  var classNameForFile=(tableClassNames.length===1)?tableClassNames[0]:'';
  var fileTitleName=buildTournamentPdfFilename('対戦成績',classNameForFile);

  // LIVE-MOBILE-SCOREBOARD-001 §4: 帳票本文に大会名 / 対象月 / 開催日 / 種別の見出しを追加し、
  //   印刷・配布時に PDF 単体で「いつ・どの大会の・何の帳票か」が分かるようにする。
  //   buildPdfDocHeaderHtml は未入力項目を安全にスキップする（崩れない）。
  var html='<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
    +'<title>'+escapeHtml(fileTitleName)+'</title>'
    +'<style>@page{size:A4;margin:10mm}'
    +'body{font-family:sans-serif;font-size:13px;padding:16px}'
    +'h2{font-size:16px;color:#1F3864;border-left:4px solid #1F3864;padding-left:10px;margin-bottom:8px}'
    +'.doc-header{border-bottom:2px solid #1F3864;padding-bottom:8px;margin-bottom:12px}'
    +'.doc-header .doc-title{font-size:19px;font-weight:bold;color:#1F3864}'
    +'.doc-header .doc-meta{font-size:13px;color:#444;margin-top:4px}'
    +'tr,td{page-break-inside:avoid}'
    // FURIGANA-VIEW-002: 印刷時に <rt> が潰れない最小CSS（氏名より小さく行高を詰める）。
    +'ruby{ruby-position:over}rt{font-size:.6em;font-weight:normal;color:#333;line-height:1}'
    +'@media print{body{padding:0}.no-print{display:none}}</style>'
    +'</head><body>'
    +buildPdfDocHeaderHtml('対戦成績')
    +'<h2>スイス式トーナメント　対戦成績</h2>'
    +tablesHtml
    +'</body></html>';
  return html;
}

// printResults: buildPrintResultsHtml() の出力を Blob 化し別タブで開いて印刷する薄い wrapper。
//   副作用のみ（MIME text/html;charset=utf-8 / window.open(url,'_blank') / load→afterprint→print
//   の登録順 / win.print() / revokeObjectURL のタイミング / alert 文言）は現行どおり不変。
function printResults(){
  // QA D-03（#279）: 印刷対象（finals 非空のクラス）が 0 件のときは空帳票を開かず alert して return。
  //   従来は全クラス空でもヘッダのみの空 HTML を window.open していた（printPairings は alert 済で非一貫）。
  //   判定は buildPrintResultsHtml の buildTable と同じ calcFinal(cls).length>0 を用いる（state-as-SoT）。
  var prClasses=(typeof getRegistrationClassList==='function')?getRegistrationClassList():[];
  var prHasPrintable=false;
  for(var pri=0;pri<prClasses.length;pri++){
    var prc=prClasses[pri];
    if(!prc||(typeof isSafeClassId==='function'&&!isSafeClassId(prc.id)))continue;
    if(calcFinal(prc.id).length>0){prHasPrintable=true;break;}
  }
  if(!prHasPrintable){
    alert('印刷できる対戦成績がありません。\n参加者を登録し、大会を開始してから実行してください。');
    return;
  }
  var html=buildPrintResultsHtml();
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var win=window.open(url,'_blank');
  if(!win){URL.revokeObjectURL(url);alert('ポップアップがブロックされています。ブラウザの設定でポップアップを許可してください。');return;}
  win.focus();
  // B05: setTimeout(800) → load イベント、B08: 印刷後に afterprint で win.close()
  win.addEventListener('load',function(){
    win.addEventListener('afterprint',function(){win.close();});
    win.print();
  });
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}

// REPORT-PRINT-003: 全クラスの現ラウンド組み合わせを印刷専用 HTML として出力する。
//   downloadReport() / printResults() と同じ Blob + window.open + win.print() 方式を踏襲。
//   state-as-SoT: 画面 DOM (.pairing-card) は読まず、state.pairings / state.players /
//   state.results / state.classes から印刷用 HTML を組み立てる（DOM 直読み禁止）。
//   classes-driven: getRegistrationClassList() で全クラスを走査し、A/B 固定 literal を避ける。
//   印刷対象クラスの条件: isClassStarted(cls) かつ done でなく state.pairings[cls].length>0。
//   全クラスに印刷対象がない場合は alert で通知して return（空 HTML を開かない）。
//   出力内容: 大会名 / 日付 / クラス名 / ラウンド番号 / 第 N 卓 / entry_no｜氏名 / vs。
//   含めないもの: 勝敗入力 / 変更 / ▲勝 / submit/repair ボタン / class-action-bar /
//     暫定成績 / 対戦履歴 / 過去結果 / 結果記入欄 / 市町村など個人情報。
function printPairings(){
  var classes=(typeof getRegistrationClassList==='function')?getRegistrationClassList():[];
  // 印刷対象のクラスとそのペア配列を事前収集（state.pairings / state.results を参照）。
  //   - 未開始 (isClassStarted=false) → skip（開始前に印刷物を出す価値なし）
  //   - 全ラウンド消化済 (results.length >= rounds) → skip（done の class は新規ペアなし）
  //   - 現ラウンドペア無し (pairings[cls].length===0) → skip
  var printable=[];
  for(var pci=0;pci<classes.length;pci++){
    var pcc=classes[pci];
    if(!pcc||(typeof isSafeClassId==='function'&&!isSafeClassId(pcc.id)))continue;
    var pccid=pcc.id;
    if(typeof isClassStarted==='function'&&!isClassStarted(pccid))continue;
    var pccResults=(state.results&&Array.isArray(state.results[pccid]))?state.results[pccid]:[];
    var pccRounds=Number(state.rounds)||0;
    if(pccRounds>0&&pccResults.length>=pccRounds)continue;
    var pccPairings=(state.pairings&&Array.isArray(state.pairings[pccid]))?state.pairings[pccid]:[];
    if(pccPairings.length===0)continue;
    printable.push({id:pccid,name:pcc.name||(pccid+'クラス'),roundNum:pccResults.length+1,pairs:pccPairings});
  }
  if(printable.length===0){
    alert('現在印刷できる組み合わせがありません。\n大会を開始し、組み合わせが生成されてから実行してください。');
    return;
  }

  // 大会名 / 日付は state.report SoT 経由で取得（normalize helper を必ず通す）。
  //   日付は YYYY-MM-DD → 「YYYY年M月D日」表記に変換、未入力時は空文字で扱う。
  var reportTitle=(typeof normalizeReportTitle==='function')?normalizeReportTitle(state.report&&state.report.title):'沼津支部月例将棋大会';
  var dateRaw=(typeof normalizeReportDateForInput==='function')?normalizeReportDateForInput(state.report&&state.report.date):'';
  var dateDisplay=dateRaw&&typeof formatJapaneseDateFromYmd==='function'?formatJapaneseDateFromYmd(dateRaw):'';

  // SHOGI-TOUR-PDF-FILENAME-MVP-001: ファイル名は共通 helper で
  //   「{YYYYMMDD}_{大会名}[_{クラス名}]_組み合わせ」に統一する。
  //   印刷対象が 1 クラスだけのときはそのクラス名を付与し、複数クラス時は付けない。
  //   （PR #204 の月度ベース命名を運用者要望で置き換え。本文・レイアウトは不変。）
  var pairingClassName=(printable.length===1)?printable[0].name:'';
  var fileTitleName=buildTournamentPdfFilename('組み合わせ',pairingClassName);

  // 各クラスごとに section を組み立て、class 間に page-break を入れる（複数クラスでも 1 クラス=1 ページ目安）。
  //   card は CSS grid で 1 ページ複数カード、page-break-inside:avoid でカード途中での改ページを避ける。
  function buildClassSection(cl){
    var sec='<section class="cls-section">'
      +'<h2 class="cls-h">'+escapeHtml(cl.name)+' — '+cl.roundNum+'回戦</h2>'
      +'<div class="cards">';
    for(var i=0;i<cl.pairs.length;i++){
      var m=cl.pairs[i];
      // FURIGANA-VIEW-002: 組み合わせ印刷の氏名にルビ（番号は素のまま・氏名のみルビ）。
      //   nameWithNoRubyHtml は escape 済み HTML を返すため、ここで再 escape せず直挿しする。
      sec+='<div class="card">'
        +'<div class="card-no">第 '+(i+1)+' 卓</div>'
        +'<div class="card-body">'
        +'<div class="card-player">'+nameWithNoRubyHtml(m.p1,cl.id)+'</div>'
        +'<div class="card-vs">vs</div>'
        +'<div class="card-player">'+nameWithNoRubyHtml(m.p2,cl.id)+'</div>'
        +'</div>'
        +'</div>';
    }
    sec+='</div></section>';
    return sec;
  }
  var sectionsHtml=printable.map(buildClassSection).join('<div class="cls-pagebreak"></div>');

  // LIVE-MOBILE-SCOREBOARD-001 §4: 見出しに対象月と開催日を併記し、配布時に PDF 単体で意味が通るようにする。
  var headerLeft=escapeHtml(reportTitle);
  var sbMonthLabel=buildTournamentTargetMonthLabel();
  var headerMetaParts=[];
  if(sbMonthLabel)headerMetaParts.push('対象月：'+sbMonthLabel);
  if(dateDisplay)headerMetaParts.push('開催日：'+dateDisplay);
  var headerRight=headerMetaParts.length?escapeHtml(headerMetaParts.join('　／　')):'';
  var html='<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
    +'<title>'+escapeHtml(fileTitleName)+'</title>'
    +'<style>@page{size:A4;margin:10mm}'
    +'body{font-family:sans-serif;font-size:13px;padding:16px;color:#222}'
    +'.doc-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1F3864;padding-bottom:6px;margin-bottom:12px}'
    +'.doc-title{font-size:18px;font-weight:bold;color:#1F3864}'
    +'.doc-date{font-size:13px;color:#444}'
    +'.doc-sub{font-size:14px;color:#444;margin-bottom:12px}'
    +'.cls-section{margin-bottom:16px}'
    +'.cls-h{font-size:15px;font-weight:bold;color:#1F3864;border-left:4px solid #1F3864;padding-left:10px;margin:0 0 8px}'
    +'.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}'
    +'.card{border:1px solid #888;border-radius:6px;padding:10px 12px;page-break-inside:avoid;break-inside:avoid;position:relative}'
    +'.card-no{position:absolute;top:6px;left:6px;background:#1F3864;color:#fff;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:4px}'
    +'.card-body{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}'
    +'.card-player{font-size:14px;font-weight:bold;color:#222;text-align:center;flex:1;word-break:break-word}'
    // FURIGANA-VIEW-002: 組み合わせカードの氏名ルビ（印刷時に <rt> が潰れない最小CSS）。
    +'.card-player ruby{ruby-position:over}.card-player rt{font-size:.55em;font-weight:normal;color:#333;line-height:1}'
    +'.card-vs{font-size:12px;color:#888;font-weight:500}'
    +'.cls-pagebreak{page-break-before:always;break-before:page}'
    +'@media print{body{padding:0}}</style></head><body>'
    +'<div class="doc-head"><div class="doc-title">'+headerLeft+'</div>'
    +(headerRight?'<div class="doc-date">'+headerRight+'</div>':'')
    +'</div>'
    +'<div class="doc-sub">現在の組み合わせ</div>'
    +sectionsHtml
    +'</body></html>';

  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var win=window.open(url,'_blank');
  if(!win){URL.revokeObjectURL(url);alert('ポップアップがブロックされています。ブラウザの設定でポップアップを許可してください。');return;}
  win.focus();
  // downloadReport/printResults と同じ load → print → afterprint→close パターン。
  win.addEventListener('load',function(){
    win.addEventListener('afterprint',function(){win.close();});
    win.print();
  });
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}

function getTopPlayers(cls){
  var finals=calcFinal(cls);
  var result=[];
  for(var i=0;i<Math.min(3,finals.length);i++){
    // FURIGANA-VIEW-002: 報告書の入賞者ルビ用に yomi も持たせる（空は ''）。rank/name は不変。
    result.push({rank:i+1,name:finals[i].p.name,yomi:(typeof finals[i].p.yomi==='string')?finals[i].p.yomi:''});
  }
  return result;
}

// REFACTOR B-5b (#300): downloadReport の HTML 生成部を副作用なしの builder として抽出。
//   旧 downloadReport の「var html 完成（末尾の <title> html.replace 差し替えを含む最終形）まで」を
//   逐語移動し return html。downloadReport 側は builder 呼出＋Blob/open/print/revoke の薄い
//   wrapper に縮約（挙動完全同値・1 バイトも変えない）。builder は現行どおり global state /
//   既存 helper（normalizeReport*/calcTotal/getRegistrationClassList/getTopPlayers/getReportClassLabel/
//   buildTournamentTargetMonthLabel/buildTournamentPdfFilename/escapeHtml 等）を直読みする
//   （side-effect-free だが厳密 pure ではない）。内側 function rankRow / buildClassRankRows も
//   builder 内に保持。dateNum の後続互換算出も逐語保持（実質未使用だが触らない）。
//   出力 byte 一致は test/test_download_report_characterization_001.js が固定する。
function buildReportHtml(){
  // REPORT-UX-001: 印刷帳票では日付・時刻を旧形式の和暦風（YYYY年M月D日 / HH時MM分）で表示する。
  //   入力 UI は <input type="date"> / <input type="time"> の YYYY-MM-DD / HH:MM だが、
  //   印刷時は formatJapaneseDateFromYmd / formatJapaneseTimeFromHhmm で変換。
  //   未入力時は旧来の placeholder「　　年　　月　　日」「　　時　　分」を維持する。
  // REPORT-UX-006B (state-as-SoT): date / start / end は state.report を SoT として扱う。
  //   DOM #rep-date|start|end.value 直読みをやめ、normalize 系 helper で正規化済の値を取得する。
  //   不正値・空欄は '' に正規化され、placeholder「　　年　　月　　日」「　　時　　分」へ。
  var dateRaw=normalizeReportDateForInput(state.report&&state.report.date);
  var startRaw=normalizeReportTimeForInput(state.report&&state.report.start);
  var endRaw=normalizeReportTimeForInput(state.report&&state.report.end);
  var date=dateRaw?formatJapaneseDateFromYmd(dateRaw):'　　年　　月　　日';
  // REPORT-UX-006A: 会場は state.report.place を SoT として扱う。
  //   DOM #rep-place.value 直読みをやめ、normalizeReportPlace で trim/fallback 済の値を使う。
  //   空欄 / 空白 / 不正値はすべて '労政会館'。escapeHtml は HTML 組立時に通す。
  var place=normalizeReportPlace(state.report&&state.report.place);
  var start=startRaw?formatJapaneseTimeFromHhmm(startRaw):'　　時　　分';
  var end=endRaw?formatJapaneseTimeFromHhmm(endRaw):'　　時　　分';
  // REPORT-UX-006C (state-as-SoT): sei / fuku / note は state.report を SoT として扱う。
  //   DOM #rep-sei|fuku|note.value 直読みをやめ、専用 helper で正規化済の値を取得する。
  //   note の '特になし' は state には保存せず、ここで表示時 fallback として付与する
  //   （normalizeReportNote の戻り値が '' のときのみ）。
  //   escapeHtml は HTML 組立時に通す。note は `escapeHtml(note).split('\n').join('<br>')` で
  //   改行表示を維持する（中間改行は normalizeReportNote が保持済み）。
  var sei=normalizeReportSei(state.report&&state.report.sei);
  var fuku=normalizeReportFuku(state.report&&state.report.fuku);
  var noteRaw=normalizeReportNote(state.report&&state.report.note);
  var note=noteRaw||'特になし';

  var total=calcTotal();
  // REPORT-UX-002 (M1): allCount を state.classes 駆動の全クラス合計に置換。
  //   旧 A/B 固定の長さ加算 literal を解消し、C クラス以上の参加人数も正しく合計する。
  //   getRegistrationClassList() は ROUND-CLASS-START-006/007 で導入済の
  //   renderRegList / calcTotal と同じ source of truth（spec §15.1 / Codex S2 整合）。
  var reportClasses=(typeof getRegistrationClassList==='function')?getRegistrationClassList():[];
  var allCount=0;
  for(var rci=0;rci<reportClasses.length;rci++){
    var rcid=reportClasses[rci]&&reportClasses[rci].id;
    if(!rcid||(typeof isSafeClassId==='function'&&!isSafeClassId(rcid)))continue;
    var rcArr=(state.players&&state.players[rcid])||[];
    allCount+=rcArr.length;
  }
  // REPORT-UX-003A: prize は state.report.prize から正規化して取得。
  //   未入力・不正値は 7000 にフォールバック（normalizeReportPrize 既定）。
  //   0 は有効値 0 として扱う（賞金なし大会等）。
  //   balance / balanceStr は prize 値に同期して再計算される。
  var prize=normalizeReportPrize(state.report&&state.report.prize);
  var balance=total-prize;
  var balanceStr=(balance<0?'▲':'')+Math.abs(balance).toLocaleString()+'円';
  // 賞金表示も prize に同期。旧の固定内訳文字列（賞金額が固定 7000 円であった前提のテンプレ）は
  //   prize 可変化と相性が悪いため単純表示に置換。内訳テンプレ可変化は後続 task で扱う。
  //   会計報告の慣習に合わせ控除を表す ▲ 接頭辞を付すが、QA D-01（#279）: 賞金>0 のときのみとし、
  //   賞金 0 円（賞金なし大会・有効値 0）には ▲ を付けない（隣の balanceStr と同じ符号判定パターン）。
  var prizeDisplay=(prize>0?'▲':'')+prize.toLocaleString()+'円';

  // REPORT-UX-002 (M2 / M3): クラス別 top 3 を state.classes 駆動で集計する。
  //   旧 getTopPlayers の cls 固定呼出と、級優勝 / 級準優勝 / 級3位 の固定 6 行
  //   ハードコードを解消。各 class について className+'優勝/準優勝/3位' の 3 行を
  //   生成し、クラス名は state.classes[*].name を尊重（Aクラス/Bクラス/Cクラス…）。
  //   既存 rankRow() は label 引数を escapeHtml していなかったため、本 PR から rankRow 内側で
  //   label も escapeHtml し、外側 caller では escape 前の生の className 文字列を渡す。
  //   こうすることで XSS 安全性を強化しつつ既存 A/B 大会の見た目変化はラベルだけに留める。
  function rankRow(label,players,idx){
    var p=players[idx];
    var name=p?p.name:'';
    // FURIGANA-VIEW-002: 入賞者氏名にルビ（空 yomi は氏名のみ）。ラベルは従来どおり escapeHtml。
    var nameHtml=playerNameRubyHtml(name,p?p.yomi:'');
    return '<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">'+escapeHtml(label)+'</td>'
      +'<td style="padding:6px 10px;border:1px solid #999;">'+nameHtml+'</td>'
      +'<td style="padding:6px 10px;border:1px solid #999;"></td></tr>';
  }
  function buildClassRankRows(classes){
    // REPORT-UX-002 (Codex Should Fix):
    //   既存 A/B 帳票の「A級優勝/B級3位」表記を維持するため、state.classes[*].name を
    //   そのまま使うのではなく getReportClassLabel(c) でラベル化する。
    //   - Aクラス → A級、Sクラス → S級、Cクラス → C級（英字1文字+クラス → 英字+級）
    //   - A級 → A級（二重変換しない）
    //   - 小学生 / 初心者 / 一般 / 上級 等のカスタム名はそのまま
    //   ラベル文字列は rankRow 内側で escapeHtml される（XSS 安全性は維持）。
    var rows='';
    for(var ci=0;ci<classes.length;ci++){
      var c=classes[ci];
      if(!c||(typeof isSafeClassId==='function'&&!isSafeClassId(c.id)))continue;
      var label=getReportClassLabel(c);
      if(!label)continue;
      var top=getTopPlayers(c.id);
      rows+=rankRow(label+'優勝',top,0);
      rows+=rankRow(label+'準優勝',top,1);
      rows+=rankRow(label+'3位',top,2);
    }
    return rows;
  }
  var rankRowsHtml=buildClassRankRows(reportClasses);

  // REPORT-UX-004: 大会名は state.report.title から取得。
  //   '報告書' 接尾辞は downloadReport 側で付与。状態側 title には含めない（純粋な大会名）。
  //   reportTitle は trim/fallback 済の純大会名、reportTitleWithSuffix は '<title>報告書' 表示用。
  var reportTitle=normalizeReportTitle(state.report&&state.report.title);
  var reportTitleWithSuffix=reportTitle+'報告書';

  // REPORT-UX-005: 主催者名は state.report.organizer から取得。

  //   既定値 '日本将棋連盟沼津支部'、空欄/不正値は normalizeReportOrganizer で fallback。
  //   escapeHtml は HTML 組立時に通すため、ここでは正規化済の生文字列を保持する。
  var reportOrganizer=normalizeReportOrganizer(state.report&&state.report.organizer);

  // REPORT-UX-007A / FAX削除対応: footer 1行目の事務局名は state.report.officeName から取得。
  //   既定値は normalizeReportOfficeName 側に集約済み、空欄/不正値は helper で default fallback。
  //   escapeHtml は HTML 組立時に通すため、ここでは正規化済の生文字列を保持する。
  //   ※ Codex 追加 Must Fix: FAX番号は実在しないため報告書 footer から削除（出力しない）。
  //     state.report.fax / normalizeReportFax / #rep-fax 入力欄は schema・保存読込互換のため残置するが、
  //     報告書出力（downloadReport）では一切参照しない。
  var officeName=normalizeReportOfficeName(state.report&&state.report.officeName);

  // REPORT-UX-007B-1: footer 2行目（会計提出文）は state.report.accountingNote から取得。
  //   既定値 '※役員会で会計長へ収支報告書として提出ください。' は normalizeReportAccountingNote
  //   側に集約済み。default のままなら footer 2行目の出力文字列は従来固定値の帳票と完全一致。
  //   escapeHtml(...).split('\n').join('<br>') で XSS 安全 + 改行表示に変換する（note と同パターン）。
  var accountingNote=normalizeReportAccountingNote(state.report&&state.report.accountingNote);

  // REPORT-REFACTOR-B5C: 報告書 footer（申し送り事項 table ＋ 事務局名/会計提出文の <p>2行）を
  //   buildReportHtml 内のネスト関数として抽出（引数なし・note/officeName/accountingNote を
  //   クロージャ参照＝既存 rankRow / buildClassRankRows と同じスタイル）。下の巨大 concat から
  //   該当範囲（申し送り table 〜 footer <p>2つ）をそのまま移動しただけで出力は byte 同値。
  //   escape 位置（escapeHtml(note).split('\n').join('<br>') / escapeHtml(officeName) /
  //   escapeHtml(accountingNote).split('\n').join('<br>')）は不変。top-level helper は追加しない。
  function buildReportFooterHtml(){
    return '<table>'
      +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold;width:120px">申し送り事項</td>'
      +'<td style="padding:6px 10px;border:1px solid #999;height:60px">'+escapeHtml(note).split('\n').join('<br>')+'</td></tr>'
      +'</table>'
      +'<p style="margin-top:12px;font-size:11px">※ホームページ掲載の為、当日夜までにメールまたは直接'+escapeHtml(officeName)+'まで</p>'
      +'<p style="font-size:11px">'+escapeHtml(accountingNote).split('\n').join('<br>')+'</p>';
  }

  var html='<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
    +'<title>'+escapeHtml(reportTitleWithSuffix)+'</title>'
    +'<style>@page{size:A4;margin:10mm}'
    +'body{font-family:sans-serif;font-size:13px;padding:20px}'
    +'table{border-collapse:collapse;width:100%}'
    +'tr,td{page-break-inside:avoid}'
    // FURIGANA-VIEW-002: 報告書（入賞者氏名）の印刷ルビが潰れない最小CSS。
    +'ruby{ruby-position:over}rt{font-size:.6em;font-weight:normal;color:#333;line-height:1}'
    +'@media print{body{padding:0}}</style></head><body>'
    +'<h2 style="text-align:center;font-size:16px;margin-bottom:6px">'+escapeHtml(reportTitleWithSuffix)+'</h2>'
    // LIVE-MOBILE-SCOREBOARD-001 §4: 対象月を表題直下に併記（開催日は下の「日付」行に既出）。
    //   対象月未入力（開催日なし）の場合はこの行ごと省略し、表示を崩さない。
    +(buildTournamentTargetMonthLabel()?'<div style="text-align:center;font-size:13px;color:#444;margin-bottom:16px">対象月：'+escapeHtml(buildTournamentTargetMonthLabel())+'</div>':'<div style="margin-bottom:10px"></div>')
    +'<table>'
    // REPORT-UX-005: 主催行（旧版で固定文字列だった主催者名を state.report.organizer 由来に置換）。
    //   既存帳票構造の踏襲: 日付行と同じ width:120px / 同 colspan="2" レイアウト。
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold;width:120px">主催</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'+escapeHtml(reportOrganizer)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold;width:120px">日付</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'+escapeHtml(date)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">時間</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'+escapeHtml(start)+' 〜 '+escapeHtml(end)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">会場</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'+escapeHtml(place)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">担当役員</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;width:80px">正</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;">'+escapeHtml(sei)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0"></td>'
    +'<td style="padding:6px 10px;border:1px solid #999;">副</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;">'+escapeHtml(fuku)+'</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">参加人数</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'+allCount+'名</td></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;font-weight:bold">収支</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;" colspan="2">'
    +'会費合計：'+total.toLocaleString()+'円<br>'
    +'賞金：'+escapeHtml(prizeDisplay)+'<br>'
    +'収支：'+escapeHtml(balanceStr)+'</td></tr>'
    +'</table>'
    +'<br>'
    +'<table>'
    +'<tr><th style="padding:6px 10px;border:1px solid #999;background:#d0d0d0;" colspan="3">結果</th></tr>'
    +'<tr><td style="padding:6px 10px;border:1px solid #999;background:#f0f0f0;"></td>'
    +'<td style="padding:6px 10px;border:1px solid #999;background:#d0d0d0;font-weight:bold;text-align:center">お名前</td>'
    +'<td style="padding:6px 10px;border:1px solid #999;background:#d0d0d0;font-weight:bold;text-align:center">お住まい（市町村のみ）</td></tr>'
    // REPORT-UX-002 (M2): A級/B級 固定 6 行を撤去し、classes-driven な rankRowsHtml に置換。
    //   reportClasses が ['A','B'] のみの大会では rankRowsHtml が 6 行（A→B 順）になり
    //   従来構造と等価。C クラス以降は自動的に 3 行ずつ追加される。
    +rankRowsHtml
    +'</table>'
    +'<br>'
    // REPORT-REFACTOR-B5C: 申し送り table 〜 footer <p>2つ を buildReportFooterHtml() へ移動（byte 同値）。
    +buildReportFooterHtml()
    +'</body></html>';

  // REPORT-UX-001: ファイル名用の日付文字列。新 type="date" の YYYY-MM-DD / 旧テキストの
  //   YYYY年MM月DD日 の両方からハイフン・和暦区切りを除去し YYYYMMDD 風にする。
  // REPORT-UX-006B: dateRaw は normalizeReportDateForInput 通過済の YYYY-MM-DD / '' なので、
  //   ハイフン除去のみで YYYYMMDD（不正値時は ''）になる。DOM 直読みをやめ state-as-SoT に統一。
  var dateNum=dateRaw.split('-').join('');
  // SHOGI-TOUR-PDF-FILENAME-MVP-001: ファイル名は共通 helper で
  //   「{YYYYMMDD}_{大会名}_報告書」に統一する（報告書は大会全体の帳票なのでクラス名は付けない）。
  //   <title> は初回組立時に reportTitleWithSuffix 由来で生成済のため、ここでは html.replace で
  //   ファイル名タイトルへ置換する（既存設計の踏襲）。本文・h2・レイアウトは変更しない。
  //   （PR #204 の月度ベース命名を運用者要望で置き換え。dateNum は後続互換のため算出を残置。）
  var fileTitleName=buildTournamentPdfFilename('報告書');
  html=html.replace('<title>'+escapeHtml(reportTitleWithSuffix)+'</title>','<title>'+escapeHtml(fileTitleName)+'</title>');
  return html;
}

// downloadReport: buildReportHtml() の出力を Blob 化し別タブで開いて印刷する薄い wrapper。
//   副作用のみ（Blob MIME text/html;charset=utf-8 / window.open(url,'_blank') / !win 即時
//   revokeObjectURL+alert+return / win.focus() / load→afterprint→print の登録順 / win.print() /
//   setTimeout(...,60000) の revokeObjectURL タイミング）は現行どおり不変。呼出側 onclick="downloadReport()" も不変。
function downloadReport(){
  var html=buildReportHtml();
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var win=window.open(url,'_blank');
  if(!win){URL.revokeObjectURL(url);alert('ポップアップがブロックされています。ブラウザの設定でポップアップを許可してください。');return;}
  win.focus();
  // B05: setTimeout(800) → load イベント、B08: 印刷後に afterprint で win.close()
  win.addEventListener('load',function(){
    win.addEventListener('afterprint',function(){win.close();});
    win.print();
  });
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}

// RESET-UX-PARTIAL-RESET-IMPL-LIGHT (PR #113 §10.1 / §15):
//   参加者一覧（state.players）を残したまま、局単位の進行データだけを初期化する。
//   設計 doc §6.7 / §8: A. 参加者データ / 大会単位データ（players / tournament_id /
//     rounds / report / _pendingNewYomi*）は維持、B. 大会進行データ
//     （pairings / results / started）のみ初期化。
//   resetAll() 自体は変更しない（全リセットとして温存、§10.2）。
//   PR #112 startTournament guard alert は本ボタンへ誘導するよう同期更新（§10.1）。
// ============================================================
// RESET-UNDO (当日運営レビュー第2弾⑩): リセット誤タップの全消失を防ぐ安全網。
//   全リセット/進行リセットの「直前」に現在の state を1回分スナップショット（UNDO_KEY）し、
//   実行後に「元に戻す」を提示する。元に戻すは load() と同じ normalizeState 経路で復元する。
//   一段（1回分）のみ。次のリセットで上書き、元に戻すと消去。保存形式は state と同一（save() 互換）。
// ============================================================
var UNDO_KEY='shogi_undo_snapshot';
function captureResetSnapshot(kind){
  try{
    localStorage.setItem(UNDO_KEY, JSON.stringify({kind:String(kind||''), savedAt:Date.now(), payload:JSON.stringify(state)}));
  }catch(e){ /* quota 等は握りつぶす＝リセット自体は続行（安全網は best-effort） */ }
}
function hasResetUndoSnapshot(){
  try{ return !!localStorage.getItem(UNDO_KEY); }catch(e){ return false; }
}
function undoLastReset(){
  try{
    var raw=localStorage.getItem(UNDO_KEY);
    if(!raw){ showMsg('元に戻せる直前のデータがありません','warn'); return false; }
    var snap=JSON.parse(raw);
    if(!snap||typeof snap.payload!=='string'){ showMsg('元に戻せる直前のデータがありません','warn'); return false; }
    state=normalizeState(JSON.parse(snap.payload));   // load() と同じ復元経路
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    try{ localStorage.removeItem(UNDO_KEY); }catch(e){}
    _pendingNewYomi={};_yomiAutoBuffer='';_yomiManuallyEdited=false;
    populateReportFields();
    renderRegList();
    renderPastParticipantsPanel();
    if(state.started){ showTab(isTournamentDone()?'result':'tournament'); } else { showTab('reg'); }
    showMsg('リセットを元に戻しました','ok');
    return true;
  }catch(e){ showMsg('元に戻すのに失敗しました','err'); return false; }
}
// リセット成功＋「元に戻す」ボタンを #reg-msg に表示（showMsg と同じ場所・次のメッセージで自然に消える＝一時的提示）。
function showResetUndoBanner(msg){
  var el=document.getElementById('reg-msg'); if(!el){ showMsg(msg,'ok'); return; }
  el.innerHTML='<div class="alert alert-ok" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">'
    +'<span>'+escapeHtml(String(msg||''))+'</span>'
    +'<button type="button" id="reset-undo-btn" class="btn-sm" style="min-height:36px;background:#fff;border:1px solid #1F3864;color:#1F3864">↩ 元に戻す</button></div>';
  var b=document.getElementById('reset-undo-btn');
  if(b)b.addEventListener('click',function(){ undoLastReset(); });
}

function resetTournamentProgressOnly(){
  if(!confirm('参加者一覧は残したまま、現在の組み合わせ・勝敗結果を削除します。\nよろしいですか？'))return;
  captureResetSnapshot('progress');
  // B. 大会進行データ（局単位）のみ初期化
  // ROUND-CLASS-START-004b (spec §12.2):
  //   state.classes 駆動で全クラス一括リセット。A/B 固定 literal を廃止し、
  //   pairings[c.id] / results[c.id] / c.started を classId ベースで初期化する。
  //   spec §8.2 例外: 全体初期化系のため classes[i].started への直接代入を許容、
  //   直後に syncGlobalStartedFromClasses() で state.started を同期書き込みする
  //   （Codex Must Fix・過去バグ防止: state.started=false だけにすると classes[i].started=true
  //    のままで保存され、再ロード時 normalizeState の保守的展開で state.started=true に戻る）。
  if(!state.pairings||typeof state.pairings!=='object')state.pairings={};
  if(!state.results||typeof state.results!=='object')state.results={};
  var classesSnapshot=Array.isArray(state.classes)?state.classes.slice():[];
  classesSnapshot.forEach(function(c){
    if(!c||typeof c.id!=='string')return;
    state.pairings[c.id]=[];
    state.results[c.id]=[];
    c.started=false;
  });
  syncGlobalStartedFromClasses();
  // 開きっぱなしのモーダルを閉じる（resetAll と同設計、進行中操作の取りこぼし防止）
  ['bulk-edit-modal','edit-past-modal','chg-modal','load-modal'].forEach(function(mid){
    var m=document.getElementById(mid);if(m)m.remove();
  });
  // 大会タブの表示 DOM をクリア（classId ベース、A/B literal 不使用、可変クラスに対応）
  classesSnapshot.forEach(function(c){
    if(!c||typeof c.id!=='string')return;
    var pane=document.getElementById('pane-'+c.id);if(pane)pane.innerHTML='';
    var rslt=document.getElementById('result-'+c.id);if(rslt)rslt.innerHTML='';
  });
  save();
  renderRegList();
  // RESET-PP-REFRESH (bugfix): リセット後は過去参加者パネルも再描画する。
  //   A/B の「✓ 登録中」ハイライト(currentRegMap=state.players 由来)が、再描画しないとリセット前のまま残るため。
  var _ppSearchReset=document.getElementById('pp-search');
  if(typeof renderPastParticipantsPanel==='function')renderPastParticipantsPanel(_ppSearchReset?_ppSearchReset.value:'');
  showTab('reg');
  showResetUndoBanner('大会進行データをリセットしました');
}

function resetAll(){
  if(!confirm('参加者一覧・組み合わせ・勝敗結果を含む大会データをすべてリセットします。\n支部マスタは保持されます。'))return;
  captureResetSnapshot('all');
  // ROUND-CLASS-START-004b (spec §12.3 / §8.2 例外):
  //   state.classes 駆動で全リセット。{A:[],B:[]} 固定 literal を廃止し、emptyClassDict 経由で
  //   classId ベースに初期化する。既定 classes は ['A','B']（A/B 大会の互換維持、Phase 6 までは現状維持）。
  //   全体初期化系のため started 直接代入を例外的に許容（spec §8.2 例外境界）。
  var defaultClasses=[
    {id:'A',name:'Aクラス',started:false},
    {id:'B',name:'Bクラス',started:false}
  ];
  state={
    players:emptyClassDict(defaultClasses,function(){return [];}),
    rounds:4,
    pairings:emptyClassDict(defaultClasses,function(){return [];}),
    results:emptyClassDict(defaultClasses,function(){return [];}),
    started:false,
    report:{date:'',place:'労政会館',start:'',end:'',sei:'',fuku:'',note:'',prize:7000,title:'沼津支部月例将棋大会',organizer:'日本将棋連盟沼津支部',fax:'943-9443',officeName:'沼津支部事務局',accountingNote:'※役員会で会計長へ収支報告書として提出ください。'},
    classes:defaultClasses
  };
  _pendingNewYomi={};_yomiAutoBuffer='';_yomiManuallyEdited=false;
  try{
    // 仕様書 3.4.1 / §3.1.5: shogi_branch_master は絶対に消さない
    localStorage.removeItem(STORAGE_KEY);
    for(var i=0;i<LEGACY_STORAGE_KEYS.length;i++)localStorage.removeItem(LEGACY_STORAGE_KEYS[i]);
  }catch(e){}
  // 開きっぱなしのモーダルを閉じる
  ['bulk-edit-modal','edit-past-modal','chg-modal','load-modal'].forEach(function(mid){
    var m=document.getElementById(mid);if(m)m.remove();
  });
  renderRegList();
  // 表示DOMを明示的にクリア（classId ベース、A/B literal 不使用）
  state.classes.forEach(function(c){
    if(!c||typeof c.id!=='string')return;
    var pane=document.getElementById('pane-'+c.id);if(pane)pane.innerHTML='';
    var rslt=document.getElementById('result-'+c.id);if(rslt)rslt.innerHTML='';
  });
  // 大会報告書入力欄を初期化
  var repPlace=document.getElementById('rep-place');if(repPlace)repPlace.value='労政会館';
  var repSei=document.getElementById('rep-sei');if(repSei)repSei.value='';
  var repFuku=document.getElementById('rep-fuku');if(repFuku)repFuku.value='';
  var repNote=document.getElementById('rep-note');if(repNote)repNote.value='';
  // REPORT-UX-007A: footer 1行目の FAX番号 / 事務局名は schema 既定値に戻す（空欄ではなく default 値）。
  //   後段の populateReportFields でも state からの再同期で同じ default が反映されるため二重ではあるが、
  //   既存の resetAll の DOM 明示初期化方針に揃える。
  var repFax=document.getElementById('rep-fax');if(repFax)repFax.value='943-9443';
  var repOfficeName=document.getElementById('rep-office-name');if(repOfficeName)repOfficeName.value='沼津支部事務局';
  // REPORT-UX-007B-1: footer 2行目（会計提出文）も schema 既定値に戻す（空欄ではなく default 文言）。
  //   note と異なり空欄運用なしのため、reset 時は default 文言へ戻す方針。
  var repAccountingNote=document.getElementById('rep-accounting-note');if(repAccountingNote)repAccountingNote.value='※役員会で会計長へ収支報告書として提出ください。';
  var inpYomiR=document.getElementById('inp-yomi');if(inpYomiR)inpYomiR.value='';
  var inpNameR=document.getElementById('inp-name');if(inpNameR)inpNameR.value='';
  // REPORT-UX-001 (Codex Should Fix - resetAll defaults 再適用):
  //   date/start/end は state.report が新規初期化された直後に populateReportFields を呼ぶことで、
  //   保存済み値の正規化代入 → defaults 補完 を一括で再実行する。これにより同一セッションで
  //   新大会を開始した直後でも、開催日=今日 / 開始=13:00 / 終了=17:00 が自然に再表示される。
  populateReportFields();
  // RESET-PP-REFRESH (bugfix): リセット後は過去参加者パネルも再描画する。
  //   A/B の「✓ 登録中」ハイライト(currentRegMap=state.players 由来)が、再描画しないとリセット前のまま残るため。
  var _ppSearchReset=document.getElementById('pp-search');
  if(typeof renderPastParticipantsPanel==='function')renderPastParticipantsPanel(_ppSearchReset?_ppSearchReset.value:'');
  showTab('reg');
  showResetUndoBanner('大会データを全リセットしました');
}

// RESET-MENU (当日第2弾⑩後半): ⋯メニューの開閉。危険操作を1段深くして誤タップを防ぐ。
function toggleDangerMenu(forceClose){
  var menu=document.getElementById('dangerMenu'); var btn=document.getElementById('dangerMenuBtn');
  if(!menu||!btn)return;
  var open=(forceClose===true)?false:(menu.style.display==='none'||menu.style.display==='');
  menu.style.display=open?'block':'none';
  btn.setAttribute('aria-expanded',open?'true':'false');
}

function bindRegistrationEvents(){
  // ROUND-CLASS-START-007 (Codex Should Fix S3):
  //   A/B 静的ボタン (bulkEditA / bulkEditB) と C+ 動的ボタン (class-bulkedit-{classId}) を
  //   bindClassBulkEditHandlers() で同経路 bind する。重複 bind は data-bulkedit-bound で抑止。
  bindClassBulkEditHandlers();
  document.getElementById('addBtn').addEventListener('click',addPlayer);
  // HELP-UX-003 (#338): 登録受付タブ見出し脇「？ ヘルプ」（静的 HTML・id=helpBtnReg）→ openHelpModal('reg')。
  var helpBtnReg=document.getElementById('helpBtnReg');
  if(helpBtnReg)helpBtnReg.addEventListener('click',function(){openHelpModal('reg');});
  // START-UX-CONSOLIDATE-001 (設計 §5): #startBtn は「対局管理へ進むナビゲーション」。
  //   開始系の副作用を持つ startTournament ではなく goToTournamentFromReg（save()+タブ移動のみ）へ bind。
  document.getElementById('startBtn').addEventListener('click',goToTournamentFromReg);

  // CLASS-VARIABLE-001 (CV-1): クラス追加ボタン / 新規クラス名入力欄（Enter で追加）を bind。
  //   改名 / 削除ボタンは renderClassManager 内で各行生成時に addEventListener する（動的 DOM）。
  var addClassBtn=document.getElementById('addClassBtn');
  if(addClassBtn)addClassBtn.addEventListener('click',onClickAddClass);
  var inpNewClass=document.getElementById('inp-new-class');
  if(inpNewClass){
    var newClassComposing=false;
    inpNewClass.addEventListener('compositionstart',function(){newClassComposing=true;});
    inpNewClass.addEventListener('compositionend',function(){newClassComposing=false;});
    inpNewClass.addEventListener('keypress',function(e){if(e.key==='Enter'&&!newClassComposing)onClickAddClass();});
  }

  // 参加者名入力欄: IME対応 + Enterで追加
  var inpName=document.getElementById('inp-name');
  var composing=false;
  inpName.addEventListener('compositionstart',function(){
    composing=true;
    // A-4 §3.1.2: IME 開始時に自動取得バッファをリセット
    _yomiAutoBuffer='';
  });
  inpName.addEventListener('compositionupdate',function(e){
    // A-4 §3.1.2: ひらがな（U+3040-U+309F）のみで構成されていればバッファ更新。
    // 漢字変換中の data はスキップ（最後のひらがな状態が確定時の追記値となる）。
    var data=(e&&typeof e.data==='string')?e.data:'';
    if(/^[぀-ゟ]*$/.test(data))_yomiAutoBuffer=data;
  });
  inpName.addEventListener('compositionend',function(){
    composing=false;
    // A-4 §3.1.2: 手動編集されていない場合のみ、バッファを yomi 欄末尾に追記。
    // サジェスト由来の値も上書きせず追記するのが原則だが、サジェスト選択直後は
    // _yomiAutoBuffer は空（onSuggestTap で reset 済み）なので追記は発生しない。
    if(!_yomiManuallyEdited && _yomiAutoBuffer){
      var inpYomi=document.getElementById('inp-yomi');
      if(inpYomi){
        inpYomi.value=(inpYomi.value||'')+_yomiAutoBuffer;
      }
    }
    _yomiAutoBuffer='';
    updateSuggestList();
  });
  inpName.addEventListener('keypress',function(e){if(e.key==='Enter'&&!composing)addPlayer();});
  // A-3 サジェスト: 入力中・focus 時に候補更新、blur で閉じる（mousedown より遅延）
  inpName.addEventListener('input',function(){
    if(!composing)updateSuggestList();
    // A-4 §3.1.2: 氏名欄を空にしたら手動編集フラグもリセット
    if(!inpName.value)_yomiManuallyEdited=false;
  });
  inpName.addEventListener('focus',function(){if(!composing)updateSuggestList();});
  inpName.addEventListener('blur',function(){setTimeout(closeSuggestList,150);});

  // A-4 §3.1.2: ふりがな欄の手動編集を追跡。Stage 1 では追跡のみ。
  var inpYomi=document.getElementById('inp-yomi');
  if(inpYomi){
    var yomiComposing=false;
    inpYomi.addEventListener('compositionstart',function(){yomiComposing=true;});
    inpYomi.addEventListener('compositionend',function(){yomiComposing=false;});
    inpYomi.addEventListener('input',function(){
      // ユーザーが yomi 欄を直接編集 → 手動編集フラグ ON
      _yomiManuallyEdited=true;
    });
    inpYomi.addEventListener('keypress',function(e){if(e.key==='Enter'&&!yomiComposing)addPlayer();});
  }
}
