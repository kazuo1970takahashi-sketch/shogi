function populateReportFields(){
  if(!state.report)state.report={date:'',place:'労政会館',start:'',end:'',sei:'',fuku:'',note:'',prize:7000,title:'沼津支部月例将棋大会',organizer:'日本将棋連盟沼津支部',fax:'943-9443',officeName:'沼津支部事務局',accountingNote:'※役員会で会計長へ収支報告書として提出ください。'};
  // REPORT-UX-001 (Codex Must Fix 1):
  //   date / start / end は <input type="date|time"> の value 制約に合わせて正規化してから代入する。
  //   旧形式 "YYYY年MM月DD日" / "H時MM分" が来ても、HTML5 input が値を空に戻して
  //   ensureReportDateTimeDefaults が今日/13:00/17:00 で上書きする問題を解消する。
  //   正規化に失敗した場合（不正値）は '' を返し、後段の defaults が補完する。
  // REPORT-UX-006B (state-as-SoT):
  //   旧仕様では state.report.* の値はここでは変更しなかったが、本タスクから state も
  //   正規化後値に同期する（legacy '2026年5月18日' → ISO '2026-05-18' へ自動 migrate）。
  //   不正値・空欄 → state.report.k=''、後段の ensureReportDateTimeDefaults が両方を補完。
  // REPORT-UX-006A: place は専用 helper で正規化するため、ここでは触らない（後段で個別反映）。
  // REPORT-UX-006C: sei / fuku / note も専用 helper で正規化するため、ここでは触らない（後段で個別反映）。
  ['date','start','end'].forEach(function(k){
    var el=document.getElementById('rep-'+k);
    if(!el)return;
    var raw=state.report[k]||'';
    var v=raw;
    if(k==='date'){
      v=normalizeReportDateForInput(raw);
      state.report.date=v;
    } else if(k==='start'||k==='end'){
      v=normalizeReportTimeForInput(raw);
      state.report[k]=v;
    }
    el.value=v;
  });
  // REPORT-UX-006C: 担当役員（正・副）・申し送り事項。state.report の値を input/textarea に反映し、
  //   state も正規化後値で同期書き戻し。note の '特になし' は state に保存しない（表示時のみ fallback）。
  //   #rep-note には trim 済の pure 値を入れるため、空欄なら textarea も '' のまま（placeholder で「特になし」を案内）。
  var seiEl=document.getElementById('rep-sei');
  if(seiEl){
    var normalizedSei=normalizeReportSei(state.report.sei);
    state.report.sei=normalizedSei;
    seiEl.value=normalizedSei;
  }
  var fukuEl=document.getElementById('rep-fuku');
  if(fukuEl){
    var normalizedFuku=normalizeReportFuku(state.report.fuku);
    state.report.fuku=normalizedFuku;
    fukuEl.value=normalizedFuku;
  }
  var noteEl=document.getElementById('rep-note');
  if(noteEl){
    var normalizedNote=normalizeReportNote(state.report.note);
    state.report.note=normalizedNote;
    noteEl.value=normalizedNote;
  }
  // REPORT-UX-006A: 会場（文字列フィールド）。state.report.place を input に反映する。
  //   - 空欄 / 不正値の場合は normalizeReportPlace 経由で '労政会館' fallback
  //   - state.report.place も同期書き込み（不正値クリーンアップ）
  var placeEl=document.getElementById('rep-place');
  if(placeEl){
    var normalizedPlace=normalizeReportPlace(state.report.place);
    state.report.place=normalizedPlace;
    placeEl.value=normalizedPlace;
  }
  // REPORT-UX-003A: 賞金額（数値フィールド）。state.report.prize の値を input に反映する。
  //   - 0 は有効値として 0 を表示
  //   - 欠落 / 不正値は normalizeReportPrize 経由で 7000 にフォールバック
  //   既存の文字列フィールドとは正規化 helper が異なるため別 forEach。
  var priceEl=document.getElementById('rep-prize');
  if(priceEl){
    var normalizedPrize=normalizeReportPrize(state.report.prize);
    state.report.prize=normalizedPrize;
    priceEl.value=String(normalizedPrize);
  }
  // REPORT-UX-004: 大会名（文字列フィールド）。state.report.title を input に反映する。
  //   - 空欄 / 不正値の場合は normalizeReportTitle 経由で '沼津支部月例将棋大会' fallback
  //   - state.report.title も同期書き込み（不正値クリーンアップ）
  var titleEl=document.getElementById('rep-title');
  if(titleEl){
    var normalizedTitle=normalizeReportTitle(state.report.title);
    state.report.title=normalizedTitle;
    titleEl.value=normalizedTitle;
  }
  // REPORT-UX-005: 主催者名（文字列フィールド）。state.report.organizer を input に反映する。
  //   - 空欄 / 不正値の場合は normalizeReportOrganizer 経由で '日本将棋連盟沼津支部' fallback
  //   - state.report.organizer も同期書き込み（不正値クリーンアップ）
  var organizerEl=document.getElementById('rep-organizer');
  if(organizerEl){
    var normalizedOrganizer=normalizeReportOrganizer(state.report.organizer);
    state.report.organizer=normalizedOrganizer;
    organizerEl.value=normalizedOrganizer;
  }
  // REPORT-UX-007A: FAX番号（文字列フィールド）。state.report.fax を input に反映する。
  //   - 空欄 / 不正値の場合は normalizeReportFax 経由で '943-9443' fallback
  //   - state.report.fax も同期書き込み（不正値クリーンアップ）
  var faxEl=document.getElementById('rep-fax');
  if(faxEl){
    var normalizedFax=normalizeReportFax(state.report.fax);
    state.report.fax=normalizedFax;
    faxEl.value=normalizedFax;
  }
  // REPORT-UX-007A: 事務局名（文字列フィールド）。state.report.officeName を input に反映する。
  //   - 空欄 / 不正値の場合は normalizeReportOfficeName 経由で '沼津支部事務局' fallback
  //   - state.report.officeName も同期書き込み（不正値クリーンアップ）
  var officeNameEl=document.getElementById('rep-office-name');
  if(officeNameEl){
    var normalizedOfficeName=normalizeReportOfficeName(state.report.officeName);
    state.report.officeName=normalizedOfficeName;
    officeNameEl.value=normalizedOfficeName;
  }
  // REPORT-UX-007B-1: 会計提出文（textarea フィールド）。state.report.accountingNote を textarea に反映する。
  //   - 空欄 / null / 非文字列は normalizeReportAccountingNote 経由で default 文言 fallback
  //   - state.report.accountingNote も同期書き込み（不正値クリーンアップ）
  //   - 中間改行は維持（normalizeReportAccountingNote が保持）
  var accountingNoteEl=document.getElementById('rep-accounting-note');
  if(accountingNoteEl){
    var normalizedAccountingNote=normalizeReportAccountingNote(state.report.accountingNote);
    state.report.accountingNote=normalizedAccountingNote;
    accountingNoteEl.value=normalizedAccountingNote;
  }
  // REPORT-UX-001: 保存済み値の復元後に未入力欄のみ defaults を補完する。
  //   保存済み値・入力済み値があれば ensureReportDateTimeDefaults は何もしない（冪等）。
  ensureReportDateTimeDefaults();
  // 復元後 / 初期化後の整合性チェック（保存済み値が end<=start 状態の場合に警告を出す）
  checkReportTimeOrder();
}

// REPORT-UX-001 (Codex Must Fix 2):
//   report field の input/change 共通の保存処理を helper 化する。
//   - state.report[key] = el.value
//   - save()
//   - date/time フィールドは change のみ発火するブラウザもあるため、
//     bindReportEvents から input/change 両イベントでこの helper を呼ぶ。
//   - start/end の場合は checkReportTimeOrder も呼ぶ。
//   key は data-report-field 属性、または DOM id の `rep-` プレフィックス除去で決定する。
function updateReportFieldFromElement(el,eventType){
  if(!el)return;
  var key=null;
  if(el.getAttribute){
    var attrKey=el.getAttribute('data-report-field');
    if(typeof attrKey==='string'&&attrKey)key=attrKey;
  }
  if(!key&&el.id&&el.id.indexOf('rep-')===0)key=el.id.substring(4);
  if(!key)return;
  if(!state.report)state.report={date:'',place:'労政会館',start:'',end:'',sei:'',fuku:'',note:'',prize:7000,title:'沼津支部月例将棋大会',organizer:'日本将棋連盟沼津支部',fax:'943-9443',officeName:'沼津支部事務局',accountingNote:'※役員会で会計長へ収支報告書として提出ください。'};
  // REPORT-UX-003A: prize は数値として保存する。空欄・負数・不正値は 7000 にフォールバック。
  //   0 は有効値として 0 のまま保存（normalizeReportPrize 内部で 0 を valid 扱い）。
  //   既存の string field (date/place/start/end/sei/fuku/note) の保存挙動は変えない。
  //
  // REPORT-UX-003B (DOM/state sync):
  //   正規化後の値を el.value にも書き戻し、「表示値」と「保存・帳票に使われる値」が
  //   一時的にズレないようにする。空欄入力 → 7000 表示 / 'abc' 入力 → 7000 表示 /
  //   0 入力 → '0' 表示 / 5000 入力 → '5000' 表示。
  //   既に el.value がそのまま正規化結果と一致する場合（通常の有効入力）は冗長代入だが、
  //   ブラウザ実装に依存せず常に同期される副作用を優先する。
  //   prize は type=number で IME が絡まないため input/change 両方で書き戻す挙動を維持。
  if(key==='prize'){
    var normalizedPrize=normalizeReportPrize(el.value);
    state.report.prize=normalizedPrize;
    el.value=String(normalizedPrize);
  } else if(key==='title'){
    // REPORT-UX-004: title は trim + 末尾「報告書」除去 + 空欄 fallback で正規化。
    //   Codex Must Fix (PR #150): 「報告書」を含む値を入れても downloadReport で
    //   二重付与されないよう、state には大会名のみを保存する。
    //   Codex Should Fix (PR #150): IME 編集中（input イベント）に DOM 書き戻しすると
    //   日本語入力のカーソル・composing 状態が壊れる可能性があるため、DOM 書き戻しは
    //   change イベント時のみに限定する。input イベントでは state 更新と save のみ。
    var normalizedTitle=normalizeReportTitle(el.value);
    state.report.title=normalizedTitle;
    if(eventType==='change')el.value=normalizedTitle;
  } else if(key==='organizer'){
    // REPORT-UX-005: organizer は trim + 空欄 fallback で正規化。state には純粋な主催者名のみを保存。
    //   「主催：」などのラベル文言は downloadReport 側で付与するため state には含めない。
    //   IME-safe: title と同じく、DOM 書き戻しは change イベント時のみに限定。input 時は state 更新と save のみ。
    var normalizedOrganizer=normalizeReportOrganizer(el.value);
    state.report.organizer=normalizedOrganizer;
    if(eventType==='change')el.value=normalizedOrganizer;
  } else if(key==='place'){
    // REPORT-UX-006A: place は trim + 空欄 fallback で正規化。state には純粋な会場名のみを保存。
    //   ラベル「会場」は downloadReport 側で付与するため state には含めない（REPORT-UX-008-1 改名）。
    //   IME-safe: title / organizer と同じく、DOM 書き戻しは change イベント時のみに限定。
    //   input 時は state 更新と save のみ（日本語 IME composing 中のカーソル位置を壊さない）。
    var normalizedPlace=normalizeReportPlace(el.value);
    state.report.place=normalizedPlace;
    if(eventType==='change')el.value=normalizedPlace;
  } else if(key==='date'){
    // REPORT-UX-006B: date は normalizeReportDateForInput で YYYY-MM-DD に正規化。
    //   <input type="date"> は picker 経由なら通常 ISO 形式だが、念のため helper を通す
    //   （legacy text の互換と空欄/不正値の '' fallback を維持）。
    //   DOM 書き戻しは change イベント時のみ（picker 中の中間値を破壊しない）。
    var normalizedDate=normalizeReportDateForInput(el.value);
    state.report.date=normalizedDate;
    if(eventType==='change')el.value=normalizedDate;
  } else if(key==='start'||key==='end'){
    // REPORT-UX-006B: start / end は normalizeReportTimeForInput で HH:MM に正規化。
    //   不正値・空欄は '' へ。DOM 書き戻しは change 時のみ（picker 操作中の中間値保護）。
    //   checkReportTimeOrder() は本関数末尾で start / end に対して既に呼ばれている。
    var normalizedTime=normalizeReportTimeForInput(el.value);
    state.report[key]=normalizedTime;
    if(eventType==='change')el.value=normalizedTime;
  } else if(key==='sei'){
    // REPORT-UX-006C: sei は trim + 空欄許容（default '' のまま）で正規化。
    //   IME-safe: 漢字氏名 IME 中の中間値を壊さないよう、DOM 書き戻しは change 時のみ。
    var normalizedSei=normalizeReportSei(el.value);
    state.report.sei=normalizedSei;
    if(eventType==='change')el.value=normalizedSei;
  } else if(key==='fuku'){
    // REPORT-UX-006C: fuku は sei と同じ仕様。空欄許容、change 時のみ DOM 同期。
    var normalizedFuku=normalizeReportFuku(el.value);
    state.report.fuku=normalizedFuku;
    if(eventType==='change')el.value=normalizedFuku;
  } else if(key==='note'){
    // REPORT-UX-006C: note は両端 trim、**中間改行は維持**。'特になし' は state に保存しない
    //   （downloadReport 側で表示時のみ fallback として付与する）。
    //   IME-safe: textarea 内の日本語 IME composing を壊さないよう DOM 書き戻しは change 時のみ。
    //   空欄 change → state も DOM も '' に揃え、'特になし' は **書き戻さない**。
    var normalizedNote=normalizeReportNote(el.value);
    state.report.note=normalizedNote;
    if(eventType==='change')el.value=normalizedNote;
  } else if(key==='fax'){
    // REPORT-UX-007A: fax は trim + 空欄 fallback で正規化。state には純粋な FAX 番号のみを保存。
    //   報告書 footer 1行目の '※…FAX（XXX）…' ラベル文言は downloadReport 側で付与するため、state には含めない。
    //   IME-safe: title / organizer 等と同じく、DOM 書き戻しは change イベント時のみに限定。
    //   input 時は state 更新と save のみ（日本語/全角 IME composing 中のカーソル位置を壊さない）。
    var normalizedFax=normalizeReportFax(el.value);
    state.report.fax=normalizedFax;
    if(eventType==='change')el.value=normalizedFax;
  } else if(key==='officeName'){
    // REPORT-UX-007A: officeName は trim + 空欄 fallback で正規化。state には純粋な事務局名のみを保存。
    //   報告書 footer 1行目の '…直接<officeName>まで' ラベル文言は downloadReport 側で付与する。
    //   IME-safe: organizer / sei / fuku 等と同じく、DOM 書き戻しは change イベント時のみに限定。
    var normalizedOfficeName=normalizeReportOfficeName(el.value);
    state.report.officeName=normalizedOfficeName;
    if(eventType==='change')el.value=normalizedOfficeName;
  } else if(key==='accountingNote'){
    // REPORT-UX-007B-1: accountingNote (textarea) は両端 trim + 空欄 fallback で正規化、**中間改行は維持**。
    //   footer 2行目 '※役員会で…' の文言全体を state.report.accountingNote から取得するため、
    //   空欄 change → default 文言に戻す（note と異なり「非表示」運用ではない）。
    //   IME-safe: textarea 内の日本語 IME composing を壊さないよう DOM 書き戻しは change 時のみ。
    var normalizedAccountingNote=normalizeReportAccountingNote(el.value);
    state.report.accountingNote=normalizedAccountingNote;
    if(eventType==='change')el.value=normalizedAccountingNote;
  } else {
    state.report[key]=el.value;
  }
  save();
  if(key==='start'||key==='end')checkReportTimeOrder();
}

function bindReportEvents(){
  // REPORT-UX-003A: prize も同じ data-report-field + input/change 両 bind パターンで扱う。
  //   updateReportFieldFromElement 側で key==='prize' のときだけ normalizeReportPrize 経由で
  //   数値化する。Codex Must Fix 2 の input/change 両イベント原則は維持。
  // REPORT-UX-004: 'title' も同じ data-report-field + input/change 両 bind パターンで扱う。
  //   updateReportFieldFromElement 側で key==='title' のとき normalizeReportTitle 経由で
  //   trim + 末尾「報告書」除去 + 空欄 fallback + (change 時のみ DOM 同期書き戻し)。
  //   イベント種別 (input/change) を updateReportFieldFromElement に渡し、
  //   title 分岐で IME 影響を避ける制御を可能にする (Codex Should Fix)。
  // REPORT-UX-005: 'organizer' も title と同じ IME-safe パターン。
  //   updateReportFieldFromElement 側で key==='organizer' のとき normalizeReportOrganizer 経由で
  //   trim + 空欄 fallback + (change 時のみ DOM 同期書き戻し)。
  // REPORT-UX-007A: 'fax' も同じ IME-safe パターン（id=rep-fax / key=fax で suffix と一致）。
  ['date','place','start','end','sei','fuku','note','prize','title','organizer','fax'].forEach(function(k){
    var el=document.getElementById('rep-'+k);
    if(!el)return;
    // data-report-field 属性を付与し、updateReportFieldFromElement が key を取得できるようにする
    if(el.setAttribute)el.setAttribute('data-report-field',k);
    // REPORT-UX-001 (Codex Must Fix 2):
    //   date/time input は ブラウザ・OS によって input イベントが発火しない場合がある
    //   （picker 確定で change のみ）。state.report 更新と save() を両イベントから走らせる。
    var inputHandler=function(e){ updateReportFieldFromElement(e.target||el,'input'); };
    var changeHandler=function(e){ updateReportFieldFromElement(e.target||el,'change'); };
    el.addEventListener('input',inputHandler);
    el.addEventListener('change',changeHandler);
  });
  // REPORT-UX-007A: 'officeName' は DOM id が `rep-office-name`（kebab-case）で state key が
  //   `officeName`（camelCase）。id-suffix からの自動導出だと一致しないため、明示的に key を
  //   付与してから input/change を bind する（updateReportFieldFromElement 側は
  //   data-report-field 経由で key を読むので、他 field と同じ分岐ロジックを共有できる）。
  var officeNameEl_bind=document.getElementById('rep-office-name');
  if(officeNameEl_bind){
    if(officeNameEl_bind.setAttribute)officeNameEl_bind.setAttribute('data-report-field','officeName');
    var officeNameInputHandler=function(e){ updateReportFieldFromElement(e.target||officeNameEl_bind,'input'); };
    var officeNameChangeHandler=function(e){ updateReportFieldFromElement(e.target||officeNameEl_bind,'change'); };
    officeNameEl_bind.addEventListener('input',officeNameInputHandler);
    officeNameEl_bind.addEventListener('change',officeNameChangeHandler);
  }
  // REPORT-UX-007B-1: 'accountingNote' は DOM id が `rep-accounting-note`（kebab-case）で state key が
  //   `accountingNote`（camelCase）。officeName と同じく id-suffix 自動導出と一致しないため
  //   明示的に data-report-field を付与してから input/change を bind する。
  var accountingNoteEl_bind=document.getElementById('rep-accounting-note');
  if(accountingNoteEl_bind){
    if(accountingNoteEl_bind.setAttribute)accountingNoteEl_bind.setAttribute('data-report-field','accountingNote');
    var accountingNoteInputHandler=function(e){ updateReportFieldFromElement(e.target||accountingNoteEl_bind,'input'); };
    var accountingNoteChangeHandler=function(e){ updateReportFieldFromElement(e.target||accountingNoteEl_bind,'change'); };
    accountingNoteEl_bind.addEventListener('input',accountingNoteInputHandler);
    accountingNoteEl_bind.addEventListener('change',accountingNoteChangeHandler);
  }
  var btn=document.getElementById('downloadReportBtn');
  if(btn)btn.addEventListener('click',downloadReport);
  // HELP-UX-002 (#322): 見出し脇「？ ヘルプ」ボタン（静的 HTML・id=helpBtnReport）の click を
  //   openHelpModal('report') に bind（追加のみ・表示のみ）。build/bind 分離のため結線はここで行う
  //   （#309 の helpBtnFirstRound_ → bindClassActionBarEvents と同型）。
  var helpBtnReport=document.getElementById('helpBtnReport');
  if(helpBtnReport)helpBtnReport.addEventListener('click',function(){openHelpModal('report');});
  // HELP-UX-004 (#341): 順位タブ見出し脇「？ ヘルプ」（静的 HTML・id=helpBtnStandings）→ openHelpModal('standings')。
  var helpBtnStandings=document.getElementById('helpBtnStandings');
  if(helpBtnStandings)helpBtnStandings.addEventListener('click',function(){openHelpModal('standings');});
  // B-2b-wire (#343): 「☁ クラウドへ送信」（静的・id=cloudSendBtn）→ sendTournamentToCloud（任意・失敗耐性）。
  var cloudSendBtn=document.getElementById('cloudSendBtn');
  if(cloudSendBtn)cloudSendBtn.addEventListener('click',function(){
    var st=document.getElementById('cloudSendStatus');
    sendTournamentToCloud(function(msg){ applyCloudStatus(st,msg); });
  });
}

// 全体として大会が完了しているか(参加者のいるクラスが全て全ラウンド消化済みか)
// ROUND-CLASS-START-005 (spec §15.1 row 3): A/B 固定 literal を解消し
//   state.classes を走査する形に置換。挙動は既存と等価：
//     - 参加者のいるクラスが 1 つでもあれば hasAnyClass=true
//     - そのクラスの results.length < state.rounds なら未完了 (false)
//     - 参加者 0 のクラスは判定対象外（skip-empty 相当）
//   3 クラス以上の構成 (C 含む) でも自然に拡張される。
function isTournamentDone(){
  if(!Array.isArray(state.classes))return false;
  var hasAnyClass=false;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    // ROUND-CLASS-START-006 (Codex Should Fix S1): isSafeClassId() で id-safety を強制し、
    //   ensureClassPaneDomNodes / ensureClassResultDomNodes / calcTotal と同条件に揃える。
    if(!c||!isSafeClassId(c.id))continue;
    var cls=c.id;
    var players=(state.players&&state.players[cls])||[];
    if(players.length>0){
      hasAnyClass=true;
      var results=(state.results&&state.results[cls])||[];
      if(results.length<state.rounds)return false;
    }
  }
  return hasAnyClass;
}

function initApp(){
  load();
  populateReportFields();
  renderRegList();
  renderPastParticipantsPanel();
  bindPastParticipantsToggle();
  if(state.started){
    if(isTournamentDone()){
      showTab('result');
    } else {
      showTab('tournament');
    }
  }
}

// ============================================================
// LIVE-MOBILE-SCOREBOARD-001 §1 スマホ閲覧用リアルタイム星取表ビュー
//   運営画面（.header / .container）とは分離した閲覧専用フルスクリーンビュー。
//   #scoreboard / #viewer / #mobile-standings hash で起動する。操作UI（入力/保存/編集/
//   ボタン）は一切描画しない。順位・勝敗は既存 calcFinal / computeDisplayRanks / getWins /
//   getName / entryNoOf を再利用して算出し、ロジックを複製しない（重複実装を避ける）。
//   リアルタイム更新: 別タブ（運営画面）の save() による localStorage 変更を storage イベントで
//   受け取り、閲覧専用ビュー表示中のみ state を再読込して再描画する。
// ============================================================

// 表示中のクラスフィルタ（'all' または classId）。memory-only、保存しない。
var _sbClassFilter='all';

// LIVE-MOBILE-SCOREBOARD-001 §1: 最終更新時刻。
//   閲覧ビューが state を最後に読み込んだ時刻を保持する（memory-only / 非保存・保存データ構造は不変）。
//   タブ切替などの単なる再描画では更新せず、データ再読込時（route 突入 / storage / focus）のみ更新する。
var _sbLastUpdate=null;

// Date を 'YYYY/MM/DD HH:MM:SS'（ゼロ詰め）へ整形する純粋関数。
//   Date でない/不正値なら '' を返す。表示専用でロジックに影響しない。
function sbFormatUpdateTime(d){
  if(!d||typeof d.getFullYear!=='function'||isNaN(d.getTime()))return '';
  function z(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'/'+z(d.getMonth()+1)+'/'+z(d.getDate())
    +' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());
}

// 最終更新時刻を現在時刻へ更新する（データ再読込時に呼ぶ）。
function sbTouchUpdate(){ _sbLastUpdate=new Date(); }

// 現在のURLが閲覧専用ビューのものか判定する。
//   LIVE-MOBILE-SCOREBOARD-001 §1: 仕様の主経路 ?view=scoreboard に加え、
//   既存運用の #scoreboard / #viewer / #mobile-standings hash も引き続き受理する（後方互換）。
//   いずれも scoreboard / viewer / mobile-standings の3トークンを許可する。
function isScoreboardRoute(){
  var tokens={scoreboard:1,viewer:1,'mobile-standings':1};
  var h=(location.hash||'').replace(/^#/,'').toLowerCase();
  if(tokens[h])return true;
  var m=(location.search||'').match(/[?&]view=([^&#]*)/i);
  var v=m?decodeURIComponent(m[1]).toLowerCase():'';
  return !!tokens[v];
}

// クラス表示名（state.classes[*].name 優先、なければ '<id>クラス'）。
function sbClassDisplayName(cls){
  if(Array.isArray(state.classes)){
    for(var i=0;i<state.classes.length;i++){
      if(state.classes[i]&&state.classes[i].id===cls&&state.classes[i].name)return state.classes[i].name;
    }
  }
  return cls+'クラス';
}

// 1 クラス分の星取表 HTML を組み立てる（横スクロール、順位+氏名は sticky 固定）。
//   各ラウンド列は ○（勝ち）/×（負け）/－（未対局）と対戦相手番号（#NN）を表示する。
//   Codex Should Fix 1: 現場要望「○×の星取表」に合わせ、負けは ● ではなく × で表示する。
//   氏名・番号はすべて escapeHtml してから描画する（XSS 安全）。
function buildScoreboardClassTableHtml(cls,sourceState){
  // SHOGI-TOUR-HISTORY-STEP1: 後方互換 optional 引数。sourceState 指定時のみ描画データ源を一時的に
  //   差し替える（withSourceState が global state を退避→finally で必ず復元）。引数なし呼び出し＝live
  //   経路の挙動は完全に従来どおり（本体不変＝#213 のふりがな ruby 表示もそのまま維持される）。
  if(sourceState!==undefined&&sourceState!==null&&sourceState!==state){
    return withSourceState(sourceState,function(){return buildScoreboardClassTableHtml(cls);});
  }
  var players=(state.players&&state.players[cls])||[];
  if(players.length===0)return '';
  var finals=calcFinal(cls);
  var ranks=computeDisplayRanks(finals,cls);
  var rounds=Number(state.rounds)||0;
  var resultsArr=(state.results&&state.results[cls])||[];
  var done=rounds>0&&resultsArr.length>=rounds;
  var html='<div class="sb-class">';
  html+='<div class="sb-class-h">'+escapeHtml(sbClassDisplayName(cls))+'　<span style="font-weight:400;color:#888;font-size:12px">'+(done?'最終結果':'途中経過')+'</span></div>';
  html+='<div class="sb-scroll"><table class="sb-table"><thead><tr>';
  html+='<th class="sb-col-rank">順位</th><th class="sb-col-name">氏名</th>';
  for(var r=1;r<=rounds;r++)html+='<th>'+r+'回戦</th>';
  html+='<th>勝</th><th>負</th><th>B</th><th>C</th></tr></thead><tbody>';
  for(var i=0;i<finals.length;i++){
    var f=finals[i];var rank=ranks[i];
    html+='<tr'+(rank===1?' class="sb-row-1"':'')+'>';
    html+='<td class="sb-col-rank">'+rank+'</td>';
    // FURIGANA-VIEW-002: 氏名にルビ（空 yomi は氏名のみ）。No.xx 補助表示は従来どおり維持。
    html+='<td class="sb-col-name">'+playerNameRubyHtml(getName(f.p.id,cls),yomiOf(f.p.id,cls))+'<span style="font-size:10px;color:#999;font-weight:400">　'+escapeHtml('No.'+entryNoOf(cls,f.p.id))+'</span></td>';
    for(var rr=0;rr<rounds;rr++){
      var round=resultsArr[rr];
      var cell='<span class="sb-mark sb-mark-none">－</span>';
      if(round){
        var match=null;
        for(var m=0;m<round.length;m++){if(round[m].p1===f.p.id||round[m].p2===f.p.id){match=round[m];break;}}
        if(match){
          var oppId=match.p1===f.p.id?match.p2:match.p1;
          var won=match.winner===f.p.id;
          var markCls=(match.winner==null)?'sb-mark-none':(won?'sb-mark-win':'sb-mark-lose');
          var markStr=(match.winner==null)?'－':(won?'○':'×');
          cell='<span class="sb-mark '+markCls+'">'+markStr+'</span><span class="sb-opp">'+escapeHtml('#'+entryNoOf(cls,oppId))+'</span>';
        }
      }
      html+='<td>'+cell+'</td>';
    }
    html+='<td class="sb-wins">'+f.A+'</td>';
    html+='<td class="sb-metric">'+(f.played-f.A)+'</td>';
    html+='<td class="sb-metric">'+f.B+'</td>';
    html+='<td class="sb-metric">'+f.C+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  html+='<div class="sb-legend">○=勝ち／×=負け／－=未対局　・　#NN=対戦相手の番号　・　勝・負=勝敗数　・　B=対戦相手の勝数合計／C=勝った相手の勝数合計（順位判定の主要指標）</div>';
  return html+'</div>';
}

// 閲覧専用ビュー全体を再描画する。state を SoT として参照（DOM 直読みしない）。
function renderScoreboard(){
  var view=document.getElementById('scoreboard-view');
  if(!view)return;
  var classList=(typeof getRegistrationClassList==='function')?getRegistrationClassList():(state.classes||[]);
  var activeClasses=[];
  for(var i=0;i<classList.length;i++){
    var c=classList[i];
    if(!c||(typeof isSafeClassId==='function'&&!isSafeClassId(c.id)))continue;
    var players=(state.players&&state.players[c.id])||[];
    if(players.length>0)activeClasses.push(c.id);
  }
  var title=(typeof normalizeReportTitle==='function')?normalizeReportTitle(state.report&&state.report.title):'沼津支部月例将棋大会';
  var monthLabel=buildTournamentTargetMonthLabel();
  var heldLabel=buildTournamentHeldDateLabel();
  var metaParts=[];
  if(monthLabel)metaParts.push('対象月：'+monthLabel);
  if(heldLabel)metaParts.push('開催日：'+heldLabel);
  // LIVE-MOBILE-SCOREBOARD-001 §1 read-only 徹底（Codex Must Fix 1）:
  //   閲覧URL（#scoreboard / #viewer / #mobile-standings）には運営画面への戻り導線
  //   （ボタン / リンク等）を一切置かない。戻り導線があると閲覧者が保存・読込・リセット・
  //   勝敗入力・編集UIへ到達でき、閲覧専用(read-only)要件に反するため。
  //   運営者が運営画面へ戻る必要がある場合は「別タブ運用」または「#scoreboard を外した
  //   運営URLを直接開く」運用とする（閲覧ビュー内には導線を持たせない）。
  // 最終更新時刻（仕様の必須表示項目）。_sbLastUpdate 未設定（直接描画）の場合は現在時刻で代替。
  var updLabel=sbFormatUpdateTime(_sbLastUpdate||new Date());
  var head='<div class="sb-head"><div>'
    +'<div class="sb-title">'+escapeHtml(title)+' 星取表</div>'
    +(metaParts.length?'<div class="sb-meta">'+escapeHtml(metaParts.join('　／　'))+'</div>':'')
    +'<div class="sb-note">閲覧専用・自動更新（運営画面の保存に追従）</div>'
    +(updLabel?'<div class="sb-updated">最終更新：'+escapeHtml(updLabel)+'</div>':'')
    +'</div></div>';
  // フィルタが現存クラスに無ければ all に戻す。
  if(_sbClassFilter!=='all'&&activeClasses.indexOf(_sbClassFilter)===-1)_sbClassFilter='all';
  var tabs='';
  if(activeClasses.length>1){
    tabs='<div class="sb-tabs"><button type="button" class="sb-tab'+(_sbClassFilter==='all'?' active':'')+'" data-sbcls="all">全クラス</button>';
    for(var t=0;t<activeClasses.length;t++){
      tabs+='<button type="button" class="sb-tab'+(_sbClassFilter===activeClasses[t]?' active':'')+'" data-sbcls="'+escapeHtml(activeClasses[t])+'">'+escapeHtml(sbClassDisplayName(activeClasses[t]))+'</button>';
    }
    tabs+='</div>';
  }
  var bodyHtml='';
  if(activeClasses.length===0){
    bodyHtml='<div class="sb-empty">まだ星取表に表示できる対局がありません。<br>運営画面で参加者を登録し、対局を開始すると表示されます。</div>';
  }else{
    var shown=(_sbClassFilter==='all')?activeClasses:[_sbClassFilter];
    for(var s=0;s<shown.length;s++)bodyHtml+=buildScoreboardClassTableHtml(shown[s]);
  }
  view.innerHTML=head+tabs+'<div class="sb-body">'+bodyHtml+'</div>';
  var tabBtns=view.querySelectorAll('.sb-tab');
  for(var b=0;b<tabBtns.length;b++){
    tabBtns[b].addEventListener('click',function(){_sbClassFilter=this.getAttribute('data-sbcls')||'all';renderScoreboard();});
  }
  // Codex Must Fix 1: 「運営画面へ」戻りボタンは廃止。閲覧ビューには運営画面への導線を束縛しない。
}

// hash に応じて閲覧専用ビューと運営画面を切り替える。
function applyScoreboardRoute(){
  var view=document.getElementById('scoreboard-view');
  if(!view)return;
  var header=document.querySelector('.header');
  var container=document.querySelector('.container');
  if(isScoreboardRoute()){
    document.body.classList.add('sb-active');
    view.style.display='block';
    view.setAttribute('aria-hidden','false');
    if(header)header.style.display='none';
    if(container)container.style.display='none';
    sbTouchUpdate();
    renderScoreboard();
  }else{
    document.body.classList.remove('sb-active');
    view.style.display='none';
    view.setAttribute('aria-hidden','true');
    if(header)header.style.display='';
    if(container)container.style.display='';
  }
}

// Codex Must Fix 1: 閲覧ビューから運営画面へ戻る exitScoreboardRoute() は廃止した。
//   閲覧URL（#scoreboard 等）では運営画面への戻り導線をコード上も提供しない（read-only 徹底）。
//   ※ hash を外した運営URLを直接開いた場合の表示切替は applyScoreboardRoute() が担うが、
//     これは閲覧ビュー内のUI導線ではなく「運営URLを直接開く」運用に対応するもの。

// 運営画面（現タブ）を維持したまま、閲覧専用ビューを別タブで開く。
//   同一ブラウザの localStorage(state) を共有し、storage イベントでリアルタイム追従する。
function openScoreboardWindow(){
  try{
    var w=window.open(location.pathname+location.search+'#scoreboard','_blank');
    if(w){w.focus();return;}
  }catch(e){}
  // ポップアップがブロックされた場合は運営タブを誤って隠さず、案内のみ出す。
  alert('別タブでスマホ星取表を開けませんでした。\nブラウザのポップアップ許可を確認するか、このページのURL末尾に「#scoreboard」を付けて開いてください。');
}

// 閲覧専用ビューの初期化（イベント束縛 + 初回ルート適用）。運営画面の挙動には影響しない。
function initScoreboard(){
  var btn=document.getElementById('openScoreboardBtn');
  if(btn)btn.addEventListener('click',openScoreboardWindow);
  window.addEventListener('hashchange',applyScoreboardRoute);
  // リアルタイム更新: 別タブの save() による localStorage 変更を受信して再描画する。
  //   閲覧専用ビュー表示中のみ load()（運営タブの未保存編集を巻き戻さないため）。
  window.addEventListener('storage',function(e){
    if(!isScoreboardRoute())return;
    if(e&&e.key&&e.key!==STORAGE_KEY)return;
    try{load();}catch(err){}
    sbTouchUpdate();
    renderScoreboard();
  });
  // タブ復帰時にも最新化（storage イベントを取りこぼした場合の保険）。
  window.addEventListener('focus',function(){
    if(!isScoreboardRoute())return;
    try{load();}catch(err){}
    sbTouchUpdate();
    renderScoreboard();
  });
  applyScoreboardRoute();
}

// ============================================================
// SHOGI-TOUR-HISTORY-STEP1: 過去大会履歴（保存 / 一覧 / read-only 閲覧）
//   設計メモ: docs/notes/20260615_shogi_tour_history_mvp_design_001.md
//   方針: 追記専用キー 'shogi_archive'。既存 'shogi_v4'（当日 state）/ 'shogi_branch_master'（マスタ）と
//         save/load/normalizeState/saveBranchMaster には一切書き込まない（§4.1）。保存単位＝確定 state の
//         deep clone スナップショット + 識別メタ（§3）。閲覧は既存 scoreboard レンダラ
//         buildScoreboardClassTableHtml を sourceState 差し替えで read-only 流用（§6・§8。#213 ruby 維持）。
//         restore（snapshot→現 state 書き戻し）は MVP では行わない（§11.2。閲覧のみ）。
// ============================================================
var ARCHIVE_KEY='shogi_archive';
var ARCHIVE_SCHEMA_VERSION=1;

// 描画データ源を一時的に sourceState へ差し替えて fn() を実行し、必ず global state を復元する。
//   scoreboard 系（getName / yomiOf / calcFinal / computeDisplayRanks …）は global state を参照するため、
//   過去スナップショットを描くにはこの「データ源差し替え」を使う。同期実行限定・finally で必ず復元する。
//   sourceState 未指定 / 現 state と同一なら差し替えない（live 経路の挙動不変）。
function withSourceState(sourceState,fn){
  if(sourceState===undefined||sourceState===null||sourceState===state)return fn();
  var _prev=state;
  state=sourceState;
  try{return fn();}
  finally{state=_prev;}
}

function archiveNowIso(){ return new Date().toISOString(); }

function archiveDeepClone(obj){
  try{ return JSON.parse(JSON.stringify(obj)); }catch(e){ return null; }
}

// localStorage の raw / object を {schema_version, updated_at, tournaments[]} へ正規化する。
//   不在・壊れた値は「履歴 0 件」として安全に返す（§4.1 後方互換）。
function normalizeArchive(raw){
  var obj=raw;
  if(typeof raw==='string'){ try{obj=JSON.parse(raw);}catch(e){obj=null;} }
  if(!obj||typeof obj!=='object'||Object.prototype.toString.call(obj.tournaments)!=='[object Array]'){
    return {schema_version:ARCHIVE_SCHEMA_VERSION,updated_at:'',tournaments:[]};
  }
  return {
    schema_version:(typeof obj.schema_version==='number')?obj.schema_version:ARCHIVE_SCHEMA_VERSION,
    updated_at:(typeof obj.updated_at==='string')?obj.updated_at:'',
    tournaments:obj.tournaments
  };
}

function loadArchive(){
  var raw=null;
  try{ raw=localStorage.getItem(ARCHIVE_KEY); }catch(e){ raw=null; }
  return normalizeArchive(raw);
}

// identity.classes 用: players を持つクラスを {id,name} で列挙（global state 参照＝withSourceState 内で呼ぶ）。
function buildArchiveIdentityClasses(){
  var out=[];
  var classes=Array.isArray(state.classes)?state.classes:[];
  for(var i=0;i<classes.length;i++){
    var c=classes[i];
    if(!c||typeof c.id!=='string'||!c.id)continue;
    var players=(state.players&&state.players[c.id])||[];
    if(players.length>0)out.push({id:c.id,name:(typeof c.name==='string'&&c.name)?c.name:(c.id+'クラス')});
  }
  if(out.length===0&&state.players&&typeof state.players==='object'){
    for(var k in state.players){
      if(!Object.prototype.hasOwnProperty.call(state.players,k))continue;
      var ps=state.players[k];
      if(Array.isArray(ps)&&ps.length>0)out.push({id:k,name:k+'クラス'});
    }
  }
  return out;
}

function countArchiveParticipants(){
  var n=0;
  var classes=buildArchiveIdentityClasses();
  for(var i=0;i<classes.length;i++){
    var ps=(state.players&&state.players[classes[i].id])||[];
    n+=ps.length;
  }
  return n;
}

// 各クラスの表示順位 1 位を {classId,name} で凍結（任意項目 §3.2。ranking は既存 calcFinal を流用）。
function buildArchiveChampions(){
  var out=[];
  try{
    var classes=buildArchiveIdentityClasses();
    for(var i=0;i<classes.length;i++){
      var cid=classes[i].id;
      var finals=calcFinal(cid);
      if(!finals||!finals.length)continue;
      var ranks=computeDisplayRanks(finals,cid);
      for(var j=0;j<finals.length;j++){
        if(ranks[j]===1)out.push({classId:cid,name:getName(finals[j].p.id,cid)});
      }
    }
  }catch(e){ return out; }
  return out;
}

// tournament_id が無い state でも一覧/閲覧キーが要るため、開催日（無ければ保存時刻）から安定 id を合成する。
//   state は変更しない（ensureTournamentId のような書き戻しはしない）。
function synthArchiveTid(heldDate,savedAtIso){
  if(heldDate&&/^\d{4}-\d{2}-\d{2}$/.test(heldDate))return 't_'+heldDate.replace(/-/g,'_');
  return 'hist_'+String(savedAtIso||'').replace(/[^0-9]/g,'').slice(0,14);
}

// 確定 state（既定 = 現在の global state）から履歴 1 件を生成する純関数（§3.2）。
//   sourceState を一時データ源にして識別メタ（title/heldDate/月ラベル/クラス/人数/優勝者）を凍結し、
//   snapshot は sourceState の deep clone を持つ。global state は呼び出し後に必ず元へ戻る。
function buildArchiveEntryFromState(sourceState,savedAtIso){
  var s=sourceState||state;
  var savedAt=savedAtIso||archiveNowIso();
  return withSourceState(s,function(){
    var report=state.report||{};
    var title=(typeof normalizeReportTitle==='function')?normalizeReportTitle(report.title):(typeof report.title==='string'?report.title:'');
    var heldDate=(typeof normalizeReportDateForInput==='function')?(normalizeReportDateForInput(report.date)||''):(typeof report.date==='string'?report.date:'');
    var targetMonthLabel=(typeof buildTournamentTargetMonthLabel==='function')?buildTournamentTargetMonthLabel():'';
    var tid=(typeof state.tournament_id==='string'&&state.tournament_id)?state.tournament_id:synthArchiveTid(heldDate,savedAt);
    return {
      schema_version:ARCHIVE_SCHEMA_VERSION,
      savedAt:savedAt,
      identity:{
        tournament_id:tid,
        title:title,
        heldDate:heldDate,
        targetMonthLabel:targetMonthLabel,
        classes:buildArchiveIdentityClasses(),
        participantCount:countArchiveParticipants(),
        champions:buildArchiveChampions()
      },
      snapshot:archiveDeepClone(state)
    };
  });
}

// tournament_id をキーに冪等追記する純関数（同 id は上書き・無ければ新しい順で先頭に追加）（§10・§11.1）。
function appendOrReplaceByTournamentId(archive,entry){
  var arc=normalizeArchive(archive);
  var list=arc.tournaments.slice();
  var tid=entry&&entry.identity&&entry.identity.tournament_id;
  var idx=-1;
  if(tid){
    for(var i=0;i<list.length;i++){
      var e=list[i];
      if(e&&e.identity&&e.identity.tournament_id===tid){idx=i;break;}
    }
  }
  if(idx>=0)list[idx]=entry; else list.unshift(entry);
  return {schema_version:ARCHIVE_SCHEMA_VERSION,updated_at:(entry&&entry.savedAt)||archiveNowIso(),tournaments:list};
}

function findArchiveEntryByTid(archive,tid){
  var arc=normalizeArchive(archive);
  if(!tid)return null;
  for(var i=0;i<arc.tournaments.length;i++){
    var e=arc.tournaments[i];
    if(e&&e.identity&&e.identity.tournament_id===tid)return e;
  }
  return null;
}

// 一覧表示順（§5）: 開催日 desc → 保存日時 desc（新しい大会が上）。heldDate は YYYY-MM-DD で辞書順=日付順。
function sortArchiveTournaments(list){
  var arr=(Array.isArray(list)?list:[]).slice();
  arr.sort(function(a,b){
    var ha=(a&&a.identity&&a.identity.heldDate)||'';
    var hb=(b&&b.identity&&b.identity.heldDate)||'';
    if(ha!==hb)return ha<hb?1:-1;
    var sa=(a&&a.savedAt)||'';
    var sb=(b&&b.savedAt)||'';
    if(sa!==sb)return sa<sb?1:-1;
    return 0;
  });
  return arr;
}

function formatArchiveSavedAt(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d.getTime()))return String(iso);
  function p2(n){return ('0'+n).slice(-2);}
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());
}

function buildArchiveChampionLabel(champions){
  if(!Array.isArray(champions)||champions.length===0)return '';
  var parts=[];
  for(var i=0;i<champions.length;i++){
    var c=champions[i];
    if(!c)continue;
    parts.push(escapeHtml((c.classId||'')+'：'+(c.name||'')));
  }
  return parts.join('　');
}

function deriveArchiveClassesFromSnapshot(snap){
  var out=[];
  var classes=(snap&&Array.isArray(snap.classes))?snap.classes:[];
  for(var i=0;i<classes.length;i++){
    var c=classes[i];
    if(c&&typeof c.id==='string'&&c.id)out.push({id:c.id,name:(typeof c.name==='string'&&c.name)?c.name:(c.id+'クラス')});
  }
  if(out.length===0&&snap&&snap.players&&typeof snap.players==='object'){
    for(var k in snap.players){
      if(Object.prototype.hasOwnProperty.call(snap.players,k))out.push({id:k,name:k+'クラス'});
    }
  }
  return out;
}

// shogi_archive へ 1 件を永続化する（§4.2）。quota 超過時は既存 helper（isQuotaExceededError /
//   notifySaveWarning）を再利用して警告し、直前の archive を復元（ロールバック）する。
//   当日 state（'shogi_v4'）には一切書き込まない＝当日データは無傷。
function persistArchiveEntry(entry){
  var archive=loadArchive();
  var next=appendOrReplaceByTournamentId(archive,entry);
  var prevRaw=null;
  try{ prevRaw=localStorage.getItem(ARCHIVE_KEY); }catch(e){ prevRaw=null; }
  try{
    localStorage.setItem(ARCHIVE_KEY,JSON.stringify(next));
    return {ok:true,quota:false};
  }catch(e){
    // ロールバック: 直前の shogi_archive を壊さない（当日 state は元々未変更）。
    try{ if(prevRaw==null)localStorage.removeItem(ARCHIVE_KEY); else localStorage.setItem(ARCHIVE_KEY,prevRaw); }catch(e2){}
    var quota=(typeof isQuotaExceededError==='function')&&isQuotaExceededError(e);
    if(typeof notifySaveWarning==='function'){
      notifySaveWarning({
        message:quota?'大会履歴を保存できませんでした（ブラウザの保存容量が上限です）。JSONバックアップをご利用ください。当日の大会データは保持されています。':'大会履歴を保存できませんでした。当日の大会データは保持されています。',
        consoleTag:'[HISTORY-WARN]',
        callsiteId:quota?'STORAGE-QUOTA:saveArchive':'saveArchive',
        kind:quota?'storage-quota':undefined,
        aggregateKey:quota?'storage-quota:global':undefined,
        severity:'warn',
        fields:['shogi_archive']
      });
    }
    return {ok:false,quota:quota};
  }
}

// 明示保存アクション（§11.1: 自動でなくユーザー操作 + 確認）。冪等は tournament_id をキーに上書き確認。
function saveCurrentTournamentToArchive(){
  var entry;
  try{ entry=buildArchiveEntryFromState(state); }
  catch(e){ alert('履歴用データの生成に失敗しました。当日の大会データは保持されています。'); return false; }
  if(!entry||!entry.snapshot){ alert('保存できる大会データがありません。'); return false; }
  var tid=entry.identity.tournament_id;
  var archive=loadArchive();
  var existing=tid?findArchiveEntryByTid(archive,tid):null;
  var label=entry.identity.targetMonthLabel||entry.identity.title||'この大会';
  if(existing){ if(!confirm('「'+label+'」は既に履歴にあります。\n現在の内容で上書きしますか？'))return false; }
  else { if(!confirm('現在の大会（'+label+'）を履歴へ保存しますか？'))return false; }
  var res=persistArchiveEntry(entry);
  if(res.ok){ renderHistoryList('✓ 大会を履歴へ保存しました。'); return true; }
  alert(res.quota
    ?'大会履歴を保存できませんでした（保存容量の上限）。\nJSONバックアップをご利用ください。\n当日の大会データは保持されています。'
    :'大会履歴を保存できませんでした。\n当日の大会データは保持されています。');
  return false;
}

// 履歴一覧（read-only。§5）。identity だけで描画し snapshot 本体は開かない。各行から閲覧へ遷移。
// ============================================================
// HISTORY-CLOUD (#343): 当日アプリ「大会履歴」にクラウドの過去大会も表示（①別セクション）。
//   クラウドは選手ごと集計のみ＝結果一覧で表示（1回戦ごとの星取りはローカル保存分のみ）。
//   要ログイン＋オンライン・fail-soft（未ログイン/オフライン/config 不在は案内のみ＝当日運営は無傷）。
//   既存クラウド機構（loadCloudDeps/getSession/claim_organizer_seat/pickActiveClubId/applyCloudStatus）を再利用。
// ============================================================
// クラウド過去大会の取得結果をセッション内で保持（タップ→戻る で一覧を再取得せず即復元・履歴タブ再表示でも維持）。
var _cloudHistoryState=null;
// 診断用：Supabase エラーの要点（code/message）を短く取り出す（#343 過去大会取得の不具合切り分け）。
function cloudErrDetail(err){ if(!err)return '不明'; var c=err.code?('['+err.code+'] '):''; return c+(err.message||err.details||err.hint||'エラー'); }
function fetchCloudTournaments(client, clubId){
  if(!client||!client.from)return Promise.resolve({ok:false,message:'クラウドに接続していません',tournaments:[]});
  return client.from('tournaments').select('id,name,date,season,status').eq('club_id',clubId).then(function(res){
    if(res&&res.error)return {ok:false,message:'大会の読み込みに失敗しました：'+cloudErrDetail(res.error),tournaments:[]};
    return {ok:true,tournaments:(res&&res.data)||[]};
  });
}
function fetchCloudEntriesForTournament(client, tid, clubId){
  if(!client||!client.from)return Promise.resolve({ok:false,message:'クラウドに接続していません',entries:[]});
  // entries→players は FK が2本（player_id / (club_id,player_id)）で埋め込みが曖昧になるため、
  // players は埋め込まず別取得して JS で突き合わせる（制約名に非依存・確実）。
  return client.from('entries').select('final_rank,class,wins,losses,sos,sodos,player_id').eq('tournament_id',tid).then(function(res){
    if(res&&res.error)return {ok:false,message:'結果の読み込みに失敗しました：'+cloudErrDetail(res.error),entries:[]};
    var rows=(res&&res.data)||[];
    return client.from('players').select('id,member_id,members(name,yomi)').eq('club_id',clubId).then(function(pr){
      if(pr&&pr.error)return {ok:false,message:'選手情報の読み込みに失敗しました：'+cloudErrDetail(pr.error),entries:[]};
      var byId={}; var plist=(pr&&pr.data)||[];
      for(var i=0;i<plist.length;i++){ if(plist[i])byId[plist[i].id]=plist[i]; }
      for(var j=0;j<rows.length;j++){ var pl=byId[rows[j]&&rows[j].player_id]; rows[j].players=pl?{member_id:pl.member_id,members:pl.members}:null; }
      return {ok:true,entries:rows};
    });
  });
}
function buildCloudTournamentListHtml(tournaments){
  var arr=Array.isArray(tournaments)?tournaments.slice():[];
  arr.sort(function(a,b){var da=(a&&a.date)||'',db=(b&&b.date)||'';return da<db?1:(da>db?-1:0);});
  if(!arr.length)return '<div style="padding:20px;text-align:center;color:#888;background:#f7f7f7;border-radius:8px">クラウドに過去大会がありません。</div>';
  var html='';
  for(var i=0;i<arr.length;i++){var t=arr[i];
    var nm=escapeHtml((t&&t.name)||'(名称未設定)');
    var dt=escapeHtml((t&&t.date)||'—');
    var sn=escapeHtml((t&&t.season)||'');
    // ローカル履歴カード(.history-row)と同じ2行レイアウトに統一。
    html+='<button type="button" class="cloud-history-row" data-tid="'+escapeHtml((t&&t.id)||'')+'" data-label="'+nm+'" data-date="'+dt+'" style="display:block;width:100%;text-align:left;background:#fff;border:1px solid #d3dbe5;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer">'
      +'<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="font-weight:600;color:#1F3864">'+nm+'</span><span style="font-size:11px;color:#999">'+sn+'</span></div>'
      +'<div style="font-size:12px;color:#555;margin-top:4px">開催日 '+dt+'　/　タップで結果を表示</div>'
      +'</button>';
  }
  return html;
}
// クラウド結果を「最終結果タブ」と同じ見た目（クラス別セクション＋金銀銅バッジ＋順位で色分け＋勝/負/相手(B)/勝相手(C)）で描画。
//   既存 _resultsRankBadgeHtml と .section / .badge スタイルを流用（buildResultsMobileHtml と同系）。クラウドは星取り無しのため回戦セルは出さない。
function _cloudResultRankInfo(e){
  var rank=(e&&e.final_rank!=null)?e.final_rank:null;
  return { rank:rank, badge:(rank!=null)?_resultsRankBadgeHtml(rank):'-', rowCls:rank===1?'row-r1':rank===2?'row-r2':rank===3?'row-r3':'',
    color:rank===1?'#fef8e7':rank===2?'#f5f5f5':rank===3?'#eaf3fb':'#fff' };
}
// スマホ用カード（縦に積む）。
function _cloudResultCardsHtml(rows){
  var html='';
  for(var j=0;j<rows.length;j++){
    var e=rows[j]; var p=e&&e.players; var m=p&&p.members;
    var nm=(m&&m.name)||''; var ym=(m&&m.yomi)||''; var ri=_cloudResultRankInfo(e);
    var wins=(e&&e.wins!=null)?e.wins:'-'; var losses=(e&&e.losses!=null)?e.losses:'-';
    var sos=(e&&e.sos!=null)?e.sos:'-'; var sodos=(e&&e.sodos!=null)?e.sodos:'-';
    html+='<div style="background:'+ri.color+';border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">';
    html+='<div style="min-width:46px;text-align:center;flex:0 0 auto">'+ri.badge+'</div>';
    html+='<div style="flex:1;min-width:0">';
    html+='<div style="font-weight:500;font-size:15px">'+playerNameRubyHtml(nm,ym)+'</div>';
    html+='<div style="font-size:12px;color:#555;margin-top:2px">勝：<strong>'+escapeHtml(String(wins))+'</strong>　負：'+escapeHtml(String(losses))+'　相手(B)：'+escapeHtml(String(sos))+'　勝相手(C)：'+escapeHtml(String(sodos))+'</div>';
    html+='</div></div>';
  }
  return html;
}
// PC/ワイド用テーブル（最終結果タブ buildResultsDesktopHtml と同型・全幅を使う）。
function _cloudResultTableHtml(rows){
  var html='<div style="overflow-x:auto"><table><thead><tr><th style="width:64px">順位</th><th style="text-align:left">氏名</th><th>勝数(A)</th><th>負数</th><th>B<br><small style="font-weight:normal;font-size:10px">対戦相手<br>勝数合計</small></th><th>C<br><small style="font-weight:normal;font-size:10px">勝った相手<br>勝数合計</small></th></tr></thead><tbody>';
  for(var j=0;j<rows.length;j++){
    var e=rows[j]; var p=e&&e.players; var m=p&&p.members;
    var nm=(m&&m.name)||''; var ym=(m&&m.yomi)||''; var ri=_cloudResultRankInfo(e);
    var wins=(e&&e.wins!=null)?e.wins:'-'; var losses=(e&&e.losses!=null)?e.losses:'-';
    var sos=(e&&e.sos!=null)?e.sos:'-'; var sodos=(e&&e.sodos!=null)?e.sodos:'-';
    html+='<tr class="'+ri.rowCls+'"><td>'+ri.badge+'</td><td style="text-align:left;font-weight:500">'+playerNameRubyHtml(nm,ym)+'</td>'
      +'<td><strong>'+escapeHtml(String(wins))+'</strong></td><td>'+escapeHtml(String(losses))+'</td><td>'+escapeHtml(String(sos))+'</td><td>'+escapeHtml(String(sodos))+'</td></tr>';
  }
  html+='</tbody></table></div>';
  return html;
}
// クラウド結果を「最終結果タブ」と同じ見た目で描画。画面幅でPC=表／スマホ=カードを切替（renderResults と同方針）。
//   既存 _resultsRankBadgeHtml / .row-r* / .section を流用。クラウドは星取り無しのため回戦セルは出さない。isSP は省略時 window 幅で判定（テスト注入可）。
function buildCloudResultBlocksHtml(entries, isSP){
  var list=Array.isArray(entries)?entries.slice():[];
  if(!list.length)return '<div style="padding:20px;text-align:center;color:#888;background:#f7f7f7;border-radius:8px">この大会の結果がありません。</div>';
  if(isSP===undefined)isSP=(typeof window!=='undefined'&&window.innerWidth)?(window.innerWidth<600):false;
  var groups={}, order=[];
  for(var i=0;i<list.length;i++){
    var cls=(list[i]&&list[i]['class']!=null&&String(list[i]['class'])!=='')?String(list[i]['class']):'（クラス未設定）';
    if(!groups[cls]){ groups[cls]=[]; order.push(cls); }
    groups[cls].push(list[i]);
  }
  order.sort();
  var html='';
  for(var g=0;g<order.length;g++){
    var key=order[g]; var rows=groups[key].slice();
    rows.sort(function(a,b){ var ra=(a&&a.final_rank!=null)?a.final_rank:9999, rb=(b&&b.final_rank!=null)?b.final_rank:9999; return ra-rb; });
    html+='<div class="section"><h2>'+escapeHtml(key)+(key==='（クラス未設定）'?'':'クラス')+' 最終結果</h2>';
    html+= isSP ? _cloudResultCardsHtml(rows) : _cloudResultTableHtml(rows);
    html+='<div style="margin-top:8px;font-size:12px;color:#666">※順位：①勝数(A)　②B（対戦相手の勝数合計）　③C（勝った相手の勝数合計）　④直接対決　⑤くじ引き</div>';
    html+='</div>';
  }
  return html;
}
// タップした大会の結果を「履歴一覧を差し替えて先頭に大きく表示」する（renderHistoryDetail と同じ全画面パターン）。
function renderCloudTournamentDetail(client,clubId,tid,label,date){
  var host=document.getElementById('history-content'); if(!host)return;
  host.innerHTML='<div style="padding:24px;text-align:center;color:#888">読み込み中…</div>';
  if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
  fetchCloudEntriesForTournament(client,tid,clubId).then(function(r){
    var h=document.getElementById('history-content'); if(!h)return;
    var html='';
    html+='<div style="margin-bottom:10px"><button type="button" class="btn-sm" id="cloud-history-back-btn" style="background:#fff;color:#444;font-size:13px;padding:6px 12px;border:1px solid #ccc;border-radius:6px;cursor:pointer">← クラウドの大会一覧へ戻る</button></div>';
    html+='<div style="background:#e8f0f8;border:1px solid #9DB7D5;color:#1F3864;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600">☁ クラウドの過去大会（閲覧専用・みんなで共有）</div>';
    html+='<div style="margin-bottom:10px"><div style="font-size:16px;font-weight:700;color:#1F3864">'+escapeHtml(label||'(大会名未設定)')+'</div>'+(date?'<div style="font-size:12px;color:#666;margin-top:2px">開催日 '+escapeHtml(date)+'</div>':'')+'</div>';
    html+= r.ok ? buildCloudResultBlocksHtml(r.entries) : '<div class="alert alert-err" style="font-size:13px">'+escapeHtml(r.message||'結果の取得に失敗しました')+'</div>';
    h.innerHTML=html;
    if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
    var back=document.getElementById('cloud-history-back-btn');
    if(back)back.addEventListener('click',function(){ renderHistoryList(); });
  });
}
function bindCloudHistoryRows(client, clubId){
  var listEl=document.getElementById('history-cloud-list'); if(!listEl)return;
  var rows=listEl.querySelectorAll('.cloud-history-row');
  for(var i=0;i<rows.length;i++){
    rows[i].addEventListener('click',(function(node){return function(){
      var tid=node.getAttribute('data-tid');
      var lbl=node.getAttribute('data-label')||''; var ldt=node.getAttribute('data-date')||'';
      renderCloudTournamentDetail(client,clubId,tid,lbl,ldt);
    };})(rows[i]));
  }
}
// クラウド過去大会の取得オーケストレーション（pullMembersToMasterUI と対称・fail-soft）。
function loadCloudPastTournamentsUI(setStatus){
  setStatus=setStatus||function(){};
  setStatus('クラウドの過去大会を取得中…');
  return loadCloudDeps().then(function(dep){
    if(dep&&dep.offline){ setStatus('オフラインのため取得できません（ネット接続後に再度お試しください・運営は続行できます）'); return {ok:false,step:'offline'}; }
    if(!dep.cfg){ setStatus('クラウド設定がありません（取得は任意です・運営は続行できます）'); return {ok:false,step:'config'}; }
    if(!dep.sb){ setStatus('クラウドに接続できませんでした（オフライン等・運営は続行できます）'); return {ok:false,step:'network'}; }
    var client=window.supabase.createClient(window.SHOGI_CLOUD_CONFIG.url,window.SHOGI_CLOUD_CONFIG.publishableKey);
    if(!client||!client.auth){ setStatus('クラウドに接続できませんでした'); return {ok:false,step:'client'}; }
    return client.auth.getSession().then(function(r){
      var session=r&&r.data&&r.data.session;
      if(!session){ setStatus('クラウド管理ページ（app/）でログインすると過去大会を表示できます'); return {ok:false,step:'auth'}; }
      return client.rpc('claim_organizer_seat').then(function(rc){
        var clubId=pickActiveClubId((rc&&rc.data)||[]);
        if(!clubId){ setStatus('取得元クラブを一意に特定できません（有効な幹事クラブが無い／複数所属の可能性・管理ページを確認してください）'); return {ok:false,step:'club'}; }
        return fetchCloudTournaments(client,clubId).then(function(res){
          if(!res.ok){ setStatus('取得に失敗しました：'+(res.message||'不明')+'（運営は続行できます・再取得できます）'); return res; }
          _cloudHistoryState={tournaments:res.tournaments,client:client,clubId:clubId,count:res.tournaments.length};
          var listEl=document.getElementById('history-cloud-list');
          if(listEl){ listEl.innerHTML=buildCloudTournamentListHtml(res.tournaments); bindCloudHistoryRows(client,clubId); }
          setStatus('クラウドの過去大会 '+res.tournaments.length+' 件（大会名をタップで結果表示）');
          return res;
        });
      });
    });
  }).catch(function(e){ setStatus('取得エラー：'+((e&&e.message)||e)+'（運営は続行できます）'); return {ok:false,step:'exception'}; });
}

function renderHistoryList(flashMessage){
  var host=document.getElementById('history-content');
  if(!host)return;
  var archive=loadArchive();
  var list=sortArchiveTournaments(archive.tournaments);
  var html='';
  if(flashMessage)html+='<div class="alert alert-ok" style="margin-bottom:10px">'+escapeHtml(flashMessage)+'</div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">';
  html+='<h2 style="font-size:16px;margin:0;color:#1F3864">大会履歴</h2>';
  html+='<button type="button" class="btn-primary" id="history-save-btn">現在の大会を履歴へ保存</button>';
  html+='</div>';
  html+='<div style="font-size:12px;color:#888;margin-bottom:12px">過去に保存した大会を閲覧専用で確認できます（このブラウザ内にのみ保存。当日の大会データには影響しません）。</div>';
  if(list.length===0){
    html+='<div style="padding:24px;text-align:center;color:#888;background:#f7f7f7;border-radius:8px">保存された大会履歴はありません。<br>当日の大会を「現在の大会を履歴へ保存」で残せます。</div>';
  }else{
    for(var i=0;i<list.length;i++){
      var e=list[i];var id=(e&&e.identity)||{};
      var month=escapeHtml(id.targetMonthLabel||id.heldDate||'（対象月未設定）');
      var ttl=escapeHtml(id.title||'（大会名未設定）');
      var held=escapeHtml(id.heldDate||'—');
      var clsCount=(id.classes&&id.classes.length)||0;
      var pcount=(typeof id.participantCount==='number')?id.participantCount:'—';
      var champ=buildArchiveChampionLabel(id.champions);
      var saved=escapeHtml(formatArchiveSavedAt(e&&e.savedAt));
      var tidAttr=escapeHtml(id.tournament_id||'');
      html+='<button type="button" class="history-row" data-tid="'+tidAttr+'" style="display:block;width:100%;text-align:left;background:#fff;border:1px solid #d3dbe5;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer">';
      html+='<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="font-weight:600;color:#1F3864">'+month+'　'+ttl+'</span><span style="font-size:11px;color:#999">保存 '+saved+'</span></div>';
      html+='<div style="font-size:12px;color:#555;margin-top:4px">開催日 '+held+'　/　'+clsCount+'クラス　/　'+pcount+'名'+(champ?'　/　優勝 '+champ:'')+'</div>';
      html+='</button>';
    }
  }
  // HISTORY-CLOUD: クラウドの過去大会セクション（別セクション・①案）。読み込みは押下時（fail-soft）。
  html+='<hr class="separator">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px"><h2 style="font-size:16px;margin:0;color:#1F3864">☁ クラウドの過去大会（みんなで共有）</h2><button type="button" class="btn-sm" id="history-cloud-load" style="background:#fff;border:1px solid #1F3864;color:#1F3864">読み込む</button></div>';
  html+='<div style="font-size:12px;color:#888;margin-bottom:6px">クラウドに保存された過去大会の結果一覧です（ログイン＋オンライン時）。</div>';
  html+='<div id="history-cloud-status" class="cloud-status" role="status" aria-live="polite" style="font-size:12px;margin-bottom:6px"></div>';
  html+='<div id="history-cloud-list"></div>';
  host.innerHTML=html;
  var saveBtn=document.getElementById('history-save-btn');
  if(saveBtn)saveBtn.addEventListener('click',saveCurrentTournamentToArchive);
  var rows=host.querySelectorAll('.history-row');
  for(var r=0;r<rows.length;r++){
    rows[r].addEventListener('click',function(){renderHistoryDetail(this.getAttribute('data-tid'));});
  }
  var cloudLoadBtn=document.getElementById('history-cloud-load');
  if(cloudLoadBtn)cloudLoadBtn.addEventListener('click',function(){
    loadCloudPastTournamentsUI(function(msg){ if(typeof applyCloudStatus==='function')applyCloudStatus(document.getElementById('history-cloud-status'),msg); else { var el=document.getElementById('history-cloud-status'); if(el)el.textContent=msg; } });
  });
  // 既に取得済みなら一覧を即復元（戻る/再表示で再取得不要）。
  if(_cloudHistoryState&&_cloudHistoryState.tournaments){
    var cl=document.getElementById('history-cloud-list');
    if(cl){ cl.innerHTML=buildCloudTournamentListHtml(_cloudHistoryState.tournaments); bindCloudHistoryRows(_cloudHistoryState.client,_cloudHistoryState.clubId); }
    if(typeof applyCloudStatus==='function')applyCloudStatus(document.getElementById('history-cloud-status'),'クラウドの過去大会 '+_cloudHistoryState.count+' 件（大会名をタップで結果表示）');
  }
}

// 過去大会の read-only 閲覧（§6）。既存 scoreboard レンダラを snapshot 入力で流用（編集 UI を一切出さない）。
//   現行大会へは「履歴一覧へ戻る」＋他タブで戻れる。snapshot 描画は withSourceState で行われ global state は不変。
function renderHistoryDetail(tid){
  var host=document.getElementById('history-content');
  if(!host)return;
  var archive=loadArchive();
  var entry=findArchiveEntryByTid(archive,tid);
  if(!entry){ renderHistoryList(); return; }
  var id=entry.identity||{};
  var snap=entry.snapshot||{};
  var html='';
  html+='<div style="margin-bottom:10px"><button type="button" class="btn-sm" id="history-back-btn" style="background:#fff;color:#444;font-size:13px;padding:6px 12px;border:1px solid #ccc;border-radius:6px;cursor:pointer">← 履歴一覧へ戻る</button></div>';
  html+='<div style="background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600">閲覧専用：過去の大会です（編集できません）</div>';
  html+='<div style="margin-bottom:10px">';
  html+='<div style="font-size:16px;font-weight:700;color:#1F3864">'+escapeHtml(id.title||'（大会名未設定）')+'</div>';
  var meta=[];
  if(id.targetMonthLabel)meta.push('対象月：'+id.targetMonthLabel);
  if(id.heldDate)meta.push('開催日：'+id.heldDate);
  meta.push('保存日時：'+formatArchiveSavedAt(entry.savedAt));
  html+='<div style="font-size:12px;color:#666;margin-top:2px">'+escapeHtml(meta.join('　／　'))+'</div>';
  html+='</div>';
  var classes=(id.classes&&id.classes.length)?id.classes:deriveArchiveClassesFromSnapshot(snap);
  var body='';
  for(var i=0;i<classes.length;i++){
    var cid=classes[i]&&classes[i].id;
    if(!cid)continue;
    body+=buildScoreboardClassTableHtml(cid,snap);
  }
  if(!body)body='<div style="padding:20px;text-align:center;color:#888">この大会には表示できる対局データがありません。</div>';
  html+='<div style="background:#eef2f7;padding:8px;border-radius:8px">'+body+'</div>';
  host.innerHTML=html;
  var back=document.getElementById('history-back-btn');
  if(back)back.addEventListener('click',function(){renderHistoryList();});
}

// 当日UX: localStorage の自動退避（eviction）を抑止＝大会途中の消失耐性。失敗は無視。起動時に一度要求（DOM 非依存）。
try{ if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
document.addEventListener('DOMContentLoaded',function(){
  bindHeaderEvents();
  bindRegistrationEvents();
  bindTabEvents();
  bindReportEvents();
  initApp();
  initScoreboard();
  // B-3c-auto (#343): 起動時 auto-pull（非ブロッキング・無音・fail-soft）。描画完了後に次 tick で実行。
  if(typeof scheduleAutoPullMembers==='function')scheduleAutoPullMembers();
});
</script>
