  return html;
}

function buildCurrentPairingsHtml(cls, roundNum, done){
  if(done){
    return '<div class="final-done">全'+state.rounds+'局終了！「最終結果」タブで確認してください。</div>';
  }
  if(state.pairings[cls].length===0)return '';
  var html='';
  var duplicatePlayers=getDuplicatePlayersInPairings(cls);
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3>'+roundNum+'回戦 組み合わせ</h3><span style="background:#2E75B6;color:#fff;padding:4px 12px;border-radius:20px;font-size:13px">'+roundNum+' / '+state.rounds+'回戦</span></div>';
  if(duplicatePlayers.length>0){
    html+='<div class="alert alert-err">同じ選手が複数の対局に入っています：'+escapeHtml(duplicatePlayers.map(function(pid){return getName(pid,cls);}).join('、'))+'</div>';
  }

  // Issue #272 / Codex P1: 待機者（2回戦以降に組み合わせへ入らない参加者）を運営に明示する（表示のみ・
  //   ブロックしない）。奇数の leftover だけでなく回戦生成後に途中追加された参加者も含むため、
  //   「人数が奇数のため」と限定せず人数非依存の文言にし、複数名でもそのまま列挙する。
  var leftoverPlayers=getRoundLeftoverPlayers(cls);
  if(leftoverPlayers.length>0){
    var leftoverNames=leftoverPlayers.map(function(p){return getName(p.id,cls);}).join('、');
    html+='<div class="alert alert-warn" style="margin-bottom:12px">⚠ 今回戦の組み合わせに入っていない待機者がいます（不戦勝にはなりません）：'+escapeHtml(leftoverNames)+'<div style="font-size:11px;color:#666;margin-top:4px">※ 待機者は勝敗に影響しません。確定すると次の回戦で組み合わせに戻ります。</div></div>';
  }

  // A-4 §1, §6: ペアリング品質評価 → 警告バナー（表示のみ・ブロックしない）
  var quality=evaluatePairingQuality(state.pairings[cls],state.results[cls],state.players[cls]);
  if(quality.warningHit){
    var warns=[];
    if(quality.rematchCount>0)warns.push('再戦 '+quality.rematchCount+'件');
    if(quality.avoidableWinDiffPairs>0)warns.push('同勝数で組めた可能性のある異勝数ペア '+quality.avoidableWinDiffPairs+'件');
    if(quality.maxWinDiff>=2)warns.push('勝数差 '+quality.maxWinDiff+' のペアあり');
    // PAIRING-UX-WARNING-DECISION-SUPPORT-IMPL-LIGHT (PR #100 Phase 1):
    //   pairing-card 側に勝敗数を併記した上で、warning object / evaluatePairingQuality()
    //   を変更せずに、勝敗起因警告のみ「勝敗数を確認」する旨の短い理由補足を追加。
    //   rematch 単独警告には補足を出さない（記載すると勝敗で再戦警告を解決できると誤読される）。
    var winRelatedWarn=(quality.avoidableWinDiffPairs>0)||(quality.maxWinDiff>=2);
    var supplementHtml=winRelatedWarn
      ?'<div style="font-size:11px;color:#666;margin-top:4px">勝敗数が異なるペアがあります。各対局カードに表示された勝敗数を確認してください。</div>'
      :'';
    html+='<div class="alert alert-warn" style="margin-bottom:12px">⚠ 要確認：'+escapeHtml(warns.join(' / '))+supplementHtml+'<div style="font-size:11px;color:#666;margin-top:4px">※ 操作はブロックされません。例外判断は現場運営に委ねます。</div></div>';
  }

  // PAIRING-UX-WARNING-DECISION-SUPPORT-IMPL-LIGHT (PR #100 §5.1 Phase 1):
  //   pairing-card に勝敗数併記用の補助ラベルを表示するため、wins / totals / player by id を準備。
  //   formatParticipantLabel(player, {mode:'standard', includeRecord:true, record:{wins, losses}})
  //   経由で補助ラベルを生成し、各 winner-btn の下に小さく表示する。
  //   既存の button (winner-btn) と n1/n2（getNameWithNo）はそのまま維持（並存）。
  //
  // cowork Should Fix (PR #103) / pcTotals セマンティクス:
  //   pairing-card record uses completed results only;
  //   unfinished current pairings must not count as losses.
  //   - 集計対象は state.results[cls]（submitRound() で全 winner 確定後に push、
  //     editPastResult() は winner を p1/p2 で上書きするのみで null 化しない）
  //   - 現ラウンド (state.pairings[cls]) は対象外。winner 未入力の現行対局を
  //     loss と数えない。
  //   - 防御的に pcMatch.winner が無い場合は totals にも加算しない
  //     （getWins() の winner-only 集計と整合させ、losses = totals - wins
  //     を「確定済み対局数 - 勝ち数」として常に正に保つ）。
  var pcWins=getWins(cls);
  var pcTotals={};
  for(var pcI=0;pcI<state.players[cls].length;pcI++)pcTotals[state.players[cls][pcI].id]=0;
  for(var pcR=0;pcR<state.results[cls].length;pcR++){
    for(var pcM=0;pcM<state.results[cls][pcR].length;pcM++){
      var pcMatch=state.results[cls][pcR][pcM];
      // winner 未確定の match は totals に含めない（cowork Should Fix PR #103）
      if(!pcMatch||!pcMatch.winner)continue;
      if(pcMatch.p1&&Object.prototype.hasOwnProperty.call(pcTotals,pcMatch.p1))pcTotals[pcMatch.p1]++;
      if(pcMatch.p2&&Object.prototype.hasOwnProperty.call(pcTotals,pcMatch.p2))pcTotals[pcMatch.p2]++;
    }
  }
  var pcPlayerById={};
  for(var pcJ=0;pcJ<state.players[cls].length;pcJ++)pcPlayerById[state.players[cls][pcJ].id]=state.players[cls][pcJ];
  function pcBuildAuxLabel(playerId){
    var pObj=pcPlayerById[playerId];
    if(!pObj)return '';
    var w=pcWins[playerId]||0;
    // losses は「確定済み対局数 - 勝ち数」。負値防御（cowork PR #103 Nice to Have）。
    var l=Math.max(0,(pcTotals[playerId]||0)-w);
    return formatParticipantLabel(pObj,{mode:'standard',includeRecord:true,record:{wins:w,losses:l}});
  }

  for(var i=0;i<state.pairings[cls].length;i++){
    var m=state.pairings[cls][i];
    var n1=getNameWithNo(m.p1,cls),n2=getNameWithNo(m.p2,cls);
    var aux1=pcBuildAuxLabel(m.p1),aux2=pcBuildAuxLabel(m.p2);
    var detail=quality.pairDetails[i]||{labels:[]};
    var labelsHtml='';
    for(var li=0;li<detail.labels.length;li++){
      var lab=detail.labels[li];
      // [要確認] は赤系、[手動変更] は青系、それ以外は灰系
      var labColor=(lab==='要確認')?'#A32D2D':(lab==='手動変更'?'#2E75B6':'#666');
      var labBg=(lab==='要確認')?'#FBEAEA':(lab==='手動変更'?'#E7F0FA':'#F0F0F0');
      labelsHtml+='<span style="display:inline-block;padding:2px 6px;margin-right:4px;font-size:11px;color:'+labColor+';background:'+labBg+';border-radius:4px">['+escapeHtml(lab)+']</span>';
    }
    html+='<div class="pairing-card" style="position:relative">'
      // A-4 §3 MF6-a: 卓番号バッジ（配列 index+1 から算出。永続化なし）
      +'<div style="position:absolute;top:6px;left:6px;padding:2px 8px;border-radius:4px;background:#1F3864;color:#fff;font-size:11px;font-weight:bold">第 '+(i+1)+' 卓</div>'
      +'<button style="position:absolute;top:6px;right:6px;padding:3px 7px;border-radius:5px;border:1px solid #ccc;background:#fff;font-size:11px;color:#888;cursor:pointer" id="chgbtn_'+cls+'_'+i+'">変更</button>'
      +'<div class="winner-row" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;margin-top:28px">'
      +'<div style="display:flex;flex-direction:column;align-items:center">'
      +'<button class="winner-btn'+(m.winner===m.p1?' selected':'')+'" id="wb_'+cls+'_'+i+'_p1">'+escapeHtml(n1)+'</button>'
      // PAIRING-UX-WARNING-DECISION-SUPPORT-IMPL-LIGHT: formatParticipantLabel による勝敗数併記補助ラベル
      +(aux1?'<div data-pairing-aux="p1" style="font-size:11px;color:#444;margin-top:3px;text-align:center;line-height:1.3;max-width:9em;word-break:break-word">'+escapeHtml(aux1)+'</div>':'')
      +(m.winner===m.p1?'<div style="font-size:11px;font-weight:bold;color:#27500A;text-align:center;margin-top:3px">▲ 勝</div>':'')
      +'</div>'
      +'<span style="font-weight:500;color:#888;padding-top:12px">vs</span>'
      +'<div style="display:flex;flex-direction:column;align-items:center">'
      +'<button class="winner-btn'+(m.winner===m.p2?' selected':'')+'" id="wb_'+cls+'_'+i+'_p2">'+escapeHtml(n2)+'</button>'
      // PAIRING-UX-WARNING-DECISION-SUPPORT-IMPL-LIGHT: formatParticipantLabel による勝敗数併記補助ラベル
      +(aux2?'<div data-pairing-aux="p2" style="font-size:11px;color:#444;margin-top:3px;text-align:center;line-height:1.3;max-width:9em;word-break:break-word">'+escapeHtml(aux2)+'</div>':'')
      +(m.winner===m.p2?'<div style="font-size:11px;font-weight:bold;color:#27500A;text-align:center;margin-top:3px">▲ 勝</div>':'')
      +'</div>'
      +'</div>'
      // A-4 §2, §5: 理由ラベル（軽量ラベル方式）
      +(labelsHtml?'<div style="margin-top:4px">'+labelsHtml+'</div>':'')
      +'</div>';
  }
  // DAYOF-UNENTERED-COUNTER (当日第2弾⑥): 未入力（勝者未選択）の卓を数えて表示し、未入力がある間は
  //   「確定して次へ」を無効化する（取りこぼし／事後 alert を減らす）。submitRound の既存ガードは温存（二重防御）。
  //   勝者選択は setWinner→renderTournament で毎回再描画されるためカウンタ／無効化はライブ更新される。
  var unfinishedCount=0;
  for(var ufi=0;ufi<state.pairings[cls].length;ufi++){ if(state.pairings[cls][ufi]&&!state.pairings[cls][ufi].winner)unfinishedCount++; }
  var totalTables=state.pairings[cls].length;
  html+=(unfinishedCount>0
    ?'<div class="alert alert-warn" style="margin:8px 0 0">残り <strong>'+unfinishedCount+'</strong> 卓 未入力です（全'+totalTables+'卓）。すべて入力すると「確定して次へ」が押せます。</div>'
    :'<div class="alert alert-ok" style="margin:8px 0 0">✓ 全 '+totalTables+' 卓 入力済みです。「確定して次へ」を押せます。</div>');
  html+='<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="btn-success" id="submitBtn_'+cls+'"'+(unfinishedCount>0?' disabled aria-disabled="true" style="opacity:0.5;cursor:not-allowed"':'')+'>'+roundNum+'回戦 確定して次へ</button>'
    // FRP-IMPL-004B (設計 §5.4 / §5.4.2): 部分手合い組成中（started・results 空・未割当>0）は
    //   再生成ボタンを出力しない（HTML に出さない＝bind 対象も存在しない）。未割当0 は由来を問わず従来どおり出力。
    +(shouldShowRegenerateButton(cls)
      ?'<button style="padding:8px 16px;border-radius:8px;border:1px solid #2E75B6;background:#fff;color:#2E75B6;font-size:14px;cursor:pointer" id="repairBtn_'+cls+'">組み合わせを再生成</button>'
      :'')
    +'</div>';
  return html;
}

function bindTournamentEvents(cls){
  for(var i=0;i<state.pairings[cls].length;i++){
    (function(idx,c){
      var m=state.pairings[cls][idx];
      var b1=document.getElementById('wb_'+c+'_'+idx+'_p1');
      var b2=document.getElementById('wb_'+c+'_'+idx+'_p2');
      var cb=document.getElementById('chgbtn_'+c+'_'+idx);
      if(b1)b1.addEventListener('click',function(){setWinner(c,idx,m.p1);});
      if(b2)b2.addEventListener('click',function(){setWinner(c,idx,m.p2);});
      if(cb)cb.addEventListener('click',function(){changePairing(c,idx);});
    })(i,cls);
  }
  var sb=document.getElementById('submitBtn_'+cls);
  if(sb)sb.addEventListener('click',function(){submitRound(cls);});
  var rb=document.getElementById('repairBtn_'+cls);
  if(rb)rb.addEventListener('click',function(){
    var pairings=state.pairings[cls]||[];
    var hasWinner=pairings.some(function(m){return m&&m.winner;});
    if(hasWinner){
      if(!confirm('入力済みの勝敗があります。組み合わせを再生成すると勝敗が消えます。続けますか？'))return;
    }else if(((state.results&&state.results[cls])||[]).length===0&&pairings.length>0){
      // FRP-IMPL-004B (設計 §5.4.1): 結果未確定の初回 round の再生成は「今の手合いを作り直す」破壊操作。
      //   部分手合い・未割当0 と通常開始 round1・未割当0 は state で識別できないため由来を問わず同じ確認を出す。
      if(!confirm('現在の組み合わせをすべて作り直します。今ある手合いは破棄され、全員をペアし直します。よろしいですか？'))return;
    }
    generatePairing(cls);renderTournament(cls);
  });

  for(var rr=0;rr<state.results[cls].length;rr++){
    for(var mm=0;mm<state.results[cls][rr].length;mm++){
      (function(ri,mi,c){
        var btn=document.getElementById('editpast_'+c+'_'+ri+'_'+mi);
        if(btn)btn.addEventListener('click',function(){editPastResult(c,ri,mi);});
      })(rr,mm,cls);
    }
  }
}

// ROUND-CLASS-START-004b (spec §11.3 / §11.4):
//   pane-{classId} 上部に表示する class action bar を生成する view helper / reader。
//   - class started=false かつ参加者 >= 2 かつ偶数 → 「<className>全員で1局目を開始」ボタン（§7 正規の開始導線）
//   - class started=true                                → 「<className>をリセット」ボタン
//   - 参加者 0 / 1 / 奇数 / 既開始以外でも、validator が拒否する場合は空（誤操作防止）。
//   classId / className を escapeHtml して出力（XSS 対策）。
//   ROUND-CLASS-START-005 (Codex Review S2 持ち越し):
//     state.classes / state.players[cls] / isClassStarted(cls) を読むため pure helper ではない
//     （reader、副作用なし、global state 依存）。引数のみで動作する pure 化は別タスクで検討。
function buildClassActionBarHtml(cls){
  var classInfo=null;
  if(Array.isArray(state.classes)){
    for(var i=0;i<state.classes.length;i++){
      if(state.classes[i]&&state.classes[i].id===cls){classInfo=state.classes[i];break;}
    }
  }
  var className=(classInfo&&classInfo.name)?classInfo.name:(cls+'クラス');
  var players=(state.players&&state.players[cls])||[];
  var classStarted=isClassStarted(cls);
  // START-FRP-UX-001 (Feature 1): クラス別「開始」を主導線として目立たせ、「リセットだけが目立つ」状態を解消する。
  //   - 未開始: 「<className>全員で1局目を開始」を full-size btn-primary（主導線）にする（btn-sm を外す）。
  //   - 開始済み: 先頭に「✓ <className> 開始済み」の状態ラベルを置き、破壊的なリセットボタンを相対的に控えめにする
  //     （リセットは btn-danger btn-sm のまま据え置き＝誤操作防止・既存挙動不変）。
  //   id / 文言 / 未開始・開始済みの分岐は START-UX-CONSOLIDATE-001 / FRP-IMPL-002 のテスト pin を保持する
  //   （本変更は CSS クラスと状態ラベルの追加のみ。startBtnClass_/startBtnPartial_/resetBtnClass_ の id・文言は不変）。
  var html='<div class="class-action-bar" style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">';
  if(classStarted){
    html+='<span class="class-status-started" style="font-size:13px;color:#1F3864;font-weight:bold">✓ '+escapeHtml(className)+' 開始済み</span>';
    html+='<button type="button" class="btn-danger btn-sm" id="resetBtnClass_'+escapeHtml(cls)+'">'+escapeHtml(className)+'をリセット</button>';
    html+='<span style="font-size:12px;color:#888">※他クラスのデータは保持されます</span>';
  } else if(players.length>=2 && players.length%2===0){
    // START-UX-CONSOLIDATE-001 (設計 §7): 正規の開始導線。文言を「<className>全員で1局目を開始」に明確化。
    //   「全員」は全クラスではなく、そのクラス内全員の意味。startTournamentForClass(cls) は当該クラスのみ開始する。
    //   START-FRP-UX-001: 主導線として full-size btn-primary にする（btn-sm を外す）。
    html+='<button type="button" class="btn-primary" id="startBtnClass_'+escapeHtml(cls)+'">'+escapeHtml(className)+'全員で1局目を開始</button>';
    html+='<span style="font-size:12px;color:#888">※このクラス内の全員で開始します（他クラスは開始しません）</span>';
  }
  // FRP-IMPL-002/003 (FRP-DESIGN-002 §2.3 / §8): 未開始かつ参加者1名以上なら「部分開始」導線を併置。
  //   既存の一括開始(startBtnClass_「全員で1局目を開始」)とは別 id・別導線（偶数/奇数を問わず出す＝奇数でも来た人から開始可）。
  //   startClassPartial で started=true にし未割当一覧を表示する。FRP-IMPL-003 で、その一覧から選んで
  //   選択者だけの1局目対局を append 作成できる（onClickAppendFirstRound）。文言は「全員で1局目を開始」と対比する。
  //   既存 startBtnClass_ / リセットボタンの出力条件・id・文言は一切変更しない（純追加）。
  if(!classStarted && players.length>=1){
    html+='<button type="button" class="btn-primary btn-sm" id="startBtnPartial_'+escapeHtml(cls)+'" title="来ている人だけで先に始めます。未到着者は未割当として残ります。">このクラスを部分開始（未割当者を表示）</button>';
    html+='<span style="font-size:12px;color:#888">※部分開始にすると、1局目の未割当者から選んで対局を追加作成できます（既存の対局は変更しません）</span>';
  }
  html+='</div>';
  return html;
}

// ROUND-CLASS-START-004b: class action bar の click handler を bind する。
//   buildClassActionBarHtml が生成したボタンに対して、startTournamentForClass /
//   resetClassForClass を呼ぶ click handler を登録する。
function bindClassActionBarEvents(cls){
  var startBtn=document.getElementById('startBtnClass_'+cls);
  if(startBtn){
    startBtn.addEventListener('click',(function(c){return function(){startTournamentForClass(c);};})(cls));
  }
  var resetBtn=document.getElementById('resetBtnClass_'+cls);
  if(resetBtn){
    resetBtn.addEventListener('click',(function(c){return function(){resetClassForClass(c);};})(cls));
  }
  // FRP-IMPL-002 (FRP-DESIGN-002 §7 / §8): 部分開始ボタンの click を startClassPartial に bind（追加のみ）。
  var partialBtn=document.getElementById('startBtnPartial_'+cls);
  if(partialBtn){
    partialBtn.addEventListener('click',(function(c){return function(){startClassPartial(c);};})(cls));
  }
  // FRP-IMPL-003 (FRP-DESIGN-002 §7 / §8): 未割当一覧の「選択した参加者で1局目を追加作成」ボタンを
  //   onClickAppendFirstRound に bind。再入防止と実行時再検証は handler 側。pane innerHTML 設定後に呼ばれる。
  var addBtn=document.getElementById('frpAddBtn_'+cls);
  if(addBtn){
    addBtn.addEventListener('click',(function(c){return function(){onClickAppendFirstRound(c);};})(cls));
  }
  // PROGRESSIVE-PAIRING-IMPL-P1 (CONFIRMED spec §2): 「1卓追加」(受付順の先頭2名) を onClickAddOneTable に bind（追加のみ）。
  var addTableBtn=document.getElementById('addTableBtn_'+cls);
  if(addTableBtn){
    addTableBtn.addEventListener('click',(function(c){return function(){onClickAddOneTable(c);};})(cls));
  }
  // PROGRESSIVE-PAIRING-IMPL-P2 (CONFIRMED spec §P2): 「未手合いをまとめて1局目作成」を onClickAddAllTables に bind（追加のみ）。
  var addAllTablesBtn=document.getElementById('addAllTablesBtn_'+cls);
  if(addAllTablesBtn){
    addAllTablesBtn.addEventListener('click',(function(c){return function(){onClickAddAllTables(c);};})(cls));
  }
  // HELP-UX-001 (#308 (2)): 「？ ヘルプ」ボタンの click を openHelpModal('first-round') に bind（追加のみ・表示のみ）。
  var helpBtn=document.getElementById('helpBtnFirstRound_'+cls);
  if(helpBtn){
    helpBtn.addEventListener('click',function(){openHelpModal('first-round');});
  }
}

// HELP-UX-001 (#308 (2)): 対局画面の迷子防止 in-app ヘルプ（モーダル1つ）。既存モーダル三層
//   （build*ModalHtml / open*Modal / bind*ModalEvents ＋ fixed overlay）を踏襲した純追加。
//   ヘルプ本文は固定文字列レジストリ HELP_TEXTS に1箇所集約し、build 時に escapeHtml を通して
//   埋め込む（＝innerHTML に自由文を流さない・textContent 相当の安全表示。XSS 流入を増やさない）。
//   保存スキーマ・既存ロジックには触れない（表示のみ）。topic 別に拡張できる。
var HELP_TEXTS={
  'first-round':{
    title:'1局目の作り方ヘルプ',
    lines:[
      '「1卓追加」：受付順の先頭2名で1卓ずつ作成します。少しずつ始めたいときに使います。',

function buildHelpModalHtml(topic){
  var t=HELP_TEXTS[topic];
  var title=(t&&t.title)?t.title:'ヘルプ';
  var lines=(t&&t.lines)?t.lines:[];
  var html='<div style="background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto">';
  html+='<h3 style="margin:0 0 12px;font-size:16px;font-weight:500;color:#1F3864">'+escapeHtml(title)+'</h3>';
  html+='<ul style="margin:0 0 16px;padding-left:1.2em;font-size:13px;color:#444;line-height:1.7">';
  for(var i=0;i<lines.length;i++){
    html+='<li style="margin-bottom:6px">'+escapeHtml(lines[i])+'</li>';
  }
  html+='</ul>';
  html+='<div style="display:flex;gap:8px;justify-content:flex-end">';
  html+='<button type="button" id="help-modal-close" class="btn-sm" style="background:#fff">閉じる</button>';
  html+='</div></div>';
  return html;
}

function openHelpModal(topic){
  var existing=document.getElementById('help-modal');
  if(existing&&existing.remove)existing.remove();
  var modal=document.createElement('div');
  modal.id='help-modal';
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML=buildHelpModalHtml(topic);
  document.body.appendChild(modal);
  bindHelpModalEvents();
}

function bindHelpModalEvents(){
  var closeBtn=document.getElementById('help-modal-close');
  if(closeBtn)closeBtn.addEventListener('click',function(){
    var m=document.getElementById('help-modal');if(m&&m.remove)m.remove();
  });
  // overlay（背景）クリックでも閉じる。カード内クリックでは閉じない（e.target===modalEl のときだけ）。
  var modalEl=document.getElementById('help-modal');
  if(modalEl)modalEl.addEventListener('click',function(e){
    if(e&&e.target===modalEl){var m=document.getElementById('help-modal');if(m&&m.remove)m.remove();}
  });
}

// FRP-IMPL-002/003 (FRP-DESIGN-002 §8 / §8.3): 部分開始中クラスの「1局目 未割当参加者」一覧（選択 → append 作成）。
//   started=true かつ results 空 かつ 未割当>0 のときだけ中身を返す（それ以外は ''）。表示専用 helper（mutate しない）。
//   未割当者をチェックして「選択した参加者で1局目を追加作成」を押すと、既存対局を変更せず選択者だけの対局を末尾追加する。
//   既に1局目対局がある参加者は派生で除外され一覧に出ない（getUnassignedFirstRoundPlayers §5.3）。
//   氏名/番号は escapeHtml を通す（個人情報・XSS 対策）。チェック集約と append の bind は bindClassActionBarEvents 側
//   （frpAddBtn_ → onClickAppendFirstRound）で行い、表示と bind を分離する（この helper は addEventListener を持たない）。
function buildFirstRoundPartialSectionHtml(cls){
  if(!isClassStarted(cls))return '';
  var results=(state.results&&state.results[cls])||[];
  if(results.length>=1)return '';
  var unassigned=getUnassignedFirstRoundPlayers(cls);
  if(unassigned.length===0)return '';
  var html='<div class="frp-partial-section" data-frp-partial="1" style="margin:12px 0;padding:12px;border:1px solid #d0d7e2;border-radius:8px;background:#f7f9fc">';
  // FRP-UNASSIGNED-COUNT-001: 見出しに現在の未割当（1局目待機）人数を併記する。運営が「あと何人が
  //   1局目待ちか」を一目で把握できるようにする派生表示（unassigned.length は上で算出済み・state 非保存）。
  //   append で人数が減ると再描画で自動更新される。既存テスト pin は部分一致（'1局目 未割当参加者'）で後方互換。
  // HELP-UX-001 (#308 (2)): 見出し脇に「？ ヘルプ」ボタンを1つ置く（対局画面の迷子防止 in-app ヘルプ導線）。
  //   click は build/bind 分離のため bindClassActionBarEvents 側で openHelpModal('first-round') へ結線する。
  //   既存テスト pin '1局目 未割当参加者' は前方一致で維持（見出し本文は不変・flex で横並びにするだけ）。
  html+='<div style="display:flex;align-items:center;gap:8px;margin:0 0 4px">';
  html+='<h3 style="margin:0;font-size:14px;color:#1F3864">1局目 未割当参加者（'+unassigned.length+'名）</h3>';
  html+='<button type="button" id="helpBtnFirstRound_'+escapeHtml(cls)+'" class="btn-sm" title="1局目の作り方をヘルプで表示します" aria-label="1局目の作り方ヘルプ" style="font-size:12px;padding:2px 8px;font-weight:400;white-space:nowrap">？ ヘルプ</button>';
  html+='</div>';
  // FRP-SMALL-UX-001 (post FRP-UNASSIGNED-COUNT-001 / #245): 未割当人数から「全員を1局目に入れると
  //   何組できて誰が待つか」を派生表示する1行。#245 の見出し人数を、運営が次に取る操作の結果（作れる
  //   組数・待機の有無）まで一目で分かるよう具体化する。表示専用＝state 非保存・mutate しない・listener
  //   を持たない（unassigned.length は上で算出済み）。奇数/1名のときは待機が生じる注意として色を強める。
  var frpMaxPairs=Math.floor(unassigned.length/2);   // 全員を選んだときに作れる最大組数
  var frpProjection, frpProjectionColor;
  if(unassigned.length===1){
    frpProjection='現在の未割当は1名です。対局を作るには、あと1名以上の受付をお待ちください。';
    frpProjectionColor='#9a3412';
  }else if(unassigned.length%2===1){
    frpProjection='いま未割当の全員（'+unassigned.length+'名）を選ぶと、'+frpMaxPairs+'組の対局を追加でき、1名が未割当のまま残ります（奇数）。';
    frpProjectionColor='#9a3412';
  }else{
    frpProjection='いま未割当の全員（'+unassigned.length+'名）を選ぶと、'+frpMaxPairs+'組の対局を1局目に追加できます。';
    frpProjectionColor='#1F3864';
  }
  html+='<p class="frp-pairing-projection" style="margin:0 0 8px;font-size:12px;font-weight:600;color:'+frpProjectionColor+'">'+frpProjection+'</p>';
  // PROGRESSIVE-PAIRING-IMPL-P1 (CONFIRMED spec §1 / §2 / 受入1-4): 逐次手合いの主導線「1卓追加」。
  //   未手合い（受付順＝entry_no 昇順）の先頭2名で round=1 の1卓を作成する（押すたびに次の2名で1卓）。
  //   未手合いが2人未満（このセクションは未割当0 で '' を返すので実質「1名」）では disabled にする。
  //   選択式の frpAddBtn_「選択した参加者で1局目を追加作成」とは別 id・別導線で併置（純追加）。click の登録は
  //   onClickAddOneTable へ bindClassActionBarEvents 側で行う。この helper は表示専用（イベント登録は持たない）。
  var canAddOneTable=unassigned.length>=2;
  html+='<div class="frp-add-one-table" style="margin:0 0 10px">';
  html+='<button type="button" id="addTableBtn_'+escapeHtml(cls)+'" class="btn-primary"'+(canAddOneTable?'':' disabled')+' title="今すぐ始める対局だけを1卓ずつ追加します。あとから残りを追加できます。">1卓追加（受付順の先頭2名で1局目を作成）</button>';
  html+='<p style="margin:6px 0 0;font-size:11px;color:#888">※受付順（参加者追加順）の先頭2名で1卓を作成します。押すたびに次の1卓。未手合いが1名のときは、次の参加者が来るまで待機します（不戦勝にはなりません）。</p>';
  // PROGRESSIVE-PAIRING-IMPL-P2 (CONFIRMED spec §P2 / 受入 Phase P2): まとめて導線「未手合いをまとめて1局目作成」。
  //   未手合い（受付順＝entry_no 昇順）の全員を 2人ずつペア化して round=1 の卓をまとめて作成する（偶数=全員・
  //   奇数=末尾1人待機）。P1「1卓追加」(addTableBtn_・先頭2名で1卓) と同じ未割当が対象で、両方を併置（純追加）。
  //   disabled 条件は P1 と同じ「未手合い2人未満」(canAddOneTable)。click の登録は onClickAddAllTables へ
  //   bindClassActionBarEvents 側で行う（この helper は表示専用・イベント登録を持たない）。
  html+='<button type="button" id="addAllTablesBtn_'+escapeHtml(cls)+'" class="btn-primary"'+(canAddOneTable?'':' disabled')+' style="margin-top:6px" title="未割当の参加者から、作れる対局をまとめて作成します。">未手合いをまとめて1局目作成</button>';
  html+='<p style="margin:6px 0 0;font-size:11px;color:#888">※いま未手合いの全員を受付順で2人ずつまとめて卓にします（受付が一段落したときに便利）。奇数なら末尾1人は次の参加者が来るまで待機します（不戦勝にはなりません）。既存の対局・結果は変更しません。</p>';
  html+='</div>';
  html+='<p style="margin:0 0 8px;font-size:12px;color:#666">このクラスは部分開始中です。まだ1局目に入っていない参加者から選んで「選択した参加者で1局目を追加作成」を押すと、既存の対局を変更せず選択者だけの対局を追加します（2人以上を選択。偶数は全員、奇数は末尾1人が未割当のまま残ります）。既に1局目対局がある参加者は表示されません。</p>';
  html+='<div class="frp-unassigned-list">';
  for(var i=0;i<unassigned.length;i++){
    var p=unassigned[i];
    var no=escapeHtml(cls+'-'+entryNoOf(cls,p.id));
    var nm=escapeHtml(getName(p.id,cls));
    html+='<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:#333;cursor:pointer">'
      +'<input type="checkbox" class="frp-unassigned-cb" data-frp-pid="'+escapeHtml(p.id)+'" value="'+escapeHtml(p.id)+'">'
      +'<span>'+no+'｜'+nm+'</span></label>';
  }
  html+='</div>';
  html+='<button type="button" id="frpAddBtn_'+escapeHtml(cls)+'" class="btn-primary btn-sm" title="選んだ未割当者だけで1局目の対局を作成します（既存の対局・結果は変更しません）" style="margin-top:8px">選択した参加者で1局目を追加作成</button>';
  html+='<p style="margin:6px 0 0;font-size:11px;color:#888">※2人以上を選択してください。作成済みの対局・結果は変更されません。</p>';
  html+='</div>';
  return html;
}

function renderTournament(cls){
  var el=document.getElementById('pane-'+cls);
  if(!el)return;
  // ROUND-CLASS-START-004b (spec §11.3 / §11.4): class action bar を pane 上部に常に描画する。
  //   参加者 0 / 未開始 ケースの早期 return でも action bar は出す（後追い開始の導線確保）。
  var actionBarHtml=buildClassActionBarHtml(cls);
  var classInfo=null;
  if(Array.isArray(state.classes)){
    for(var ci=0;ci<state.classes.length;ci++){
      if(state.classes[ci]&&state.classes[ci].id===cls){classInfo=state.classes[ci];break;}
    }
  }
  var className=(classInfo&&classInfo.name)?classInfo.name:(cls+'クラス');
  var players=state.players[cls]||[];
  if(players.length===0){
    el.innerHTML='<div class="section">'+actionBarHtml+'<h2>'+escapeHtml(className)+'</h2><p style="color:#888">参加者なし</p></div>';
    bindClassActionBarEvents(cls);
    return;
  }
  if(!isClassStarted(cls)){
    // 未開始クラス: 参加者数を表示 + 後追い開始ボタンを案内（action bar 経由）。
    el.innerHTML='<div class="section">'+actionBarHtml+'<h2>'+escapeHtml(className)+'</h2><p style="color:#666">未開始（参加者 '+players.length+' 名）</p></div>';
    bindClassActionBarEvents(cls);
    return;
  }
  var wins=getWins(cls);
  var done=state.results[cls].length>=state.rounds;
  var roundNum=state.results[cls].length+1;
  // PAIRING-UX-SCORE-LIST-READABILITY-IMPL-LIGHT (PR #104 §4.1 候補 C):
  //   暫定成績の並び順を「勝数降順 + 同勝数内エントリー番号順」に明示する。
  //   1 次キー: wins desc / 2 次キー: entry_no asc。
  //   entry_no が未設定 / 不正の場合は Infinity にして末尾へ送る（fallback）。
  //   buildPlayedHistoryHtml と sorted を共有しているため、対戦済みリストも同じ並び順となる。
  //   generatePairing() 側の sorted（L4580、ランダム化前段）は対象外。
  var sorted=players.slice().sort(function(a,b){
    var winDiff=(wins[b.id]||0)-(wins[a.id]||0);
    if(winDiff!==0)return winDiff;
    var ea=(a&&typeof a.entry_no==='number'&&a.entry_no>0)?a.entry_no:Infinity;
    var eb=(b&&typeof b.entry_no==='number'&&b.entry_no>0)?b.entry_no:Infinity;
    return ea-eb;
  });

  var played={};
  for(var i=0;i<players.length;i++)played[players[i].id]=[];
  for(var r=0;r<state.results[cls].length;r++){
    for(var m=0;m<state.results[cls][r].length;m++){
      var match=state.results[cls][r][m];
      if(match.winner){
        played[match.p1].push(match.p2);
        played[match.p2].push(match.p1);
      }
    }
  }

  // ROUND-CLASS-START-004b: action bar を section の冒頭に挿入し、started=true 時の
  //   「<className>をリセット」導線を確保する。className は state.classes[cls].name を尊重。
  var html='<div class="section">'+actionBarHtml+'<h2>'+escapeHtml(className)+'</h2>';
  html+=buildScoreGridHtml(cls, sorted, wins);
  html+=buildPlayedHistoryHtml(cls, sorted, played);
  html+=buildPastResultsHtml(cls);
  // FRP-IMPL-002 (FRP-DESIGN-002 §8): 部分開始中(started かつ results 空)のクラスは未割当一覧を表示。
  //   helper 内部で「started かつ results 空 かつ 未割当>0」のときだけ中身を返す（それ以外は ''）。
  html+=buildFirstRoundPartialSectionHtml(cls);
  html+=buildCurrentPairingsHtml(cls, roundNum, done);

  el.innerHTML=html;
  bindTournamentEvents(cls);
  bindClassActionBarEvents(cls);
}

  // インライン index 確認で expectedWinner と照合する。多次元 index の存在チェックを必ず行い、
  // どこかが欠落していれば保存未確認扱い。rollback しない・alert しない。
  function verifyPastResultPersisted_ep(expectedWinner){
    var persisted_ep=readPersistedState();
    if(!persisted_ep||!persisted_ep.results)return false;
    var rArr=persisted_ep.results[cls];
    if(!Array.isArray(rArr))return false;

      notifySaveWarning({

        consoleTag:'SAVE-003b: bindEditPastResultModalEvents (p1) の保存が確認できませんでした (cls='+cls+', round='+roundIdx+', match='+matchIdx+', expected='+expectedWinner_p1+')',
        callsiteId:'SAVE-003b-bindEditPastResultModalEvents-p1',
        kind:'save-verify',
        aggregateKey:'save-verify:pairing',
        severity:'warn'
      });
    }
  });
  document.getElementById('ep-p2').addEventListener('click',function(){
    state.results[cls][roundIdx][matchIdx].winner=state.results[cls][roundIdx][matchIdx].p2;
    document.getElementById('edit-past-modal').remove();
    renderTournament(cls);renderResults();save();
    var expectedWinner_p2=state.results[cls][roundIdx][matchIdx].winner;
    if(!verifyPastResultPersisted_ep(expectedWinner_p2)){
      notifySaveWarning({
        message:'過去結果を修正しましたが、保存が確認できませんでした。ブラウザを閉じる前にバックアップしてください',
        consoleTag:'SAVE-003b: bindEditPastResultModalEvents (p2) の保存が確認できませんでした (cls='+cls+', round='+roundIdx+', match='+matchIdx+', expected='+expectedWinner_p2+')',
        callsiteId:'SAVE-003b-bindEditPastResultModalEvents-p2',
        kind:'save-verify',
        aggregateKey:'save-verify:pairing',
        severity:'warn'
      });
    }
  });
}

// #331: 2人の直接対決を全対戦行で集計した勝越し差を返す（pid1 視点）。
//   >0: pid1 勝越し / <0: pid2 勝越し / 0: 決着なし（1-1 等の同数・または対戦なし）。
//   旧実装（calcFinal 比較子・isSameDisplayedRank）は最初の対戦行で early-return し、
//   1勝1敗(split)でも早い回戦の勝者を上位/別順位に固定していた（#331・作者方針=同順位）。
function headToHeadBalance(pid1,pid2,cls){
  var rounds=(typeof state!=='undefined'&&state&&state.results&&state.results[cls])?state.results[cls]:[];
  var bal=0;
  for(var r=0;r<rounds.length;r++){
    var round=rounds[r];
    if(!round)continue;
    for(var m=0;m<round.length;m++){
      var match=round[m];
      if(!match)continue;
      if((match.p1===pid1&&match.p2===pid2)||(match.p1===pid2&&match.p2===pid1)){
        if(match.winner===pid1)bal++;
        else if(match.winner===pid2)bal--;
      }
    }
  }
  return bal;
}
function calcFinal(cls){
  var players=state.players[cls];
  // QA D-02（#279 / Codex P1 follow-up）: 勝ち星(wins)を getWins(cls) で別走査せず、下の
  //   results ループ内で played/opponents と「同一の stale 行スキップ判定・同一タイミング」で数える。
  //   getWins は p1/p2 を検証せず winner を加算するため、players から消えた id を含む stale 行で
  //   wins だけ過剰加算され played と乖離していた（順位が変わる／負け数 played-A が負値で印刷）。
  //   wins も同じガードの内側で集計し A・played・opponents を整合させる（正常データでは getWins と同値）。
  var wins={};
  var opponents={};
  var played={};
  for(var i=0;i<players.length;i++){
    wins[players[i].id]=0;
    opponents[players[i].id]=[];
    played[players[i].id]=0;
  }
  for(var r=0;r<state.results[cls].length;r++){
    for(var m=0;m<state.results[cls][r].length;m++){
      var match=state.results[cls][r][m];
      if(match.winner){
        // QA D-02（#279）: results に players から消えた id が残った場合の防御。通常 UI からは
        //   removePlayer の削除ガード（started && pastMatches>0）+ normalizeState の sanitizeMatch で
        //   非到達の latent だが、保険として未登録 id を含む行は集計対象外にして TypeError を防ぐ。
        //   wins もこのガードの内側で加算し、winner-only 集計が stale 行を過剰加算する不整合（Codex P1）を防ぐ。
        if(!opponents[match.p1]||!opponents[match.p2])continue;
        if(Object.prototype.hasOwnProperty.call(wins,match.winner))wins[match.winner]++;
        opponents[match.p1].push({opp:match.p2,won:match.winner===match.p1});
        opponents[match.p2].push({opp:match.p1,won:match.winner===match.p2});
        played[match.p1]++;
        played[match.p2]++;
      }
    }
  }
  var res=[];
  for(var i=0;i<players.length;i++){
    var p=players[i];
    var A=wins[p.id]||0;
    var opps=opponents[p.id]||[];
    var B=0;for(var j=0;j<opps.length;j++)B+=(wins[opps[j].opp]||0);
    var C=0;for(var j=0;j<opps.length;j++){if(opps[j].won)C+=(wins[opps[j].opp]||0);}
    res.push({p:p,A:A,B:B,C:C,played:played[p.id]||0});
  }
  res.sort(function(a,b){
    if(b.A!==a.A)return b.A-a.A;
    if(b.B!==a.B)return b.B-a.B;
    if(b.C!==a.C)return b.C-a.C;
    // A B C全て同じ場合：直接対決を全対戦行で集計して判定（#331）。
    //   1勝1敗(split)等の同数・対戦なしは決着なし→同順位（最終くじ引き）。
    var pid1=a.p.id,pid2=b.p.id;
    var bal=headToHeadBalance(pid1,pid2,cls);
    if(bal>0)return -1; // pid1(a) 勝越し→上位
    if(bal<0)return 1;  // pid2(b) 勝越し→上位
    return 0; // 同数(1-1等)/対戦なし→同順位（くじ引き）
  });
  return res;
}

// RANK-TIE-001: 順位決定項目（A/B/C/直接対決）が完全同点の参加者を同順位として
//   表示する。比較対象は競技上の順位決定項目のみ。
//   含めるもの:   A（勝数）, B（対戦相手の勝数合計）, C（勝った相手の勝数合計）, 直接対決
//   含めないもの: 参加者配列の登録順・entry_no・氏名・id 等、表示安定化用の tie-breaker
//   A/B/C はすべて整数のため厳密比較。許容誤差不要。
//   既存 calcFinal の sort 比較関数構造は変更しない（同点判定は本 helper で独立に行う）。
function isSameDisplayedRank(a,b,cls){
  if(!a||!b||!a.p||!b.p)return false;
  if(a.A!==b.A)return false;
  if(a.B!==b.B)return false;
  if(a.C!==b.C)return false;
  // #331: 直接対決を全対戦行で集計し、勝越し差があれば別順位。
  //   1勝1敗(split)等の同数・対戦なしは決着なし＝同順位（最初の対戦行での early-return をやめる）。
  if(headToHeadBalance(a.p.id,b.p.id,cls)!==0)return false;
  return true;
}

// RANK-TIE-001: ソート済 finals から表示順位を算出する（欠番方式）。
//   - 先頭は 1 位
//   - 現在の同順位グループ「全員」と isSameDisplayedRank が成立する場合のみ同順位
//   - 1 人でも不成立なら新順位 = index+1（タイ後は欠番: 12,12,14）
//   - 直前 1 行だけと比較してはいけない: A/B/C 同点でも直接対決があれば
//     非隣接（X→Y→Z で X-Z 直接対決決着）の透過的な同順位化を防ぐ必要があるため。
//   - 表示順位は保存しない。毎回計算する（保存データ構造は不変）。
function computeDisplayRanks(finals,cls){
  var ranks=[];
  var currentRank=1;
  var currentGroup=[];
  for(var i=0;i<finals.length;i++){
    var row=finals[i];
    if(i===0){
      ranks.push(1);
      currentGroup=[row];
      continue;
    }
    var sameAsGroup=true;
    for(var g=0;g<currentGroup.length;g++){
      if(!isSameDisplayedRank(currentGroup[g],row,cls)){sameAsGroup=false;break;}
    }
    if(sameAsGroup){
      ranks.push(currentRank);
      currentGroup.push(row);
    }else{
      currentRank=i+1;
      ranks.push(currentRank);
      currentGroup=[row];
    }
  }
  return ranks;
}

// ============================================================
// CLOUD SYNC (B-2a / #343): ローカル state → クラウド upsert ペイロードの純マッピング。
//   ネットワーク・supabase・UI は持たない（B-2b で送信グルーを足す）。当日運営はローカルファースト不変。
//   冪等キー: tournament=(club_id, app_tournament_id) ※B-2b で tournaments に app_tournament_id 列が要る /
//             members,players=(club_id, member_id) / entries=(tournament_id, player_id)。
//   結果値: wins=A(勝数) / losses=played-A / sos=B(SOS) / sodos=C(SODOS) / final_rank=computeDisplayRanks。
//   名簿未紐付け（member_id 無し）の参加者は送信対象外として skipped に積む（氏名のみ）。
function deriveSeason(ymd){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||''));
  if(!m)return '';
  var y=parseInt(m[1],10), mo=parseInt(m[2],10);
  var fy=(mo>=4)?y:(y-1);
  return fy+'年度';
}
function buildCloudSyncPayload(master, opts){
  opts=opts||{};
  var st=(typeof state!=='undefined')?state:null;
  var clubId=opts.clubId||null;
  var date=getTournamentDateFromReport(st&&st.report);
  var appTid=(st&&typeof st.tournament_id==='string'&&st.tournament_id)?st.tournament_id:'';
  var title=normalizeReportTitle(st&&st.report&&st.report.title);
  var season=deriveSeason(date);
  var memById={};
  if(master&&Array.isArray(master.members)){
    for(var mi=0;mi<master.members.length;mi++){var mm=master.members[mi]; if(mm&&mm.id)memById[mm.id]=mm;}
  }
  function stamp(o){ if(clubId)o.club_id=clubId; return o; }
  var membersOut={}, playersOut={}, entries=[], skipped=[];
  var classes=(st&&Array.isArray(st.classes))?st.classes:[];
  for(var ci=0;ci<classes.length;ci++){
    var cls=classes[ci]&&classes[ci].id; if(!cls)continue;
    var players=(st.players&&Array.isArray(st.players[cls]))?st.players[cls]:[]; if(!players.length)continue;
    var finals=calcFinal(cls); var ranks=computeDisplayRanks(finals,cls);
    for(var fi=0;fi<finals.length;fi++){
      var row=finals[fi], p=row.p, mid=p&&p.member_id;
      if(typeof mid!=='string'||!mid){ skipped.push((p&&p.name)||''); continue; }
      if(!membersOut[mid]){
        var mm2=memById[mid]||{};
        membersOut[mid]=stamp({ member_id:mid, name:(mm2.name||p.name||''), yomi:(mm2.yomi||p.yomi||''), branch:(mm2.branch||null) });
        playersOut[mid]=stamp({ member_id:mid });
      }
      entries.push(stamp({
        app_tournament_id:appTid, member_id:mid, 'class':cls,
        final_rank:(ranks[fi]!=null?ranks[fi]:null),
        wins:row.A, losses:(row.played-row.A), draws:0,
        sos:row.B, sodos:row.C, participated:true
      }));
    }
  }
  function vals(o){ var a=[]; for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k))a.push(o[k]); } return a; }
  return {
    tournament:stamp({ app_tournament_id:appTid, name:title, date:date, season:season, status:'confirmed', source:'app_sync' }),
    members:vals(membersOut), players:vals(playersOut), entries:entries, skipped:skipped
  };
}

// CLOUD PULL (B-3a / #343): クラウド members（正本）→ ローカル支部マスタ（オフライン用キャッシュ）へのマージ。
//   buildCloudSyncPayload の逆写像。throw せず {master, added, updated, skipped} を返す（当日運営を止めない）。
//   方針（#343 設計確定 2026-06-24）: クラウドが名簿の正本。
//   - キーは member_id（クラウド値＝ローカル member.id・沼津1クラブ固定で衝突なし）。同名照合はしない
//     （member_id 一致のみ＝同名別人の誤統合が起きない）。
//   - 既存会員: name/yomi をクラウド値で上書き（正本）。ただし**クラウド値が空のときは上書きしない**
//     （未入力での消失防止＝#333「空上書き禁止」と同じ安全側）。
//   - ローカル運用専用フィールド（last_class/出席日/tournament_ids/member/grade/city/note）は温存。
//   - branch はローカル支部マスタの永続スキーマに無い（normalizeBranchMaster が保持しない）ため取り込まない。
//   - tombstone: クラウド deleted=true はローカルへ反映（論理削除）。deleted=false での自動復元はしない
//     （既存 import 規則と同じ・OR 安全側）。
//   - クラウドに在ってローカルに無い会員は新規追加（normalize が出席日等を後で補完）。
//   既知の限界: 「ある幹事が pull 前にオフラインで初対面の会員をローカル作成」した場合のみ、同一人物が別
//     member_id で二重化しうる（起動時 auto-pull で実害小・名前ベース統合は app/ 名簿編集/手動マージで対応＝
//     B-3a 対象外。再キーは履歴参照を壊すため行わない）。
function mergeCloudMembersIntoMaster(master, cloudMembers, opts){
  opts=opts||{};
  // possibleDuplicates: クラウド新規会員が、ローカルの「同名・同ふりがな・別 member_id・非削除」と
  //   重なるケースの検知数（A-1 / SYSTEM-REVIEW）。自動統合はしない（既存方針「同名非統合」維持）。
  var res={master:master, added:0, updated:0, skipped:0, possibleDuplicates:0};
  if(!master||!Array.isArray(master.members))return res;
  if(!Array.isArray(cloudMembers))return res;
  function nonEmpty(s){ return typeof s==='string'&&s.length>0; }
  function nameYomiKey(nm,ym){ return String(nm==null?'':nm)+'\u0001'+String(ym==null?'':ym); }
  var byId={};
  var byNameYomi={};   // 非削除ローカル会員の name+yomi → true（pre-merge スナップショット）
  for(var i=0;i<master.members.length;i++){
    var lm=master.members[i];
    if(lm&&typeof lm.id==='string'&&lm.id){
      byId[lm.id]=lm;
      if(lm.deleted!==true&&nonEmpty(lm.name))byNameYomi[nameYomiKey(lm.name,lm.yomi||'')]=true;
    }
  }
  var changed=false;
  for(var c=0;c<cloudMembers.length;c++){
    var cm=cloudMembers[c];
    if(!cm||typeof cm!=='object'){ res.skipped++; continue; }
    var mid=cm.member_id;
    if(typeof mid!=='string'||!mid){ res.skipped++; continue; }
    var cName=nonEmpty(cm.name)?cm.name:'';
    var cYomi=(typeof cm.yomi==='string')?cm.yomi:'';
    var cDeletedAt=(typeof cm.deleted_at==='string'&&cm.deleted_at)?cm.deleted_at:null;
    // クラウド members は deleted boolean を持たず deleted_at(timestamptz)のみ（app/ B-5 が書く）。
    // 後方互換のため deleted===true も引き続き尊重しつつ、deleted_at 非 null を tombstone とみなす（B-3b-tombstone）。
    var cDeleted=(cm.deleted===true)||(cDeletedAt!==null);
    var existing=byId[mid];
    if(existing){
      var didChange=false;
      if(nonEmpty(cName)&&existing.name!==cName){ existing.name=cName; didChange=true; }
      if(nonEmpty(cYomi)&&existing.yomi!==cYomi){ existing.yomi=cYomi; didChange=true; }
      if(cDeleted&&existing.deleted!==true){ existing.deleted=true; if(cDeletedAt&&!existing.deleted_at)existing.deleted_at=cDeletedAt; didChange=true; }
      if(didChange){ res.updated++; changed=true; }
    }else{
      // 新規追加には有効な氏名が必須（normalizeBranchMaster の id&name 必須に整合）。
      if(!nonEmpty(cName)){ res.skipped++; continue; }
      // 同名・同ふりがなの非削除ローカル会員が別 id で既にいる＝二重化の疑い（検知のみ・統合しない）。
      if(!cDeleted&&byNameYomi[nameYomiKey(cName,cYomi)])res.possibleDuplicates++;
      var nm={ id:mid, name:cName, yomi:cYomi, tournament_ids:[] };
      if(cDeleted){ nm.deleted=true; nm.deleted_at=cDeletedAt; }
      master.members.push(nm);
      byId[mid]=nm;
      res.added++; changed=true;
    }
  }
  if(changed)master.updated_at=new Date().toISOString();
  return res;
}

// CLOUD SYNC (B-2b-core / #343): buildCloudSyncPayload の出力を supabase へ upsert するオーケストレーション。
//   client は注入（mock 可）。throw せず {ok,...} を返す（当日運営を止めない）。冪等 upsert（onConflict）。
//   順序: members → players(id 解決) → tournament(id 解決) → entries（tournament_id/player_id を解決）。
//   失敗は {ok:false, step, message, counts} を返す。supabase-js v2 想定（.upsert(rows,{onConflict}).select()）。
function syncTournamentToCloud(client, master, opts){
  opts=opts||{};
  var clubId=opts.clubId;
  if(!client||!client.from)return Promise.resolve({ok:false,step:'init',message:'クラウドに接続していません'});
  if(!clubId)return Promise.resolve({ok:false,step:'club',message:'送信先クラブが特定できません（ログインを確認してください）'});
  var payload=buildCloudSyncPayload(master,{clubId:clubId});
  if(!payload.tournament.app_tournament_id)return Promise.resolve({ok:false,step:'tournament',message:'大会IDが未設定です'});
  var counts={members:payload.members.length,players:payload.players.length,entries:payload.entries.length,skipped:payload.skipped.length,unresolved:0};
  function fail(step,res){ return {ok:false,step:step,counts:counts,message:((res&&res.error&&res.error.message)||'クラウド送信に失敗しました')+'（'+step+'）'}; }
  return client.from('members').upsert(payload.members,{onConflict:'club_id,member_id'}).then(function(r1){
    if(r1&&r1.error)return fail('members',r1);
    return client.from('players').upsert(payload.players,{onConflict:'club_id,member_id'}).select('id,member_id').then(function(r2){
      if(r2&&r2.error)return fail('players',r2);
      var pidByMember={}; var prows=(r2&&r2.data)||[];
      for(var i=0;i<prows.length;i++){ if(prows[i]&&prows[i].member_id)pidByMember[prows[i].member_id]=prows[i].id; }
      return client.from('tournaments').upsert(payload.tournament,{onConflict:'club_id,app_tournament_id'}).select('id').then(function(r3){
        if(r3&&r3.error)return fail('tournament',r3);
        var d3=r3&&r3.data; var trow=(Array.isArray(d3)?d3[0]:d3)||null; var tid=trow&&trow.id;
        if(!tid)return fail('tournament',{error:{message:'tournament id を取得できません'}});
        var entryRows=[];
        for(var e=0;e<payload.entries.length;e++){
          var en=payload.entries[e]; var pid=pidByMember[en.member_id];
          if(!pid){ counts.unresolved++; continue; }
          var row={};
          for(var k in en){ if(Object.prototype.hasOwnProperty.call(en,k)&&k!=='member_id'&&k!=='app_tournament_id')row[k]=en[k]; }
          row.tournament_id=tid; row.player_id=pid;
          entryRows.push(row);
        }
        counts.entries=entryRows.length;
        if(!entryRows.length)return {ok:true,warn:(counts.unresolved>0),counts:counts,tournament_id:tid};
        return client.from('entries').upsert(entryRows,{onConflict:'tournament_id,player_id'}).then(function(r4){
          if(r4&&r4.error)return fail('entries',r4);
          return {ok:true,warn:(counts.unresolved>0),counts:counts,tournament_id:tid};
        });
      });
    });
  });
}

// CLOUD PULL (B-3b / #343): クラウド members（正本）読み取り → mergeCloudMembersIntoMaster → saveBranchMaster。
//   syncTournamentToCloud（送信）と対称の読み取りオーケストレーション。client は注入（mock 可）。
//   throw せず {ok,...} を返す（当日運営を止めない）。全クラウド操作は任意・非ブロッキング・失敗は通知のみ。
//   opts: { clubId（必須）, master（省略時 loadBranchMaster()） }。
//   - members を select('member_id,name,yomi,branch,deleted_at').eq('club_id',clubId) で取得。
//     deleted_at 非 null はクラウド側の論理削除（app/ B-5）→ merge でローカル tombstone 反映（B-3b-tombstone）。
//   - 変更が無ければ保存しない（保存失敗での誤通知を避ける）。
//   - 戻り: {ok, step?, counts:{fetched,added,updated,skipped}, saved, master, message?}。
function pullMembersFromCloud(client, opts){
  opts=opts||{};
  var clubId=opts.clubId;
  if(!client||!client.from)return Promise.resolve({ok:false,step:'init',message:'クラウドに接続していません'});
  if(!clubId)return Promise.resolve({ok:false,step:'club',message:'取得元クラブが特定できません（ログインを確認してください）'});
  return client.from('members').select('member_id,name,yomi,branch,deleted_at').eq('club_id',clubId).then(function(r){
    if(r&&r.error)return {ok:false,step:'fetch',message:((r.error&&r.error.message)||'名簿の読み込みに失敗しました')+'（fetch）'};
    var rows=(r&&Array.isArray(r.data))?r.data:[];
    var master=(opts.master&&Array.isArray(opts.master.members))?opts.master
              :((typeof loadBranchMaster==='function')?loadBranchMaster():{schema_version:1,updated_at:new Date().toISOString(),members:[]});
    var mres=mergeCloudMembersIntoMaster(master,rows,{});
    var counts={fetched:rows.length,added:mres.added,updated:mres.updated,skipped:mres.skipped,possibleDuplicates:mres.possibleDuplicates||0};
    if(mres.added===0&&mres.updated===0)return {ok:true,counts:counts,saved:false,master:master};
    var saved=(typeof saveBranchMaster==='function')?saveBranchMaster(master):true;
    if(saved===false)return {ok:false,step:'save',counts:counts,message:'名簿の保存に失敗しました（取得は成功・再取得できます）',master:master};
    return {ok:true,counts:counts,saved:true,master:master};
  });
}

// CLOUD SYNC (B-2b-wire / #343): 当日アプリ→クラウド送信のブラウザ・グルー。
//   全クラウド操作は任意・非ブロッキング・失敗は status 表示のみ（押さなければ従来通り・ネット不要）。
//   supabase-js / app/config.js は click 時のみ遅延ロード（既定では外部依存ゼロ）。
//   pickActiveClubId は純関数（claim 結果から1クラブ自動解決）でテスト対象。
function pickActiveClubId(memberships){
  // A-6 (SYSTEM-REVIEW #384 follow): distinct な active クラブが2つ以上なら一意に定まらない→null
  //   （先頭一致での誤クラブ送信を防ぐ）。沼津=単一クラブは従来どおり当該 club_id を返す。
  var list=Array.isArray(memberships)?memberships:[];
  var found=null;
  for(var i=0;i<list.length;i++){ var m=list[i]; if(m&&m.status==='active'&&m.club_id){ if(found===null)found=m.club_id; else if(m.club_id!==found)return null; } }
  return found;
}
function _cloudCfgReady(){
  var c=(typeof window!=='undefined')&&window.SHOGI_CLOUD_CONFIG;
  return !!(c&&c.url&&c.publishableKey&&!/REPLACE_ME|YOUR_PROJECT_REF/.test(String(c.url)+String(c.publishableKey)));
}
function _cloudSbReady(){ return (typeof window!=='undefined')&&window.supabase&&!!window.supabase.createClient; }
function loadCloudDeps(){
  return new Promise(function(resolve){
    // A-9 (SYSTEM-REVIEW #384 follow): オフライン事前ガード。navigator.onLine===false なら CDN 注入を
    //   待たずに即 resolve（当日ネット断での無駄待ちを避ける）。offline:true マーカーを付け、呼び出し側が
    //   「設定がありません」ではなく offline 案内を出せるようにする（fail-soft）。
    if(typeof navigator!=='undefined'&&navigator&&navigator.onLine===false){ resolve({cfg:_cloudCfgReady(),sb:_cloudSbReady(),offline:true}); return; }
    function injof(src, integrity){ return new Promise(function(res){ try{ var sc=document.createElement('script'); sc.src=src; if(integrity){ sc.integrity=integrity; sc.crossOrigin='anonymous'; } sc.onload=function(){res(true);}; sc.onerror=function(){res(false);}; document.head.appendChild(sc); }catch(e){ res(false); } }); }
    var p=Promise.resolve();
    if(!_cloudCfgReady())p=p.then(function(){ return injof('app/config.js'); });
    p=p.then(function(){ if(!_cloudSbReady())return injof('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js', 'sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p'); })
       .then(function(){ resolve({cfg:_cloudCfgReady(),sb:_cloudSbReady()}); });
  });
}
// U-1 (UX-P1 / #343): クラウド結果 status の種別判定（純関数・キーワード分類）。
//   成功/失敗/警告(⚠)/案内/送信中 を分け、applyCloudStatus が色クラスを当てる。
//   優先順: err(失敗/エラー) > warn(⚠) > ok(送信/取得しました) > pending(…中) > info。
function classifyCloudStatusKind(msg){
  var s=(msg==null)?'':String(msg);
  if(s==='')return 'none';
  if(s.indexOf('失敗')>=0||s.indexOf('エラー')>=0)return 'err';
  if(s.indexOf('\u26a0')>=0)return 'warn';
  if(s.indexOf('しました')>=0)return 'ok';
  if(s.indexOf('\u4e2d\u2026')>=0)return 'pending';
  return 'info';
}
// U-1 (UX-P1): status 要素に textContent と色クラスを反映（DOM 不在/null は安全に無視・innerHTML 不使用）。
function applyCloudStatus(el,msg){
  if(!el)return;
  var s=(msg==null)?'':String(msg);
  el.textContent=s;
  el.className='cloud-status cloud-status-'+classifyCloudStatusKind(s);
}
function sendTournamentToCloud(setStatus){
  setStatus=setStatus||function(){};
  setStatus('クラウドへ送信中…');
  return loadCloudDeps().then(function(dep){
    if(dep.offline){ setStatus('オフラインのため送信できません（ネット接続後に再度お試しください・運営は続行できます）'); return {ok:false,step:'offline'}; }
    if(!dep.cfg){ setStatus('クラウド設定がありません（送信は任意です・運営は続行できます）'); return {ok:false,step:'config'}; }
    if(!dep.sb){ setStatus('クラウドに接続できませんでした（オフライン等・運営は続行できます）'); return {ok:false,step:'network'}; }
    var client=window.supabase.createClient(window.SHOGI_CLOUD_CONFIG.url,window.SHOGI_CLOUD_CONFIG.publishableKey);
    if(!client||!client.auth){ setStatus('クラウドに接続できませんでした'); return {ok:false,step:'client'}; }
    return client.auth.getSession().then(function(r){
      var session=r&&r.data&&r.data.session;
      if(!session){ setStatus('クラウド管理ページ（app/）でログインしてから送信してください'); return {ok:false,step:'auth'}; }
      return client.rpc('claim_organizer_seat').then(function(rc){
        var clubId=pickActiveClubId((rc&&rc.data)||[]);
        if(!clubId){ setStatus('送信先クラブを一意に特定できません（有効な幹事クラブが無い／複数所属の可能性・管理ページを確認してください）'); return {ok:false,step:'club'}; }
        var master=(typeof loadBranchMaster==='function')?loadBranchMaster():{members:[]};
        try{ if(typeof ensureTournamentId==='function')ensureTournamentId(state,master,getTournamentDateFromReport(state&&state.report)); }catch(e){}
        return syncTournamentToCloud(client,master,{clubId:clubId}).then(function(res){
          if(res&&res.ok){
            // A-2 (SYSTEM-REVIEW #377 follow): 未解決 entry を黙って成功扱いにしない。
            //   unresolved>0 は ⚠ 警告（U-1 で橙）＝集計欠落に気づける。skipped(マスタ未連携)は対象外の中立注記。
            var c=res.counts||{};
            var base='送信しました（名簿 '+(c.members||0)+' 名・結果 '+(c.entries||0)+' 件';
            if(c.skipped)base+='／マスタ未連携 '+c.skipped+' 名は対象外';
            base+='）';
            if(res.warn){ base='⚠ 一部の結果を送信できませんでした：未解決 '+(c.unresolved||0)+' 名。'+base+' 支部マスタへ紐付けてから再送してください（冪等・運営は続行できます）'; }
            setStatus(base);
          }
          else { setStatus('送信に失敗しました：'+((res&&res.message)||'不明')+'（運営は続行できます・再送できます）'); }
          return res;
        });
      });
    });
  }).catch(function(e){ setStatus('送信エラー：'+((e&&e.message)||e)+'（運営は続行できます）'); return {ok:false,step:'exception'}; });
}

// CLOUD PULL (B-3c-auto / #343): 起動時 auto-pull。全て任意・非ブロッキング・無音・fail-soft。
//   config 検出かつ既存ログインセッションがあるときだけ背景で名簿 pull（B-3c-wire の手動ボタンと同経路）。
//   未ログイン/オフライン/config 不在/失敗はすべて無音（ログインは促さない・status も出さない＝当日運営は無傷）。
//   データ保存（pullMembersFromCloud→saveBranchMaster）は常に実施。再描画は「マスタタブ表示中」かつ

//   起動描画をブロックしないよう scheduleAutoPullMembers が次 tick へ回す。throw は握りつぶす。
function autoPullMembersOnStartup(){

    return loadCloudDeps().then(function(dep){
      if(!dep||!dep.cfg||!dep.sb)return {ok:false,step:'deps'};

          var clubId=pickActiveClubId((rc&&rc.data)||[]);

            if(res&&res.ok&&res.counts&&(res.counts.added||res.counts.updated)){

                }
              }catch(eR){}
            }
            return res;
          });

      });

}
function scheduleAutoPullMembers(){

// 結果表セルの共通コア(PHASE-B-2 / #287): Mobile/Desktop 双子の「中身」を1か所へ集約する。
//   対戦相手取得・勝敗判定・対戦相手勝数/マーク文字の算出を行い、結果をオブジェクトで返す。
//   該当ラウンドが無い / そのプレイヤーの対局がそのラウンドに無い場合は null を返す
//   （呼び出し側 variant が「空セル」HTML を返す）。タグ(div / td)と敗北色だけが
//   Mobile/Desktop で異なるため、それらはラッパー側で差し込む（生成 HTML は従来と完全同一）。
function _buildResultsRoundCellCore(cls, playerId, roundIdx, wins){
  var round=state.results[cls][roundIdx];
  if(!round)return null;
  var match=null;
  for(var m=0;m<round.length;m++){if(round[m].p1===playerId||round[m].p2===playerId){match=round[m];break;}}
  if(!match)return null;
  var oppId=match.p1===playerId?match.p2:match.p1;
  var oppWins=wins[oppId]||0;
  var won=match.winner===playerId;
  var markStr=match.winner===null?'－':(won?'○':'●');
  return {oppId:oppId, oppWins:oppWins, won:won, markStr:markStr};
}

// 順位バッジ(PHASE-B-2 / #287): 1〜3 位は色付きバッジ・その他は「N位」。
//   結果表 Mobile/Desktop で同一だった三項式を共通化（返り値は従来と完全同一の文字列）。

    // ROUND-CLASS-START-007 (最終結果タブ ラベル統一):

    //   表示: 勝：N　負：N　相手：N　勝相手：N
    //   旧実装はラベル間で半角コロン・コロンなしが混在していた（同 PR で解消）。
    html+='<div style="font-size:12px;color:#555">勝：<strong>'+f.A+'</strong>　負：'+(f.played-f.A)+'　相手：'+f.B+'　勝相手：'+f.C+'</div>';
    html+='</div>';
    html+='</div>';
    html+='<div style="display:flex;gap:4px">';
    for(var r=0;r<state.rounds;r++){
      html+=buildResultsRoundCellMobileHtml(cls, f.p.id, r, wins);
    }
    html+='</div></div>';
  }
  return html;
}

// PC向け表示全体(テーブル)
function buildResultsDesktopHtml(cls, finals, wins){
  var html='<div style="overflow-x:auto"><table><thead><tr><th style="width:60px">順位</th><th style="text-align:left">氏名</th>';
  for(var r=1;r<=state.rounds;r++)html+='<th>'+r+'回戦</th>';
  html+='<th>勝数(A)</th><th>負数</th><th>B<br><small style="font-weight:normal;font-size:10px">対戦相手<br>勝数合計</small></th><th>C<br><small style="font-weight:normal;font-size:10px">勝った相手<br>勝数合計</small></th></tr></thead><tbody>';
  var displayRanks=computeDisplayRanks(finals,cls);
  for(var idx=0;idx<finals.length;idx++){
    var f=finals[idx];var rank=displayRanks[idx];
    var rowCls=rank===1?'row-r1':rank===2?'row-r2':rank===3?'row-r3':'';
    var badge=_resultsRankBadgeHtml(rank);
    html+='<tr class="'+rowCls+'"><td>'+badge+'</td><td style="text-align:left;font-weight:500">'+nameWithNoRubyHtml(f.p.id,cls)+'</td>';
    for(var r=0;r<state.rounds;r++){
      html+=buildResultsRoundCellDesktopHtml(cls, f.p.id, r, wins);
    }
    html+='<td><strong>'+f.A+'</strong></td><td>'+(f.played-f.A)+'</td><td>'+f.B+'</td><td>'+f.C+'</td></tr>';
  }
  html+='</tbody></table></div>';
  return html;
}

// 1クラス分のセクション全体(参加者0チェックは呼び出し側で行う前提)
function buildResultsClassHtml(cls, isSP){
  var wins=getWins(cls);
  var done=state.results[cls].length>=state.rounds;
  var finals=calcFinal(cls);
  var html='<div class="section"><h2>'+cls+'クラス '+(done?'最終結果':'（途中経過）')+'</h2>';
  html+=isSP?buildResultsMobileHtml(cls, finals, wins):buildResultsDesktopHtml(cls, finals, wins);
  html+='<div style="margin-top:8px;font-size:12px;color:#666">※順位：①勝数(A)多い順　②B（対戦相手の勝数合計）多い順　③C（勝った相手の勝数合計）多い順　④直接対決　⑤くじ引き</div>';
  html+='</div>';
  return html;
}

function renderResults(){
  // ROUND-CLASS-START-005 (spec §15.1 row 2): A/B 固定 literal を解消し、
  //   state.classes を走査して result-{classId} を描画する。
  //   ensureClassResultDomNodes() で不足分の DOM を補完してから描画する。
  //   state.classes が空 / 未定義の場合は何も描画しない（normalizeState 後は必ず存在）。
  //   DOM が存在しない classId は no-op（fail-safe）。
  ensureClassResultDomNodes();
  var isSP=window.innerWidth<600;
  if(!Array.isArray(state.classes))return;
  for(var i=0;i<state.classes.length;i++){
    var c=state.classes[i];
    // ROUND-CLASS-START-006 (Codex Should Fix S1): isSafeClassId() で id-safety を強制し、
    //   ensureClassResultDomNodes / ensureClassPaneDomNodes / calcTotal と同条件に揃える。
    if(!c||!isSafeClassId(c.id))continue;
    var cls=c.id;
    var el=document.getElementById('result-'+cls);
    if(!el)continue;
    var players=(state.players&&state.players[cls])||[];
    if(players.length===0){el.innerHTML='';continue;}
    el.innerHTML=buildResultsClassHtml(cls, isSP);
  }
}

// 大会の report.date を YYYY-MM-DD に変換。失敗時は今日。
// REPORT-UX-001: 旧テキスト入力時代の "YYYY年MM月DD日" と新 type="date" の "YYYY-MM-DD"
//   の両方を受け付ける（旧データ互換）。
function getTournamentDateFromReport(r){
  if(r&&typeof r.date==='string'){
    // 新 schema: type="date" 由来の YYYY-MM-DD
    var iso=r.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(iso)return iso[1]+'-'+iso[2]+'-'+iso[3];
    // 旧 schema: 旧テキスト入力 "YYYY年MM月DD日"
    var m=r.date.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
    if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  }
  return todayYmd();
}

// マスタ同期は saveData() 時のみ。save()/resetAll()/編集時に呼ばない（仕様書 3.4.1、§3.1.3）
function syncBranchMasterOnSave(){
  try{
    var master=loadBranchMaster();
    // 仕様書 v5 §3.5 / Codex MF #3: 破損由来の空マスタは保存しない。
    // 既存 localStorage を保持し、ユーザの再マイグレ・手動修復を待つ。
    if(master&&master._loaded_with_corruption){
      // SAVE-UX-PARSE-HANDLING-IMPL: 第 4 系統 storage-corrupted を helper 経由化。
      //   notifySaveWarning が showMsg('warn') / console.warn (consoleTag) / indicator count +1 を担当。
      //   重複回避のため既存 explicit console.warn / showMsg は呼ばない（PR #79 storage-quota パターン）。
      //   aggregation 対象外（SAVE_WARN_AGGREGATABLE_KINDS は変更しない）。
      notifySaveWarning({
        message:'支部マスタが破損しているため自動同期をスキップしました（大会データのコピーは継続）。マスタタブのインポート・統合で復旧できます。',
        consoleTag:'[STORAGE-CORRUPTED] syncBranchMasterOnSave skipped (master._loaded_with_corruption)',
        callsiteId:'PARSE-MASTER-003',
        kind:'storage-corrupted',
        aggregateKey:'storage-corrupted:branch-master',
        severity:'warn'
      });
      save();
      return;
    }
    var date=getTournamentDateFromReport(state.report);
    // 仕様書 v5 §3.3 / Codex MF #1: 大会日を ensureTournamentId に明示的に渡す
    ensureTournamentId(state,master,date);
    // A-4 §3.1.5: 登録画面ふりがな欄から退避した値（_pendingNewYomi）をマスタへ反映
    updateBranchMasterFromTournament(state,master,{tournament_id:state.tournament_id,tournament_date:date,yomiMap:_pendingNewYomi});
    // SAVE-UX-NONQUOTA-NOTIFY-001 (Codex P2-B): yomi バックフィルを含む master 同期の保存失敗を握り潰さない。
    //   saveBranchMaster は失敗時に notifySaveWarning（showMsg('warn')＋console.warn＋indicator +1）を
    //   既に発火する（kind:'storage-error' は集約対象外＝確実に可視化）。大会データのコピー（saveData の
    //   後続表示）は native alert で別経路のため、この inline 警告は上書きされない。よって二重通知は避け、
    //   ここでは戻り値を受けて「保存できなかった一時マップ（_pendingNewYomi）を破棄しない」ことで
    //   ふりがなの反映漏れを握り潰さない（成功時のみクリアして次回再試行に委ねる）。
    var masterSaved=saveBranchMaster(master);
    if(masterSaved!==false){
      // 反映済みのため一時マップをクリア（保存成功時のみ。失敗時は次回 saveData での再試行に備えて保持）。
      _pendingNewYomi={};
    }
    save();
  }catch(e){
    if(typeof console!=='undefined'&&console.warn)console.warn('支部マスタ同期に失敗（既存大会運営は継続）',e);
  }
}

// クリップボード優先、非対応(http等)はファイルダウンロードにフォールバック
function saveData(){
  // F2: 大会データコピー時に支部マスタへ同期（A-1 ではこのタイミングのみ）
  syncBranchMasterOnSave();
  var json=JSON.stringify(state,null,2);
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
    navigator.clipboard.writeText(json).then(function(){
      alert('大会データをコピーしました。\n\nメモ帳やEvernoteに貼り付けて保管してください。\n\n次回大会前に「マスタ」タブの統合機能で取り込めます。');
    }).catch(function(){
      saveDataAsFile(json);
    });
    return;
  }
  saveDataAsFile(json);
}

function saveDataAsFile(json){
  try{
    var now=new Date();
    var y=now.getFullYear();
    var m=('0'+(now.getMonth()+1)).slice(-2);
    var d=('0'+now.getDate()).slice(-2);
    var hh=('0'+now.getHours()).slice(-2);
    var mm=('0'+now.getMinutes()).slice(-2);
    var filename='shogi_taikai_'+y+m+d+'_'+hh+mm+'.json';
    var blob=new Blob([json],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert(filename+' に保存しました（端末のダウンロードフォルダ）');
  }catch(e){
    alert('保存に失敗しました');
  }
}

}

// DATA-IMPORT-ROUTING (#UX): 読み込みファイルの種類を内容から自動判定する純関数。
//   ファイル名に頼らず JSON 構造で判別し、取り違え（バックアップ/名簿を「読込」に入れて無言で
//   空読み込みされる事故）を防ぐ。戻り: 'backup' | 'master' | 'state' | 'invalid'。
//   - backup : 大会バックアップ（kind=shogi_tour_backup）
//   - master : 支部マスタ（名簿）= 先頭に members 配列を持ち大会データのキーを持たない
//   - state  : 生の大会データ（従来の「保存」/applyLoadedJson 経路）
function classifyImportJson(text){
  var parsed;
  try{ parsed=JSON.parse(text); }catch(e){ return 'invalid'; }
  if(!parsed||typeof parsed!=='object'||Object.prototype.toString.call(parsed)==='[object Array]')return 'invalid';
  if(parsed.kind===BACKUP_KIND)return 'backup';
  if(Array.isArray(parsed.members)&&!parsed.players&&!parsed.classes&&!parsed.results&&!parsed.report&&parsed.rounds===undefined)return 'master';
  return 'state';
}

function loadData(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var text=ev.target.result;
    var kind=classifyImportJson(text);
    if(kind==='backup'){
      // バックアップ形式は専用復元へ自動誘導（確認・復元はそちらが担当・空読み込み事故を防ぐ）。
      importTournamentBackupFromText(text);
    }else if(kind==='master'){
      alert('これは支部マスタ（名簿）ファイルです。\n「マスタ」タブの「📂 マスタをインポート」から取り込んでください。');
    }else if(kind==='invalid'){
      alert('読み込みに失敗しました。正しい大会データファイルか確認してください');
    }else{
      if(!confirm('現在のデータを上書きして読み込みますか？')){e.target.value='';var lm0=document.getElementById('load-modal');if(lm0)lm0.remove();return;}
      try{
        applyLoadedJson(text);
        alert('データを読み込みました');
      } catch(err){
        alert('読み込みに失敗しました。正しいファイルか確認してください');
      }
    }
    e.target.value='';
    var lm=document.getElementById('load-modal');if(lm)lm.remove();
  };
  reader.readAsText(file);
}

// ============================================================
// DATA-PERSISTENCE Phase 1: 大会データのバックアップ（JSON エクスポート / インポート）
//   正本仕様: ai-requests/2026-06-20_data-persistence-CONFIRMED-spec.md §5 Phase 1。
//   位置づけ: 自動バックアップ・将来の Supabase 移行の土台（引き継ぎの主役ではない）。
//   絶対ルール（HANDOFF.md / impl-phase1）:
//     - 追加のみ。既存 saveData()/loadData()/applyLoadedJson()/normalizeState()/save()/load() は変更しない。
//     - エクスポート JSON は schema_version を持ち、import 時に検証して不一致/不正は安全に拒否する。
//     - 構造を「氏名等を含むローカル運営データ(local)」と「member_id＋成績の匿名データ(anonymous)」に分離する
//       （Phase 2 のクラウド同期 payload を anonymous 側から生成できるように。anonymous には氏名を入れない）。
//     - 対局情報（pairings/results）は local.state にそのまま含まれ、anonymous.matches にも匿名形で投影する。
//     - 復元は必ず既存 applyLoadedJson()（= normalizeState 経路）を再利用する（独自の正規化を作らない）。
//   build/bind/coordinator パターン維持。pure builder は global state を参照しない（テスト容易・副作用なし）。
// ============================================================
var BACKUP_SCHEMA_VERSION=1;
var BACKUP_KIND='shogi_tour_backup';

// 匿名投影（pure）: 引数 state s から「氏名を含まない」member_id＋成績データを派生する。
//   global state は参照しない。氏名は一切含めない（player_ref=非PIIなローカル id のみ）。
function buildBackupAnonymous(s){
  var out={classes:[],entries:[],matches:[]};
  if(!s||typeof s!=='object')return out;
  var classes=(Object.prototype.toString.call(s.classes)==='[object Array]')?s.classes:[];
  for(var ci=0;ci<classes.length;ci++){
    var c=classes[ci];
    if(!c||typeof c.id!=='string'||!c.id)continue;
    var cls=c.id;
    out.classes.push(cls);
    var players=(s.players&&Object.prototype.toString.call(s.players[cls])==='[object Array]')?s.players[cls]:[];
    // player.id -> member_id|null の対応表（氏名は引かない）。
    var memberIdOf={};
    for(var pi=0;pi<players.length;pi++){
      var pp=players[pi];
      if(pp&&pp.id)memberIdOf[pp.id]=(typeof pp.member_id==='string'&&pp.member_id)?pp.member_id:null;
    }
    var results=(s.results&&Object.prototype.toString.call(s.results[cls])==='[object Array]')?s.results[cls]:[];
    // 勝数・対局数を results から集計（getWins と同等のロジックを pure に inline）。
    var wins={}, games={};
    for(var ri=0;ri<results.length;ri++){
      var round=(Object.prototype.toString.call(results[ri])==='[object Array]')?results[ri]:[];
      for(var mi=0;mi<round.length;mi++){
        var m=round[mi];
        if(!m||!m.p1||!m.p2)continue;
        games[m.p1]=(games[m.p1]||0)+1;
        games[m.p2]=(games[m.p2]||0)+1;
        if(m.winner)wins[m.winner]=(wins[m.winner]||0)+1;
        // 匿名 match（氏名なし。round は 1 始まり）。
        out.matches.push({
          cls:cls, round:ri+1,
          p1_ref:m.p1, p2_ref:m.p2,
          p1_member_id:(m.p1 in memberIdOf)?memberIdOf[m.p1]:null,
          p2_member_id:(m.p2 in memberIdOf)?memberIdOf[m.p2]:null,
          winner_ref:m.winner||null
        });
      }
    }
    for(var ei=0;ei<players.length;ei++){
      var p=players[ei];
      if(!p||!p.id)continue;
      out.entries.push({
        cls:cls,
        member_id:(typeof p.member_id==='string'&&p.member_id)?p.member_id:null,
        player_ref:p.id,
        entry_no:isValidEntryNo(p.entry_no)?p.entry_no:(ei+1),
        wins:wins[p.id]||0,
        games:games[p.id]||0
      });
    }
  }
  return out;
}

// エクスポート構造（pure）: schema_version 付きの backup オブジェクトを組み立てる。
//   local.state = 復元の正本（氏名を含むフル state）。anonymous = 派生・匿名（氏名なし）。
//   nowIso は呼び出し側が new Date().toISOString() で渡す（pure 化のため引数注入）。
function buildTournamentBackupObject(s,nowIso){
  return {
    schema_version:BACKUP_SCHEMA_VERSION,
    kind:BACKUP_KIND,
    app:'shogi_v4',
    exported_at:(typeof nowIso==='string')?nowIso:'',
    local:{ state:s },
    anonymous:buildBackupAnonymous(s)
  };
}

// エクスポート JSON 文字列（pure）。
function serializeTournamentBackup(s,nowIso){
  return JSON.stringify(buildTournamentBackupObject(s,nowIso),null,2);
}

// インポート検証（pure）: text を parse・検証し {ok:true,state} か {ok:false,reason,message} を返す。
//   不正 JSON / 種別不一致 / schema_version 不一致 / state 欠落 を安全に拒否しメッセージを返す。
function parseTournamentBackup(text){
  var parsed;
  try{ parsed=JSON.parse(text); }
  catch(e){ return {ok:false,reason:'invalid_json',message:'ファイルを読み取れませんでした（JSON として不正です）。'}; }
  if(!parsed||typeof parsed!=='object'||Object.prototype.toString.call(parsed)==='[object Array]'){
    return {ok:false,reason:'not_object',message:'バックアップ形式ではありません。'};
  }
  if(parsed.kind!==BACKUP_KIND){
    return {ok:false,reason:'wrong_kind',message:'このファイルは大会バックアップではありません。通常の「読み込み」からお試しください。'};
  }
  if(parsed.schema_version!==BACKUP_SCHEMA_VERSION){
    return {ok:false,reason:'schema_mismatch',message:'バックアップのバージョンが一致しません（ファイル: '+String(parsed.schema_version)+' / 対応: '+BACKUP_SCHEMA_VERSION+'）。'};
  }
  var st=parsed.local&&parsed.local.state;
  if(!st||typeof st!=='object'||Object.prototype.toString.call(st)==='[object Array]'){
    return {ok:false,reason:'no_state',message:'バックアップに大会データが含まれていません。'};
  }
  return {ok:true,state:st};
}

// coordinator: 現在の state を backup JSON としてダウンロードする（saveDataAsFile を踏襲）。
function exportTournamentBackup(){
  try{
    var now=new Date();
    var json=serializeTournamentBackup(state,now.toISOString());
    var y=now.getFullYear();
    var mo=('0'+(now.getMonth()+1)).slice(-2);
    var d=('0'+now.getDate()).slice(-2);
    var hh=('0'+now.getHours()).slice(-2);
    var mm=('0'+now.getMinutes()).slice(-2);
    var filename='shogi_backup_'+y+mo+d+'_'+hh+mm+'.json';
    var blob=new Blob([json],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert(filename+' にバックアップを保存しました（端末のダウンロードフォルダ）');
    return true;
  }catch(e){
    alert('バックアップの保存に失敗しました');
    return false;
  }
}

// coordinator: backup テキストを検証 → 確認 → 既存 applyLoadedJson（normalizeState 経路）で復元する。
//   既存 state を上書きするため confirm ガードを必ず通す（誤操作でのデータ消失防止）。
function importTournamentBackupFromText(text){
  var res=parseTournamentBackup(text);
  if(!res.ok){ alert(res.message); return false; }
  if(!confirm('現在の大会データを上書きしてバックアップを復元しますか？この操作は元に戻せません。'))return false;
  try{
    // 復元は独自正規化を作らず、既存 applyLoadedJson（state=normalizeState(...)→save→再描画）を再利用する。
    applyLoadedJson(JSON.stringify(res.state));
    alert('バックアップを復元しました');
    return true;
  }catch(err){
    alert('復元に失敗しました。正しいバックアップファイルか確認してください');
    return false;
  }
}

// coordinator: ファイル選択 input(change) から backup を取り込む。
function importTournamentBackupFile(e){
  var file=e&&e.target&&e.target.files&&e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    importTournamentBackupFromText(ev.target.result);
    if(e.target)e.target.value='';
    var bm=document.getElementById('backup-modal');if(bm)bm.remove();
  };
  reader.readAsText(file);
}
