<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>沼津支部 クラウド管理</title>
  <style>
    /* APP-UX-001 (作者依頼 2026-07-02): 当日アプリと同じ設計言語に統一。
       primary を #2b6cb0 → #1F3864（STYLE-GUIDE §9 M5 消化）・最大幅 520→920px・
       紺のヘッダバー＋ピル型ナビ（縦一本のカード羅列を解消）・ログイン系は中央寄せ。 */
    :root { --fg:#222; --muted:#777; --line:#d3dbe5; --primary:#1F3864; --bg:#eef2f7; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
           color:var(--fg); background:var(--bg); line-height:1.6; }
    #app-root { max-width:920px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin:0 0 16px; }
    h1 { font-size:20px; margin:0 0 10px; color:var(--primary); }
    h2 { font-size:16px; margin:14px 0 8px; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:4px; }
    .app-bar { background:var(--primary); color:#fff; border-radius:10px; padding:12px 16px; margin:0 0 10px;
               display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .app-bar-title { font-size:17px; font-weight:600; }
    .app-bar-sub { font-size:11px; font-weight:400; opacity:.8; margin-left:8px; }
    .app-bar-user { font-size:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .bar-btn { margin-top:0; padding:6px 12px; font-size:12px; background:#fff; color:var(--primary); border:none; border-radius:8px; }
    .app-nav { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
    .nav-pill { margin-top:0; padding:8px 16px; font-size:13px; border-radius:18px; border:1px solid var(--line); background:#fff; color:#555; min-height:38px; }
    .nav-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
    .card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:12px; }
    .card-grid .card { margin:0; }
    #loginView, #checkEmailView, #unregisteredView { max-width:420px; margin:8vh auto 0; }
    /* APP-UX-002: 名簿シート（当日アプリ MASTER-SHEET と同型）。 */
    /* APP-MEMBER-SEARCH-001: 名簿検索ボックス（氏名・ふりがな・市町村の部分一致）。 */
    .ms-search { display:flex; gap:8px; margin-top:10px; }
    .ms-search input { flex:1; min-height:40px; padding:8px 12px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
    .ms-search button { min-height:40px; padding:0 14px; font-size:13px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--primary); cursor:pointer; }
    /* APP-MEMBER-SHEET-UX-001: 区分セルの ▾ ヒント・セル内 select・削除済みトグル。 */
    .ms-caret { font-size:10px; color:var(--muted); }
    .ms-in-select { min-height:36px; font-size:14px; border:1px solid var(--primary); border-radius:6px; padding:2px 4px; }
    .ms-del-toggle { margin:2px 0 6px; }
    .ms-del-toggle button { min-height:40px; padding:2px 12px; font-size:12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#667; cursor:pointer; }
    .ms-wrap { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:4px; }
    .ms-table { width:100%; border-collapse:collapse; font-size:13px; }
    .ms-table thead tr { background:#f4f6f9; }
    .ms-table th { padding:6px 4px; font-size:12px; color:#556; font-weight:600; text-align:center; }
    .ms-th-name { text-align:left; padding-left:8px; }
    .ms-th-check { width:44px; font-weight:400; font-size:11px; color:#888; }
    .ms-table td { border-top:1px solid #eef1f5; padding:5px 8px; text-align:center; }
    .ms-name-cell, .ms-city-cell, .ms-branch-cell, .ms-kind-cell, .ms-grade-cell { cursor:pointer; }
    .ms-yomi { display:block; font-size:10px; color:#888; line-height:1.15; }
    .ms-yomi-missing { color:#BA7517; }
    .ms-name { font-weight:600; }
    .ms-del-tag { color:var(--muted); font-size:11px; }
    .ms-row-deleted { background:#f5f5f5; color:#888; text-decoration:line-through; }
    .mk-badge { font-size:11px; border-radius:5px; padding:1px 6px; }
    .mk-member { background:#eaf3de; color:#27500A; }
    .mk-other { background:#f1efe8; color:#5f5e5a; }
    .ms-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#E6F1FB; border:1px solid #B5D4F4;
                  border-radius:8px; padding:6px 10px; margin:0 0 10px; font-size:13px; color:#0C447C; }
    .ms-toolbar button { margin-top:0; padding:6px 12px; font-size:13px; background:#fff; }
    .ms-danger { border-color:#A32D2D; color:#A32D2D; }
    .ms-check { width:18px; height:18px; }
    .ms-in { width:96%; font-size:14px; padding:4px 6px; border:1px solid var(--primary); border-radius:6px; margin:1px 0; }
    .muted { color:var(--muted); font-size:13px; }
    label { display:block; font-size:13px; margin:10px 0 4px; }
    input[type="email"], select { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
    button { margin-top:10px; padding:10px 14px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
    button.primary { background:var(--primary); color:#fff; border-color:var(--primary); width:100%; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .msg { min-height:1.2em; font-size:13px; color:var(--primary); }
    .org-list { list-style:none; padding:0; margin:10px 0 0; }
    .org-row { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
    .org-who { font-weight:600; min-width:9em; }
    .org-meta { color:var(--muted); font-size:12px; }
    .org-actions { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
    .org-actions button { margin-top:0; padding:6px 10px; font-size:13px; }
    /* APP-UX-004B (作者承認 2026-07-03): 幹事管理の整列＋役割説明。招待フォームは
       .adm-form（コントロール高さ40px統一・役割 select は内容幅＝全幅巨大化解消）。
       旧 #inviteForm の行組み CSS は .adm-form に置換。 */
    .adm-form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
    .adm-fld { flex:1 1 220px; min-width:0; }
    .adm-fld label { margin:0 0 4px; }
    .adm-fld-role { flex:0 0 auto; }
    .adm-form input[type="email"] { height:40px; padding:6px 10px; font-size:15px; }
    .adm-form select { width:auto; max-width:100%; height:40px; padding:6px 8px; font-size:15px; }
    .adm-form button { margin-top:0; height:40px; padding:0 18px; font-size:14px; }
    .role-help { background:#f4f6f9; border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0 0; font-size:12px; color:#556; }
    .role-help dt { float:left; clear:left; width:4.5em; font-weight:600; color:var(--primary); }
    .role-help dd { margin:0 0 2px 5em; }
    .org-role-badge { font-size:11px; border-radius:5px; padding:1px 8px; background:#e6edf7; color:var(--primary); font-weight:600; }
    .org-role-badge.rb-organizer { background:#eaf3de; color:#27500A; }
    .org-role-badge.rb-viewer { background:#f1efe8; color:#5f5e5a; }
    .org-status { font-size:11px; color:var(--muted); }
    .org-status.st-suspended { color:#BA7517; }
    .member-add { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-top:10px; }
    .member-add input, .member-edit input { padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
    .member-add input { flex:1 1 140px; }
    .member-edit input { flex:1 1 120px; }
    .member-deleted { text-decoration:line-through; color:var(--muted); font-weight:400; }
    /* APP-UX-003 (作者承認 2026-07-03): 集計系テーブル（.cloud-entries＝大会結果/通年/殿堂/月別/市町村/成長賞 共通）の
       統一スタイル＋通年集計の操作列＋取り込みパネルの details 化。CSS 追加のみ・既存 id/bind 非接触。 */
    .cloud-entries { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums; color:var(--fg); }
    .cloud-entries thead tr { background:#f4f6f9; }
    .cloud-entries th { padding:6px 6px; font-size:12px; color:#556; font-weight:600; text-align:center; border-bottom:1px solid var(--line); }
    .cloud-entries td { padding:5px 8px; border-top:1px solid #eef1f5; text-align:center; }
    .cloud-entries tbody tr:first-child td { border-top:none; }
    .cloud-entries tbody tr:last-child td { border-bottom:1px solid #eef1f5; }
    .rec-block h3 { font-size:13px; margin:12px 0 0; color:#333; }
    .rec-block:first-child h3 { margin-top:4px; }
    #standingsControls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:6px 0 2px; }
    #standingsControls label { display:inline; margin:0; font-size:12px; color:#556; }
    #standingsControls select { width:auto; max-width:100%; padding:6px 8px; font-size:14px; }
    #importPanel summary { cursor:pointer; font-size:14px; font-weight:600; color:var(--primary); padding:2px 0; }
    #importPanel details[open] summary { margin-bottom:6px; }
    /* APP-UX-004A (作者依頼 2026-07-03): 大会結果を当日アプリの順位表と同型に（sb-* は当日 shogi_v4 の
       スコアボード CSS のサブセット移植・回戦列なし）。選択中大会ボタンは .cloud-tnt.active。 */
    .sb-class { margin:10px 0 14px; }
    .sb-class-h { font-size:14px; font-weight:600; color:var(--primary); padding:6px 0 4px; }
    .sb-class-h .sb-sub { font-weight:400; color:#888; font-size:12px; }
    .sb-table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; color:var(--fg); }
    .sb-table th, .sb-table td { border:1px solid #e0e6ee; padding:5px 8px; text-align:center; }
    .sb-table thead th { background:var(--primary); color:#fff; font-weight:500; }
    .sb-col-rank { width:44px; font-weight:700; background:#eef3f9; }
    .sb-col-name { text-align:left; font-weight:600; }
    .sb-col-name rt { font-size:9px; color:#888; font-weight:400; }
    .sb-row-1 .sb-col-rank { background:#fde7c4; }
    .sb-wins { font-weight:700; color:var(--primary); font-size:14px; }
    .sb-metric { color:#555; font-size:12px; }
    .sb-legend { margin:4px 0 0; font-size:11px; color:#667; }
    .sb-tnt-head { font-size:15px; font-weight:600; color:var(--fg); margin:8px 0 2px; }
    .sb-tnt-head .sb-tnt-meta { font-weight:400; font-size:12px; color:var(--muted); margin-left:8px; }
    .cloud-tnt.active { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
    /* APP-UX-004A2: 大会結果の一覧⇄詳細切替（戻るボタン） */
    .tnt-back { margin:0 0 10px; padding:8px 14px; font-size:13px; color:var(--primary); }
    /* APP-UX-004C (作者承認 2026-07-03): ①大会一覧の行カード化 ②名簿上部の整理（検索先頭・
       追加フォーム details 化・40px 統一） ③メッセージ色分け（成功=緑/失敗=赤/中立=従来の紺）。
       .cloud-tnt.active の再指定は同置＝後勝ちで base の background:#fff に負けないための明示。 */
    .tnt-list { list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:8px; }
    .tnt-list li { margin:0; }
    .tnt-list .cloud-tnt { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
                           margin-top:0; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
                           background:#fff; font-size:14px; min-height:52px; }
    .tnt-list .cloud-tnt.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .cloud-tnt .tnt-date { font-variant-numeric:tabular-nums; color:#556; font-size:13px; white-space:nowrap; }
    .cloud-tnt .tnt-name { font-weight:600; flex:1; min-width:0; }
    .cloud-tnt .tnt-season { color:var(--muted); font-size:12px; white-space:nowrap; }
    .cloud-tnt.active .tnt-date, .cloud-tnt.active .tnt-name, .cloud-tnt.active .tnt-season { color:#fff; }
    .tnt-status { font-size:11px; border-radius:5px; padding:1px 8px; white-space:nowrap; background:#eaf3de; color:#27500A; }
    .tnt-status.ts-other { background:#f1efe8; color:#5f5e5a; }
    .ms-add-details { margin:2px 0 6px; }
    .ms-add-details summary { cursor:pointer; font-size:14px; font-weight:600; color:var(--primary); padding:6px 0; }
    .ms-meta-row { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .ms-meta-row .muted { margin:0; }
    .member-add .fld { flex:1 1 160px; min-width:0; }
    .member-add .fld label { display:block; font-size:12px; color:#556; margin:0 0 4px; }
    .member-add .fld input { width:100%; height:40px; padding:6px 10px; font-size:15px; }
    .member-add button { margin-top:0; height:40px; padding:0 18px; font-size:14px; }
    .msg.msg-ok { color:#1E7A1E; }
    .msg.msg-err { color:#A32D2D; }
  </style>
</head>
<body>
  <p style="max-width:920px;margin:0 auto 10px"><a href="../shogi_v4.html" style="font-size:13px;color:var(--primary);text-decoration:none">← 当日運営アプリへ戻る</a></p>
  <main id="app-root">
    <section class="card"><h1>読み込み中…</h1><p class="muted">クラウド設定を確認しています。</p></section>
  </main>

  <!-- 実値は app/config.js（.gitignore 済・非コミット）に置く。未配置なら設定エラーを表示。 -->
  <script src="config.js" onerror="window.__SHOGI_CONFIG_MISSING=true"></script>
  <!-- Supabase JS（UMD・global `supabase` を生やす）。publishable key + URL のみ使用。 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js" integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p" crossorigin="anonymous"></script>
  <!-- cache-bust: app/auth.js 変更時に ?v=N をバンプ（app/ は cache-bust が無く旧 JS を握る問題の対策・#343）-->
  <script src="auth.js?v=35"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try { window.ShogiAuth.boot(); }
      catch (e) {
        document.getElementById('app-root').innerHTML =
          '<section class="card"><h1>起動エラー</h1><p>' + String(e && e.message || e) + '</p></section>';
      }
    });
  </script>
</body>
</html>
