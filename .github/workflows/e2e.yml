name: E2E
on:
  push:
    branches:
      - chore/shogi-tour-apphq-003h-2d-orphan-clean-base
  pull_request:
    # PHASE0-B-CI-GREEN-001: 開発本流（orphan clean base）宛ての PR でも CI を起動する。
    # - production は対象にしない（配布成果物専用系列のため）
    branches:
      - chore/shogi-tour-apphq-003h-2d-orphan-clean-base
  # 自動マージ後の再検証と、人手での失敗再現・再検証に使う。
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit (run_tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # PHASE0-B-CI-GREEN-001: run_tests.sh は FAIL>0 のとき自分で exit 1 するため、
      # その終了コードをそのままゲートに使う。出力を文字列で再 grep する二重判定は廃止した。
      # 旧実装は `set -o pipefail` + `OUT=$(... | tee ...)` + `echo "$OUT" | grep -q ...` で、
      # grep -q が最初のマッチで即終了 → echo が SIGPIPE → pipefail でパイプライン失敗、
      # という経路により PASS=234 / FAIL=0 でも FAIL 判定になっていた。
      - name: Run unit test suite
        env:
          TEST_INVENTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash test/run_tests.sh shogi_v4.html

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # ここだけがこのジョブのブロッキング検査。
      # 例外は .htmlvalidate.json でルールを off にせず、shogi_v4.html 側の
      # インラインディレクティブで該当1要素のみに限定して抑制している。
      - name: HTMLバリデーション（index.html / shogi_v4.html）※ブロッキング
        run: npx html-validate index.html shogi_v4.html

      # PHASE0-B-CI-GREEN-001: 検出は残し、初回は non-blocking にする。
      # 現在の指摘は html-validate の推移的 devDependency 2件（本番成果物には同梱されない）。
      # 依存更新は 0-B のスコープ外＝独立 Issue 候補。検出自体は無効化しない。
      - name: npm audit（高・致命的脆弱性の検出／non-blocking）
        continue-on-error: true
        run: npm audit --audit-level=high

      # PHASE0-B-CI-GREEN-001: 検査は残し、初回は non-blocking にする。
      # base: HEAD~1 の実測挙動（run 30442522474）: pull_request では checkout が
      # マージ ref を出すため HEAD~1 = 第1親 = base 枝の先端に解決され、結果として
      # PR 全体の差分を走査できていた（base=4fcda31… = 開発本流 tip）。
      # ただしこれは checkout の既定挙動に依存した偶然であり、push イベントや
      # 複数コミットの push では取りこぼす。base を
      # github.event.pull_request.base.sha 等へ明示するのは独立 Issue 候補。
      # ここで走査範囲を広げる変更は行わない。
      - name: Secrets検出（APIキー・パスワードのコミット漏れ／non-blocking）
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

  e2e-test:
    name: E2E (Playwright)
    # E2E-NOT-RUN-001 (#865): `if: false` を解除した。
    #   旧コメントの解除条件は「Playwright 資産（spec / helpers / VRT）の移植完了」だったが、
    #   その後 test/e2e/*.e2e.js（素の node スクリプト・playwright test ランナー不使用）が
    #   6スイート育っており、移植を待たずに走らせられる状態になっていた。
    #   その間ずっと誰も走らせておらず、**2スイートが落ちたまま放置**されていた
    #   （IN-APP-MODAL-001 #606 で native confirm がアプリ内モーダルへ変わった追従漏れ）。
    #   実行対象を playwright test ランナーから test/run_e2e.sh へ変更している。
    needs: [unit-test, security-scan]
    runs-on: ubuntu-latest
    # E2E-INSTALL-GUARD-001 (#918): 15 → 20。ブラウザ導入に上限付きの再試行を入れたぶんの余地。
    #   最悪ケース（PW_INSTALL_TIMEOUT × PW_INSTALL_TRIES ＋ 実測に基づく予備）がこの枠に
    #   収まることは test/test_e2e_install_guard_918.js が**計算で**固定する。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # E2E-INSTALL-GUARD-001 (#918): このステップは**外部ネットワークと apt に依存する**のに、
      #   これまで上限も再試行も無かった。実測（2026-08-19 job 96122380273）では、ここで
      #   **15分05秒ぶら下がってジョブごと cancelled** になっている（E2E スイートは1秒も走っていない）。
      #   同じ commit の再実行では **21秒**で終わった。つまり遅いのはテストではなく、この外部作業。
      #   放置できない理由: `cancelled` は「赤」「遅い」「外部が詰まった」を区別できず、
      #   AUTO-MERGE-GATE-001 は SUCCESS 以外を停止条件にする（P1-2）ので、
      #   **自動マージが外部要因で黙って止まる**。
      #   ★ 打ち切りと再試行をこのステップの中に閉じ込め、駄目なら**原因を名指しして**落とす。
      #     15分の沈黙が「240秒で終わらなかった、やり直す」というログに変わる。
      #   ★ 秒数と回数は env で与える（テストが読み取れる一箇所に置く）。
      - name: Install Chromium
        env:
          PW_INSTALL_TIMEOUT: '240'
          PW_INSTALL_TRIES: '2'
        run: |
          set -u
          _limit="${PW_INSTALL_TIMEOUT:-240}"
          _tries="${PW_INSTALL_TRIES:-2}"
          _i=1
          while [ "$_i" -le "$_tries" ]; do
            timeout "$_limit" npx playwright install --with-deps chromium
            _rc=$?
            if [ "$_rc" -eq 0 ]; then
              echo "playwright install 完了（試行 ${_i}/${_tries}）"
              exit 0
            fi
            if [ "$_rc" -eq 124 ]; then
              echo "::warning::playwright install が ${_limit} 秒で終わらなかった（試行 ${_i}/${_tries}）。やり直す。"
            else
              echo "::warning::playwright install が失敗した（終了コード ${_rc}・試行 ${_i}/${_tries}）。やり直す。"
            fi
            _i=$((_i+1))
          done
          echo "::error::playwright install が ${_tries} 回とも成功しなかった（上限 ${_limit} 秒）。E2E は実行していない＝これはテストの赤ではなく、ブラウザ導入の失敗。"
          exit 1
      # E2E-NOT-RUN-001 (#865): test/e2e/*.e2e.js を全部走らせる。
      #   対象が0件なら run_e2e.sh 自身が exit 2 で落ちる（「緑」と「何も検査していない」を
      #   区別できない状態を作らないため）。
      #   SHOGI-TOUR-APPHQ-003D-4E-1 の懸念（実データ依存の legacy spec が CI の
      #   ログ・トレース・スクリーンショットに運営値を出す）は該当しない: 現行の
      #   test/e2e/*.e2e.js は全スイートが**架空の fixture を state に直接組み立てる**方式で、
      #   実データの読み込みも本番 URL へのアクセスも既定では行わない。
      - name: Run E2E suites (test/e2e/*.e2e.js)
        env:
          LC_ALL: C.UTF-8
        run: bash test/run_e2e.sh
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
